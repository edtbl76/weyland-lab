# Shared SonarQube scan configuration for weyland-lab — the SINGLE source of scope truth, read by BOTH scanners:
#   • CI gate       — .woodpecker.yml `sonar-gate` step. Adds -Dsonar.qualitygate.wait=true on its command line to
#                     BLOCK the deploy on a red gate. This is the enforcing lane.
#   • weekly report — nodes/mother/lab/weyland-platform/k8s/sonarqube/sonar-scan.yaml CronJob. Reports only; no wait.
#
# sonar-scanner auto-reads this file from sonar.projectBaseDir (default = the cwd of the run, which is the repo root
# for BOTH invocations: the CI workspace root, and /usr/src in the CronJob where the repo is cloned). Because the
# scope now lives here once, the two invocations can no longer drift. Only the gate-WAIT behavior differs between
# them, and that stays on the CI step's command line — it is not scope.
#
# SCOPE (B138 lane model): SonarQube owns CODE QUALITY on real application source. code-scan-suite
# (trivy/checkov/gitleaks) owns SECURITY across all files incl. IaC. Scanning `.` naively re-flagged the whole
# infra monorepo (~280 k8s/Docker/notebook findings) and drowned the ~230 real Python/Java findings. `sonar.exclusions`
# drops the non-code surface: k8s/Argo/Helm YAML + OpenTofu (checkov owns them), Dockerfiles (trivy owns them),
# notebooks, build artifacts (incl. swift's `.build/`), the golden-paths/ language fixtures (B88/B153 hello-world,
# no prod code) and eval/ task fixtures. What remains is the real code: the Python services + the Flink Java modules.
sonar.projectKey=weyland-lab
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/.yarn/**,**/.git/**,**/openclaw/**,site-techdocs/**,golden-paths/**,eval/**,**/*.ipynb,**/*.yaml,**/*.yml,**/*.tf,**/*.tfvars,**/Dockerfile,**/Dockerfile.*,**/*.dockerfile,**/target/**,**/build/**,**/.build/**,**/dist/**,**/.next/**,**/_build/**,**/coverage.xml,**/.venv/**,**/tests/arch/fixtures/**,**/StdoutOffender.java

# B152 architecture-test scaffolding (added 2026-09-17). The planted-violation fixtures are DELIBERATELY-bad
# code that exists only to prove an arch rule trips (StdoutOffender uses System.out → java:S106; the
# import-linter fixture packages import fastapi/dagster on purpose) — they must never be scanned for issues, so
# they are in sonar.exclusions above. The per-service arch TESTS (test_architecture.py, ArchitectureTest.java)
# are intentionally parallel across modules (same rules, per service), which the duplication detector flags — so
# exclude them from CPD only (still scanned for real issues), never from the whole analysis.
sonar.cpd.exclusions=**/tests/arch/fixtures/**,**/StdoutOffender.java,**/test_architecture.py,**/ArchitectureTest.java

# Flink Java: the bytecode-aware analyzer binds against compiled classes (the CronJob's build-java initContainer /
# CI's test-java compile them). Without this the Java analyzer hard-fails.
sonar.java.binaries=nodes/mother/lab/weyland-platform/k8s/flink/health-job/target/classes,nodes/mother/lab/weyland-platform/k8s/flink/sql-runner/target/classes

# Python coverage: the per-service Cobertura coverage.xml (emitted by coverage-ratchet.sh cov_python, mirrored in
# CI's test-python and the CronJob's coverage-python initContainer) makes `coverage` a real number, not 0.
sonar.python.coverage.reportPaths=**/coverage.xml

# Coverage measures LOGIC, not generated data or pure I/O. Two groups leave the coverage DENOMINATOR (still fully
# ISSUE-scanned):
#  (a) generated/data files, 0 functions: aidlc_glossary (auto-gen 480-term dict), datasets_field_docs,
#      mesh_vocabulary, roles (baked prompt strings).
#  (b) the dagster ASSET-ORCHESTRATION layer — the @asset bodies (assets/*.py), resource clients (resources/),
#      schedule/Definitions wiring. These are INTEGRATION code (run the pipeline against lakeFS/stores, verified by
#      the running system + Soda/GE data-quality checks). Unit-"covering" them = mocking dagster + every client =
#      testing mocks. The extractable transform LOGIC lives in assets/datasets_lib/ (a subdir, deliberately NOT
#      matched by assets/*.py) which STAYS in coverage and IS unit-tested.
sonar.coverage.exclusions=**/aidlc_glossary.py,**/datasets_field_docs.py,**/mesh_vocabulary.py,**/roles.py,**/weyland_pipeline/assets/*.py,**/weyland_pipeline/resources/**,**/weyland_pipeline/schedules/**,**/weyland_pipeline/definitions.py
