  # ---- B214 (2026-10-16): the 19 requirements directories that had no entry ------------------------------------
  # Only 4 of 23 were listed, so an advisory against the other 19 never reached a PR, 9 of them the lockfiles B213
  # had just frozen from the deployed images. scripts/check-dependabot-coverage.sh (repo-guards) now fails on a
  # requirements directory with no pip entry. Same shape as above: security updates only, grouped, Sunday 09:00.
  - package-ecosystem: "pip"
    directory: "/nodes/mother/lab/weyland-platform/k8s/flink"
    schedule: { interval: "weekly", day: "sunday", time: "09:00" }
    open-pull-requests-limit: 0
    groups:
      security-and-patches:
        applies-to: security-updates
        patterns: ["*"]
    # B214 (2026-10-16): mirrors osv-scanner.toml — no installable fix here; re-proposing it only breaks the build.
    ignore:
      - dependency-name: "protobuf"   # apache-beam 2.48 (apache-flink 1.20.x) caps it; Flink 2.x lifts
        versions: [">=4.24.0"]
      - dependency-name: "pyarrow"   # apache-beam 2.48 caps it; Flink 2.x lifts
        versions: [">=12.0.0"]
      - dependency-name: "httplib2"   # apache-beam 2.48 caps it; Flink 2.x lifts
        versions: [">=0.23.0"]

