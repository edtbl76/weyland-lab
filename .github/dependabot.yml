# Dependabot config (B131). Added 2026-08-20 after discovering there was NO config file at all: the PRs that
# had been arriving came from GitHub's repo-level "Dependabot security updates" toggle, which is opportunistic
# — it had picked up services/genre-trainer and left every other service unwatched.
#
# The cost of that gap, measured: a scan on 2026-08-20 found 74 osv highs. Merging the two genre-trainer PRs
# cleared 24 of them — but 22 MORE were the SAME two packages (GitPython, sqlparse) at the SAME old versions in
# services/weyland-dagster, which no PR had ever been opened for. Half the exposure was invisible.
#
# So: every requirements.txt gets an explicit entry. An unlisted directory is an unwatched directory.
#
# ⚠ SECURITY UPDATES ONLY — `open-pull-requests-limit: 0` is the documented switch that DISABLES version
# updates while leaving security updates enabled. It is not a typo and not a throttle.
#
# Learned the hard way: the first version of this file omitted it and Dependabot immediately opened THIRTEEN
# PRs of routine version bumps — including flink 1.20.1 -> 2.3.0 (a major that would break the streaming tier),
# python 3.12 -> 3.14-slim on two base images, and kubernetes 31 -> 36. On a $0 lab where every dep is pinned
# deliberately and nothing has a test suite guarding an upgrade, routine version churn is noise WITH RISK, and
# a queue of unreviewed PRs is the exact failure mode B131 exists to prevent.
#
# What we want is narrow: tell me when a pinned dep has a KNOWN VULNERABILITY. Version currency is a decision
# to make deliberately (see B136 — dbt-core), not a PR to rubber-stamp.
version: 2
updates:
  # ---- Python services -------------------------------------------------------------------------------------
  # One entry per requirements.txt. Weekly + grouped, because a solo lab wants a small number of reviewable PRs,
  # not one PR per package (see B131: open PRs that pile up are the failure mode, not the fix).
  - package-ecosystem: "pip"
    directory: "/nodes/mother/lab/weyland-platform/services/weyland-dagster"
    schedule: { interval: "weekly", day: "sunday", time: "09:00" }
    open-pull-requests-limit: 0
    groups:
      security-and-patches:
        applies-to: security-updates
        patterns: ["*"]
    # B214 (2026-10-16): mirrors osv-scanner.toml — no installable fix here; re-proposing it only breaks the build.
    ignore:
      - dependency-name: "transformers"   # build-stage ONNX export only; 5.x risks a byte-different export (U13)
        versions: [">=5.0.0"]

  - package-ecosystem: "pip"
    directory: "/nodes/mother/lab/weyland-platform/services/genre-trainer"
    schedule: { interval: "weekly", day: "sunday", time: "09:00" }
    open-pull-requests-limit: 0
    groups:
      security-and-patches:
        applies-to: security-updates
