# Publish the Weyland visual maps to GitHub Pages.
# Deploys the self-contained maps (docs/platform-map.html + docs/data-mesh-map.html; zero external asset requests) —
# a clean public share, NOT the internal runbooks/hosts docs. Runs on GitHub's cloud runners (no LAN dependency).
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".
# URLs: https://edtbl76.github.io/weyland-lab/ (platform map) · /data-mesh-map.html (data mesh map)
name: Deploy visual maps to Pages

on:
  push:
    branches: [main]
    paths:
      - docs/platform-map.html
      - docs/data-mesh-map.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (maps)
        run: |
          mkdir -p _site
          cp docs/platform-map.html _site/index.html
          cp docs/platform-map.html _site/platform-map.html
          cp docs/data-mesh-map.html _site/data-mesh-map.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # turn Pages on via the API so no manual Settings→Pages toggle is needed
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
