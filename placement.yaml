# Placement inventory (B198) — where every workload in the lab runs, what state it holds, whether it can move, and
# where it goes when the Strix Halo box lands (B134). The migration plan for that purchase IS this file: every row whose
# `strix` is not `stays` / `any` / `every-node`.
#
# HELD HONEST BY scripts/check-placement.sh:
#   repo mode (repo-guards, every push): schema + enums, every host known, every LikeC4 component on a non-cluster node
#     has a row, a pvc/host-path row is never marked movable.
#   live mode (nightly placement-coverage CronJob): every Deployment/StatefulSet/DaemonSet/CronJob that kube-state-
#     metrics reports has exactly one row and every k8s row still exists; every active systemd service/timer on a
#     watched host has a row or is listed under host_os_units; every Proxmox guest has a row.
#   Exit 1 = drift (named), 2 = a source could not be read. Never a pass on missing data.
#
# ROW FIELDS
#   id        k8s:<ns>/<Kind>/<name> · systemd:<host>/<unit> · pve:<type>/<vmid> ·
#             tool:<host>/<name> and user-systemd:<host>/<unit> (declared only — Prometheus cannot see them)
#   host      a key under `hosts`
#   state     stateless | pvc:local-path | host-path: <path> | model-library: <path> | none
#   move      movable | every-node | pinned: <reason> | hardware-bound: <reason>
#   strix     any (the scheduler may place it on either node) | k3s-worker (deliberately moved) | inference-lxc |
#             stays | every-node | tbd (an owner decision, with `why`)
#   managed   how it is deployed: argo | k3s | operator (<Kind>) | istioctl / helm (deliberate exceptions, runbooks/argocd.md)
#             | systemd | pve. "not argo" with no recorded decision is a GitOps gap — fix it, do not record it.
#   scope     lab (default) | stud.io (a separate product — recorded, not planned here) | personal (the owner's own
#             tools, confirmed by the owner) | unused (a removal candidate) | unknown (owner not confirmed — never guess)
#   likec4    the element id in docs/architecture/weyland.likec4, when the model has one
#   on_demand true = normally NOT running (benches, trainers); the live check does not treat "not running" as drift
#   why       the reason, required for k3s-worker / inference-lxc / tbd / unused
#
# Every local-path PV is bound to node `mother` (47/47 on 2026-09-27), so every pvc row is pinned: moving one means
# moving its data, which is B134's call per store (docs/dr.md holds the blast radius).
#
# ADDING A WORKLOAD: add its row in the same change (DoD Pillar 1 "placement row"). The live check prints a
# ready-to-edit row for anything running without one.

hosts:
  weyland:    {kind: proxmox-host, always_on: true, note: "Minisforum MS-A2 (.232); hosts VM 101 mother + CT 103 whisper"}
  mother:     {access: "ssh emangini@mother", kind: qemu-vm, runs_on: weyland, pve_id: "qemu/101", always_on: true, note: "the only k3s node today"}
  whisper:    {access: "ssh root@weyland pct exec 103", kind: lxc, runs_on: weyland, pve_id: "lxc/103", always_on: true, note: "whisper.cpp CPU STT (.246)"}
  rogueone:   {access: "local", kind: laptop, always_on: false, node_exporter: "192.168.1.230:9100", note: "RTX 5000 Ada 16 GB, 128 GB RAM (.230); sleeps — not always on; systemd-only node-exporter (B198)"}
  strix-halo: {kind: planned, always_on: true, note: "B134 purchase: k3s worker VM + inference LXC; no rows until it lands"}

