# U10 — least privilege: stop auto-mounting an API token into pods that never call
# the Kubernetes API. All weyland/n8n app workloads (tool server, Dagster, n8n, the
# vector DBs, APISIX, CoreDNS, Postgres) talk to DBs / SSH / GraphQL / DNS — never the
# k8s API — yet each pod gets the default SA's auto-mounted token (CIS 5.1.6).
#
# `kubectl apply` patches the auto-created `default` ServiceAccount in each namespace,
# covering all current AND future pods that use it. Headlamp is untouched (it uses its
# own SA and genuinely needs API access). A future pod that DOES need the API should get
# its own dedicated SA rather than relying on default.
#
# ⚠️ BEFORE ADDING A NAMESPACE HERE — grep for RoleBindings whose SUBJECT is that `default` SA:
#   kubectl get rolebinding -A -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{" -> "}{range .subjects[*]}{.kind}/{.namespace}/{.name}{" "}{end}{"\n"}{end}' | grep 'ServiceAccount/<ns>/default'
# Every hit is a pod that PROVABLY calls the k8s API — nobody writes a RoleBinding otherwise. Disabling automount
# leaves it holding permissions with no token to present, and the failure is SILENT until that code path next runs.
#
# This already bit once (2026-07-20, B95): `lancedb-sync-rbac.yaml` bound its Role to `weyland/default`, so the
# Dagster `trigger_lancedb_sync` op died on `ConfigException: Service token file does not exist` — undetected for
# weeks because the op only runs when its sensor fires. Fix = dedicated SA (`dagster-user-code`) with
# `automountServiceAccountToken: true` + `serviceAccountName` on the Deployment + RoleBinding subject repointed.
# NEVER "fix" it by re-enabling automount on `default`. See [[k8s-sa-token-vs-rbac-split]].
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: weyland
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: n8n
automountServiceAccountToken: false
