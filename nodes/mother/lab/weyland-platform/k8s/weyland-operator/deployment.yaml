# B66 Part 1 — weyland-operator: the lab operator agent (LangGraph ReAct loop over the tool-server read tools).
# Meshed now so Part 2's STRICT-mTLS Postgres session store drops in without a topology change; today it reaches the
# tool-server + weyland-guard in-cluster and egresses to Ollama on rogueone (LAN, PERMISSIVE). Read-only: no act
# tools, no Telegram, no session yet. Brain is local gpt-oss:20b ($0, primary) with Haiku as a HEALTH FAILOVER (B45
# follow-up) — used only when rogueone/Ollama is unavailable, so the operator never goes dark. See the OLLAMA_* env below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weyland-operator
  namespace: weyland
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weyland-operator
  template:
    metadata:
      labels:
        app: weyland-operator
        sidecar.istio.io/inject: "true"   # ready for Part 2 STRICT-mTLS Postgres sessions
    spec:
      enableServiceLinks: false
      containers:
        - name: weyland-operator
          image: registry.weyland.lab/weyland-operator:v21   # B103 prompt federation — Langfuse prompt-linked tracing (langfuse SDK); was v20 (local qwen2.5:7b + curated FLAT toolset + Haiku failover)
          imagePullPolicy: IfNotPresent
          resources:
            # No torch/embedder — just langgraph/langchain/mlflow client + fastapi; LLM inference is remote (Ollama).
            # Request kept LOW (256Mi) — the node's requested-memory sum runs near allocatable (B99 reserves); actual
            # usage is bounded by the 1Gi limit. On-demand service, fine to be an eviction candidate.
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 1Gi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet: { path: /health, port: 8080 }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            periodSeconds: 10
          env:
            - name: TOOLSERVER
              value: http://weyland-tool-server.weyland.svc.cluster.local:8080
            # B17+B19: acts route through the MCP gateway with a Keycloak client_credentials token — the gateway injects
            # the VERIFIED actor (weyland-operator). optional:true → falls back to the direct/self-set path until wired.
            # Create out-of-band (NOT committed):
            #   kubectl -n weyland create secret generic weyland-operator-mcp --from-literal=client-secret=$(cd ~/IdeaProjects/weyland/nodes/mother/lab/weyland-platform/tofu/keycloak && tofu output -raw mcp_operator_client_secret)
            - name: OPERATOR_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: weyland-operator-mcp, key: client-secret, optional: true } }
            # Two-stage routing (v9): all fleet tools load and collapse into 6 subsystem routers, so no curation needed.
            # FLEET_PREFIXES / FLEET_TOOLS can still trim a noisy subsystem (e.g. grafana's ~40 tools) without a rebuild.
            # AGENTIC LANE: the Haiku FALLBACK path routes through LiteLLM — a TRANSPARENT passthrough proxy (tools +
            # tool_calls survive), with spend tracking + the off-LAN egress valve = governance at the right layer. NOT the
            # MLflow AI Gateway (chat/eval lane only — its strict normalization shreds tool schemas). Guardrails live at
            # the agent EDGE (weyland-guard input/output + the act confirm-step), never inline in the LLM path.
            #
            # PRIMARY brain — local qwen2.5:7b on rogueone, DIRECT to Ollama (LAN, PERMISSIVE): $0, never touches
            # LiteLLM/spend. qwen2.5:7b is fast + non-thinking + tool-calls cleanly on a SMALL FLAT toolset (proven: one
            # real tool → a clean structured tool_call in ~2.7s). agent.py gives the LOCAL brain READ_TOOLS + a curated
            # fleet subset (LOCAL_FLEET_ALLOW, ~15 ops tools) — NOT the full ~91 and NOT the two-stage routers, both of
            # which broke its tool selection. ~4.7GB fits the shared 16GB card (rag-embed + display) best with the
            # on-demand llama-guard-8b OFF; if the card saturates it health-fails-over to Haiku (which gets the full 91).
            - name: OLLAMA_BASE_URL
              value: http://192.168.1.230:11434/v1
            - name: OLLAMA_MODEL
              value: qwen2.5:7b
            - name: LLM_API_KEY
              value: ollama          # Ollama ignores the key; any non-empty string satisfies the OpenAI client
            # FALLBACK brain — Haiku via LiteLLM (flat fleet, handles all ~91 tools). Used ONLY when the local engine
            # fails a fast health pre-check (GET OLLAMA_HEALTH_URL, ~3s, cached ~30s) or errors mid-request — so a
            # rogueone/Ollama outage degrades to paid cloud instead of going dark, and steady-state Haiku spend ≈ $0.
            # Set OPERATOR_LLM_FALLBACK=0 for local-only. Watch operator_brain_selected_total{brain,reason}.
            - name: OPERATOR_LLM_FALLBACK
              value: "1"
            - name: OLLAMA_FALLBACK_BASE_URL
              value: http://litellm.weyland.svc.cluster.local:4000/v1
            - name: OLLAMA_FALLBACK_MODEL
              value: claude-haiku
            - name: OLLAMA_FALLBACK_FLEET_ROUTING
              value: "0"
            - name: OLLAMA_FALLBACK_API_KEY
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: LITELLM_MASTER_KEY } }
            - name: OLLAMA_HEALTH_URL
              value: http://192.168.1.230:11434/api/tags
            - name: GUARD_BASE_URL
              value: http://weyland-guard.weyland.svc.cluster.local:8080
            # B17 A2A — the Realm of Agents (24 specialists). delegate_to_realm posts here; Gná routes.
            - name: REALM_URL
              value: http://realm-of-agents.weyland.svc.cluster.local:8080
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.weyland.svc.cluster.local:5000
            # B103 prompt federation — Langfuse prompt-linked tracing (alongside MLflow). Reuses the already-sealed
            # litellm-secrets project keys (same weyland ns). Unset = Langfuse tracing off.
            - name: LANGFUSE_HOST
              value: http://langfuse.weyland.svc:3000
            - name: OTEL_SERVICE_NAME   # labels the Langfuse trace's service.name (else "unknown_service")
              value: weyland-operator
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LANGFUSE_PUBLIC_KEY
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LANGFUSE_SECRET_KEY
            # Postgres session store (STRICT-mTLS — rides the mesh sidecar). Same secret the agent/tool-server use.
            - name: WEYLAND_DB_HOST
              value: weyland-postgres.weyland.svc.cluster.local
            - name: WEYLAND_DB_PORT
              value: "5432"
            - name: WEYLAND_DB_NAME
              valueFrom: { secretKeyRef: { name: weyland-postgres-secret, key: POSTGRES_DB } }
            - name: WEYLAND_DB_USER
              valueFrom: { secretKeyRef: { name: weyland-postgres-secret, key: POSTGRES_USER } }
            - name: WEYLAND_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: weyland-postgres-secret, key: POSTGRES_PASSWORD } }
            # Telegram ingress — token + allowlist from weyland-operator-secret (your @BotFather token + chat_id).
            # Absent token → ingress stays off and only the HTTP surface runs (graceful).
            - name: TELEGRAM_BOT_TOKEN
              valueFrom: { secretKeyRef: { name: weyland-operator-secret, key: TELEGRAM_BOT_TOKEN, optional: true } }
            - name: TELEGRAM_ALLOWED_USERS
              valueFrom: { secretKeyRef: { name: weyland-operator-secret, key: TELEGRAM_ALLOWED_USERS, optional: true } }
            # B45 — enrich-only incident sweep: the agent READS Prometheus `ALERTS{alertstate="firing"}` off the
            # critical path (which unifies blackbox synthetic downs + guardrail/service alerts), correlates logs/pods,
            # and posts a proactive Telegram digest to the first TELEGRAM_ALLOWED_USERS chat. Set "false" to disable.
            - name: INCIDENT_SWEEP_ENABLED
              value: "true"
            - name: INCIDENT_SWEEP_INTERVAL
              value: "180"
            - name: PROMETHEUS_URL
              value: http://prometheus-operated.monitoring.svc.cluster.local:9090
