# B66/B45 — weyland-operator down + incident-sweep health alerts. Lives in the `monitoring` ns with release:monitoring
# (kube-prometheus-stack ruleSelector); routes to the Weyland Alerts Telegram chat (B5 P2a). Same pattern as the
# nemo-guardrails / litellm rules. NOTE: these alert on the OPERATOR — paging itself is independent (direct
# Kuma/Alertmanager -> Telegram), so an operator outage never blinds the pager, only the enrichment layer.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: weyland-operator
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: weyland-operator
      rules:
        # Down: kube-state-metrics signal (fires even if the pod's own /metrics is unreachable).
        - alert: WeylandOperatorDown
          expr: kube_deployment_status_replicas_available{namespace="weyland",deployment="weyland-operator"} < 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "weyland-operator has no ready replica"
            description: "The operator agent is down — Telegram ops + the B45 incident sweep (alert enrichment) stop. Paging is UNAFFECTED (direct Kuma/Alertmanager -> Telegram is independent). Check: kubectl -n weyland rollout status deploy/weyland-operator"
        # Incident sweep erroring: the enrich loop can't reach Prometheus ALERTS / the fleet / Telegram (needs the
        # operator's own /metrics — ServiceMonitor scrapes it). Firing alerts won't be enriched while this fires.
        - alert: WeylandOperatorSweepErrors
          expr: increase(operator_incident_sweeps_total{outcome="error"}[15m]) > 3
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "weyland-operator incident sweep is erroring (> 3 in 15m)"
            description: "The B45 incident-enrichment loop is failing — firing alerts won't be enriched (paging still works). Check: kubectl -n weyland logs deploy/weyland-operator | grep '\\[incidents\\]'"
        # 2026-10-02: the sweep never fails over to paid Haiku — while the local brain (rogueone Ollama) is busy or
        # down it DEFERS and retries. An eval keeps Ollama busy up to ~5h, so deferring that long is normal; every
        # 30m window deferring for 6h straight means the local brain is really gone and enrichment has stopped.
        # Thresholds tested in scripts/tests/fixtures/alert-rules/operator-sweep.test.yaml.
        - alert: WeylandOperatorSweepDeferred
          expr: increase(operator_incident_sweeps_total{outcome="deferred"}[30m]) > 0
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: "weyland-operator incident sweep has deferred for 6h — its local brain is unavailable"
            description: "The sweep only enriches on the local brain (qwen on rogueone Ollama) and never fails over to paid Haiku, so new firing alerts are not being enriched (paging still works). Check rogueone's Ollama: curl http://192.168.1.230:11434/api/tags, and kubectl -n weyland logs deploy/weyland-operator | grep 'local brain unavailable'"
        # B174 — the decision-model shadow (decide.py): after each sweep the operator asks Jev (TypeSafe, paid from the
        # owner's prepaid credit) which tool to open with. Failing: errors and NO success for an hour — a bad key, the
        # credit ran out (401/402), or TypeSafe is down. `unless`, not `== 0`: a success series that was never created
        # is an EMPTY vector, and `== 0` on it would silently never fire. Tested in alert-rules/operator-decide.test.yaml.
        - alert: OperatorDecideShadowFailing
          expr: sum(increase(operator_decide_shadow_total{outcome="error"}[1h])) > 0 unless sum(increase(operator_decide_shadow_total{outcome!="error"}[1h])) > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "weyland-operator decision-model shadow has only errored for 2h"
            description: "Every shadow call failed (no agreement evidence is being collected; the sweep itself is unaffected). Likely the TypeSafe key or credit. Check: kubectl -n weyland logs deploy/weyland-operator | grep '\\[decide\\]'"
        # Paid spend on a $0 budget is always alerted (same $1/24h as BifrostSpendObserved). Jev bills input tokens at
        # $0.042 per million; a sweep sends ~2K, so normal use is cents a month — this catches a loop, not normal use.
        - alert: OperatorDecideSpendObserved
          expr: sum(increase(operator_decide_input_tokens_total{backend="jev"}[24h])) * 0.042 / 1e6 > 1
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "weyland-operator decision-model shadow spent > $1 of TypeSafe credit in 24h"
            description: "Jev input tokens x $0.042/M exceeded $1 in 24h — far above the ~2K tokens a sweep. Turn the shadow off (OPERATOR_DECIDE_SHADOW=false in k8s/weyland-operator/deployment.yaml) and check the sweep rate."
