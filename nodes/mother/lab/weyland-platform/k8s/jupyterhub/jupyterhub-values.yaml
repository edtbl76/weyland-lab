# B1.8 L8 — JupyterHub (Zero-to-JupyterHub chart). Hub + proxy always-on (tiny); per-user notebook pods on-demand
# via KubeSpawner, idle-culled → scale-to-zero. Auth = Keycloak OIDC (GenericOAuthenticator). First cut uses sqlite
# (hub PVC) + the public scipy-notebook image; swap singleuser.image for the custom polars/lakeFS image once built.
hub:
  db:
    type: sqlite-pvc          # first cut — no Postgres-mesh plumbing; migrate to the lab Postgres later
  config:
    JupyterHub:
      authenticator_class: generic-oauth
    GenericOAuthenticator:
      client_id: jupyterhub
      oauth_callback_url: https://jupyter.weyland.lab/hub/oauth_callback
      authorize_url: https://keycloak.weyland.lab/realms/weyland/protocol/openid-connect/auth
      token_url: https://keycloak.weyland.lab/realms/weyland/protocol/openid-connect/token
      userdata_url: https://keycloak.weyland.lab/realms/weyland/protocol/openid-connect/userinfo
      username_claim: preferred_username
      scope:
        - openid
        - profile
        - email
    Authenticator:
      allow_all: true          # solo lab — any weyland-realm user (i.e. the operator) may log in
  extraEnv:
    OAUTH_CLIENT_SECRET:
      valueFrom:
        secretKeyRef:
          name: jupyterhub-oidc
          key: client_secret
  extraVolumes:
    - name: mkcert-ca
      secret:
        secretName: weyland-mkcert-ca
  extraVolumeMounts:
    - name: mkcert-ca
      mountPath: /etc/mkcert
      readOnly: true
  extraConfig:
    # keep the client secret out of git — inject it from the k8s Secret (tofu output → jupyterhub-oidc)
    oidc-secret: |
      import os
      c.GenericOAuthenticator.client_secret = os.environ["OAUTH_CLIENT_SECRET"]
      # the hub's SERVER-SIDE token/userinfo calls to keycloak.weyland.lab use the mkcert cert (libcurl won't
      # trust it by default → HTTP 599 SSL error). Point the OAuthenticator's HTTP client at the mkcert root.
      c.GenericOAuthenticator.http_request_kwargs = {"ca_certs": "/etc/mkcert/rootCA.pem"}
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 512Mi }

proxy:
  service:
    type: ClusterIP            # exposed via the Traefik ingress below, not a LoadBalancer
  chp:
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 256Mi }

singleuser:
  image:
    name: weyland-jupyter      # custom datasets-lake image (polars/s3fs/pylance/duckdb) — k8s/jupyterhub/singleuser/
    tag: local                 # built + ctr-imported into k3s (single node → no registry)
    pullPolicy: Never
  storage:
    capacity: 2Gi
  cpu:
    limit: 2
    guarantee: 0.1
  memory:
    limit: 2G
    guarantee: 256M
  defaultUrl: /lab            # JupyterLab, not the classic tree
  extraEnv:
    LAKEFS_ENDPOINT: "http://lakefs.data-mesh.svc.cluster.local:8000"
    LAKEFS_ACCESS_KEY_ID:
      valueFrom:
        secretKeyRef: { name: lakefs-creds, key: LAKEFS_ACCESS_KEY_ID }
    LAKEFS_SECRET_ACCESS_KEY:
      valueFrom:
        secretKeyRef: { name: lakefs-creds, key: LAKEFS_SECRET_ACCESS_KEY }
    # Iceberg/Nessie warehouse S3 creds (B81 storage notebook 11) — the MinIO-backed `s3://warehouse`, a
    # DIFFERENT credential than lakeFS above. Mirrors data-mesh `nessie-secret` (s3-access-key/-secret-key)
    # into a jupyterhub SealedSecret `iceberg-s3-creds`; the notebook defaults NESSIE_ICEBERG_URI /
    # ICEBERG_WAREHOUSE / ICEBERG_S3_ENDPOINT to the cluster URLs, so only the creds need injecting.
    ICEBERG_S3_ACCESS_KEY:
      valueFrom:
        secretKeyRef: { name: iceberg-s3-creds, key: access_key }
    ICEBERG_S3_SECRET_KEY:
      valueFrom:
        secretKeyRef: { name: iceberg-s3-creds, key: secret_key }
  lifecycleHooks:
    postStart:
      exec:
        # NOTEBOOK LIBRARY (B81) — populate ~/notebooks on every spawn. The 2Gi home PVC hides anything baked at
        # /home/jovyan, so we sync here: first the image's baked copy (no-clobber → an offline spawn still has
        # notebooks), then the LATEST from the public repo. git is in the scipy base, so growing the library is a
        # `git push`, NOT an image rebuild. The sync OVERWRITES the library (it == git); do scratch work elsewhere
        # in home, which the PVC persists. A failed clone (offline) degrades to the baked fallback, never blank.
        command:
          - sh
          - -c
          - |
            set -e
            DEST=/home/jovyan/notebooks; mkdir -p "$DEST"
            cp -rn /opt/examples/. "$DEST"/ 2>/dev/null || true
            REPO=https://github.com/edtbl76/weyland-lab
            SUB=nodes/mother/lab/weyland-platform/k8s/jupyterhub/singleuser/notebooks
            if cd /tmp && rm -rf nbsync \
               && git clone --depth 1 --filter=blob:none --sparse "$REPO" nbsync >/dev/null 2>&1 \
               && ( cd nbsync && git sparse-checkout set "$SUB" >/dev/null 2>&1 ) \
               && cp -rf "/tmp/nbsync/$SUB/." "$DEST"/ ; then
              echo "notebook library git-synced into $DEST"
            else
              echo "notebook git-sync skipped (offline?) — using baked fallback in $DEST" >&2
            fi
            rm -rf /tmp/nbsync 2>/dev/null || true
  networkPolicy:
    # Z2JH's default singleuser NetworkPolicy BLOCKS egress to private cluster IPs (a security default). But the
    # whole point here is notebooks querying the data mesh (lakeFS / Trino / Cube), which are private ClusterIPs —
    # so allow privateIPs. The cloud-metadata block (block-cloud-metadata init) stays.
    egressAllowRules:
      privateIPs: true

# idle-culler → scale singleuser pods to zero (run-mode tiering)
cull:
  enabled: true
  timeout: 3600               # cull after 1h idle
  every: 300

ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - jupyter.weyland.lab
  tls:
    - hosts: [jupyter.weyland.lab]
      secretName: weyland-wildcard-tls

scheduling:
  userScheduler:
    enabled: false             # single node — no need for the spread scheduler

# no image pre-pulling — it adds a hook Job + a continuous-image-puller DaemonSet pod (extra pod slots on a node
# already near the 110-pod cap). Cost: the FIRST notebook spawn pulls the image (slow once), then it's cached.
prePuller:
  hook:
    enabled: false
  continuous:
    enabled: false
