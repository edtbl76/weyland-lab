# B65 Tier-2 — Apache Superset: BI / SQL exploration over the query layer (Trino). ns data-mesh.
# Metadata = the lab Postgres `superset` DB (postgresql.enabled=false); bundled Redis for cache + Celery.
# Sensitive values (SECRET_KEY, DB password) come from the imperatively-created `superset-env` secret —
# NOT in git. OIDC (Keycloak) + the Trino *connection* are added in steps 3-4; this gets it UP first.
#
# Not meshed on the first cut (keeps the OIDC/ingress bring-up clean; Trino is PERMISSIVE so plaintext
# reaches it). Mesh in a follow-up.

postgresql:
  enabled: false   # use the lab Postgres (superset DB created in step 1)
redis:
  enabled: false   # use the SHARED data-mesh Valkey (k8s/data-mesh/valkey.yaml), not a bundled per-app Redis

# db_host/port/user/name drive the init job's wait-for-db + the default URI; the PASSWORD is injected via
# env (superset-env → DB_PASS) and the real SQLALCHEMY_DATABASE_URI is built in configOverrides below so the
# password never lands in git.
supersetNode:
  podAnnotations:
    sidecar.istio.io/inject: "true"
  # Recreate, not RollingUpdate: kill the old pod before creating the new one. On this ~tight node a rolling
  # update double-books CPU/RAM and the old (even crashing) pod blocks the new from scheduling.
  strategy:
    type: Recreate
  connections:
    db_type: postgresql
    db_host: weyland-postgres.weyland.svc.cluster.local
    db_port: "5432"
    db_user: superset
    # SEC-1 / EMA-84 — this value is INERT; the real password arrives via `extraEnvRaw` (see below).
    # The chart templates `connections.db_pass` into the `superset-env` Secret (secret-env.yaml: `DB_PASS`), which
    # every superset pod consumes with `envFrom`. You cannot de-commit it by editing that Secret — it is
    # chart-generated (heritage=Helm) and Argo reverts hand-added keys on the next sync.
    # The escape hatch is precedence: an explicit container `env:` entry ALWAYS wins over the same name coming
    # from `envFrom`, so `extraEnvRaw` re-defines DB_PASS from a SealedSecret and this key is never read.
    db_pass: unused-overridden-by-extraEnvRaw
    db_name: superset
    redis_host: valkey.data-mesh.svc.cluster.local   # the shared data-mesh Valkey
    redis_port: "6379"

# Same Recreate strategy on the Celery worker.
supersetWorker:
  podAnnotations:
    sidecar.istio.io/inject: "true"
  strategy:
    type: Recreate
  resources:
    requests: { memory: 1Gi, cpu: 200m }
    limits: { memory: 3Gi }     # celery worker — actual ~1.5Gi (the fat one)

# superset web / frontend node
resources:
  requests: { memory: 256Mi, cpu: 100m }
  limits: { memory: 1Gi }       # actual ~357Mi

# SEC-1: SUPERSET_SECRET_KEY is NOT set here — it comes from the `superset-env` secret via `envFromSecret` below.
# Verified the two values were identical before removing this duplicate, so the effective key is UNCHANGED. Never
# let SECRET_KEY drift: it encrypts the saved DB-connection passwords in Superset's metadata DB, and a changed key
# orphans every one of them.

extraVolumes:
  - name: weyland-ca
    secret:
      secretName: weyland-mkcert-ca

extraVolumeMounts:
  - name: weyland-ca
    mountPath: /etc/ssl/weyland-ca
    readOnly: true

# SECRET_KEY + DB_PASS from the chart-GENERATED `superset-env` Secret (heritage=Helm, Argo-tracked — NOT
# imperative, despite what this comment used to claim). Its DB_PASS is now overridden by extraEnvRaw below.
envFromSecret: superset-env

# EMA-84 — the real metadata-DB password, from the `superset-db-pass` SealedSecret instead of git.
# Rendered into the main container of superset (deployment.yaml), superset-worker (deployment-worker.yaml) AND the
# superset-init-db migration Job (init-job.yaml) — all three read DB_PASS, so all three need the override.
# NOTE: the init Job's pod spec is immutable; it must be deleted once so Argo recreates it with this env.
extraEnvRaw:
  - name: DB_PASS
    valueFrom:
      secretKeyRef:
        name: superset-db-pass
        key: DB_PASS

# Build the metadata URI from the env password (configOverrides append to the END of superset_config.py,
# so this wins over the chart default).
configOverrides:
  db_uri: |
    import os
    SQLALCHEMY_DATABASE_URI = (
        f"postgresql://superset:{os.environ.get('DB_PASS')}"
        "@weyland-postgres.weyland.svc.cluster.local:5432/superset?sslmode=disable"
    )
    SECRET_KEY = os.environ["SUPERSET_SECRET_KEY"]
  oidc: |
    import os
    from flask_appbuilder.security.manager import AUTH_OAUTH
    AUTH_TYPE = AUTH_OAUTH
    AUTH_USER_REGISTRATION = True
    AUTH_USER_REGISTRATION_ROLE = "Admin"
    OAUTH_PROVIDERS = [{
        "name": "keycloak",
        "icon": "fa-key",
        "token_key": "access_token",
        "remote_app": {
            "client_id": "superset",
            "client_secret": os.environ["OIDC_CLIENT_SECRET"],
            "api_base_url": "https://keycloak.weyland.lab/realms/weyland/protocol/openid-connect",
            "client_kwargs": {"scope": "openid email profile"},
            "access_token_url": "https://keycloak.weyland.lab/realms/weyland/protocol/openid-connect/token",
            "authorize_url": "https://keycloak.weyland.lab/realms/weyland/protocol/openid-connect/auth",
            "jwks_uri": "https://keycloak.weyland.lab/realms/weyland/protocol/openid-connect/certs",
            "server_metadata_url": "https://keycloak.weyland.lab/realms/weyland/.well-known/openid-configuration",
        },
    }]
    os.environ["REQUESTS_CA_BUNDLE"] = "/etc/ssl/weyland-ca/rootCA.pem"
    PREFERRED_URL_SCHEME = "https"
    WTF_CSRF_SSL_STRICT = False
    ENABLE_PROXY_FIX = True
    PROXY_FIX_CONFIG = {"x_for": 1, "x_proto": 1, "x_host": 1, "x_prefix": 1}

# Fallback local admin (break-glass; OIDC is the real login). Dev password — low-sensitivity, LAN-only.
init:
  # SEC-1: the bootstrap admin password is no longer committed. The admin already exists (created on first
  # install) and Keycloak OIDC is the real login path — this local account is break-glass only. On a FRESH
  # install, create it manually instead:
  #   kubectl -n data-mesh exec deploy/superset -- superset fab create-admin
  createAdmin: false
  adminUser:
    username: admin
    firstname: Superset
    lastname: Admin
    email: admin@weyland.lab
  resources:
    requests: { memory: 128Mi, cpu: 100m }
    limits: { memory: 512Mi }

# Install the Trino SQLAlchemy driver at startup (the connection itself is added in step 4).
bootstrapScript: |
  #!/bin/bash
  # psycopg2-binary: the metadata-DB (Postgres) driver — the 6.1.0 image doesn't bundle it. trino: the query
  # connector. clickhouse-connect: the ClickHouse dialect (clickhousedb:// + Superset engine spec) for the
  # data-mesh OLAP store. Both need PyPI egress at pod start; a custom image baking them in is the cleaner
  # long-term fix.
  pip install --target /app/.venv/lib/python3.10/site-packages psycopg2-binary trino authlib clickhouse-connect
  if [ ! -f ~/bootstrap ]; then echo "Superset bootstrapped (psycopg2 + trino + clickhouse)" > ~/bootstrap; fi

ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - superset.weyland.lab
  tls:
    - secretName: weyland-wildcard-tls   # reused in data-mesh (Trino uses it too)
      hosts:
        - superset.weyland.lab
