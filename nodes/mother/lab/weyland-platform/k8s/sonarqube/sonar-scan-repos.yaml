# B138 — multi-repo SonarQube for the active repos with no build step (Python/JS/TS/MDX, and source-only Java since
# B229 — freejack's lesson .java files). Source-level analysis, one
# Sonar project per repo. SEPARATE from:
#   - sonar-scan (weyland-lab) — the flagship monorepo with its own deep Flink/Maven bytecode build; unchanged.
#   - ServiceTransformation — Gradle multi-module, needs `./gradlew classes` (a different pipeline); follow-on.
# The self-hosted vuln suite (code-scan-suite) already covers ALL 8 repos for SECURITY; this adds Sonar's
# code-QUALITY metrics for the eight that scan at source level (SONAR_REPOS below; no compile step, so no per-repo
# build). A repo that fails to clone is listed in /src/.clone-failed and fails the Job by name (B229 re-audit).
#
# An alpine/git initContainer clones each repo into /src/<repo> (with the pr-lifecycle Contents:read token, so
# it reaches the private freejack/startme-curator); the scanner container then loops those checkouts. Cloning
# stays in the git image so the scanner image needs nothing extra. Weekly Sun 03:15 NY — after sonar-scan
# (03:00), before code-scan-suite (04:00) (B228, 2026-10-19: moved out of the working day — Design Rule #5 — and onto the NY clock, Rule #1). Token in Secret sonarqube-scan-token (global analysis token).
apiVersion: v1
kind: ConfigMap
metadata:
  name: sonar-scan-repos-runner
  namespace: weyland
data:
  sonar-all.sh: |
    #!/bin/sh
    # Scan every pre-cloned repo under /src (SONAR_SRC overrides it for the bats suite; one Sonar project per repo). Best-effort per repo: one failure
    # never skips the rest, but the job exits nonzero so a persistent failure is visible (never a silent green).
    set -u
    : "${SONAR_HOST_URL:?}"
    : "${SONAR_TOKEN:?}"
    rc=0
    # A repo the init container failed to clone is absent from /src, so the loop below would never see it and the Job
    # would go green with it unscanned (B229 re-audit, 2026-10-21). The init container lists each failure here.
    if [ -s "${SONAR_SRC:-/src}/.clone-failed" ]; then
      echo "!! not scanned (clone failed): $(tr '\n' ' ' < "${SONAR_SRC:-/src}/.clone-failed")" >&2
      rc=1
    fi
    DEFAULT_EXCL='**/node_modules/**,**/.git/**,**/build/**,**/dist/**,**/.next/**,**/vendor/**,**/*.min.js'
    # Source-only Java (2026-10-19, B229): these repos have no Java build, so no compiled classes exist, and
    # SonarQube's Java analyzer refuses to run without `sonar.java.binaries` — freejack's 177 lesson .java files
    # failed the whole Job on 2026-10-18. Pointing it at an EMPTY directory = analyze the source as-is (cross-file type
    # rules lose some precision). A repo whose own sonar-project.properties sets the binaries keeps its own setting.
    NO_CLASSES=$(mktemp -d)
    # Does the repo hold any .java outside node_modules/.git? `ls -R` + awk, NOT find: the scanner image
    # (sonarsource/sonar-scanner-cli, Amazon Linux 2023) has no `find`, and a missing find here would silently skip
    # the setting while the bats image (which has find) stayed green.
    has_java() {
      ls -R "$1" 2>/dev/null | awk '/:$/ { skip = ($0 ~ /\/(node_modules|\.git)(\/|:$)/) } !skip && /\.java$/ { found = 1 } END { exit !found }'
    }
    for dir in "${SONAR_SRC:-/src}"/*/; do
      [ -d "$dir" ] || continue
      repo=$(basename "$dir")
      echo "======================= sonar-scan-repos: ${repo} ======================="
      # A repo that ships its OWN sonar-project.properties defines its sources/tests/exclusions — a deliberate
      # main/test split (e.g. stud.io, which declares sonar.tests). Forcing -Dsonar.sources=. there re-adds its
      # test dirs to the MAIN set and the scanner aborts ("File ... can't be indexed twice; produce disjoint sets
      # for main and test files"). So DEFER to the repo's own config when present (pass only projectKey/baseDir/
      # host/token); supply the source+exclusion defaults ONLY for repos with no properties file of their own.
      if [ -f "${dir}sonar-project.properties" ]; then
        set --
      else
        set -- -Dsonar.sources=. -Dsonar.exclusions="${DEFAULT_EXCL}"
      fi
      if has_java "$dir" && ! grep -qs '^sonar\.java\.binaries=' "${dir}sonar-project.properties"; then
        set -- "$@" -Dsonar.java.binaries="${NO_CLASSES}"
      fi
      if ! sonar-scanner \
          -Dsonar.projectKey="${repo}" \
          -Dsonar.projectBaseDir="${dir}" \
          -Dsonar.host.url="${SONAR_HOST_URL}" \
          -Dsonar.token="${SONAR_TOKEN}" \
          -Dsonar.scm.disabled=true \
          "$@"; then
        echo "!! sonar-scanner failed for ${repo}" >&2
        rc=1
      fi
    done
    echo "=== sonar-scan-repos: all repos processed (rc=${rc}) ==="
    exit "${rc}"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sonar-scan-repos
  namespace: weyland
spec:
  schedule: "15 3 * * 0"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 259200   # 72h: a failed Job alerts (and keeps its logs) for 3 days, then clears — never forever (2026-09-25)
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          initContainers:
            - name: clone
              image: alpine/git:latest
              command:
                - sh
                - -c
                - |
                  set -u
                  : "${GITHUB_TOKEN:?}"
                  : "${SONAR_REPOS:?}"
                  for repo in $SONAR_REPOS; do
                    echo "cloning edtbl76/${repo}"
                    git clone --quiet --depth 1 \
                      "https://oauth2:${GITHUB_TOKEN}@github.com/edtbl76/${repo}.git" "/src/${repo}" \
                      || { echo "!! clone failed for ${repo}" >&2; echo "${repo}" >> /src/.clone-failed; }
                  done
                  # The scanner container runs NON-ROOT but the clone ran as root; make /src writable so
                  # sonar-scanner can create each repo's .scannerwork working dir (else AccessDeniedException).
                  chmod -R a+w /src
              env:
                - name: SONAR_REPOS
                  value: "Algopedia emangini-tailwind-nextjs-contentlayer startme-curator stud.io freejack MyBodyGraph OJayFloyd grkit"
                - name: GITHUB_TOKEN
                  valueFrom: { secretKeyRef: { name: pr-lifecycle-github, key: token } }
              volumeMounts:
                - { name: src, mountPath: /src }
          containers:
            - name: scanner
              image: sonarsource/sonar-scanner-cli:latest
              command: ["sh", "/runner/sonar-all.sh"]
              env:
                - name: SONAR_HOST_URL
                  value: http://sonarqube.weyland.svc.cluster.local:9000
                - name: SONAR_TOKEN
                  valueFrom: { secretKeyRef: { name: sonarqube-scan-token, key: SONAR_TOKEN } }
              volumeMounts:
                - { name: src, mountPath: /src }
                - { name: runner, mountPath: /runner }
          volumes:
            - { name: src, emptyDir: {} }
            - name: runner
              configMap: { name: sonar-scan-repos-runner, defaultMode: 0755 }
