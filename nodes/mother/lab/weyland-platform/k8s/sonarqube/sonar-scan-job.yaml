# On-demand SonarQube scan (Code Quality, B43). Pattern: initContainer git-clones the public repo → scanner
# container analyzes it against the in-cluster SonarQube over http (ClusterIP — no Traefik/mkcert TLS hassle).
# Unmeshed: SonarQube is PERMISSIVE mTLS, so plaintext from a non-meshed Job is accepted. Re-run with
# `kubectl delete job sonar-scan-weyland -n weyland` then re-apply (or template per-repo / fire from Dagster).
# Token in Secret `sonarqube-scan-token` (global analysis token), created out-of-band, never committed.
apiVersion: batch/v1
kind: Job
metadata:
  name: sonar-scan-weyland
  namespace: weyland
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: clone
          image: alpine/git:latest
          args: ["clone", "--depth", "1", "https://github.com/edtbl76/weyland-lab.git", "/usr/src"]
          volumeMounts:
            - name: src
              mountPath: /usr/src
        # Compile the Flink Java modules so the SonarQube Java analyzer has classes to bind rules against
        # (sonar.java.binaries below). Java analysis is bytecode-aware and hard-fails on bare source. `compile`
        # phase only (no shade/fat-jar) -> just target/classes, fast. Runs after clone, shares the /usr/src volume.
        - name: build-java
          image: maven:3.9-eclipse-temurin-17
          workingDir: /usr/src
          command: ["sh", "-c", "mvn -q -B -f nodes/mother/lab/weyland-platform/k8s/flink/health-job/pom.xml compile && mvn -q -B -f nodes/mother/lab/weyland-platform/k8s/flink/sql-runner/pom.xml compile"]
          volumeMounts:
            - name: src
              mountPath: /usr/src
      containers:
        - name: scanner
          image: sonarsource/sonar-scanner-cli:latest   # on-demand scan Job: immutable once created — don't pin/limit (Argo can't patch it)
          env:
            - name: SONAR_HOST_URL
              value: http://sonarqube.weyland.svc.cluster.local:9000
            - name: SONAR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sonarqube-scan-token
                  key: SONAR_TOKEN
          args:
            - -Dsonar.projectKey=weyland-lab
            - -Dsonar.sources=.
            - -Dsonar.exclusions=**/node_modules/**,**/.yarn/**,**/.git/**,**/openclaw/**,site-techdocs/**
            # Compiled classes from the build-java initContainer, so the Java analyzer binds instead of failing.
            - -Dsonar.java.binaries=nodes/mother/lab/weyland-platform/k8s/flink/health-job/target/classes,nodes/mother/lab/weyland-platform/k8s/flink/sql-runner/target/classes
          volumeMounts:
            - name: src
              mountPath: /usr/src
      volumes:
        - name: src
          emptyDir: {}
