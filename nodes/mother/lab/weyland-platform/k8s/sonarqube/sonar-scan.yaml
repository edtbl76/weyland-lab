# B69 Wave 4 — weekly SonarQube scan (was an on-demand Job). initContainer clones the public repo → build-java
# compiles the Flink Java modules (so SonarQube's bytecode-aware Java analyzer binds instead of hard-failing) →
# sonar-scanner-cli analyzes against the in-cluster SonarQube over http (ClusterIP — no Traefik/mkcert TLS; the Job
# is unmeshed and SonarQube is PERMISSIVE mTLS, so plaintext is accepted). Kept SEPARATE from code-scan-suite:
# that one runs server-less file scanners → Port; SonarQube needs its own server. Token in Secret
# sonarqube-scan-token (global analysis token), created out-of-band, never committed. Weekly Sun 12:00 UTC (08:00 NY).
#
# SCOPE (B138 lane model): SonarQube owns CODE QUALITY on real application source. The scan lane (code-scan-suite:
# trivy/checkov/gitleaks) already owns SECURITY across ALL files including IaC. Scanning `.` naively made SonarQube
# re-flag the whole infra monorepo — ~280 k8s/Docker/notebook findings that duplicate code-scan-suite and drowned
# the ~230 real Python/Java findings, so the gate failed on pure noise. `sonar.exclusions` therefore drops the
# non-code surface: k8s/Argo/Helm YAML + OpenTofu (checkov owns them), Dockerfiles (trivy owns them), notebooks,
# build artifacts, the golden-paths/ language fixtures (B88/B153 hello-world, no prod code) and eval/ task fixtures
# (deliberately-buggy coding-agent tasks). What remains is the real code: the Python services + the Flink Java modules.
#
# COVERAGE: the `coverage-python` initContainer mirrors CI's python lane EXACTLY (.woodpecker.yml `test-python`):
# python:3.12-slim → run-lang-tests.sh python (installs each project's requirements-test.txt, runs the suites) →
# coverage-ratchet.sh run python. coverage-ratchet's cov_python now also emits a Cobertura coverage.xml per real
# service (weyland-dagster, weyland-guard); the scanner imports them via sonar.python.coverage.reportPaths, so
# `coverage` is a real number instead of 0. Best-effort: a test/ratchet failure never fails the scan (CI is the
# enforcing gate) — a missing report just yields honest 0%, never a false green. The gate stays the strict default
# "Sonar way" (new_coverage 80% / 0 new violations / hotspots reviewed); wiring coverage makes ONE of its three
# conditions measurable — new violations + hotspot review remain a separate burndown, tracked in the backlog.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sonar-scan
  namespace: weyland
spec:
  schedule: "0 12 * * 0"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          initContainers:
            - name: clone
              image: alpine/git:latest
              args: ["clone", "--depth", "1", "https://github.com/edtbl76/weyland-lab.git", "/usr/src"]
              volumeMounts:
                - { name: src, mountPath: /usr/src }
            - name: build-java
              image: maven:3.9-eclipse-temurin-17
              workingDir: /usr/src
              command: ["sh", "-c", "mvn -q -B -f nodes/mother/lab/weyland-platform/k8s/flink/health-job/pom.xml compile && mvn -q -B -f nodes/mother/lab/weyland-platform/k8s/flink/sql-runner/pom.xml compile"]
              volumeMounts:
                - { name: src, mountPath: /usr/src }
            - name: coverage-python
              # Produce Cobertura coverage.xml for the real Python services, exactly as CI does. Best-effort:
              # the scan must never fail on a test/ratchet non-zero — CI is the enforcing gate, this only needs
              # the coverage.xml side-effect. An empty result yields an honest 0%, never a false green.
              image: python:3.12-slim
              workingDir: /usr/src
              command:
                - sh
                - -c
                - |
                  set -u
                  pip install --quiet --no-cache-dir pytest pytest-cov prometheus_client || \
                    { echo "!! pip install failed — coverage skipped, scan proceeds at honest 0%"; exit 0; }
                  bash scripts/run-lang-tests.sh python || echo "!! run-lang-tests python non-zero (coverage best-effort)"
                  bash scripts/coverage-ratchet.sh run python || echo "!! coverage-ratchet python non-zero (coverage.xml still emitted where tests ran)"
              volumeMounts:
                - { name: src, mountPath: /usr/src }
          containers:
            - name: scanner
              image: sonarsource/sonar-scanner-cli:latest
              env:
                - name: SONAR_HOST_URL
                  value: http://sonarqube.weyland.svc.cluster.local:9000
                - name: SONAR_TOKEN
                  valueFrom: { secretKeyRef: { name: sonarqube-scan-token, key: SONAR_TOKEN } }
              args:
                - -Dsonar.projectKey=weyland-lab
                - -Dsonar.sources=.
                - -Dsonar.exclusions=**/node_modules/**,**/.yarn/**,**/.git/**,**/openclaw/**,site-techdocs/**,golden-paths/**,eval/**,**/*.ipynb,**/*.yaml,**/*.yml,**/*.tf,**/*.tfvars,**/Dockerfile,**/Dockerfile.*,**/*.dockerfile,**/target/**,**/build/**,**/.build/**,**/dist/**,**/.next/**,**/_build/**,**/coverage.xml,**/.venv/**
                - -Dsonar.java.binaries=nodes/mother/lab/weyland-platform/k8s/flink/health-job/target/classes,nodes/mother/lab/weyland-platform/k8s/flink/sql-runner/target/classes
                - -Dsonar.python.coverage.reportPaths=**/coverage.xml
                # Coverage measures LOGIC, not generated data or pure I/O. Two groups are out of the coverage
                # denominator (still fully analyzed for ISSUES):
                #  (a) generated/data files, 0 functions: aidlc_glossary (auto-gen 480-term dict), datasets_field_docs,
                #      mesh_vocabulary, roles (baked prompt strings).
                #  (b) the dagster ASSET-ORCHESTRATION layer — the top-level @asset bodies (assets/*.py), the resource
                #      clients (resources/), the schedule/Definitions wiring. These are INTEGRATION code: they run the
                #      pipeline (download→read→write to lakeFS/stores) and are verified by the running system + the
                #      data-quality checks (Soda/GE), while the extractable transform LOGIC lives in assets/datasets_lib/
                #      (which stays IN coverage and IS unit-tested). Unit-"covering" the asset bodies means mocking
                #      dagster + every store client = testing mocks, not correctness — so they leave the coverage
                #      denominator (still fully ISSUE-scanned). datasets_lib is deliberately NOT matched by assets/*.py
                #      (it is a subdir). NOTE: source_document/eval_testset carry small logic blocks that ARE unit-tested
                #      (tests still run + guard); extracting that logic to datasets_lib to re-count it is a follow-on.
                - -Dsonar.coverage.exclusions=**/aidlc_glossary.py,**/datasets_field_docs.py,**/mesh_vocabulary.py,**/roles.py,**/weyland_pipeline/assets/*.py,**/weyland_pipeline/resources/**,**/weyland_pipeline/schedules/**,**/weyland_pipeline/definitions.py
              volumeMounts:
                - { name: src, mountPath: /usr/src }
          volumes:
            - { name: src, emptyDir: {} }
