# 2026-11-24: `traefik-forward-auth` is a CHAIN — upgrade http to https FIRST, then authenticate. Over plain http the
# proxy built redirect_uri=http://auth.weyland.lab/_oauth, which Keycloak rejects ("Invalid parameter: redirect_uri").
# Same shape in every namespace's copy (Traefik blocks cross-namespace refs); test: scripts/tests/write-surface-netpol.bats.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-forward-auth
  namespace: opencost
spec:
  chain:
    middlewares:
      - name: traefik-forward-auth-https
      - name: traefik-forward-auth-core
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-forward-auth-https
  namespace: opencost
spec:
  redirectScheme: { scheme: https, permanent: false }
---
# B55 — OpenCost UI via Traefik TLS at opencost.weyland.lab. Reuses the mkcert wildcard cert
# (weyland-wildcard-tls — must exist in the opencost ns; copy it from the weyland ns once). The UI
# service is opencost:9090 (the cost-model API is on 9003). CoreDNS *.weyland.lab wildcard already
# resolves this to mother; rogueone needs an explicit /etc/hosts line (it doesn't use CoreDNS).
# Keycloak SSO gate — local forward-auth Middleware (cross-ns middleware refs are blocked), targets the shared
# traefik-forward-auth service in weyland.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-forward-auth-core
  namespace: opencost
spec:
  forwardAuth:
    address: http://traefik-forward-auth.weyland.svc.cluster.local:4181
    trustForwardHeader: true
    authResponseHeaders:
      - X-Forwarded-User
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opencost
  namespace: opencost
  # Keycloak SSO gate (forward-auth) — all UIs behind Keycloak.
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: opencost-traefik-forward-auth@kubernetescrd
spec:
  tls:
    - hosts:
        - opencost.weyland.lab
      secretName: weyland-wildcard-tls
  rules:
    - host: opencost.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opencost
                port:
                  number: 9090
