# MinIO-backed OCI registry (distribution/registry) — the platform's private Docker registry. Image blobs live
# in MinIO (bucket `registry`), so this pod is STATELESS (no PVC). Fronted by Traefik at registry.weyland.lab
# (wildcard TLS so Docker gets HTTPS). Reuses the weyland-ns MinIO creds (aidlc-kb-minio-secret), same as MLflow.
#
# B211 (2026-10-14): TWO hosts. It used to take unauthenticated pushes, so any pod or LAN machine could replace an image
# every workload pulls. registry.weyland.lab is the PULL name (every reader: node containerd, registry-ui, blackbox,
# syft/trivy; GET/HEAD only once phase 3 lands). registry-push.weyland.lab is the PUSH name, behind Traefik basic auth
# (secret registry-push-auth, htpasswd). The docker CLI, buildkit and cosign handle the basic-auth challenge; the
# IntelliJ "Unsupported" problem that dropped basic auth before only hits GUI clients, which only ever pull.
#
# ONE out-of-band prerequisite (NOT committed), on mother — the bucket:
#   mc mb <minio-alias>/registry            (or via the MinIO console)
# The earlier registry-auth secret is now unused: kubectl -n weyland delete secret registry-auth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: weyland
  labels:
    app: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
      # NOT meshed: only talks plain HTTP to MinIO (no STRICT-mTLS Postgres in the path), so no sidecar needed.
    spec:
      containers:
        - name: registry
          image: registry:2.8.3  # nosemgrep: yaml.kubernetes.security.run-as-non-root.run-as-non-root
          imagePullPolicy: IfNotPresent
          # B47 hardening: drop priv-esc + seccomp (see arch)
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: REGISTRY_HTTP_ADDR
              value: ":5000"
            # REGISTRY_HTTP_HOST is deliberately UNSET (B211, 2026-10-14). It pinned blob-upload Location headers to
            # https://registry.weyland.lab, which is the pull-only name now; pushes arrive on registry-push.weyland.lab.
            # Unset, the registry builds them from the request's Host + X-Forwarded-Proto (Traefik sets both).
            # Internal HMAC salt for upload state (single replica → any fixed value; NOT a credential).
            - name: REGISTRY_HTTP_SECRET
              value: weyland-registry-http-secret
            # --- S3 storage driver → MinIO ---
            - name: REGISTRY_STORAGE
              value: s3
            - name: REGISTRY_STORAGE_S3_REGIONENDPOINT
              value: http://minio.minio.svc.cluster.local:9000
            - name: REGISTRY_STORAGE_S3_BUCKET
              value: registry
            - name: REGISTRY_STORAGE_S3_REGION
              value: us-east-1
            - name: REGISTRY_STORAGE_S3_SECURE          # http endpoint, not https
              value: "false"
            - name: REGISTRY_STORAGE_S3_FORCEPATHSTYLE  # MinIO needs path-style, not vhost-style
              value: "true"
            # CRITICAL: without this the registry redirects blob GETs to *presigned MinIO URLs* pointing at
            # minio.minio.svc:9000 — which external clients (rogueone) can't reach. Disabling redirect makes the
            # registry PROXY blob bytes through the ingress, so clients never need direct MinIO access.
            # NOTE: `redirect.disable` is a SIBLING of `s3` under `storage` (storage.redirect.disable), NOT a key
            # inside s3 — so the env var is REGISTRY_STORAGE_REDIRECT_DISABLE (a _S3_ prefix here is ignored).
            - name: REGISTRY_STORAGE_REDIRECT_DISABLE
              value: "true"
            - name: REGISTRY_STORAGE_DELETE_ENABLED     # allow image deletes + GC
              value: "true"
            - name: REGISTRY_STORAGE_S3_ACCESSKEY
              valueFrom:
                secretKeyRef:
                  name: aidlc-kb-minio-secret
                  key: access_key
            - name: REGISTRY_STORAGE_S3_SECRETKEY
              valueFrom:
                secretKeyRef:
                  name: aidlc-kb-minio-secret
                  key: secret_key
          readinessProbe:
            httpGet:
              path: /v2/            # no auth → 200
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: weyland
  labels:
    app: registry
spec:
  type: ClusterIP
  selector:
    app: registry
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registry
  namespace: weyland
spec:
  tls:
    - hosts:
        - registry.weyland.lab
      secretName: weyland-wildcard-tls
  rules:
    - host: registry.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: registry
                port:
                  number: 5000
---
# The PUSH host (B211). Same backend as registry.weyland.lab, so anything pushed here is pullable at the old name.
# The middleware's secret is created out-of-band, from scripts/.env (runbooks/write-surfaces.md § Registry):
#   users = <REGISTRY_PUSH_USER>:<apr1 hash of REGISTRY_PUSH_PASSWORD>
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: registry-push-auth
  namespace: weyland
spec:
  basicAuth:
    secret: registry-push-auth
    realm: registry-push
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registry-push
  namespace: weyland
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: weyland-registry-push-auth@kubernetescrd
spec:
  tls:
    - hosts:
        - registry-push.weyland.lab
      secretName: weyland-wildcard-tls
  rules:
    - host: registry-push.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: registry
                port:
                  number: 5000
