# MinIO-backed OCI registry (distribution/registry) — the platform's private Docker registry. Image blobs live
# in MinIO (bucket `registry`), so this pod is STATELESS (no PVC). Fronted by Traefik at registry.weyland.lab
# (wildcard TLS so Docker gets HTTPS) with basic-auth (docker login) — forward-auth/SSO can't be used because the
# docker CLI only speaks Basic. Reuses the weyland-ns MinIO creds (aidlc-kb-minio-secret), same as MLflow.
#
# TWO out-of-band prerequisites (NOT committed), on mother:
#   1. bucket:  mc mb <minio-alias>/registry            (or via the MinIO console)
#   2. auth secret:
#      kubectl create secret generic registry-auth -n weyland \
#        --from-literal=users="admin:$(openssl passwd -apr1 weyland_dev_password)"
#
# Then on rogueone:  docker login registry.weyland.lab -u admin -p weyland_dev_password
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: registry-auth
  namespace: weyland
spec:
  basicAuth:
    secret: registry-auth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: weyland
  labels:
    app: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
      # NOT meshed: only talks plain HTTP to MinIO (no STRICT-mTLS Postgres in the path), so no sidecar needed.
    spec:
      containers:
        - name: registry
          image: registry:2.8.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: REGISTRY_HTTP_ADDR
              value: ":5000"
            # Behind the Traefik proxy — advertise the external URL so blob-upload location headers are correct.
            - name: REGISTRY_HTTP_HOST
              value: https://registry.weyland.lab
            # Internal HMAC salt for upload state (single replica → any fixed value; NOT a credential).
            - name: REGISTRY_HTTP_SECRET
              value: weyland-registry-http-secret
            # --- S3 storage driver → MinIO ---
            - name: REGISTRY_STORAGE
              value: s3
            - name: REGISTRY_STORAGE_S3_REGIONENDPOINT
              value: http://minio.minio.svc.cluster.local:9000
            - name: REGISTRY_STORAGE_S3_BUCKET
              value: registry
            - name: REGISTRY_STORAGE_S3_REGION
              value: us-east-1
            - name: REGISTRY_STORAGE_S3_SECURE          # http endpoint, not https
              value: "false"
            - name: REGISTRY_STORAGE_S3_FORCEPATHSTYLE  # MinIO needs path-style, not vhost-style
              value: "true"
            # CRITICAL: without this the registry redirects blob GETs to *presigned MinIO URLs* pointing at
            # minio.minio.svc:9000 — which external clients (rogueone) can't reach. Disabling redirect makes the
            # registry PROXY blob bytes through the ingress, so clients never need direct MinIO access.
            - name: REGISTRY_STORAGE_S3_REDIRECT_DISABLE
              value: "true"
            - name: REGISTRY_STORAGE_DELETE_ENABLED     # allow image deletes + GC
              value: "true"
            - name: REGISTRY_STORAGE_S3_ACCESSKEY
              valueFrom:
                secretKeyRef:
                  name: aidlc-kb-minio-secret
                  key: access_key
            - name: REGISTRY_STORAGE_S3_SECRETKEY
              valueFrom:
                secretKeyRef:
                  name: aidlc-kb-minio-secret
                  key: secret_key
          readinessProbe:
            httpGet:
              path: /v2/            # authless at the pod (basic-auth is at Traefik) → 200
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: weyland
  labels:
    app: registry
spec:
  type: ClusterIP
  selector:
    app: registry
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registry
  namespace: weyland
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: weyland-registry-auth@kubernetescrd
spec:
  tls:
    - hosts:
        - registry.weyland.lab
      secretName: weyland-wildcard-tls
  rules:
    - host: registry.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: registry
                port:
                  number: 5000
