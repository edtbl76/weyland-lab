# Persistent Ray head — the standing cluster you SUBMIT jobs to (Ray Dashboard "Submit Job" + a Port action),
# instead of docker-run-per-job. Phase 1: a normal in-cluster pod on mother; jobs run on the head itself (light
# sweeps only — real compute arrives in Phase 2 when rogueone joins as an edge worker). Plain Ray, NOT KubeRay
# (KubeRay only manages in-cluster POD workers; edge/external nodes need a plain `ray start` cluster).
#
# NOT hostNetwork yet: keeps Ray's ports OFF the LAN (the dashboard's Jobs API is unauthenticated = RCE). The
# dashboard is reachable ONLY via the Keycloak-gated ingress; the Jobs API only via cluster DNS (the port-agent).
# Phase 2 flips hostNetwork on (so edge workers can reach mother's real IP) + adds the DMZ firewall.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ray-head
  namespace: weyland
  labels:
    app: ray-head
spec:
  replicas: 1
  strategy:
    type: Recreate            # single Ray head — never two GCS at once
  selector:
    matchLabels:
      app: ray-head
  template:
    metadata:
      labels:
        app: ray-head
    spec:
      # hostNetwork so an EXTERNAL worker (rogueone) can reach the head's GCS on mother's real IP (.243). Exposes
      # the unauth dashboard on the LAN → revert / firewall :8265 after the validation; the DMZ is the Phase-2 fix.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: ray-head
          image: registry.weyland.lab/ray-head:v5   # base Ray + trainer deps (services/ray-head/) — v5: --source feast
          command: ["/bin/bash", "-lc"]
          # --num-cpus=0 → the head only COORDINATES; the driver runs here but trials schedule onto the worker
          # (rogueone). --block keeps `ray start` foreground as PID 1.
          args:
            - >
              ray start --head --node-ip-address=192.168.1.243 --dashboard-host=0.0.0.0 --dashboard-port=8265
              --port=6379 --num-cpus=0 --metrics-export-port=8080 --disable-usage-stats --block
          ports:
            - name: dashboard
              containerPort: 8265     # dashboard UI + Jobs API (submit)
            - name: gcs
              containerPort: 6379     # GCS (Phase 2 edge workers dial this)
            - name: client
              containerPort: 10001    # Ray Client
            - name: metrics
              containerPort: 8080      # Prometheus metrics (ray_* + autoscaler) — scraped by the ServiceMonitor
          # Submitted jobs INHERIT this env — in-cluster the trainer needs no port-forwards/kubeconfig, just the
          # svc-DNS endpoints + creds. (mlflow/lakefs inbound are PERMISSIVE, so an unmeshed head reaches them.)
          env:
            # LAN endpoints (not svc DNS) so the values, captured by the driver and shipped into worker tasks,
            # work on the EXTERNAL worker too. MLflow = the NodePort; MinIO = the LAN S3 ingress (IGNORE_TLS: its
            # mkcert cert isn't in the worker's trust). lakeFS stays svc DNS — only the in-cluster driver reads it.
            - name: MLFLOW_TRACKING_URI
              value: http://192.168.1.243:30500
            - name: MLFLOW_S3_ENDPOINT_URL
              value: https://s3.weyland.lab
            - name: LAKEFS_ENDPOINT
              value: http://lakefs.data-mesh.svc.cluster.local:8000
            - name: LAKEFS_BRANCH
              value: main
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: LAKEFS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: lakefs-creds, key: LAKEFS_ACCESS_KEY_ID }
            - name: LAKEFS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: lakefs-creds, key: LAKEFS_SECRET_ACCESS_KEY }
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: aidlc-kb-minio-secret, key: access_key }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: aidlc-kb-minio-secret, key: secret_key }
            # --- Ray dashboard Metrics tab (embeds Grafana panels backed by our kube-prometheus-stack) ---
            # Server-side (the dashboard backend queries these in-cluster; hostNetwork + ClusterFirstWithHostNet
            # resolves svc DNS): Prometheus for the metric queries, Grafana for a health check.
            - name: RAY_PROMETHEUS_HOST
              value: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
            - name: RAY_PROMETHEUS_NAME
              value: Prometheus                       # the Grafana datasource name (chart default)
            - name: RAY_GRAFANA_HOST
              value: http://monitoring-grafana.monitoring.svc.cluster.local
            # Browser-facing Grafana URL for the <iframe> panels (same weyland.lab site → the Keycloak SSO cookie
            # carries into the iframe; Grafana needs allow_embedding=true, set in the kube-prometheus-stack values).
            - name: RAY_GRAFANA_IFRAME_HOST
              value: https://grafana.weyland.lab
          readinessProbe:
            httpGet:
              path: /api/version       # dashboard API — 200 once the head is up
              port: 8265
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ray-head
  namespace: weyland
  labels:
    app: ray-head
spec:
  type: ClusterIP
  selector:
    app: ray-head
  ports:
    - name: dashboard
      port: 8265
      targetPort: 8265
    - name: gcs
      port: 6379
      targetPort: 6379
    - name: client
      port: 10001
      targetPort: 10001
    - name: metrics
      port: 8080
      targetPort: 8080
---
# Dashboard UI at ray.weyland.lab — Keycloak forward-auth (browser SSO), like the other UIs. The Jobs API used by
# the Port action is reached in-cluster via ray-head.weyland.svc:8265 (NOT this gated ingress).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ray-dashboard
  namespace: weyland
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: weyland-traefik-forward-auth@kubernetescrd
spec:
  tls:
    - hosts:
        - ray.weyland.lab
      secretName: weyland-wildcard-tls
  rules:
    - host: ray.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ray-head
                port:
                  number: 8265
