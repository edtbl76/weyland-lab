apiVersion: apps/v1
kind: Deployment
metadata:
  name: weyland-apisix-dashboard
  namespace: weyland
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weyland-apisix-dashboard
  template:
    metadata:
      labels:
        app: weyland-apisix-dashboard
    spec:
      containers:
        - name: apisix-dashboard
          image: apache/apisix-dashboard:3.0.1-alpine
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: dashboard-config
              mountPath: /usr/local/apisix-dashboard/conf/conf.yaml
              subPath: conf.yaml
          readinessProbe:
            httpGet:
              path: /
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: dashboard-config
          configMap:
            name: apisix-dashboard-config
---
apiVersion: v1
kind: Service
metadata:
  name: weyland-apisix-dashboard
  namespace: weyland
spec:
  # ClusterIP only — access is HTTPS via Traefik Ingress (apisix.weyland.lab).
  # Raw LAN HTTP on :30091 removed (U9).
  type: ClusterIP
  selector:
    app: weyland-apisix-dashboard
  ports:
    - name: dashboard
      port: 9000
      targetPort: 9000
---
# Plain Ingress (portable). TLS secret weyland-wildcard-tls already exists in weyland ns.
# Note: the APISIX *dashboard* is a platform-hosted UI → it sits behind Traefik like the
# other UIs. (The APISIX *gateway* itself remains the outlier-cell front door — separate.)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weyland-apisix-dashboard
  namespace: weyland
  # Keycloak SSO gate (forward-auth) — all UIs behind Keycloak.
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: weyland-traefik-forward-auth@kubernetescrd
spec:
  tls:
    - hosts:
        - apisix.weyland.lab
      secretName: weyland-wildcard-tls
  rules:
    - host: apisix.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: weyland-apisix-dashboard
                port:
                  number: 9000
