apiVersion: apps/v1
kind: Deployment
metadata:
  name: weyland-postgres
  namespace: weyland
spec:
  replicas: 1
  # Single-instance + ReadWriteOnce storage: kill the old pod BEFORE starting the new
  # one so they never contend for the storage lock on restart (RollingUpdate deadlocks).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: weyland-postgres
  template:
    metadata:
      labels:
        app: weyland-postgres
        sidecar.istio.io/inject: "true"   # B8 — Istio sidecar (per-workload injection; weyland ns is unlabeled)
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          args: ["-c", "max_connections=200"]
          envFrom:
            - secretRef:
                name: weyland-postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: weyland-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: weyland-postgres
  namespace: weyland
spec:
  selector:
    app: weyland-postgres
  ports:
    - port: 5432
      targetPort: 5432
      appProtocol: tcp        # B8 — tell Istio this is opaque TCP (Postgres wire protocol); else sidecar mis-parses as HTTP
