# B1.3 — forward-auth Middleware local to the opensearch ns (cross-namespace Traefik middleware refs are
# blocked by default), targeting the shared traefik-forward-auth service in weyland. The Dashboards
# ingress references opensearch-traefik-forward-auth@kubernetescrd to gate the UI behind Keycloak.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-forward-auth
  namespace: opensearch
spec:
  forwardAuth:
    address: http://traefik-forward-auth.weyland.svc.cluster.local:4181
    trustForwardHeader: true
    authResponseHeaders:
      - X-Forwarded-User
