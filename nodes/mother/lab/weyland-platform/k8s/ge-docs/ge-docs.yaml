# ge-docs — nginx serving Great Expectations Data Docs (B77 part b). The GE run (ge_validate_op, which executes IN
# the user-code pod via DefaultRunLauncher) writes Data Docs to the shared `ge-data-docs` PVC at /ge-data; this nginx
# mounts the same PVC read-only and serves <root>/uncommitted/data_docs/local_site at ge-docs.weyland.lab. RWO works
# because both pods are on mother (single node). Registered as a pure-compute `ui` component in applications.yaml
# (B82); Kuma monitor + GeDocsDown alert per the DoD onboarding rule.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ge-data-docs
  namespace: weyland
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ge-docs-nginx
  namespace: weyland
data:
  # root points at the Data Docs local_site; mounting the whole PVC (not a subPath) avoids the "subdir must exist
  # before the first GE run" chicken-egg — nginx just 404s until ge_validate_job has run once.
  default.conf: |
    server {
      listen 80;
      root /ge-data/uncommitted/data_docs/local_site;
      index index.html;
      location / { try_files $uri $uri/ =404; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ge-docs
  namespace: weyland
  labels:
    app: ge-docs
spec:
  replicas: 1
  strategy:
    type: Recreate           # RWO PVC — one pod at a time
  selector:
    matchLabels:
      app: ge-docs
  template:
    metadata:
      labels:
        app: ge-docs
    spec:
      nodeSelector:
        kubernetes.io/hostname: mother   # co-locate with user-code so the RWO PVC is shareable
      containers:
        - name: nginx
          image: nginx:1.27-alpine  # nosemgrep: yaml.kubernetes.security.run-as-non-root.run-as-non-root
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: { memory: 32Mi, cpu: 20m }
            limits: { memory: 128Mi }
          ports:
            - containerPort: 80
          volumeMounts:
            - name: docs
              mountPath: /ge-data
              readOnly: true
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: docs
          persistentVolumeClaim:
            claimName: ge-data-docs
        - name: conf
          configMap:
            name: ge-docs-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: ge-docs
  namespace: weyland
spec:
  selector:
    app: ge-docs
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ge-docs
  namespace: weyland
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: weyland-traefik-forward-auth@kubernetescrd  # Keycloak SSO gate
spec:
  tls:
    - hosts:
        - ge-docs.weyland.lab
      secretName: weyland-wildcard-tls
  rules:
    - host: ge-docs.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ge-docs
                port:
                  number: 80
