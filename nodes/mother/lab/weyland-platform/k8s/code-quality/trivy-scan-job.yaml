# On-demand Trivy scan (Code Quality, B43) → Port. init: clone → trivy fs (vuln+secret+misconfig, JSON) → main
# python container counts severities and POSTs to the Port `code-quality` webhook (security_scan blueprint).
# Ingest URL in Secret `port-ingest-url` (key `url`), never committed. Re-run:
# `kubectl delete job trivy-scan-weyland -n weyland` then re-apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: trivy-scan-weyland
  namespace: weyland
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: clone
          image: alpine/git:latest
          args: ["clone", "--depth", "1", "https://github.com/edtbl76/weyland-lab.git", "/src"]
          volumeMounts:
            - name: src
              mountPath: /src
        - name: trivy
          image: aquasec/trivy:latest
          args:
            - fs
            # --offline-scan: do NOT resolve dependencies over the network. The Flink pom.xml files (B83) made Trivy
            # fetch transitive POMs from Maven Central, which 429-rate-limited and blocked mother's IP for 30 min.
            # Offline still does Dockerfile/k8s misconfig + secret + local lockfile scanning — just no Maven fetch.
            - --offline-scan
            - --scanners
            - vuln,secret,misconfig
            - --severity
            - CRITICAL,HIGH,MEDIUM,LOW
            - --no-progress
            - --format
            - json
            - --output
            - /out/trivy.json
            - --skip-dirs
            - "**/node_modules,**/.yarn,**/openclaw,site-techdocs"
            # B47: documented accepted findings (ShadowRay disputed+isolated, public-repo intentional, gatekeeper/
            # kiali RBAC required). Repo clones to /src, so the .trivyignore lives at /src/.trivyignore.
            - --ignorefile
            - /src/.trivyignore
            - /src
          volumeMounts:
            - name: src
              mountPath: /src
            - name: out
              mountPath: /out
      containers:
        - name: report
          image: python:3-alpine
          env:
            - name: PORT_INGEST_URL
              valueFrom:
                secretKeyRef:
                  name: port-ingest-url
                  key: url
          command: ["python3", "-c"]
          args:
            - |
              import json, os, urllib.request, datetime
              d = json.load(open('/out/trivy.json'))
              c = {'CRITICAL': 0, 'HIGH': 0, 'MEDIUM': 0, 'LOW': 0}
              for r in (d.get('Results') or []):
                  tgt = r.get('Target', '')
                  for k in ('Vulnerabilities', 'Misconfigurations', 'Secrets'):
                      for f in (r.get(k) or []):
                          s = (f.get('Severity') or '').upper()
                          if s in c:
                              c[s] += 1
                          idv = f.get('ID') or f.get('AVDID') or f.get('RuleID') or ''
                          print(f"[{s}] {tgt} {idv} :: {(f.get('Title') or f.get('Description') or '')[:100]}")
              p = {'tool': 'trivy', 'target': 'weyland-lab',
                   'critical': c['CRITICAL'], 'high': c['HIGH'],
                   'medium': c['MEDIUM'], 'low': c['LOW'], 'total': sum(c.values()),
                   'scannedAt': datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')}
              req = urllib.request.Request(os.environ['PORT_INGEST_URL'],
                  data=json.dumps(p).encode(), headers={'Content-Type': 'application/json'})
              print('POST', urllib.request.urlopen(req).status, p)
          volumeMounts:
            - name: out
              mountPath: /out
      volumes:
        - name: src
          emptyDir: {}
        - name: out
          emptyDir: {}
