# B69 Wave 4 — weekly code-scan suite. Clones the repo (FULL history — code-maat needs it) once, then the
# scan-suite image runs the whole free-scanner set — the tool roster is the repo-root quality-tools.yaml (SOURCE OF
# TRUTH; scripts/check-quality-tools.sh guards it), now multi-language (Python/Go/shell/docker/IaC + HTTP-headers) —
# POSTing per-tool severity counts to the Port `code-quality` webhook
# (Secret port-ingest-url). Replaces the manual semgrep-scan-job + trivy-scan-job (folded in). SonarQube is its own
# CronJob (sonar-scan — needs the server + a Java build). Weekly Sun 13:00 UTC (09:00 NY) — clear of the DataHub
# train (05:00–10:00 UTC) and the image-prune (15:00 UTC). Image built via scripts/build-push-images.sh.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: code-scan-suite
  namespace: weyland
spec:
  schedule: "0 13 * * 0"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          initContainers:
            - name: clone   # FULL clone (no --depth) so code-maat sees real history
              image: alpine/git:latest
              args: ["clone", "https://github.com/edtbl76/weyland-lab.git", "/src"]
              volumeMounts:
                - { name: src, mountPath: /src }
          containers:
            - name: scan-suite
              image: registry.weyland.lab/scan-suite:git-59d33de2
              imagePullPolicy: IfNotPresent
              env:
                - name: PORT_INGEST_URL
                  valueFrom: { secretKeyRef: { name: port-ingest-url, key: url } }
              securityContext:
                allowPrivilegeEscalation: false
                seccompProfile: { type: RuntimeDefault }
              resources:
                # cpu is a SCHEDULING RESERVATION, not a cap — there is no cpu limit, so the scan
                # still bursts to whatever the node has free. On a chronically request-saturated
                # single node a batch job with no latency SLO should reserve little and burst wide:
                # at 250m this job sat Pending for 40min behind reservations the fleet wasn't using.
                requests: { cpu: 100m, memory: 512Mi }
                # 2Gi SIGKILLed the pod (exit 137) mid-semgrep on 2026-08-20: semgrep defaults --jobs to the
                # CPU count, so on this 16-core node it forked ~16 workers against a 2Gi cgroup. scan.py now
                # pins --jobs/--max-memory (durable fix, needs an image rebuild); this headroom is the belt to
                # that braces, and the node has ~76Gi so it costs nothing to hold.
                limits: { memory: 6Gi } # semgrep auto + trivy fs are the heavy ones
              volumeMounts:
                - { name: src, mountPath: /src }
                - { name: out, mountPath: /out }
          volumes:
            - { name: src, emptyDir: {} }
            - { name: out, emptyDir: {} }
