# B69 Wave 4 — weekly code-scan suite. B138: generalized from weyland-lab-only to EVERY active repo
# (repos.yaml `scan: true`, reconciled by scripts/check-repo-coverage.sh). A wrapper (scan-all.sh, ConfigMap
# below) loops over SCAN_REPOS: for each repo it clones a FRESH /src (FULL history — code-maat needs it) with
# the pr-lifecycle token (Contents: read → works for public AND private repos), then runs the shared scan.py
# once with SCAN_TARGET set, so each repo gets its own Port `code-quality` counts + MinIO report. The tool
# roster is the repo-root quality-tools.yaml (SOURCE OF TRUTH; scripts/check-quality-tools.sh guards it).
# SonarQube is its own CronJob (sonar-scan). Weekly Sun 04:00 NY — after the three Sonar scans
# (03:00–03:30), clear of the 02:17 ingestion and the 06:00 dbt build; ~44–55 min (B228, 2026-10-19: moved out of the working day — Design Rule #5 — and onto the NY clock, Rule #1). Image built via scripts/build-push-images.sh (scan.py's SCAN_TARGET support needs a rebuild).
apiVersion: v1
kind: ConfigMap
metadata:
  name: scan-suite-runner
  namespace: weyland
data:
  scan-all.sh: |
    #!/bin/sh
    # Run the scan suite over every repo in SCAN_REPOS. Best-effort PER REPO: a clone/scan failure on one repo
    # never skips the rest — but the job exits nonzero so a persistent failure is visible (never a silent green).
    set -u
    : "${GITHUB_TOKEN:?GITHUB_TOKEN not set — needs the pr-lifecycle-github token with Contents: read}"
    : "${SCAN_REPOS:?SCAN_REPOS not set}"
    # scan.py exits 3 on a SCAN DEFECT (a tool crashed, an image could not be scanned) after posting everything else
    # (2026-10-16). A defect anywhere makes the whole run exit 3, which the podFailurePolicy below turns into a failed
    # Job with no retry; any other failure stays 1 and keeps the one retry for a transient clone or network error.
    rc=0
    defect=""
    for repo in $SCAN_REPOS; do
      echo "======================= scan-suite: edtbl76/${repo} ======================="
      find /src -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true   # fresh /src per repo
      if git clone --quiet "https://oauth2:${GITHUB_TOKEN}@github.com/edtbl76/${repo}.git" /src; then
        SCAN_TARGET="${repo}" python3 /usr/local/bin/scan.py
        r=$?
        if [ "$r" -eq 3 ]; then
          echo "!! SCAN DEFECT in ${repo} — see its '!! SCAN DEFECT' lines" >&2
          defect="${defect} ${repo}"
        elif [ "$r" -ne 0 ]; then
          echo "!! scan.py returned ${r} for ${repo}" >&2
          rc=1
        fi
      else
        echo "!! CLONE FAILED for ${repo} — NOT recording a scan (fail loud, not a silent zero)" >&2
        rc=1
      fi
    done
    if [ -n "$defect" ]; then
      echo "=== scan-suite: all repos processed — SCAN DEFECT in:${defect} (exit 3) ==="
      exit 3
    fi
    echo "=== scan-suite: all repos processed (rc=${rc}) ==="
    exit "${rc}"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: code-scan-suite
  namespace: weyland
spec:
  schedule: "0 4 * * 0"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 259200   # 72h: a failed Job alerts (and keeps its logs) for 3 days, then clears — never forever (2026-09-25)
      backoffLimit: 1
      # Exit 3 = a SCAN DEFECT (scan-all.sh above): rerunning a 55-minute scan would not fix a crashed tool, so fail
      # the Job at once — KubeJobFailed carries it to Telegram. Any other failure keeps the one retry (2026-10-16).
      podFailurePolicy:
        rules:
          - action: FailJob
            onExitCodes:
              containerName: scan-suite
              operator: In
              values: [3]
      template:
        spec:
          restartPolicy: Never
          # No initContainer clone any more — scan-all.sh clones each repo itself (public + private).
          containers:
            - name: scan-suite
              image: registry.weyland.lab/scan-suite:git-251cc06d   # bump after the scan.py SCAN_TARGET rebuild
              imagePullPolicy: IfNotPresent
              command: ["sh", "/runner/scan-all.sh"]
              env:
                # B138 — the active repos with scan:true (reconciled to repos.yaml by check-repo-coverage.sh).
                - name: SCAN_REPOS
                  value: "Algopedia ServiceTransformation emangini-tailwind-nextjs-contentlayer startme-curator stud.io weyland-lab freejack MyBodyGraph OJayFloyd grkit"
                # Clone credential: the pr-lifecycle token, now also granted Contents: read (clones public+private).
                - name: GITHUB_TOKEN
                  valueFrom: { secretKeyRef: { name: pr-lifecycle-github, key: token } }
                - name: PORT_INGEST_URL
                  valueFrom: { secretKeyRef: { name: port-ingest-url, key: url } }
                # Archive raw per-tool JSON to MinIO (/out is emptyDir). In-cluster http:// endpoint on purpose
                # (s3.weyland.lab would need the lab CA). Creds reuse aidlc-kb-minio-secret (mirrored into weyland).
                - name: SCAN_S3_ENDPOINT
                  value: http://minio.minio.svc.cluster.local:9000
                - name: SCAN_S3_BUCKET
                  value: scan-reports
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: aidlc-kb-minio-secret, key: access_key } }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: aidlc-kb-minio-secret, key: secret_key } }
              securityContext:
                allowPrivilegeEscalation: false
                seccompProfile: { type: RuntimeDefault }
              resources:
                # cpu is a scheduling reservation, not a cap (no cpu limit — bursts to free node capacity).
                # Now 8 repos sequentially, so hold a touch more memory headroom; still weekly, Forbid concurrency.
                requests: { cpu: 100m, memory: 512Mi }
                limits: { memory: 6Gi }   # semgrep auto + trivy fs are the heavy ones
              volumeMounts:
                - { name: src, mountPath: /src }
                - { name: out, mountPath: /out }
                - { name: runner, mountPath: /runner }
          volumes:
            - { name: src, emptyDir: {} }
            - { name: out, emptyDir: {} }
            - name: runner
              configMap: { name: scan-suite-runner, defaultMode: 0755 }
