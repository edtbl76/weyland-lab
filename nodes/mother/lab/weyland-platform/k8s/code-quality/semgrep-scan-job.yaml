# On-demand Semgrep scan (Code Quality, B43) → Port. init: clone → semgrep (auto ruleset, JSON) → main python
# container maps severities (ERROR→high, WARNING→medium, INFO→low; semgrep has no "critical") and POSTs to the
# Port `code-quality` webhook (security_scan blueprint). Ingest URL in Secret `port-ingest-url`, never committed.
# Re-run: `kubectl delete job semgrep-scan-weyland -n weyland` then re-apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: semgrep-scan-weyland
  namespace: weyland
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: clone
          image: alpine/git:latest
          args: ["clone", "--depth", "1", "https://github.com/edtbl76/weyland-lab.git", "/src"]
          volumeMounts:
            - name: src
              mountPath: /src
        - name: semgrep
          image: semgrep/semgrep:latest
          command: ["semgrep"]
          args:
            - scan
            - --config
            - auto
            - --json
            - --output
            - /out/semgrep.json
            - --exclude
            - node_modules
            - --exclude
            - .yarn
            - --exclude
            - openclaw
            - --exclude
            - site-techdocs
            - /src
          volumeMounts:
            - name: src
              mountPath: /src
            - name: out
              mountPath: /out
      containers:
        - name: report
          image: python:3-alpine
          env:
            - name: PORT_INGEST_URL
              valueFrom:
                secretKeyRef:
                  name: port-ingest-url
                  key: url
          command: ["python3", "-c"]
          args:
            - |
              import json, os, urllib.request, datetime
              d = json.load(open('/out/semgrep.json'))
              c = {'critical': 0, 'high': 0, 'medium': 0, 'low': 0}
              m = {'ERROR': 'high', 'WARNING': 'medium', 'INFO': 'low'}
              for f in (d.get('results') or []):
                  sev = ((f.get('extra') or {}).get('severity') or '').upper()
                  k = m.get(sev)
                  if k:
                      c[k] += 1
              p = {'tool': 'semgrep', 'target': 'weyland-lab',
                   'critical': c['critical'], 'high': c['high'],
                   'medium': c['medium'], 'low': c['low'], 'total': sum(c.values()),
                   'scannedAt': datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')}
              req = urllib.request.Request(os.environ['PORT_INGEST_URL'],
                  data=json.dumps(p).encode(), headers={'Content-Type': 'application/json'})
              print('POST', urllib.request.urlopen(req).status, p)
          volumeMounts:
            - name: out
              mountPath: /out
      volumes:
        - name: src
          emptyDir: {}
        - name: out
          emptyDir: {}
