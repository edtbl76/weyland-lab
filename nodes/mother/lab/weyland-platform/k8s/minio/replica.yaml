# MinIO replica on timberback (B134, 2026-11-16, owner: "yes, 30 days, include registry"). A second MinIO on a SECOND
# MACHINE, filled nightly from the primary (mother's USB disk, /mnt/minio). Closes docs/dr.md Closing Gaps 1, 3 and 4:
#   1. the core Postgres dumps sat on the same USB disk as MinIO: they are the `backups` bucket, so they are copied here;
#   3. the old mirror (backup.yaml, mother NVMe) has no history: every replica bucket is VERSIONED and keeps 30 days of
#      noncurrent versions, so a bad delete or overwrite upstream is recoverable for 30 days;
#   4. `rogueone-backup` lived only on the USB disk: EVERY bucket is copied, not a list.
# Still the same house: this is not an off-site copy (gap 5 stays open). Runbook: docs/runbooks/storage-minio.md § Replica.
#
# Same credentials as the primary (minio-creds): same trust boundary, one secret to rotate. In-cluster only (ClusterIP),
# like the primary's own Service.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-replica-data
  namespace: minio
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path   # WaitForFirstConsumer: created on timberback's NVMe, where the pod is pinned
  resources:
    requests:
      storage: 2000Gi            # ~1.02 TB today (2026-11-16) + 30 days of history; local-path does not enforce it
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-replica
  namespace: minio
  labels:
    app: minio-replica
spec:
  replicas: 1
  strategy:
    type: Recreate               # one RWO volume
  selector:
    matchLabels:
      app: minio-replica
  template:
    metadata:
      labels:
        app: minio-replica
    spec:
      # The point is a SECOND MACHINE: pinned to timberback, never mother. The toleration goes with the onboarding taint.
      nodeSelector:
        kubernetes.io/hostname: timberback
      tolerations:
        - key: weyland.lab/onboarding
          operator: Exists
          effect: NoSchedule
      securityContext:           # as the primary (deployment.yaml); the image's user is `minio`
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: minio
          image: alpine/minio:RELEASE.2025-10-15T17-29-55Z   # the primary's image (deployment.yaml)
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: minio-creds, key: MINIO_ROOT_USER } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: minio-creds, key: MINIO_ROOT_PASSWORD } }
          ports:
            - { name: api, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 2Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-replica-data }
---
apiVersion: v1
kind: Service
metadata:
  name: minio-replica
  namespace: minio
  labels:
    app: minio-replica
spec:
  type: ClusterIP
  selector:
    app: minio-replica
  ports:
    - { name: api, port: 9000, targetPort: 9000 }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-replica-lifecycle
  namespace: minio
data:
  # Applied to every replica bucket with `mc ilm import` (it REPLACES the bucket's lifecycle, so re-running is
  # idempotent). Noncurrent versions (what an overwrite or a mirrored delete leaves behind) expire after 30 days, and a
  # delete marker with nothing left behind it is cleaned up, so a deleted object really goes after 30 days.
  lifecycle.json: |
    {"Rules":[{"ID":"replica-30d-history","Status":"Enabled","Filter":{"Prefix":""},
      "NoncurrentVersionExpiration":{"NoncurrentDays":30},
      "Expiration":{"ExpiredObjectDeleteMarker":true}}]}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minio-replica-sync
  namespace: minio
spec:
  # 00:25 NY: after the whole 22:30-23:58 backup cluster (the night's Postgres dumps are in `backups` by then), between
  # the 00:20 `timeseries` and 00:35 `datahub_catalog_emit`, inside the Design Rule #5 pre-dawn window. Nightly runs
  # copy only what changed; the FIRST run copies ~1 TB and is started by hand (runbook), not left to the schedule.
  schedule: "25 0 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 259200   # 72h, like minio-backup: a failure alerts and keeps its logs for 3 days
      backoffLimit: 1
      activeDeadlineSeconds: 43200      # 12h: room for a large delta; the first full copy runs by hand
      template:
        spec:
          restartPolicy: Never
          # On timberback (2026-11-16): the first copy OOM-killed twice at a 1Gi limit on mother, early in `datasets`
          # (325 GB of small lakeFS objects; `mc mirror` and `mc diff` hold a bucket's listing in memory). timberback has
          # the headroom, and the bytes cross the network once (mother's MinIO -> timberback) instead of via mother.
          nodeSelector:
            kubernetes.io/hostname: timberback
          tolerations:
            - key: weyland.lab/onboarding
              operator: Exists
              effect: NoSchedule
          containers:
            - name: mc
              image: registry.weyland.lab/minio-client:cg-2026-10-22@sha256:f0b1d3d6ae12391d9bbe88345dee6da67027c93cda18dc5c9a463c2cc7d61b29  # the lab's mirrored mc (backup.yaml)
              securityContext:
                allowPrivilegeEscalation: false
                seccompProfile: { type: RuntimeDefault }
              resources:
                requests: { memory: 512Mi, cpu: 100m }
                limits: { memory: 6Gi }   # 1Gi OOM-killed on `datasets` listings (2026-11-16)
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  mc alias set src http://minio.minio.svc.cluster.local:9000 "$MC_USER" "$MC_PASS" >/dev/null
                  mc alias set dst http://minio-replica.minio.svc.cluster.local:9000 "$MC_USER" "$MC_PASS" >/dev/null
                  # EVERY bucket, read live. An empty list is a broken read, never "nothing to copy" (fail closed).
                  buckets="$(mc ls src | awk '{print $NF}' | sed 's#/$##')"
                  [ -n "$buckets" ] || { echo "no buckets listed on the primary: refusing to report success"; exit 1; }
                  n=0
                  for b in $buckets; do
                    echo "== $b"
                    mc mb --ignore-existing "dst/$b" >/dev/null
                    mc version enable "dst/$b" >/dev/null
                    mc ilm import "dst/$b" < /lifecycle/lifecycle.json >/dev/null
                    mc mirror --overwrite --remove --quiet "src/$b" "dst/$b"
                    # Verify, don't assume: after the mirror the current objects must match the primary exactly.
                    d="$(mc diff "src/$b" "dst/$b" | head -5)"
                    [ -z "$d" ] || { echo "replica differs from the primary in $b:"; echo "$d"; exit 1; }
                    n=$((n + 1))
                  done
                  echo "minio replica complete: $n bucket(s) mirrored and verified, $(date -u)"
              env:
                - name: MC_USER
                  valueFrom: { secretKeyRef: { name: minio-creds, key: MINIO_ROOT_USER } }
                - name: MC_PASS
                  valueFrom: { secretKeyRef: { name: minio-creds, key: MINIO_ROOT_PASSWORD } }
              volumeMounts:
                - { name: lifecycle, mountPath: /lifecycle, readOnly: true }
          volumes:
            - name: lifecycle
              configMap: { name: minio-replica-lifecycle }
