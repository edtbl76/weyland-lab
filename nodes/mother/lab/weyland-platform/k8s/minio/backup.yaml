# B1 / B69 data-mesh-now — MinIO data-product backup. Lives here (k8s/minio, owned by the `minio`
# Argo app → minio ns) so it's same-namespace with minio-creds + the data (secretKeyRef can't cross
# namespaces). Mirrors the product buckets to mother's NVMe (local-path), so a USB (/mnt/minio)
# failure doesn't lose data. Daily; idempotent (--remove keeps the mirror in sync). The Postgres
# (nessie/lakefs) backup is the sibling in k8s/data-mesh/backup.yaml.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-backup
  namespace: minio
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path # NVMe (mother root), NOT the USB (minio-local)
  resources:
    requests:
      storage: 50Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minio-backup
  namespace: minio
spec:
  # 22:30 America/New_York. The comment used to read "02:30 local" and was WRONG: with no
  # `spec.timeZone` a k8s CronJob runs in the controller-manager's clock (UTC), so `30 2 * * *` fired
  # at 02:30 UTC = 22:30 EDT — confirmed against observed successes (02:32:49Z on 2026-08-23). Pinned
  # 2026-08-23 to the time it ALREADY ran, so nothing moves today and it stops drifting an hour in EST.
  # Deliberately NOT moved into the 00:00–06:00 pre-dawn window (Design Rule #5): 02:30 NY would land
  # 13 min into the 02:17 HEAVY ingestion, where dagster-user-code peaks at 10.6Gi on this same node.
  # Documented carve-out — see docs/schedules.md.
  schedule: "30 22 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: mc
              image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727  # pinned from :latest 2026-07-10  # nosemgrep: yaml.kubernetes.security.run-as-non-root.run-as-non-root
              # B47 hardening: drop priv-esc + seccomp (see arch)
              securityContext:
                allowPrivilegeEscalation: false
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests: { memory: 64Mi, cpu: 50m }
                limits: { memory: 256Mi }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  mc alias set src http://minio.minio.svc.cluster.local:9000 "$MC_USER" "$MC_PASS"
                  for b in warehouse lakefs aidlc-kb mlflow tofu-state; do  # B69: +mlflow (models) +tofu-state (IaC state) — both IRREPLACEABLE
                    echo "mirroring $b ..."
                    mc mirror --overwrite --remove "src/$b" "/backup/minio/$b"
                  done
                  echo "minio backup complete: $(date -u)"
              env:
                - name: MC_USER
                  valueFrom: { secretKeyRef: { name: minio-creds, key: MINIO_ROOT_USER } }
                - name: MC_PASS
                  valueFrom: { secretKeyRef: { name: minio-creds, key: MINIO_ROOT_PASSWORD } }
              volumeMounts:
                - { name: backup, mountPath: /backup }
          volumes:
            - name: backup
              persistentVolumeClaim: { claimName: minio-backup }
