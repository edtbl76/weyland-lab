# ClusterIP service fronting both MinIO ports. Traefik Ingress (ingress.yaml) routes the two
# external hostnames to these. In-cluster clients use http://minio.minio.svc:9000 for S3.
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio
  labels:
    app: minio
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
