# Filestash — web file browser for the MinIO bucket (replaces the dead MinIO community
# console). Independent, maintained S3 frontend; reached at https://files.weyland.lab.
# Lives in the `minio` namespace alongside MinIO (reuses the weyland-wildcard-tls secret).
#
# Rolling-release image (no semver): pin-by-cache via imagePullPolicy: IfNotPresent. To pin
# strictly, replace `:latest` with a `machines/filestash@sha256:...` digest after first pull.
#
# Post-deploy config is done in the Filestash admin UI (first visit sets an admin password),
# then add an S3 backend: endpoint http://minio.minio.svc.cluster.local:9000,
# access key admin / secret weyland_dev_password, region us-east-1. See docs/b6-minio-storage.md.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filestash-data
  namespace: minio
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filestash
  namespace: minio
  labels:
    app: filestash
spec:
  replicas: 1
  strategy:
    type: Recreate          # single-instance + RWO PVC (same rationale as the other services)
  selector:
    matchLabels:
      app: filestash
  template:
    metadata:
      labels:
        app: filestash
    spec:
      containers:
        - name: filestash
          image: machines/filestash:latest
          imagePullPolicy: IfNotPresent
          # No APPLICATION_URL: setting it to a full URL caused Filestash to build a
          # scheme-doubled redirect (http://https//files.weyland.lab). Let Filestash infer
          # its public URL from Traefik's forwarded Host + X-Forwarded-Proto headers instead.
          ports:
            - name: http
              containerPort: 8334
          volumeMounts:
            - name: state
              mountPath: /app/data/state
          readinessProbe:
            tcpSocket:
              port: 8334
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8334
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: filestash-data
---
apiVersion: v1
kind: Service
metadata:
  name: filestash
  namespace: minio
  labels:
    app: filestash
spec:
  type: ClusterIP
  selector:
    app: filestash
  ports:
    - name: http
      port: 8334
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: filestash
  namespace: minio
spec:
  tls:
    - hosts:
        - files.weyland.lab
      secretName: weyland-wildcard-tls
  rules:
    - host: files.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: filestash
                port:
                  number: 8334
