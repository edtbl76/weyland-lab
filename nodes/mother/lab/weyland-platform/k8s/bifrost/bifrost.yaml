# Bifrost — B17+B19 Phase 3b, the AGENT EDGE (coding-agent MCP front door). Self-hosted maximhq/bifrost: connects to
# upstream MCP servers and re-exposes all their tools through ONE /mcp endpoint (per-client virtual-key tool registries).
# Consumer = B15 coding agents (Cline/Cursor/Claude Code) — they point one URL + a VK at Bifrost and get all lab tools.
#
# It aggregates the compositor (weyland-mcp-compositor:8000/mcp = the 6 read-only subsystems) — configured via the UI /
# config.json after first boot. Reads only; acts still go gateway→tool-server /mcp-act (Bifrost never touches acts).
#
# ADDRESS: bifrost.weyland.lab. TWO routers (MCP clients can't browser-SSO): the UI (`/`) is Keycloak forward-auth'd;
# `/mcp` is NOT (Bifrost's own virtual-key auth). Verified 2026-07-30: /mcp re-exposes all 91/91 fleet tools end-to-end.
# Image pinned to the multi-arch index digest (below). TODO(B111): codify config.json as GitOps — init-seed the
# weyland_fleet MCP upstream via an initContainer + SealedSecret the virtual keys (repo is PUBLIC, so VKs can't be plain
# git). Until then the MCP-upstream config is UI-managed in the PVC; re-add steps in docs/runbooks/mcp-gateway.md.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bifrost-data
  namespace: weyland
  labels: { app: bifrost }
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifrost
  namespace: weyland
  labels: { app: bifrost }
spec:
  replicas: 1
  strategy: { type: Recreate }   # RWO PVC, single instance
  selector:
    matchLabels: { app: bifrost }
  template:
    metadata:
      labels: { app: bifrost }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001            # so /app/data (the PVC) is writable by the non-root user
      containers:
        - name: bifrost
          # Pinned to the multi-arch INDEX digest of `latest` as of 2026-07-30 (not a per-arch manifest, so it still
          # resolves on any node arch — same rationale as LiteLLM). To bump: `docker buildx imagetools inspect
          # maximhq/bifrost:latest` on a box with docker → copy the top-level Digest → update below. Deliberate only.
          image: maximhq/bifrost@sha256:bf2208978308477a9f667dfc04cef3153197aeaca8618befefbecde3ed3378b7   # latest @ 2026-07-30
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /app/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: bifrost-data }
---
apiVersion: v1
kind: Service
metadata:
  name: bifrost
  namespace: weyland
  labels: { app: bifrost }
spec:
  type: ClusterIP
  selector: { app: bifrost }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
# UI router — Keycloak forward-auth (browser SSO), like every other lab UI.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bifrost-ui
  namespace: weyland
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: weyland-traefik-forward-auth@kubernetescrd
spec:
  tls:
    - hosts: [bifrost.weyland.lab]
      secretName: weyland-wildcard-tls
  rules:
    - host: bifrost.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: bifrost, port: { number: 8080 } }
---
# MCP router — NO forward-auth (MCP clients can't browser-SSO); Bifrost's virtual-key auth guards /mcp. Longer path →
# higher Traefik priority, so /mcp requests hit THIS router, not the forward-auth'd UI one.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bifrost-mcp
  namespace: weyland
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts: [bifrost.weyland.lab]
      secretName: weyland-wildcard-tls
  rules:
    - host: bifrost.weyland.lab
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service: { name: bifrost, port: { number: 8080 } }
