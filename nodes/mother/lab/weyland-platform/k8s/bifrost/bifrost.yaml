# Bifrost — B17+B19 Phase 3b, the AGENT EDGE (coding-agent MCP front door). Self-hosted maximhq/bifrost: connects to
# upstream MCP servers and re-exposes all their tools through ONE /mcp endpoint (per-client virtual-key tool registries).
# Consumer = B15 coding agents (Cline/Cursor/Claude Code) — they point one URL + a VK at Bifrost and get all lab tools.
#
# It aggregates the compositor (weyland-mcp-compositor:8000/mcp = the 6 read-only subsystems) — configured via the UI /
# config.json after first boot. Reads only; acts still go gateway→tool-server /mcp-act (Bifrost never touches acts).
#
# ADDRESS: bifrost.weyland.lab. TWO routers (MCP clients can't browser-SSO): the UI (`/`) is Keycloak forward-auth'd;
# `/mcp` is NOT (Bifrost's own virtual-key auth). Verified 2026-07-30: /mcp re-exposes all 91/91 fleet tools end-to-end.
# Image pinned to the multi-arch index digest (below). TODO(B111): codify config.json as GitOps — init-seed the
# weyland_fleet MCP upstream via an initContainer + SealedSecret the virtual keys (repo is PUBLIC, so VKs can't be plain
# git). Until then the MCP-upstream config is UI-managed in the PVC; re-add steps in docs/runbooks/mcp-gateway.md.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bifrost-data
  namespace: weyland
  labels: { app: bifrost }
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifrost
  namespace: weyland
  labels: { app: bifrost }
spec:
  replicas: 1
  strategy: { type: Recreate }   # RWO PVC, single instance
  selector:
    matchLabels: { app: bifrost }
  template:
    metadata:
      labels: { app: bifrost }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001            # so /app/data (the PVC) is writable by the non-root user
      initContainers:
        # B111 — stage a node + chromium runtime into a shared volume so Bifrost (a Go binary on Alpine, no node/npx)
        # can spawn the stdio MCP servers the library only offers as stdio (Perplexity, Playwright). Bifrost's pod runs
        # non-root with a read-only /usr, so a runtime `apk add` is impossible — this root initContainer apk-installs
        # into an emptyDir instead. Same Alpine version (3.23) → the chromium is musl-ABI-compatible with the Bifrost
        # pod, so Playwright drives the SYSTEM chromium (--executable-path) rather than its unsupported glibc download.
        - name: mcp-runtime
          image: alpine:3.23
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          # NEVER fail (always exit 0) — an initContainer error would block Bifrost from starting = agent-edge outage.
          # Best-effort staging; if anything fails, Bifrost still boots (just without the stdio runtime).
          command: ["/bin/sh", "-c"]
          args:
            - |
              R=/runtime
              # apk --root --initdb makes an EMPTY repo list → every package is "no such package". Point apk at the
              # real main+community repos and the host's signing keys so the --root install can actually resolve.
              printf '%s\n' \
                "https://dl-cdn.alpinelinux.org/alpine/v3.23/main" \
                "https://dl-cdn.alpinelinux.org/alpine/v3.23/community" > /tmp/repos
              apk add --root "$R" --initdb --no-cache --repositories-file /tmp/repos --keys-dir /etc/apk/keys \
                nodejs npm chromium nss freetype harfbuzz ttf-freefont ca-certificates git || echo "WARN: apk failed"
              mkdir -p "$R/bin" "$R/opt/mcp"
              ln -sf "$R/usr/bin/node" "$R/bin/node" 2>/dev/null || true
              ln -sf "$R/usr/bin/npm"  "$R/bin/npm"  2>/dev/null || true
              ln -sf "$R/usr/bin/npx"  "$R/bin/npx"  2>/dev/null || true
              ln -sf "$R/usr/bin/git"  "$R/bin/git"  2>/dev/null || true   # B111: git enables the Claude Code / Codex skill marketplace (git-served plugins)
              # Alpine's chromium binary name varies by version — pin a stable symlink for Playwright.
              CHR="$(ls "$R"/usr/lib/chromium/chrome "$R"/usr/lib/chromium/chromium "$R"/usr/bin/chromium 2>/dev/null | head -1 || true)"
              [ -n "$CHR" ] && ln -sf "$CHR" "$R/bin/chromium" 2>/dev/null || echo "WARN: chromium binary not located"
              # node's Intl needs its ICU data dir (rooted under /runtime, not the compiled /usr default) — a stable
              # symlink + ICU_DATA, else npm/npx die with "Icu error". chromium's libpulse lives in a pulseaudio/ subdir
              # not on the default lib path. HOME must be writable for npm.
              ICUD="$(ls -d "$R"/usr/share/icu/*/ 2>/dev/null | head -1)"
              [ -n "$ICUD" ] && ln -sfn "${ICUD%/}" "$R/usr/share/icu/current" 2>/dev/null || true
              mkdir -p "$R/home/.npm" && chmod -R 0777 "$R/home" 2>/dev/null || true
              export PATH="$R/usr/bin:$PATH" HOME="$R/home" ICU_DATA="$R/usr/share/icu/current" \
                LD_LIBRARY_PATH="$R/usr/lib:$R/usr/lib/pulseaudio:$R/lib" npm_config_cache="$R/home/.npm"
              # MCP server packages (canonical names) — install GLOBAL into /runtime/usr so bins land on PATH.
              PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install -g --prefix "$R/usr" @playwright/mcp @perplexity-ai/mcp-server \
                || echo "WARN: MCP pkg install failed — finalize live"
              echo "staged: node=$("$R/bin/node" -v 2>/dev/null) chromium=$CHR"
              exit 0
          volumeMounts:
            - { name: mcp-runtime, mountPath: /runtime }
      containers:
        - name: bifrost
          # Pinned to the multi-arch INDEX digest of `latest` as of 2026-07-30 (not a per-arch manifest, so it still
          # resolves on any node arch — same rationale as LiteLLM). To bump: `docker buildx imagetools inspect
          # maximhq/bifrost:latest` on a box with docker → copy the top-level Digest → update below. Deliberate only.
          image: maximhq/bifrost@sha256:bf2208978308477a9f667dfc04cef3153197aeaca8618befefbecde3ed3378b7   # latest @ 2026-07-30
          envFrom:                       # B111 key-sealing: provider API keys as env, from the bifrost-provider-keys
            - secretRef:                 # SealedSecret. Each provider's key is set to `env.VAR` (register_bifrost_providers.py)
                name: bifrost-provider-keys
                optional: true           # optional → pod still boots if the Secret isn't applied yet (chicken-and-egg safe)
          env:
            # B111 — expose the initContainer-staged stdio MCP runtime (node + chromium) to Bifrost's process spawner.
            - { name: PATH, value: "/runtime/bin:/runtime/usr/bin:/usr/local/bin:/usr/bin:/bin:/sbin" }
            - { name: LD_LIBRARY_PATH, value: "/runtime/usr/lib:/runtime/usr/lib/pulseaudio:/runtime/lib" }  # pulseaudio subdir = chromium's libpulse
            - { name: ICU_DATA, value: "/runtime/usr/share/icu/current" }   # else node Intl / npm die with "Icu error"
            - { name: HOME, value: "/runtime/home" }                        # writable HOME for npm/npx
            - { name: npm_config_cache, value: "/runtime/home/.npm" }
            - { name: NODE_PATH, value: "/runtime/usr/lib/node_modules" }   # global installs from the initContainer
            - { name: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD, value: "1" }        # use Alpine's system chromium, not the glibc download
            - { name: PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH, value: "/runtime/bin/chromium" }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 1536Mi }   # B111: 512Mi→1.5Gi — headless chromium (Playwright) needs the headroom
          volumeMounts:
            - { name: data, mountPath: /app/data }
            - { name: mcp-runtime, mountPath: /runtime }   # node + chromium staged by the initContainer
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: bifrost-data }
        - name: mcp-runtime
          emptyDir: { sizeLimit: 1536Mi }   # apk chromium+node tree (~400-600 MB); re-staged fresh each pod start
---
apiVersion: v1
kind: Service
metadata:
  name: bifrost
  namespace: weyland
  labels: { app: bifrost }
spec:
  type: ClusterIP
  selector: { app: bifrost }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
# UI router — Keycloak forward-auth (browser SSO), like every other lab UI.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bifrost-ui
  namespace: weyland
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: weyland-traefik-forward-auth@kubernetescrd
spec:
  tls:
    - hosts: [bifrost.weyland.lab]
      secretName: weyland-wildcard-tls
  rules:
    - host: bifrost.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: bifrost, port: { number: 8080 } }
---
# MCP router — NO forward-auth (MCP clients can't browser-SSO); Bifrost's virtual-key auth guards /mcp. Longer path →
# higher Traefik priority, so /mcp requests hit THIS router, not the forward-auth'd UI one.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bifrost-mcp
  namespace: weyland
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts: [bifrost.weyland.lab]
      secretName: weyland-wildcard-tls
  rules:
    - host: bifrost.weyland.lab
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service: { name: bifrost, port: { number: 8080 } }
          # B111 — skill marketplace serving (Claude Code / Codex plugin fetch + git clone) must be OPEN, not
          # Keycloak forward-auth'd: agents can't browser-SSO. Longer path → higher Traefik priority than the UI's `/`.
          - path: /api/skills/serve
            pathType: Prefix
            backend:
              service: { name: bifrost, port: { number: 8080 } }
