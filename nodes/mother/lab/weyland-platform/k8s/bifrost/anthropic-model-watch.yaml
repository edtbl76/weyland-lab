apiVersion: batch/v1
kind: CronJob
metadata:
  name: anthropic-model-watch
  namespace: weyland
spec:
  schedule: "55 3 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 259200   # 72h: a failed Job alerts (and keeps its logs) for 3 days, then clears
      backoffLimit: 0
      activeDeadlineSeconds: 180
      template:
        metadata:
          labels:
            app: anthropic-model-watch           # MLflow's front-door NetworkPolicy admits this label
            sidecar.istio.io/inject: "false"     # Bifrost + MLflow reachable unmeshed; see the header
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false    # HTTP only — no Kubernetes API
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534                     # nobody: the script is stdlib-only, so no apk install (and no root)
            runAsGroup: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: check
              image: python:3.12-alpine
              command: ["python3", "/opt/model-watch/model_lifecycle.py", "live"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              env:
                - name: MODEL_MANIFEST
                  value: /opt/model-watch/anthropic-models.json
                - name: MLFLOW_URL
                  value: http://mlflow.weyland.svc.cluster.local:5000
                - name: BIFROST_URL
                  value: http://bifrost.weyland.svc.cluster.local:8080
                - name: BIFROST_SETUP_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: bifrost-setup-token
                      key: BIFROST_SETUP_TOKEN
                # Bifrost's own Anthropic key: GET /v1/models is free, and "what can Bifrost's key still call" is the
                # question for the gateway that egresses Anthropic traffic. Read-only use; never printed.
                - name: ANTHROPIC_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: bifrost-provider-keys
                      key: ANTHROPIC_API_KEY
              resources:
                requests: { cpu: 25m, memory: 48Mi }
                limits: { memory: 128Mi }
              volumeMounts:
                - name: logic
                  mountPath: /opt/model-watch
          volumes:
            - name: logic
              configMap:
                name: anthropic-model-watch-logic
