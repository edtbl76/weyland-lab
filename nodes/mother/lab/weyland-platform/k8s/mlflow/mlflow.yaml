# B10+B16 — MLflow (experiment tracking + model registry). Reuses the shared Postgres (backend store) and
# MinIO (artifact store, proxied via --serve-artifacts so clients only talk to MLflow). Meshed: Postgres is
# STRICT mTLS, so the pod MUST carry the sidecar label or psycopg2 gets `read ECONNRESET`. Dev-password gated
# at the Traefik ingress (no native MLflow auth). B227 (2026-10-24): the image is weyland-mlflow
# (services/weyland-mlflow/) — the pg/s3 drivers and the gateway extras are BAKED IN from the pod's frozen
# `pip freeze`; nothing is pip-installed on start (it used to be, unpinned, on every boot).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mlflow-auth
  namespace: weyland
spec:
  basicAuth:
    secret: mlflow-auth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: weyland
  labels:
    app: mlflow
spec:
  replicas: 1
  # Recreate (not RollingUpdate): single replica + a DB migration on startup. RollingUpdate would run the new 3.x
  # pod (which migrates the schema) alongside the old 2.18 pod on the SAME backend DB — the old server breaks when
  # the schema moves under it. Recreate terminates old first, then the new pod migrates + starts. Brief downtime OK.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
        # Join the mesh — required to reach STRICT-mTLS Postgres (read ECONNRESET otherwise).
        sidecar.istio.io/inject: "true"
      annotations:
        # ...but carve MinIO (9000) OUT of the sidecar: boto3's multipart PUT (Expect: 100-continue)
        # to the artifact store stalls forever through Envoy → gunicorn WORKER TIMEOUT → 500 on
        # log_model. Postgres (5432) still rides the mesh (mTLS intact); only the S3 upload goes direct.
        traffic.sidecar.istio.io/excludeOutboundPorts: "9000"
    spec:
      containers:
        - name: mlflow
          image: registry.weyland.lab/weyland-mlflow:git-859e602d  # nosemgrep: yaml.kubernetes.security.run-as-non-root.run-as-non-root  (B227, 2026-10-24: CI-built FROM ghcr.io/mlflow/mlflow:v3.16.1 by digest + the frozen lockfile; the bump PR rewrites this git-<sha> tag. Version history: B47: 2.18.0 -> 3.14.0 cleared the 2025/2026 RCE CVEs; 2026-08-20: 3.14.0 -> 3.15.1 clears CVE-2026-64849, unauthenticated full-read SSRF in webhook delivery — this server has an un-authed LAN NodePort :30500, so the SSRF was reachable without credentials; 2026-10-17 B215: 3.15.1 -> 3.16.1 clears GHSA-h7x2-h6g9-p789 / CVE-2026-71211, the AI Gateway SSRF via an unvalidated api_base, <=3.15.2 — this server runs that gateway. 3 forward-only migrations, proven locally on a 3.15.1 DB)
          imagePullPolicy: IfNotPresent
          # B47 hardening: drop priv-esc + seccomp (see arch)
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          command: ["sh", "-c"]
          args:
            # B47: `mlflow db upgrade` applies the 3.x Alembic migrations to the backend store BEFORE the server
            # starts (2->3 changes the schema; the 3.x server refuses to start on a 2.x DB otherwise). Idempotent —
            # a no-op once migrated, so it's safe on every pod restart. BACK UP the mlflow DB before first rollout.
            # B100 P4: the AI Gateway's backend deps (`mlflow[gateway]`: tiktoken/slowapi/watchfiles), litellm and the
            # psycopg2/boto3 drivers are in the image (B227) — this command installs NOTHING. To change a package or
            # the mlflow version, edit services/weyland-mlflow/requirements.txt (+ its base tag), never this command.
            # `postgresql+psycopg2://`, never a bare `postgresql://` (2026-10-24): SQLAlchemy 2.1 (mlflow 3.17's base)
            # maps the bare scheme to the psycopg v3 driver, which the image does not have, so the server would not start.
            # scripts/mlflow-upgrade-drill.sh caught it on a restored copy and reads this scheme from here.
            - >
              mlflow db upgrade "postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@weyland-postgres.weyland.svc.cluster.local:5432/mlflow" &&
              mlflow server --host 0.0.0.0 --port 5000
              --backend-store-uri "postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@weyland-postgres.weyland.svc.cluster.local:5432/mlflow"
              --artifacts-destination s3://mlflow/ --serve-artifacts
              --allowed-hosts '*' --cors-allowed-origins '*' --workers 1
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: POSTGRES_PASSWORD
            # S3 artifact store → MinIO (reuses the B37 MinIO secret in this ns).
            - name: MLFLOW_S3_ENDPOINT_URL
              value: http://minio.minio.svc.cluster.local:9000
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aidlc-kb-minio-secret
                  key: access_key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aidlc-kb-minio-secret
                  key: secret_key
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              # MLflow 3.x is a much larger package than 2.x (absorbed the GenAI/tracing/eval stack); importing the
              # full server app spikes past 2Gi at startup (OOMKilled exit 137 even with --workers 1). 4Gi cleared
              # the import peak.
              # B99 (2026-07-22) — raised 4Gi → 8Gi. MLflow 3.14's server-side JOB RUNNER (`mlflow.server.jobs`,
              # Huey) runs ~7 consumer processes doing REAL work for the eval/scoring/judge/webhook demos. Under job
              # load their combined footprint pushed past the 4Gi cgroup → `memory.oom.group` killed the whole
              # group (197 python3.10 kills across the boot, the 2026-07-22 node-OOM incident). The runner is
              # REQUIRED — the fix is HEADROOM, not disabling it. 8Gi holds the web server + the consumer fleet +
              # in-flight jobs. Only the LIMIT moves (request stays low = no scheduling reservation); node has
              # ~14Gi physical free. Revisit if a single heavy job still OOMs at 8Gi. See B99 / [[node-oom-forensics]].
              memory: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: weyland
  labels:
    app: mlflow
spec:
  type: ClusterIP
  selector:
    app: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
# LAN NodePort — lets EXTERNAL Ray workers (rogueone, the Phase-2 DMZ edge node) log runs + register models to
# MLflow directly (svc DNS is cluster-only; the ingress is browser-SSO). MLflow has no native auth, so this is an
# unauthenticated MLflow API on the LAN — consistent with the trusted-LAN posture (like the registry/Ray dash);
# firewall it to the worker subnet when the DMZ lands. Reached at http://192.168.1.243:30500.
apiVersion: v1
kind: Service
metadata:
  name: mlflow-lan
  namespace: weyland
  labels:
    app: mlflow
spec:
  type: NodePort
  externalTrafficPolicy: Local   # preserve the client source IP so the host nft rule can pin :30500 to rogueone
  selector:
    app: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30500
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mlflow
  namespace: weyland
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: weyland-traefik-forward-auth@kubernetescrd
spec:
  tls:
    - hosts:
        - mlflow.weyland.lab
      secretName: weyland-wildcard-tls
  rules:
    - host: mlflow.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mlflow
                port:
                  number: 5000
