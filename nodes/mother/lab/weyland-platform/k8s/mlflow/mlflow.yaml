# B10+B16 — MLflow (experiment tracking + model registry). Reuses the shared Postgres (backend store) and
# MinIO (artifact store, proxied via --serve-artifacts so clients only talk to MLflow). Meshed: Postgres is
# STRICT mTLS, so the pod MUST carry the sidecar label or psycopg2 gets `read ECONNRESET`. Dev-password gated
# at the Traefik ingress (no native MLflow auth). v1 installs the pg/s3 drivers on start (no custom image) —
# if pod restarts get slow/flaky, bake a small `FROM ghcr.io/mlflow/mlflow + pip install` image instead.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mlflow-auth
  namespace: weyland
spec:
  basicAuth:
    secret: mlflow-auth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: weyland
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
        # Join the mesh — required to reach STRICT-mTLS Postgres (read ECONNRESET otherwise).
        sidecar.istio.io/inject: "true"
      annotations:
        # ...but carve MinIO (9000) OUT of the sidecar: boto3's multipart PUT (Expect: 100-continue)
        # to the artifact store stalls forever through Envoy → gunicorn WORKER TIMEOUT → 500 on
        # log_model. Postgres (5432) still rides the mesh (mTLS intact); only the S3 upload goes direct.
        traffic.sidecar.istio.io/excludeOutboundPorts: "9000"
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.18.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - >
              pip install --quiet --no-cache-dir psycopg2-binary boto3 &&
              mlflow server --host 0.0.0.0 --port 5000
              --backend-store-uri "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@weyland-postgres.weyland.svc.cluster.local:5432/mlflow"
              --artifacts-destination s3://mlflow/ --serve-artifacts
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: POSTGRES_PASSWORD
            # S3 artifact store → MinIO (reuses the B37 MinIO secret in this ns).
            - name: MLFLOW_S3_ENDPOINT_URL
              value: http://minio.minio.svc.cluster.local:9000
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aidlc-kb-minio-secret
                  key: access_key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aidlc-kb-minio-secret
                  key: secret_key
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: weyland
  labels:
    app: mlflow
spec:
  type: ClusterIP
  selector:
    app: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mlflow
  namespace: weyland
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: weyland-traefik-forward-auth@kubernetescrd
spec:
  tls:
    - hosts:
        - mlflow.weyland.lab
      secretName: weyland-wildcard-tls
  rules:
    - host: mlflow.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mlflow
                port:
                  number: 5000
