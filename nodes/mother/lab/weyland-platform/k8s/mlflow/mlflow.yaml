# B10+B16 — MLflow (experiment tracking + model registry). Reuses the shared Postgres (backend store) and
# MinIO (artifact store, proxied via --serve-artifacts so clients only talk to MLflow). Meshed: Postgres is
# STRICT mTLS, so the pod MUST carry the sidecar label or psycopg2 gets `read ECONNRESET`. Dev-password gated
# at the Traefik ingress (no native MLflow auth). v1 installs the pg/s3 drivers on start (no custom image) —
# if pod restarts get slow/flaky, bake a small `FROM ghcr.io/mlflow/mlflow + pip install` image instead.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mlflow-auth
  namespace: weyland
spec:
  basicAuth:
    secret: mlflow-auth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: weyland
  labels:
    app: mlflow
spec:
  replicas: 1
  # Recreate (not RollingUpdate): single replica + a DB migration on startup. RollingUpdate would run the new 3.x
  # pod (which migrates the schema) alongside the old 2.18 pod on the SAME backend DB — the old server breaks when
  # the schema moves under it. Recreate terminates old first, then the new pod migrates + starts. Brief downtime OK.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
        # Join the mesh — required to reach STRICT-mTLS Postgres (read ECONNRESET otherwise).
        sidecar.istio.io/inject: "true"
      annotations:
        # ...but carve MinIO (9000) OUT of the sidecar: boto3's multipart PUT (Expect: 100-continue)
        # to the artifact store stalls forever through Envoy → gunicorn WORKER TIMEOUT → 500 on
        # log_model. Postgres (5432) still rides the mesh (mTLS intact); only the S3 upload goes direct.
        traffic.sidecar.istio.io/excludeOutboundPorts: "9000"
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.14.0  # nosemgrep: yaml.kubernetes.security.run-as-non-root.run-as-non-root  (B47: 2.18.0 -> 3.14.0 clears the 2025/2026 mlflow RCE CVEs)
          imagePullPolicy: IfNotPresent
          # B47 hardening: drop priv-esc + seccomp (see arch)
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          command: ["sh", "-c"]
          args:
            # B47: `mlflow db upgrade` applies the 3.x Alembic migrations to the backend store BEFORE the server
            # starts (2->3 changes the schema; the 3.x server refuses to start on a 2.x DB otherwise). Idempotent —
            # a no-op once migrated, so it's safe on every pod restart. BACK UP the mlflow DB before first rollout.
            - >
              pip install --quiet --no-cache-dir psycopg2-binary boto3 &&
              mlflow db upgrade "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@weyland-postgres.weyland.svc.cluster.local:5432/mlflow" &&
              mlflow server --host 0.0.0.0 --port 5000
              --backend-store-uri "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@weyland-postgres.weyland.svc.cluster.local:5432/mlflow"
              --artifacts-destination s3://mlflow/ --serve-artifacts
              --allowed-hosts '*' --cors-allowed-origins '*' --workers 1
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: POSTGRES_PASSWORD
            # S3 artifact store → MinIO (reuses the B37 MinIO secret in this ns).
            - name: MLFLOW_S3_ENDPOINT_URL
              value: http://minio.minio.svc.cluster.local:9000
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aidlc-kb-minio-secret
                  key: access_key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aidlc-kb-minio-secret
                  key: secret_key
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              # MLflow 3.x (FastAPI/uvicorn) is heavier than 2.x (gunicorn) — 1Gi OOMKilled (exit 137). 2Gi holds.
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: weyland
  labels:
    app: mlflow
spec:
  type: ClusterIP
  selector:
    app: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
# LAN NodePort — lets EXTERNAL Ray workers (rogueone, the Phase-2 DMZ edge node) log runs + register models to
# MLflow directly (svc DNS is cluster-only; the ingress is browser-SSO). MLflow has no native auth, so this is an
# unauthenticated MLflow API on the LAN — consistent with the trusted-LAN posture (like the registry/Ray dash);
# firewall it to the worker subnet when the DMZ lands. Reached at http://192.168.1.243:30500.
apiVersion: v1
kind: Service
metadata:
  name: mlflow-lan
  namespace: weyland
  labels:
    app: mlflow
spec:
  type: NodePort
  externalTrafficPolicy: Local   # preserve the client source IP so the host nft rule can pin :30500 to rogueone
  selector:
    app: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30500
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mlflow
  namespace: weyland
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: weyland-traefik-forward-auth@kubernetescrd
spec:
  tls:
    - hosts:
        - mlflow.weyland.lab
      secretName: weyland-wildcard-tls
  rules:
    - host: mlflow.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mlflow
                port:
                  number: 5000
