apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: weyland-apisix-etcd
  namespace: weyland
spec:
  serviceName: weyland-apisix-etcd
  replicas: 1
  selector:
    matchLabels:
      app: weyland-apisix-etcd
  template:
    metadata:
      labels:
        app: weyland-apisix-etcd
    spec:
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.31
          command:
            - etcd
            - --name=weyland-apisix-etcd
            - --data-dir=/etcd-data
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://weyland-apisix-etcd:2379
            - --listen-peer-urls=http://0.0.0.0:2380
            - --initial-advertise-peer-urls=http://weyland-apisix-etcd:2380
            - --initial-cluster=weyland-apisix-etcd=http://weyland-apisix-etcd:2380
            - --initial-cluster-state=new
          ports:
            - containerPort: 2379
            - containerPort: 2380
          volumeMounts:
            - name: etcd-data
              mountPath: /etcd-data
          readinessProbe:
            httpGet:
              path: /health
              port: 2379
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: etcd-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: weyland-apisix-etcd
  namespace: weyland
spec:
  selector:
    app: weyland-apisix-etcd
  ports:
    - name: client
      port: 2379
      targetPort: 2379
    - name: peer
      port: 2380
      targetPort: 2380
