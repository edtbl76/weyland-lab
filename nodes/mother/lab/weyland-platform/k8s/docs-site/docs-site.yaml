# docs-site — standalone MkDocs Material site for docs/ (B59 — TechDocs parity, replaces Backstage's render).
# An initContainer clones the public repo + builds the material site (Mermaid renders natively — the unsolved
# B40); nginx serves the static output from a shared emptyDir. Self-contained: no MinIO/Dagster coupling.
# Refresh after docs change: `kubectl -n weyland rollout restart deploy/docs-site` (a daily CronJob can automate).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs-site
  namespace: weyland
  labels:
    app: docs-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docs-site
  template:
    metadata:
      labels:
        app: docs-site
    spec:
      initContainers:
        - name: build
          image: squidfunk/mkdocs-material:9
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache git nodejs npm
              # B64: LikeC4 in-page diagrams. The mkdocs-likec4 plugin shells out to the likec4 CLI at build time
              # to render the ```likec4-view <id>``` fences embedded in the docs. Model + config live in likec4/.
              npm i -g likec4
              pip install --no-cache-dir mkdocs-likec4
              git clone --depth 1 https://github.com/edtbl76/weyland-lab.git /src
              cd /src
              mkdocs build -f mkdocs-site.yml -d /site
          volumeMounts:
            - name: site
              mountPath: /site
      containers:
        - name: nginx
          image: nginx:1.27-alpine  # nosemgrep: yaml.kubernetes.security.run-as-non-root.run-as-non-root
          # B47 hardening: drop priv-esc + seccomp (see arch)
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: { memory: 32Mi, cpu: 20m }
            limits: { memory: 128Mi }
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: site
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: docs-site
  namespace: weyland
spec:
  selector:
    app: docs-site
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docs-site
  namespace: weyland
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: weyland-traefik-forward-auth@kubernetescrd  # Keycloak SSO gate
spec:
  tls:
    - hosts:
        - docs.weyland.lab
      secretName: weyland-wildcard-tls
  rules:
    - host: docs.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docs-site
                port:
                  number: 80
