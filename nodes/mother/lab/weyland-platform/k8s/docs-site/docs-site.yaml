# docs-site — standalone MkDocs Material site for docs/ (B59 — TechDocs parity, replaces Backstage's render).
# An initContainer clones the public repo + builds the material site (Mermaid renders natively — the unsolved
# B40); nginx serves the static output from a shared emptyDir. Self-contained: no MinIO/Dagster coupling.
# Refresh after docs change: `kubectl -n weyland rollout restart deploy/docs-site` (a daily CronJob can automate).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs-site
  namespace: weyland
  labels:
    app: docs-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docs-site
  template:
    metadata:
      labels:
        app: docs-site
    spec:
      initContainers:
        - name: build
          image: squidfunk/mkdocs-material:9
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache git curl
              # B64: D2 diagram renderer. Mermaid renders in-browser; D2 renders to SVG at BUILD time, so the
              # d2 binary + mkdocs-d2-plugin must exist here. Pinned to v0.7.1 for GitOps reproducibility.
              # The v0.7.1 tarball carries macOS AppleDouble (._*) entries, so don't trust the first tar entry as
              # the dir — extract, then FIND the real bin/d2 and copy it (no make/build needed).
              curl -fsSL https://github.com/terrastruct/d2/releases/download/v0.7.1/d2-v0.7.1-linux-amd64.tar.gz -o /tmp/d2.tar.gz
              mkdir -p /tmp/d2x
              tar -xzf /tmp/d2.tar.gz -C /tmp/d2x
              d2bin=$(find /tmp/d2x -type f -path '*/bin/d2' ! -name '._*' | head -1)
              install -m 0755 "$d2bin" /usr/local/bin/d2
              d2 --version
              git clone --depth 1 https://github.com/edtbl76/weyland-lab.git /src
              cd /src
              # B64: pre-render every D2 source to SVG (dagre default). The d2 binary is authoritative — this
              # avoids the mkdocs-d2 plugin vs pymdownx.superfences custom_fence conflict. mkdocs then copies
              # the generated .svg into the site alongside the .md that references it.
              for f in docs/diagrams/*.d2; do [ -e "$f" ] || continue; echo "d2 render: $f"; d2 "$f" "${f%.d2}.svg"; done
              mkdocs build -f mkdocs-site.yml -d /site
          volumeMounts:
            - name: site
              mountPath: /site
      containers:
        - name: nginx
          image: nginx:1.27-alpine  # nosemgrep: yaml.kubernetes.security.run-as-non-root.run-as-non-root
          # B47 hardening: drop priv-esc + seccomp (see arch)
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: { memory: 32Mi, cpu: 20m }
            limits: { memory: 128Mi }
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: site
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: docs-site
  namespace: weyland
spec:
  selector:
    app: docs-site
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docs-site
  namespace: weyland
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: weyland-traefik-forward-auth@kubernetescrd  # Keycloak SSO gate
spec:
  tls:
    - hosts:
        - docs.weyland.lab
      secretName: weyland-wildcard-tls
  rules:
    - host: docs.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docs-site
                port:
                  number: 80
