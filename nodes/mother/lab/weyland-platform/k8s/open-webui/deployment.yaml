# Open WebUI (B13) — browser voice/chat front door to the lab's local models.
#   chat  <- Ollama  (native API, CT 102, auto-lists the 6 models)
#   voice <- whisper shim (B11, CT 103) via the OpenAI-compatible STT engine
# Additive: independent consumer of shared endpoints — zero impact on OpenClaw/Telegram.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: weyland
spec:
  replicas: 1
  # RWO PVC single-instance — Recreate avoids two pods deadlocking on the volume
  # (see [[k8s-rwo-recreate-strategy]] / docs).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false   # no k8s API access needed (U10 least-privilege)
      # B1.1 — combined CA bundle (system + mkcert root) so the OIDC back-channel verifies Keycloak's cert.
      initContainers:
        - name: ca-bundle
          image: ghcr.io/open-webui/open-webui:main
          command: ["sh", "-c", "cat /etc/ssl/certs/ca-certificates.crt /mkcert/rootCA.pem > /cabundle/ca-bundle.crt"]
          volumeMounts:
            - { name: mkcert-ca, mountPath: /mkcert, readOnly: true }
            - { name: ca-bundle, mountPath: /cabundle }
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main   # TODO: pin to a release tag for reproducibility  # nosemgrep: yaml.kubernetes.security.run-as-non-root.run-as-non-root
          # B47 hardening: drop priv-esc + seccomp (see arch)
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
          env:
            # --- Chat: native Ollama integration (CT 102) ---
            - name: OLLAMA_BASE_URL
              value: http://192.168.1.230:11434
            - name: ENABLE_OPENAI_API          # don't reach OpenAI cloud for chat — Ollama only
              value: "false"
            # --- Voice input (STT) -> whisper shim (CT 103, B11), OpenAI-compatible ---
            - name: AUDIO_STT_ENGINE
              value: openai
            - name: AUDIO_STT_OPENAI_API_BASE_URL
              value: http://192.168.1.246:9000/v1
            - name: AUDIO_STT_OPENAI_API_KEY
              value: sk-local-whisper           # shim ignores it; present to satisfy the client
            - name: AUDIO_STT_MODEL
              value: whisper-1
            - name: WEBUI_NAME
              value: "Weyland AI"
            # --- B1.1 Keycloak SSO (OIDC) — pure env, the clean cutover ---
            - name: WEBUI_URL
              value: https://chat.weyland.lab
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "true"
            - name: OAUTH_PROVIDER_NAME
              value: Keycloak
            - name: OPENID_PROVIDER_URL
              value: https://keycloak.weyland.lab/realms/weyland/.well-known/openid-configuration
            - name: OAUTH_SCOPES
              value: "openid email profile"
            - name: OAUTH_CLIENT_ID
              value: open-webui
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: open-webui-oauth, key: OAUTH_CLIENT_SECRET }
            # OIDC back-channel trusts Keycloak via the mkcert-inclusive bundle built by the initContainer.
            - name: REQUESTS_CA_BUNDLE
              value: /cabundle/ca-bundle.crt
            - name: SSL_CERT_FILE
              value: /cabundle/ca-bundle.crt
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
            - name: ca-bundle
              mountPath: /cabundle
              readOnly: true
          # First run does DB migrations (+ may fetch a default embedding model) — be patient.
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
        - name: mkcert-ca
          secret:
            secretName: weyland-mkcert-ca
        - name: ca-bundle
          emptyDir: {}
