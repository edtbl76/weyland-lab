# B243 SEED (TEMPORARY — remove after the seeded test night, EMA-342; owner approved "All five", 2026-11-24).
# Proves the morning remediation's allowlisted retry end to end: at 05:00 NY the scheduled run FAILS, as a transient
# upstream failure would, which fires KubeJobFailed/ScheduledJobFailed; the 05:30 morning runner should re-run it with
# the allowlisted `cronjob-rerun` (a Job named b243-seed-retry-<yyyymmdd>), which PASSES, and report it fixed.
# A run tells the two apart by its own Job name (the downward API label). Unmeshed: it needs no network.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: b243-seed
  namespace: weyland
  labels:
    weyland.lab/seed: b243
spec:
  schedule: "0 5 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 259200   # 72h, Design Rule #6
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            sidecar.istio.io/inject: "false"   # unmeshed: no network at all
            weyland.lab/seed: b243
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: seed
              image: alpine:latest
              env:
                - name: JOB_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['batch.kubernetes.io/job-name']
              command: ["/bin/sh", "-c"]
              args:
                - |
                  case "$JOB_NAME" in
                    *-retry-*) echo "B243 seed: re-run $JOB_NAME passes"; exit 0 ;;
                  esac
                  echo "fetching the upstream index for $JOB_NAME"
                  echo "ERROR: upstream mirror answered HTTP 503 Service Unavailable (B243 seed: a transient failure; a re-run passes)"
                  exit 1
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { memory: 32Mi }
