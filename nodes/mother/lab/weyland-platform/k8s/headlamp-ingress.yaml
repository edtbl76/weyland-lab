# Standalone plain Ingress for Headlamp (U9). Headlamp itself is the headlamp Helm chart, deployed by the `headlamp`
# Argo app (helm-apps.yaml, since 2026-09-28); this Ingress is a separate object the chart does not own, carried by that
# app's directory source — so no chart-schema guessing and no drift on chart-managed resources.
# TLS uses the shared wildcard cert — the Secret must exist in the headlamp namespace.
# Keycloak SSO gate — local forward-auth Middleware (cross-ns middleware refs are blocked), targets the shared
# traefik-forward-auth service in weyland.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-forward-auth
  namespace: headlamp
spec:
  forwardAuth:
    address: http://traefik-forward-auth.weyland.svc.cluster.local:4181
    trustForwardHeader: true
    authResponseHeaders:
      - X-Forwarded-User
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  namespace: headlamp
  # Keycloak SSO gate (forward-auth) on top of Headlamp's SA-token login — all UIs behind Keycloak.
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: headlamp-traefik-forward-auth@kubernetescrd
spec:
  tls:
    - hosts:
        - headlamp.weyland.lab
      secretName: weyland-wildcard-tls
  rules:
    - host: headlamp.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headlamp
                port:
                  number: 80
