# B69 Wave 2 — Bitnami sealed-secrets controller (chart 2.19.1 / controller v0.37.0). Watches ALL namespaces and
# decrypts committed `SealedSecret` CRs into real Secrets using its private key. INERT until we commit any
# SealedSecret — installing it changes nothing on its own.
#
# fullnameOverride = `sealed-secrets-controller` so `kubeseal`'s defaults work with NO flags
# (--controller-name sealed-secrets-controller --controller-namespace kube-system).
#
# ⚠️ BRICKING KEY: the controller auto-generates a private key on first start, stored as a Secret labelled
# `sealedsecrets.bitnami.com/sealed-secrets-key` in kube-system. If that key is LOST, every SealedSecret becomes
# undecryptable (a new secret can be re-created, but all sealed values must be re-sealed). ESCROW it off-cluster:
#   kubectl -n kube-system get secret -l sealedsecrets.bitnami.com/sealed-secrets-key -o yaml > sealed-secrets-key.backup.yaml
# (store alongside the lakeFS encrypt-key escrow — see docs/runbooks/data-mesh-secrets.md / the forthcoming secrets.md).
fullnameOverride: sealed-secrets-controller
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 128Mi }
