# B69 — full-instance backup of weyland-postgres (ALL databases + global roles: 18 on 2026-11-09) via pg_dumpall. The
# k8s/data-mesh/backup.yaml sibling only dumps nessie+lakefs; this covers the IRREPLACEABLE rest —
# keycloak (realm/users/clients), superset (dashboards), weyland core (eval_leaderboard / model_catalog /
# guardrail_verdicts), + the reproducible-but-nice dagster/datahub/feast/mlflow/sonarqube/ranger DBs.
# In the weyland ns (co-located with the weyland-postgres-secret superuser envFrom); meshed to reach the
# STRICT-mTLS Postgres (native sidecars let the Job terminate). Onboarded via the `postgres` loose-app.
#
# CROSS-DISK durability (2026-07-18): weyland-postgres lives on the NVMe root LV, so its backup must NOT — a
# root-disk loss would take the DB AND its backup together. This Job writes to a hostPath on the USB
# (/mnt/minio/backups — a different physical disk; the script creates the `pg/` subdir), so the dump survives a
# root failure. (minio-backup does the inverse: it mirrors the USB-hosted MinIO buckets onto root.)
# DirectoryOrCreate auto-makes the dir; the pod runs as root (no runAsNonRoot) so it can write it. No PVC.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: weyland
spec:
  # 23:30 America/New_York — 30 min after the data-mesh nessie/lakefs pg-backup, preserving the
  # deliberate ordering. Was `30 3 * * *` with a "03:30 local" comment and no `spec.timeZone`, so it
  # really fired at 03:30 UTC = 23:30 EDT (observed 03:43:33Z, 2026-08-23). Pinned 2026-08-23 to the
  # time it already ran; the two backups keep their relative order because both moved together.
  schedule: "30 23 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 259200   # 72h: a failed Job alerts (and keeps its logs) for 3 days, then clears — never forever (2026-09-25)
      backoffLimit: 1
      activeDeadlineSeconds: 3600  # 60 min — a wedged run (e.g. a stuck native-sidecar init) self-kills instead of
                                   # freezing ALL future backups via concurrencyPolicy: Forbid (the 12–13d wedge B45 caught).
                                   # Raised 900→1800 on 2026-08-20 (runs took ~12–13 min), and 1800→3600 on 2026-11-03:
                                   # runs had crept to 16–28 min (28.4 once) and 2026-11-03's run passed 30 and was killed
                                   # (DeadlineExceeded) with the gzip just finished. Streaming the dump through gzip (below)
                                   # removes the uncompressed write + re-read on the USB disk; 60 min is headroom while that
                                   # proves itself, and still catches a real wedge.
      template:
        metadata:
          labels:
            sidecar.istio.io/inject: "true" # reach STRICT-mTLS weyland-postgres
        spec:
          restartPolicy: Never
          containers:
            - name: pgdumpall
              image: postgres:17-alpine # pg_dumpall >= server version; bump if a mismatch surfaces
              securityContext:
                allowPrivilegeEscalation: false
                seccompProfile:
                  type: RuntimeDefault
              resources:
                # Raised 512Mi -> 1Gi (2026-07-22): the backup pod OOM'd at 512Mi. pg_dumpall STREAMS
                # (SQL row-by-row → file, then gzip streams too), so it's normally well under this — the
                # spike is almost certainly a single oversized row/blob in one of the 12 DBs (glitchtip
                # events / mlflow / superset JSON) that libpq buffers whole. 1Gi covers that headroom for a
                # short-lived nightly job (limit only — no scheduling reservation). If it OOMs AGAIN, the fix
                # is finding the fat row, not piling on more memory.
                requests: { memory: 256Mi, cpu: 100m }
                limits: { memory: 1Gi }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  # 2026-11-03: stream pg_dumpall straight into gzip (no uncompressed copy written and re-read on
                  # the USB disk), into a .partial name that is renamed only once the file is proven complete. A
                  # run killed mid-write therefore never leaves a valid-looking newest backup (the old flow could:
                  # its gzip wrote the final name). pipefail: a failed pg_dumpall inside the pipe fails the job.
                  set -eu
                  # pipefail is not POSIX, but this image's /bin/sh is BusyBox ash, which honors it (verified
                  # 2026-11-03 in postgres:17-alpine: `set -o pipefail; false | true` exits 1)
                  # shellcheck disable=SC3040
                  set -o pipefail
                  TS=$(date -u +%Y%m%d)
                  DIR=/backup/pg
                  OUT="$DIR/weyland-all-$TS.sql.gz"
                  mkdir -p "$DIR"
                  rm -f "$DIR"/*.partial
                  echo "pg_dumpall weyland-postgres (all DBs + roles) ..."
                  PGPASSWORD="$POSTGRES_PASSWORD" pg_dumpall -h weyland-postgres.weyland.svc.cluster.local -U "$POSTGRES_USER" | gzip > "$OUT.partial"
                  # proof of completeness: the gzip stream decodes (zcat fails on a truncated file) and ends with
                  # pg_dumpall's own completion line
                  zcat "$OUT.partial" | tail -n 3 | grep -q 'PostgreSQL database cluster dump complete'
                  mv -f "$OUT.partial" "$OUT"
                  # rotation: keep the 7 most recent (a .partial never matches this glob)
                  ls -1t "$DIR"/weyland-all-*.sql.gz | tail -n +8 | xargs -r rm -f
                  echo "full pg backup complete: $(date -u) $(du -h "$OUT" | cut -f1)"
              envFrom:
                - secretRef: { name: weyland-postgres-secret } # provides POSTGRES_USER (superuser) + POSTGRES_PASSWORD
              volumeMounts:
                - { name: backup, mountPath: /backup }
          volumes:
            - name: backup
              hostPath: { path: /mnt/minio/backups, type: DirectoryOrCreate }
