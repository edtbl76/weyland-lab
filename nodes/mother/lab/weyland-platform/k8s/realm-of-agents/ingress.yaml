# realm.weyland.lab — the Realm of Agents' front door (B17), behind Keycloak forward-auth since B209 (2026-10-14).
#
# Before B209 this host had NO auth, for programmatic A2A clients (SSO redirects break them). It was open to the whole
# LAN, CORS was "*", /route spent paid Haiku by default, and the pod holds the coding-agents' Bifrost key. Nothing outside
# the cluster actually used it: the a2a-inspector and the operator call the in-cluster Service (unaffected by this),
# and blackbox accepts 302. So the whole host is now gated like the other human UIs; external A2A discovery needs a
# Keycloak session. In-cluster callers are limited by k8s/realm-of-agents/netpol.yaml.
#
# The Agent Card `url` is request-derived (cards.py), so a card fetched through this host still advertises
# https://realm.weyland.lab/a2a.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: realm-of-agents
  namespace: weyland
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: weyland-traefik-forward-auth@kubernetescrd
spec:
  tls:
    - hosts:
        - realm.weyland.lab
      secretName: weyland-wildcard-tls
  rules:
    - host: realm.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: realm-of-agents
                port:
                  number: 8080
