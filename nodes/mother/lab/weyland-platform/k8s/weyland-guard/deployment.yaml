# B70 Part 1 — weyland-guard: the B14 guard layer extracted into a shared service (tool-server + weyland-agent +
# future B66 call it over HTTP). Meshed: writes guardrail_verdicts to STRICT-mTLS Postgres, so it MUST carry the
# sidecar label. Guard chains default SHADOW (record-only) — override per-validator with GUARDRAIL_MODE__<name>.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weyland-guard
  namespace: weyland
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weyland-guard
  template:
    metadata:
      labels:
        app: weyland-guard
        sidecar.istio.io/inject: "true"   # B8 — needed for STRICT-mTLS Postgres (guardrail_verdicts)
    spec:
      enableServiceLinks: false
      containers:
        - name: weyland-guard
          image: registry.weyland.lab/weyland-guard:v7
          imagePullPolicy: IfNotPresent
          resources:
            # Loads 4 models: injection DeBERTa + toxicity + NLI cross-encoder + (B34) the PII NER model. 3Gi covers
            # the startup load of all four; trim once steady-state usage is measured.
            requests: { memory: 768Mi, cpu: 100m }
            limits: { memory: 3072Mi }   # B35 grounding NLI headroom (2560Mi) + B34 PII model (~480MB, 4th model) → 3Gi for startup load; trim after measuring
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
          # startupProbe covers the model-load window (lifespan blocks until the 3 models load); once it passes,
          # liveness/readiness take over. /ready 503s until the validators are built.
          startupProbe:
            httpGet: { path: /health, port: 8080 }
            failureThreshold: 48   # B34: the 4th model (PII) lengthens the load window → ~4 min before liveness takes over
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            periodSeconds: 10
          env:
            - name: WEYLAND_DB_HOST
              value: weyland-postgres.weyland.svc.cluster.local
            - name: WEYLAND_DB_PORT
              value: "5432"
            - name: WEYLAND_DB_NAME
              valueFrom:
                secretKeyRef: { name: weyland-postgres-secret, key: POSTGRES_DB }
            - name: WEYLAND_DB_USER
              valueFrom:
                secretKeyRef: { name: weyland-postgres-secret, key: POSTGRES_USER }
            - name: WEYLAND_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: weyland-postgres-secret, key: POSTGRES_PASSWORD }
            # /admin/* auth (demo toggle). optional:true so the pod still starts before the Secret exists — the admin
            # routes stay fail-closed (503) until the token is wired. Create out-of-band (NOT committed):
            #   kubectl -n weyland create secret generic weyland-guard-admin --from-literal=token=$(openssl rand -hex 24)
            - name: GUARD_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: { name: weyland-guard-admin, key: token, optional: true }
