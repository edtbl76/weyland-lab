apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  namespace: n8n
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: n8n
          image: docker.n8n.io/n8nio/n8n:latest
          ports:
            - containerPort: 5678
          env:
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-secret
                  key: N8N_ENCRYPTION_KEY
            - name: N8N_HOST
              value: "n8n.weyland.lab"
            - name: N8N_PORT
              value: "5678"
            # Behind Traefik TLS termination — n8n is addressed as HTTPS by the browser.
            - name: N8N_PROTOCOL
              value: "https"
            # RL #6: secure cookies now possible because the UI is served over HTTPS.
            - name: N8N_SECURE_COOKIE
              value: "true"
            # One reverse proxy hop (Traefik) — trust X-Forwarded-* so n8n sees HTTPS.
            - name: N8N_PROXY_HOPS
              value: "1"
            - name: WEBHOOK_URL
              value: "https://n8n.weyland.lab/"
            - name: N8N_EDITOR_BASE_URL
              value: "https://n8n.weyland.lab/"
            - name: TZ
              value: "America/New_York"
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
            - name: weyland-lab-ssh-key
              mountPath: /home/node/.ssh/weyland-lab
              subPath: id_ed25519
              readOnly: true
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-data
        - name: weyland-lab-ssh-key
          secret:
            secretName: weyland-lab-ssh-key
            defaultMode: 0440        
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: n8n
spec:
  # ClusterIP only — access is HTTPS via Traefik Ingress (n8n.weyland.lab).
  # Raw LAN HTTP on :30082 removed (RL #7).
  type: ClusterIP
  selector:
    app: n8n
  ports:
    - name: http
      port: 5678
      targetPort: 5678
---
# Traefik picks this up as the k3s default ingress controller. Plain Ingress (no
# IngressRoute CRD) for portability. TLS terminated by Traefik using the shared
# wildcard cert; the Secret must live in THIS namespace (n8n).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n
  namespace: n8n
spec:
  tls:
    - hosts:
        - n8n.weyland.lab
      secretName: weyland-wildcard-tls
  rules:
    - host: n8n.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n8n
                port:
                  number: 5678
