# B8/B48 — mesh-wide tracing: send 100% of spans to the `tempo` extensionProvider (defined in istio-install.yaml).
# Pairs with the provider; together they ship spans to Tempo's zipkin receiver (was Jaeger, retired in B48).
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: mesh-default
  namespace: istio-system
spec:
  tracing:
    - providers:
        - name: tempo
      randomSamplingPercentage: 100.0
