# B8 — traffic-management LEARNING experiment (apply, observe in Kiali/Jaeger, then DELETE).
# Injects a 3s delay on 100% of tool-server->qdrant calls. Safe: just slow, no failures.
# The fault is enforced by the CALLER's sidecar (the meshed tool-server), so /status' qdrant check gains ~3s.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: qdrant-fault-demo
  namespace: weyland
spec:
  hosts:
    - qdrant.weyland.svc.cluster.local
  http:
    - fault:
        delay:
          percentage:
            value: 100
          fixedDelay: 3s
      retries:
        attempts: 2
        perTryTimeout: 10s     # generous — we want to SEE the delay, not time it out
      route:
        - destination:
            host: qdrant.weyland.svc.cluster.local
