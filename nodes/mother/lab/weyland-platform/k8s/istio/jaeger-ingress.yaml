# B8 — Traefik TLS ingress for the Jaeger UI (the "View in Tracing" target from Kiali).
# Reuses weyland-wildcard-tls already copied into istio-system for Kiali.
# SECURITY: like Kiali, Jaeger has no auth → anonymous read-only trace viewing on the LAN. Same posture /
# same follow-up as Kiali (add dev-password auth at the Traefik ingress).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger
  namespace: istio-system
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: istio-system-observability-auth@kubernetescrd
spec:
  tls:
    - hosts:
        - jaeger.weyland.lab
      secretName: weyland-wildcard-tls
  rules:
    - host: jaeger.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tracing
                port:
                  number: 80
