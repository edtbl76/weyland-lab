# B8 slice 1 — Istio control plane, minimal profile (istiod only).
# No ingress/egress gateways — Traefik stays the front door. Tracing enabled (Jaeger added in Task 3;
# trace-destination wiring verified there — may need a Telemetry resource on Istio 1.30).
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: weyland-istio
spec:
  profile: minimal
  values:
    pilot:
      env:
        # B1.3 — k8s-native init-container sidecars (k8s 1.35 supports them). Without this, an Envoy sidecar
        # never exits, so meshed Jobs hang at 1/2 forever. The data mesh runs many meshed Jobs (DataHub
        # systemUpdate, Dagster ops, Trino, dbt, Soda) → enable cluster-wide. Affects newly-created pods only.
        ENABLE_NATIVE_SIDECARS: "true"
    global:
      # B1.3 — the istio-proxy default request (100m CPU) × ~15 meshed pods reserved ~1.4 vCPU while each
      # sidecar idles at ~5m, pinning the single node at 98% CPU requests. Drop to 15m; limit unchanged.
      proxy:
        resources:
          requests:
            cpu: "15m"
            memory: "128Mi"
          limits:
            cpu: "2000m"
            memory: "1024Mi"
  # istiod (pilot) right-sized 2026-06-27 (CPU 500m→200m; idles ~15m) and 2026-08-06 (mem 2Gi→512Mi): the
  # 2Gi reservation was a myth — live usage is ~200Mi/replica, and the default HPA runs 3 replicas, so 2Gi
  # reserved 6Gi and pinned the single node at 98% memory-requests (blocking a 4Gi dagster-user-code roll).
  # No mem LIMIT is set, so istiod can still burst above 512Mi during large config pushes — this only frees
  # the scheduler reservation. istio is NOT in Argo (B69) → re-apply with `istioctl install -f`.
  components:
    pilot:
      k8s:
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
  meshConfig:
    enableTracing: true
    # Tracing PROVIDER: where Envoy ships spans → Tempo's zipkin receiver (B48; was the addon Jaeger, now retired).
    # (Sampling % is set by the Telemetry resource — k8s/istio/telemetry.yaml — not here; `sampling` alone never ships spans.)
    extensionProviders:
      - name: tempo
        zipkin:
          service: tempo.monitoring.svc.cluster.local
          port: 9411
