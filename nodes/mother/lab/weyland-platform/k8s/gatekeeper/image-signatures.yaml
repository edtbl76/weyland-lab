# OPA Gatekeeper — cosign image-signature admission (B88 Phase 3).
#
# ⛔ SHIPS IN dryrun, AND THAT IS NOT TIMIDITY. Every image running in this cluster today is
# UNSIGNED. A constraint with `enforcementAction: deny` would reject every one of them on the next
# pod creation — every Deployment, every CronJob, every Argo sync — and the cluster would not come
# back until the policy was deleted. Signing is additive and safe; REQUIRING signatures is the
# single most destructive change in this whole B88 effort.
#
# This follows the house rule already written at the top of constraints.yaml: "ALL start in
# enforcementAction: dryrun — violations are audited but NOTHING is blocked."
#
# ── HOW TO PROMOTE THIS TO deny (do not skip a step) ─────────────────────────────────────────────
#   1. Sign everything. The ship loop calls scripts/supply-chain.sh, so this happens as images are
#      rebuilt — but images that are NOT rebuilt stay unsigned indefinitely. Enumerate them:
#         kubectl get pods -A -o jsonpath='{range .items[*]}{.spec.containers[*].image}{"\n"}{end}' | sort -u
#   2. Watch the audit until it reads zero:
#         kubectl get k8simagesignature require-signed-images \
#           -o jsonpath='{.status.totalViolations}{"\n"}'
#      Gatekeeper's audit runs on an interval, so a fresh zero means "zero at last audit", not
#      "zero now". Confirm it holds across at least two audit cycles before trusting it.
#   3. ONLY THEN flip `enforcementAction: dryrun` -> `deny` below, and keep the exempt list honest.
#
# ── WHY A PREFIX CHECK AND NOT A REAL SIGNATURE VERIFY ───────────────────────────────────────────
# Gatekeeper's Rego runs in the admission path with no network egress, so it CANNOT call cosign or
# reach the registry. It can only reason about the object in front of it. So this constraint asserts
# the honest, checkable thing: images must come from the registry whose contents we sign
# (registry.weyland.lab). Actual cryptographic verification is done by scripts/supply-chain.sh in
# CI, before the image is ever deployed.
#
# That is a real limitation, stated rather than hidden: this policy raises the cost of running an
# arbitrary upstream image, it does not prove a signature at admission time. Full in-cluster
# verification needs a policy controller that can reach the registry (Kyverno + cosign, or
# sigstore-policy-controller) — a separate decision, not a silent gap.
#
#   kubectl apply -f image-signatures.yaml
#   kubectl get k8simagesignature require-signed-images -o yaml | yq '.status.violations'
---
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8simagesignature
spec:
  crd:
    spec:
      names: { kind: K8sImageSignature }
      validation:
        openAPIV3Schema:
          type: object
          properties:
            allowedRegistries:
              type: array
              items: { type: string }
            exemptImages:
              type: array
              items: { type: string }
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8simagesignature

        # An image is exempt when it matches an explicit prefix in exemptImages. Exemptions are
        # listed one by one on purpose: a wildcard here would quietly re-admit everything.
        exempt(image) {
          prefix := input.parameters.exemptImages[_]
          startswith(image, prefix)
        }

        from_allowed_registry(image) {
          reg := input.parameters.allowedRegistries[_]
          startswith(image, reg)
        }

        # IMPLICIT DOCKER HUB — **OFFICIAL IMAGES ONLY**, and the narrowness is the point.
        #
        # `postgres:17` is shorthand for `docker.io/library/postgres:17`: a Docker-Hub OFFICIAL
        # image, curated, in the `library` namespace. A SINGLE-segment reference can only ever
        # resolve there, so exempting it is exactly as broad as the `docker.io/library/` entry in
        # exemptImages — no wider.
        #
        # ⚠ WHAT THIS DELIBERATELY DOES **NOT** COVER, and why. The first version of this rule
        # exempted anything whose first path segment lacked a `.` or `:`, reasoning that such a
        # segment is "a namespace, not a host". True — but a namespace belongs to ANY Docker Hub
        # user, so `grafana/grafana` was exempt and so was `attacker/evil`. That is an admission
        # BYPASS, not an exemption: the policy would have admitted any image any person on earth
        # can push. Caught by security review 2026-08-28, after this repo's own test suite had
        # asserted the broken behaviour as correct ("implicit hub, org-scoped -> 0 violations").
        #
        # An org-scoped Hub image that this lab genuinely needs must therefore be listed
        # explicitly in exemptImages, by full path. That is more entries and a higher violation
        # count — which is the honest state, not a problem to be suppressed.
        implicit_official_image(image) {
          count(split(image, "/")) == 1          # no namespace at all -> library/
          not contains(split(image, ":")[0], ".")  # ...and not a bare hostname
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not exempt(container.image)
          not from_allowed_registry(container.image)
          not implicit_official_image(container.image)
          msg := sprintf("container <%v> runs image <%v>, which is not from a signed registry (%v) and is not exempt", [container.name, container.image, input.parameters.allowedRegistries])
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.initContainers[_]
          not exempt(container.image)
          not from_allowed_registry(container.image)
          not implicit_official_image(container.image)
          msg := sprintf("initContainer <%v> runs image <%v>, which is not from a signed registry (%v) and is not exempt", [container.name, container.image, input.parameters.allowedRegistries])
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sImageSignature
metadata:
  name: require-signed-images
spec:
  # dryrun. See the promote-to-deny checklist at the top of this file. Do not flip this because the
  # violation count "looks low" — flip it when it is zero and has stayed zero.
  enforcementAction: dryrun
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces:
      # Cluster infrastructure the lab does not build and therefore cannot sign. Listing them makes
      # the exemption auditable; leaving them to a wildcard would not.
      - kube-system
      - gatekeeper-system
      - istio-system
      - cert-manager
  parameters:
    allowedRegistries:
      - registry.weyland.lab/
    exemptImages:
      # Third-party images the lab runs but does not build. Every entry is a deliberate, reviewable
      # decision — NOT a catch-all. Trim this list as workloads move to locally-built images.
      # ⚠ NEVER exempt the ROOT of a registry that accepts public pushes. `docker.io/` was briefly
      # listed here and that was wrong twice over: it admits `docker.io/<anyone>/<anything>`, and
      # the only reason it was widened was to make a violation count drop. The 270 violations were
      # TRUE — they really are unsigned third-party images. Suppressing a correct signal is not a
      # fix. Reverted to official images only (security review, 2026-08-28).
      - docker.io/library/
      # registry.istio.io — vendor-controlled (the Istio project publishes it; it is not open-push)
      # and unavoidable: sidecars are injected into EVERY meshed namespace, so
      # `excludedNamespaces: [istio-system]` never covered them.
      - registry.istio.io/
      - quay.io/
      - ghcr.io/
      - gcr.io/
      - registry.k8s.io/

      # ── REVIEWED THIRD-PARTY INVENTORY (B88, 2026-08-29) ──────────────────────────────────────
      # 44 publisher prefixes covering the 84 violations the first dryrun audit surfaced. Scoped to
      # the PUBLISHER, never the registry root: `docker.io/grafana/` trusts Grafana Labs, whereas
      # `docker.io/` would trust anyone with a Docker Hub account (that mistake was made and
      # reverted here on 2026-08-28 — it was made to lower a violation count, which is the wrong
      # reason to widen a security control).
      #
      # THIS IS AN ALLOWLIST OF REVIEWED SOFTWARE, NOT A SUPPRESSION LIST. Its value is what
      # happens AFTER: with the known inventory named, any future violation means an image from a
      # publisher nobody has reviewed has appeared — a typosquat, an ad-hoc pull, or a chart
      # quietly changing its image source. Keep it that way; do not add a prefix without knowing
      # what it is.
      # ── VENDOR: published by the project's own organisation. Lowest risk of the three.
      - alpine/                                   # alpine/git (CI clones) + alpine/minio
      - apache/                                   # APISIX gateway + dashboard
      - apachesuperset.docker.scarf.sh/apache/    # Superset BI (vendor-hosted scarf mirror)
      - clickhouse/                               # ClickHouse OLAP
      - cockroachdb/                              # CockroachDB
      - confluentinc/                             # Kafka Connect
      - coredns/                                  # CoreDNS
      - cubejs/                                   # Cube semantic layer
      - docker.io/acryldata/                      # DataHub (gms/frontend/actions/upgrade)
      - docker.io/grafana/                        # Alloy, Grafana, Loki, Tempo
      - docker.io/woodpeckerci/                   # Woodpecker server + agent
      - docker.n8n.io/n8nio/                      # n8n
      - docker.redpanda.com/redpandadata/         # Redpanda + console
      - ecr-public.aws.com/docker/                # redis (official image via the AWS ECR mirror)
      - glitchtip/                                # GlitchTip error tracking
      - grafana/                                  # mcp-grafana + pyroscope
      - langfuse/                                 # Langfuse web + worker
      - lightdash/                                # Lightdash BI
      - minio/                                    # mc client
      - moby/                                     # BuildKit
      - neo4jlabs/                                # NeoDash
      - opensearchproject/                        # OpenSearch + Dashboards
      - qdrant/                                   # Qdrant
      - rancher/                                  # kubectl (job runner)
      - semitechnologies/                         # Weaviate
      - sonarsource/                              # sonar-scanner-cli
      - timescale/                                # TimescaleDB HA
      - treeverse/                                # lakeFS
      - trinodb/                                  # Trino
      - unleashorg/                               # Unleash
      - valkey/                                   # Valkey
      # ── COMMUNITY: real multi-maintainer projects, not vendor-run.
      - docker.io/kiwigrid/                       # k8s-sidecar (dashboard loader)
      - gizmodata/                                # GizmoSQL
      - pgvector/                                 # pgvector Postgres
      - prompve/                                  # prometheus-pve-exporter
      - squidfunk/                                # mkdocs-material
      # ── SOLO-MAINTAINER namespaces. Legitimate and in use, but a different trust tier:
      #    one account compromise is one supply-chain compromise. Reviewed and accepted; the
      #    tiering exists so this concentration is visible rather than buried in an alphabetised list.
      - crystaldba/                               # postgres-mcp
      - joxit/                                    # docker-registry-ui
      - louislam/                                 # Uptime Kuma
      - machines/                                 # Filestash
      - maximhq/                                  # Bifrost LLM gateway
      - mcp/                                      # neo4j-cypher MCP
      - thomseddon/                               # traefik-forward-auth
      # ── (The FLAGGED tier is now EMPTY, and that is the point.) `docker.io/bitnamilegacy/`
      #    was the one entry of 44 that made the estate LESS safe — Bitnami's frozen namespace,
      #    no security updates. It was removed on 2026-08-29 by deleting the image rather than
      #    by trusting it: DataHub was repointed at the Redpanda already running in-cluster and
      #    the chart's bundled broker was disabled. THE ALLOWLIST SHRINKING IS THE PROOF —
      #    an exemption removed because the risk is gone, not because it was tolerated.
