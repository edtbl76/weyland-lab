apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-config
  namespace: weyland
data:
  config.yaml: |
    apisix:
      node_listen: 9080
      enable_ipv6: false

    deployment:
      role: traditional
      role_traditional:
        config_provider: etcd
      admin:
        allow_admin:
          - 127.0.0.1/32
        admin_listen:
          ip: 127.0.0.1
          port: 9180
        admin_key:
          - name: admin
            key: $ENV://APISIX_ADMIN_KEY
            role: admin
      etcd:
        host:
          - "http://weyland-apisix-etcd:2379"
        prefix: /apisix
        timeout: 30

    plugin_attr:
      prometheus:
        export_uri: /apisix/prometheus/metrics
        export_addr:
          # 0.0.0.0 (not 127.0.0.1): Prometheus scrapes the pod IP from another pod,
          # so the metrics endpoint must bind all interfaces, not just loopback.
          ip: 0.0.0.0
          port: 9091

    plugins:
      - prometheus
      - proxy-rewrite
      - cors
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weyland-apisix
  namespace: weyland
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weyland-apisix
  template:
    metadata:
      labels:
        app: weyland-apisix
    spec:
      containers:
        - name: apisix
          image: apache/apisix:3.9.0-debian
          resources:
            requests: { memory: 128Mi, cpu: 100m }
            limits: { memory: 512Mi }   # actual ~228Mi
          envFrom:
            - secretRef:
                name: apisix-secret
          ports:
            - containerPort: 9080
            - containerPort: 9180
            - containerPort: 9091
          volumeMounts:
            - name: apisix-config
              mountPath: /usr/local/apisix/conf/config.yaml
              subPath: config.yaml
          readinessProbe:
            tcpSocket:
              port: 9080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9080
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: apisix-config
          configMap:
            name: apisix-config
---
apiVersion: v1
kind: Service
metadata:
  name: weyland-apisix
  namespace: weyland
  labels:
    app: weyland-apisix
spec:
  type: NodePort
  selector:
    app: weyland-apisix
  ports:
    - name: gateway
      port: 9080
      targetPort: 9080
      nodePort: 30090
    - name: prometheus
      port: 9091
      targetPort: 9091
