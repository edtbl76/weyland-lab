apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-data
  namespace: weyland
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j
  namespace: weyland
  labels:
    app: neo4j
spec:
  replicas: 1
  # Single-instance + ReadWriteOnce storage: kill the old pod BEFORE starting the new
  # one so they never contend for the storage lock on restart (RollingUpdate deadlocks).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
        sidecar.istio.io/inject: "true"   # B8 — Istio sidecar (per-workload injection; weyland ns is unlabeled)
    spec:
      enableServiceLinks: false
      containers:
        - name: neo4j
          image: neo4j:5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7474
            - name: bolt
              containerPort: 7687
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: neo4j-secret
                  key: auth
            - name: NEO4J_PLUGINS
              value: '["apoc","graph-data-science"]'
            # Bumped from 256m/512m — the RAG + AIDLC graph was tiny, but the lastfm dataset graph is ~17M
            # PLAYS edges. Neo4j caps per-tx memory at ~70% of heap, so 512m OOM'd even on a batched DETACH
            # DELETE. neo4j 5 canonical `server.memory.*` names (the old `dbms.memory.*` are deprecated).
            - name: NEO4J_server_memory_heap_initial__size
              value: 1G
            - name: NEO4J_server_memory_heap_max__size
              value: 2G
            - name: NEO4J_server_memory_pagecache_size
              value: 2G   # holds the lastfm store (~17M edges) hot → CREATE isn't disk-thrashing
          resources:
            requests:
              memory: 1Gi
              cpu: 250m
            limits:
              memory: 5Gi   # 2G heap + 2G pagecache + JVM/off-heap overhead
          volumeMounts:
            - name: neo4j-storage
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: neo4j-storage
          persistentVolumeClaim:
            claimName: neo4j-data
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: weyland
  labels:
    app: neo4j
spec:
  type: NodePort
  selector:
    app: neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
      nodePort: 30085
    - name: bolt
      port: 7687
      targetPort: 7687
      appProtocol: tcp        # B8 — tell Istio this is opaque TCP (Bolt); else the sidecar mis-parses it as HTTP
      nodePort: 30086
