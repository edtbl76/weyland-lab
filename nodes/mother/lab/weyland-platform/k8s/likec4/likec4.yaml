# B64 — LikeC4 standalone interactive architecture explorer (likec4.weyland.lab). An initContainer (node)
# installs the likec4 CLI, clones the public repo, and `likec4 build`s the model in likec4/ into a static
# interactive SPA (pan/zoom/drill); nginx serves it. Keycloak forward-auth gated like the other UIs.
# Single source of truth = likec4/weyland.likec4 (same model the docs embed via mkdocs-likec4).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: likec4
  namespace: weyland
  labels:
    app: likec4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: likec4
  template:
    metadata:
      labels:
        app: likec4
    spec:
      initContainers:
        - name: build
          image: node:22-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache git
              npm i -g likec4
              likec4 --version
              git clone --depth 1 https://github.com/edtbl76/weyland-lab.git /src
              cd /src/docs
              # Model + likec4.config.json live under docs/ (so the mkdocs-likec4 plugin discovers the same
              # project). --use-hash-history: routes under /#/... so plain nginx needs no SPA rewrite rules.
              likec4 build -o /site --base / --use-hash-history
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 2Gi }
          volumeMounts:
            - name: site
              mountPath: /site
      containers:
        - name: nginx
          image: nginx:1.27-alpine  # nosemgrep: yaml.kubernetes.security.run-as-non-root.run-as-non-root
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: { memory: 32Mi, cpu: 20m }
            limits: { memory: 128Mi }
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: site
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: likec4
  namespace: weyland
  labels:
    app: likec4
spec:
  type: ClusterIP
  selector:
    app: likec4
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: likec4
  namespace: weyland
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: weyland-traefik-forward-auth@kubernetescrd  # Keycloak SSO gate
spec:
  tls:
    - hosts:
        - likec4.weyland.lab
      secretName: weyland-wildcard-tls
  rules:
    - host: likec4.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: likec4
                port:
                  number: 80
