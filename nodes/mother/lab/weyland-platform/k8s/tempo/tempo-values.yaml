# B48 — Tempo (traces) monolithic, storage → MinIO (S3). Replaces Jaeger as the single trace backend; Grafana
# Tempo datasource unlocks the trace Drilldown, Kiali repoints here too. Chart: grafana/tempo 1.24.4 (app 2.9.0).
# Receivers: zipkin (Istio's mesh tracing provider points here) + otlp (future). Creds via env-expansion from the
# loki-minio Secret (config.expand-env=true → ${AWS_*}); no inline secrets. Bucket: tempo-traces.
tempo:
  reportingEnabled: false        # no phone-home ($0/LAN)
  storage:
    trace:
      backend: s3
      s3:
        bucket: tempo-traces
        endpoint: minio.minio.svc.cluster.local:9000
        access_key: "${AWS_ACCESS_KEY_ID}"
        secret_key: "${AWS_SECRET_ACCESS_KEY}"
        insecure: true            # plain http to in-cluster MinIO
  receivers:
    zipkin:
      endpoint: 0.0.0.0:9411      # Istio mesh tracing → here
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  extraArgs:
    "config.expand-env": "true"   # expand ${AWS_*} in the rendered config
  extraEnv:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: loki-minio
          key: access_key
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: loki-minio
          key: secret_key
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 3Gi   # 1Gi OOM'd (exit 137) ~9s in on a vParquet4 block; raised to 2Gi. Then 2Gi OOM'd **72×** in
                    # the 2026-07-22 boot under peak trace load (eval mesh traffic + the B98/B21 LGTM
                    # self-monitoring, 2026-07-21, both increased trace volume). Raised 2Gi→3Gi. Monolithic Tempo
                    # builds blocks in memory before the S3 flush, so peak scales with ingest; revisit if it OOMs
                    # again (or cap ingestion via sampling). Baseline is only ~326Mi — this is peak headroom, not
                    # steady-state. See B99 / [[node-oom-forensics]].

persistence:
  enabled: true
  storageClassName: local-path
  size: 5Gi
