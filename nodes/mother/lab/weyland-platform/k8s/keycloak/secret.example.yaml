# TEMPLATE ONLY — the real Secret is applied out-of-band (kubectl) and NEVER committed.
# Argo excludes this file from sync (directory.exclude in argocd/applications/subdir-apps.yaml).
# Copy → fill the CHANGE_ME values → kubectl apply, before the Deployment rolls.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: weyland
type: Opaque
stringData:
  KC_DB_USERNAME: keycloak
  KC_DB_PASSWORD: CHANGE_ME              # must match the Postgres role password created in Phase-1 step 1
  KC_BOOTSTRAP_ADMIN_USERNAME: admin
  KC_BOOTSTRAP_ADMIN_PASSWORD: CHANGE_ME
