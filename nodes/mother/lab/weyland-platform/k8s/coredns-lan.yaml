# Weyland LAN DNS resolver (U9 prerequisite) — SEPARATE from k3s kube-dns.
#
# Authoritative for weyland.lab (wildcard *.weyland.lab -> mother), forwards everything else to public resolvers.
# Exposed on mother:53 via a Deployment hostPort PINNED to the LAN IP (hostIP: 192.168.1.243) — NOT k3s ServiceLB.
# WHY (2026-07-18 outage, see runbooks/lan-dns.md): ServiceLB (klipper) ran an svclb pod with hostPort 53 bound to
# 0.0.0.0, whose CNI DNAT matched `dst-type LOCAL` and captured the node's OWN 127.0.0.53 systemd-resolved stub;
# when this pod died, ALL host DNS black-holed. `hostIP` scopes the DNAT to 192.168.1.243 only, so the node
# resolver is never touched. mother resolves *.weyland.lab via a systemd-resolved drop-in → 192.168.1.243
# (nodes/mother/host/systemd/resolved.conf.d/weyland-lab.conf). Swappable for Pi-hole/dnsmasq later.
apiVersion: v1
kind: ConfigMap
metadata:
  name: weyland-lan-dns-corefile
  namespace: weyland
data:
  Corefile: |
    # Standalone LXC services on the weyland host — own LAN IPs, NOT k3s/Traefik.
    # These are MORE-SPECIFIC zones than weyland.lab, and CoreDNS routes to the
    # longest-matching zone, so they reliably override the wildcard below (no
    # dependency on plugin ordering). Add one block per CT service.
    ollama.weyland.lab:53 {
        errors
        log
        template IN A {
            answer "{{ .Name }} 60 IN A 192.168.1.230"
        }
        template IN AAAA {
            rcode NOERROR
        }
    }
    whisper.weyland.lab:53 {
        errors
        log
        template IN A {
            answer "{{ .Name }} 60 IN A 192.168.1.246"
        }
        template IN AAAA {
            rcode NOERROR
        }
    }
    # hermes CT 104 — the Hermes dashboard (+ Kanban) behind nginx (TLS + dev password). NOT k3s/Traefik.
    dashboard.weyland.lab:53 {
        errors
        log
        template IN A {
            answer "{{ .Name }} 60 IN A 192.168.1.247"
        }
        template IN AAAA {
            rcode NOERROR
        }
    }
    # Authoritative zone for the private lab domain.
    weyland.lab:53 {
        errors
        log
        # Wildcard: every name under weyland.lab (and the apex) resolves to mother.
        template IN A {
            answer "{{ .Name }} 60 IN A 192.168.1.243"
        }
        # We have no IPv6; return NODATA (NOERROR/empty), not NXDOMAIN, for AAAA.
        template IN AAAA {
            rcode NOERROR
        }
    }
    # Everything else: forward to public resolvers (Cloudflare + Quad9).
    .:53 {
        errors
        log
        health
        ready
        prometheus :9153
        forward . 1.1.1.1 9.9.9.9
        cache 30
        loop
        reload
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weyland-lan-dns
  namespace: weyland
  labels:
    app: weyland-lan-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weyland-lan-dns
  template:
    metadata:
      labels:
        app: weyland-lan-dns
    spec:
      containers:
        - name: coredns
          image: coredns/coredns:1.11.3
          args: ["-conf", "/etc/coredns/Corefile"]
          ports:
            # hostPort pinned to the LAN IP (hostIP) — LAN clients reach mother:53, but the CNI hostPort DNAT is
            # scoped to `-d 192.168.1.243 --dport 53`, so it NEVER matches the node's 127.0.0.53 resolver.
            - { name: dns-udp, containerPort: 53, hostPort: 53, hostIP: 192.168.1.243, protocol: UDP }
            - { name: dns-tcp, containerPort: 53, hostPort: 53, hostIP: 192.168.1.243, protocol: TCP }
            - { name: metrics, containerPort: 9153, protocol: TCP }
            - { name: health, containerPort: 8080, protocol: TCP }
            - { name: ready, containerPort: 8181, protocol: TCP }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: { path: /ready, port: 8181 }
            initialDelaySeconds: 2
          volumeMounts:
            - { name: corefile, mountPath: /etc/coredns, readOnly: true }
      volumes:
        - name: corefile
          configMap:
            name: weyland-lan-dns-corefile
---
apiVersion: v1
kind: Service
metadata:
  name: weyland-lan-dns
  namespace: weyland
  labels:
    app: weyland-lan-dns
spec:
  # ClusterIP — NOT LoadBalancer. ServiceLB (klipper) would run an svclb pod with hostPort 53 on 0.0.0.0 whose CNI
  # DNAT matched `dst-type LOCAL` and captured the node's 127.0.0.53 resolver (2026-07-18 outage). The Deployment
  # now exposes :53 itself via hostPort+hostIP (LAN IP only). This ClusterIP is for in-cluster clients + metrics.
  type: ClusterIP
  selector:
    app: weyland-lan-dns
  ports:
    - { name: dns-udp, port: 53, targetPort: 53, protocol: UDP }
    - { name: dns-tcp, port: 53, targetPort: 53, protocol: TCP }
    - { name: metrics, port: 9153, targetPort: 9153, protocol: TCP }
