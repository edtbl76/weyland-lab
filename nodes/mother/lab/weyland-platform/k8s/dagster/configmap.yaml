apiVersion: v1
kind: ConfigMap
metadata:
  name: dagster-workspace
  namespace: weyland
data:
  workspace.yaml: |
    load_from:
      - grpc_server:
          host: dagster-user-code
          port: 4000
          location_name: weyland_pipeline
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dagster-config
  namespace: weyland
data:
  dagster.yaml: |
    storage:
      postgres:
        postgres_db:
          username: weyland
          password:
            env: DAGSTER_PG_PASSWORD
          hostname: weyland-postgres.weyland.svc.cluster.local
          db_name: dagster
          port: 5432
    run_launcher:
      module: dagster.core.launcher
      class: DefaultRunLauncher
    run_coordinator:
      module: dagster.core.run_coordinator
      class: QueuedRunCoordinator
      config:
        # 1, not 2: runs execute IN the user-code pod (DefaultRunLauncher + gRPC code server), so two heavy
        # runs at once (all-asset ingestion + all-store emit) OOM/exhaust it and can take the code server down.
        # Serialize on a resource-constrained node; the crons are now spread so queueing is rare. Raise when
        # mother has headroom. The 1h run-monitoring timeout below bounds a stuck run blocking the queue.
        max_concurrent_runs: 1
    run_monitoring:
      enabled: true
      max_resume_run_attempts: 0
      max_runtime_seconds: 14400   # 4h — big one-time loads (lastfm ~17M-edge graph, OFF ~9GB) need headroom
