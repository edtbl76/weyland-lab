apiVersion: apps/v1
kind: Deployment
metadata:
  name: dagster-webserver
  namespace: weyland
  labels:
    app: dagster-webserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dagster-webserver
  template:
    metadata:
      labels:
        app: dagster-webserver
    spec:
      containers:
        - name: dagster-webserver
          image: registry.weyland.lab/weyland-dagster-base:v1
          imagePullPolicy: IfNotPresent
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 768Mi }
          command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/opt/dagster/dagster_home/workspace.yaml"]
          ports:
            - containerPort: 3000
          env:
            - name: DAGSTER_HOME
              value: /opt/dagster/dagster_home
            - name: DAGSTER_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dagster-postgres-secret
                  key: password
          volumeMounts:
            - name: dagster-config
              mountPath: /opt/dagster/dagster_home/dagster.yaml
              subPath: dagster.yaml
            - name: dagster-workspace
              mountPath: /opt/dagster/dagster_home/workspace.yaml
              subPath: workspace.yaml
      volumes:
        - name: dagster-config
          configMap:
            name: dagster-config
        - name: dagster-workspace
          configMap:
            name: dagster-workspace
---
apiVersion: v1
kind: Service
metadata:
  name: dagster-webserver
  namespace: weyland
  labels:
    app: dagster-webserver
spec:
  # ClusterIP only — access is HTTPS via Traefik Ingress (dagster.weyland.lab).
  # Raw LAN HTTP on :30088 removed (U9).
  type: ClusterIP
  selector:
    app: dagster-webserver
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
# Plain Ingress (portable). TLS secret weyland-wildcard-tls already exists in the
# weyland namespace. Traefik proxies Dagster's websocket/GraphQL subscriptions natively.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dagster-webserver
  namespace: weyland
  # Keycloak SSO gate (forward-auth) — all UIs behind Keycloak.
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: weyland-traefik-forward-auth@kubernetescrd
spec:
  tls:
    - hosts:
        - dagster.weyland.lab
      secretName: weyland-wildcard-tls
  rules:
    - host: dagster.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dagster-webserver
                port:
                  number: 3000
