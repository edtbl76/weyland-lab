# Dedicated SA for the user-code pod. REQUIRED because runs execute IN this pod (DefaultRunLauncher — see
# k8s/dagster/configmap.yaml) and the `trigger_lancedb_sync` op calls the Kubernetes API
# (`config.load_incluster_config()` → creates the lancedb-sync Job in data-mesh).
#
# Why not the `default` SA: U10/B69 hardening (k8s/rbac-default-sa-noautomount.yaml) sets
# `automountServiceAccountToken: false` on `weyland/default`. lancedb-sync-rbac.yaml had bound its Role to that
# same `default` SA — so the pod held the RBAC *permissions* but had no token to authenticate with, and the op
# died on `ConfigException: Service token file does not exist` (surfaced 2026-07-20, the first time the sensor
# fired since the hardening landed). Two individually-correct changes that cancelled each other out.
# This is precisely the escape hatch that manifest prescribes: "a future pod that DOES need the API should get
# its own dedicated SA rather than relying on default."
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dagster-user-code
  namespace: weyland
automountServiceAccountToken: true   # explicit: this pod genuinely needs an API token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dagster-user-code
  namespace: weyland
  labels:
    app: dagster-user-code
spec:
  replicas: 1
  # Recreate (not RollingUpdate): this node is ~98% committed, so a RollingUpdate can't schedule the new pod
  # alongside the old (Insufficient memory) and the rollout deadlocks. Terminate old → then create new. Brief
  # code-server blip on redeploy is acceptable for a single-replica gRPC server.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dagster-user-code
  template:
    metadata:
      labels:
        app: dagster-user-code
    spec:
      enableServiceLinks: false
      serviceAccountName: dagster-user-code   # NOT `default` — that SA has automount disabled (see above)
      containers:
        - name: dagster-user-code
          image: registry.weyland.lab/weyland-dagster-user-code:v38   # B103 prompt federation (langfuse SDK + sync_prompts.py + app-integrated prompts in register_bifrost_prompts.py); was v37 (B49(b) OTel spans); keep in lockstep with dbt-docs.yaml
          imagePullPolicy: IfNotPresent
          # DefaultRunLauncher runs jobs INSIDE this pod, so a heavy dataset transform spikes here. With no
          # limit a big run triggered NODE-level OOM that killed random lab pods (2026-06-30). The limit
          # contains it: a run over 12Gi gets a pod-scoped OOM (this pod restarts) instead of node-wide.
          # Tune up if legit runs hit the ceiling; lower if the node is starved. (Big sources are deferred /
          # read-gated, so steady-state peak is a few Gi — 12Gi is headroom.)
          resources:
            requests:
              memory: 4Gi
            limits:
              memory: 12Gi
          ports:
            - containerPort: 4000
          env:
            # B49(b) Phase 2 — app-level spans → Tempo OTLP (OPT-IN; unset = no tracing). service.name=weyland-dagster;
            # coarse per-dataset store-load spans (weyland_pipeline/_otel.py). Runbook: observability.md.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.monitoring.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: weyland-dagster
            # B103 prompt federation — sync_prompts.py mirrors Bifrost prompts → Langfuse. Project keys reused from the
            # already-sealed litellm-secrets (same weyland ns) to avoid a duplicate sealed CR.
            - name: LANGFUSE_HOST
              value: http://langfuse.weyland.svc:3000
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LANGFUSE_PUBLIC_KEY
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LANGFUSE_SECRET_KEY
            - name: WEYLAND_PG_HOST
              value: weyland-postgres.weyland.svc.cluster.local
            - name: WEYLAND_PG_PORT
              value: "5432"
            - name: WEYLAND_PG_DB
              value: weyland
            - name: WEYLAND_PG_USER
              value: weyland
            - name: WEYLAND_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dagster-postgres-secret
                  key: password
            - name: DAGSTER_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dagster-postgres-secret
                  key: password
            # B25b: git-pull ingestion source (replaces the SSH/SFTP single-file read).
            - name: GIT_REPO_URL
              value: https://github.com/edtbl76/weyland-lab.git
            - name: GIT_REF
              value: ""                                        # empty = clone the default branch
            # Public repo — no auth needed. (For a private repo, source GIT_TOKEN from a Secret.)
            - name: GIT_TOKEN
              value: ""
            - name: QDRANT_HOST
              value: qdrant.weyland.svc.cluster.local
            - name: QDRANT_PORT
              value: "6333"
            - name: WEAVIATE_HOST
              value: weaviate.weyland.svc.cluster.local
            - name: WEAVIATE_PORT
              value: "8080"
            - name: WEAVIATE_GRPC_PORT
              value: "50051"
            - name: NEO4J_URI
              value: bolt://neo4j.weyland.svc.cluster.local:7687
            - name: NEO4J_USER
              value: neo4j
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neo4j-secret
                  key: password
            # model_catalog asset: enables the Gemini source (OpenRouter + Ollama need no key).
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: GEMINI_API_KEY
            # aidlc_kb_ingest asset (B37): reads the brand-neutral AIDLC KB from the MinIO bucket.
            # Creds live in the minio ns (minio-creds) — mirror them into THIS ns as aidlc-kb-minio-secret
            # (see runbook); secretKeyRef can't cross namespaces.
            - name: MINIO_ENDPOINT
              value: minio.minio.svc.cluster.local:9000
            - name: AIDLC_KB_BUCKET
              value: aidlc-kb
            - name: MINIO_SECURE
              value: "false"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aidlc-kb-minio-secret
                  key: access_key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aidlc-kb-minio-secret
                  key: secret_key
            # B72 lakeFS write-through — datasets_land/transform write THROUGH the lakeFS S3 gateway (versioned),
            # datasets_commit versions each run. Endpoint/repo/branch are plain; creds from lakefs-creds (THIS ns).
            - name: LAKEFS_ENDPOINT
              value: http://lakefs.data-mesh.svc.cluster.local:8000
            - name: LAKEFS_REPO
              value: music
            - name: LAKEFS_BRANCH
              value: main
            - name: LAKEFS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: lakefs-creds
                  key: LAKEFS_ACCESS_KEY_ID
            - name: LAKEFS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lakefs-creds
                  key: LAKEFS_SECRET_ACCESS_KEY
            # B96 — how many RAG contexts each eval question retrieves. Env, not code, so changing it is a
            # manifest change + Argo sync, no image rebuild.
            #
            # ⚠️ MEASURED, three runs on the SAME golden 20-question exam — only this value changed:
            #                              limit 3 (run 7) | limit 5 (run 10) | limit 8 (run 9)
            #   answer_relevancy  conceptual        0.644  |          0.687   |         0.741
            #   context_relevancy conceptual        0.514  |          0.563   |         0.554
            #   faithfulness      conceptual        0.660  |          0.662   |         0.665
            #   answer_relevancy  lexical           0.832  |          0.811   |         0.750
            #   context_relevancy lexical           0.736  |          0.703   |         0.702
            #   faithfulness      lexical           0.780  |          0.716   |         0.691
            #   SUM                                 4.166  |          4.142   |         4.103   <- 3 WINS
            #
            # Depth is a TRADE, not an improvement, and it is roughly LINEAR — there is no free middle (5 sits
            # between 3 and 8 on nearly every cell). More context helps CONCEPTUAL synthesis and hurts LEXICAL
            # precision: an identifier answer lives in ONE chunk, so extra chunks are noise. Lexical faithfulness
            # declines monotonically with depth (0.780 -> 0.716 -> 0.691) — the cleanest signal in the data.
            #
            # The finding that matters: conceptual context_relevancy moved only 0.514 -> 0.563 while k nearly
            # TRIPLED. Depth cannot fix a RANKING problem. The lever is ranking precision (B74 hybrid/RRF, or a
            # reranker), or per-query-type k — identifier queries want a tight top-3, synthesis queries want more.
            # Keep at 3 unless re-measured on the golden set.
            - name: EVAL_ASK_LIMIT
              value: "3"
            # B65 Tier-2 — emit_duckdb() catalogs the GizmoSQL/DuckDB Flight SQL views. URI/user are plain;
            # password = the shared dev password (same dagster-postgres-secret value GizmoSQL was created with).
            - name: GIZMOSQL_URI
              value: grpc+tcp://gizmosql.data-mesh.svc.cluster.local:31337
            - name: GIZMOSQL_USERNAME
              value: weyland
            - name: GIZMOSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dagster-postgres-secret
                  key: password
            # B51 — error tracking → GlitchTip (internal-service DSN). Empty/unset = SDK no-op.
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: dagster-sentry
                  key: SENTRY_DSN
            # B65 Tier 1 — DataHub Dagster sensor: PAT to push lineage/catalog to GMS (metadata-auth on).
            # GMS_URL + DAGSTER_URL have code defaults; only the token is required. Secret in THIS ns.
            - name: DATAHUB_GMS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: datahub-token
                  key: token
            # Lightdash → DataHub custom emitter (emit_lightdash): catalogs BI charts/dashboards + chart→mart
            # lineage. URL has a code default (in-cluster svc); the PAT is optional — emit_lightdash no-ops if
            # unset. Create secret `lightdash-api-token` (key `token`) in THIS ns with a Lightdash PAT to enable.
            - name: LIGHTDASH_URL
              value: http://lightdash.data-mesh.svc.cluster.local:8080
            - name: LIGHTDASH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lightdash-api-token
                  key: token
                  optional: true
            # Iceberg data products (iceberg_export assets → Nessie warehouse on MinIO). Nessie/MinIO URLs
            # have code defaults; only the MinIO creds are required. Mirror nessie-secret's S3 creds into
            # THIS ns as `iceberg-s3-secret` (secretKeyRef can't cross namespaces).
            - name: ICEBERG_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: iceberg-s3-secret
                  key: access_key
            - name: ICEBERG_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: iceberg-s3-secret
                  key: secret_key
            # eval → MLflow experiment tracking (eval_mlflow_log). In-cluster MLflow (no native auth).
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.weyland.svc.cluster.local:5000
            # B65 Tier-2 — TimescaleDB time-series writes (ts_* assets). In-cluster svc; dev password.
            - name: TIMESCALEDB_HOST
              value: timescaledb.data-mesh.svc.cluster.local
            - name: TIMESCALEDB_PORT
              value: "5432"
            - name: TIMESCALEDB_DB
              value: timeseries
            - name: TIMESCALEDB_USER
              value: weyland
            - name: TIMESCALEDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: datamesh-store-creds   # SEC-1: sealed; secretKeyRef can't cross ns → replicated into weyland
                  key: TIMESCALEDB_PASSWORD
            # Store hydration (data-store-mageddon) — MySQL loader (build_store_load_assets reads silver
            # Parquet → MySQL). Always-on store in data-mesh; in-cluster svc; shared dev password.
            - name: MYSQL_HOST
              value: mysql.data-mesh.svc.cluster.local
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_USER
              value: weyland
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: datamesh-store-creds
                  key: MYSQL_PASSWORD
            # MongoDB loader (silver Parquet → documents; aidlc-kb → frontmatter docs). Always-on, data-mesh.
            - name: MONGO_HOST
              value: mongodb.data-mesh.svc.cluster.local
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_USER
              value: weyland
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: datamesh-store-creds
                  key: MONGO_PASSWORD
            # CockroachDB loader (pg-wire, insecure single-node → user root, no password). Always-on, data-mesh.
            - name: COCKROACH_HOST
              value: cockroachdb.data-mesh.svc.cluster.local
            - name: COCKROACH_PORT
              value: "26257"
            - name: COCKROACH_USER
              value: root
            # ClickHouse loader (native s3() ingest → MergeTree). Always-on, data-mesh. The default user has a
            # password (set via the users.d Secret — DataHub's clickhouse-sqlalchemy can't do no-auth); the
            # loader reads it here (empty default in code fails loudly). Same shared dev-password pattern as
            # the mysql/mongo/timescale envs above — migrating all Tier-2 store creds to Secrets is a backlog item.
            - name: CLICKHOUSE_HOST
              value: clickhouse.data-mesh.svc.cluster.local
            - name: CLICKHOUSE_PORT
              value: "8123"
            - name: CLICKHOUSE_USER
              value: default
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: datamesh-store-creds
                  key: CLICKHOUSE_PASSWORD
            # OpenSearch loader (silver Parquet → bulk-indexed docs). Standalone playground (ns opensearch,
            # security plugin OFF → plain HTTP, no auth — nothing secret here). Cross-namespace svc DNS.
            # VERIFY the host: `kubectl -n opensearch get svc` — set to whatever exposes HTTP :9200.
            - name: OPENSEARCH_HOST
              value: opensearch-cluster-master.opensearch.svc.cluster.local
            - name: OPENSEARCH_PORT
              value: "9200"
            # Redpanda (B1.5 streaming) — the Avro event-stream producer. Bootstrap = the headless svc (clients
            # get the advertised pod DNS on connect); Schema Registry is the broker's built-in one on :8081.
            - name: REDPANDA_BOOTSTRAP
              value: redpanda.data-mesh.svc.cluster.local:9092
            - name: SCHEMA_REGISTRY_URL
              value: http://redpanda.data-mesh.svc.cluster.local:8081
          volumeMounts:
            - name: dagster-config
              mountPath: /opt/dagster/dagster_home/dagster.yaml
              subPath: dagster.yaml
            - name: ge-data-docs
              mountPath: /ge-data   # B77 part b — GE (ge_validate_op runs in-pod via DefaultRunLauncher) writes Data Docs here; ge-docs nginx serves the same PVC
      volumes:
        - name: dagster-config
          configMap:
            name: dagster-config
        - name: ge-data-docs
          persistentVolumeClaim:
            claimName: ge-data-docs
---
apiVersion: v1
kind: Service
metadata:
  name: dagster-user-code
  namespace: weyland
  labels:
    app: dagster-user-code
spec:
  type: ClusterIP
  selector:
    app: dagster-user-code
  ports:
    - name: grpc
      port: 4000
      targetPort: 4000
