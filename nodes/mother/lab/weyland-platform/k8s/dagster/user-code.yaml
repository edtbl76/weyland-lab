apiVersion: apps/v1
kind: Deployment
metadata:
  name: dagster-user-code
  namespace: weyland
  labels:
    app: dagster-user-code
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dagster-user-code
  template:
    metadata:
      labels:
        app: dagster-user-code
    spec:
      enableServiceLinks: false
      containers:
        - name: dagster-user-code
          image: weyland-dagster-user-code:local
          imagePullPolicy: Never
          ports:
            - containerPort: 4000
          env:
            - name: WEYLAND_PG_HOST
              value: weyland-postgres.weyland.svc.cluster.local
            - name: WEYLAND_PG_PORT
              value: "5432"
            - name: WEYLAND_PG_DB
              value: weyland
            - name: WEYLAND_PG_USER
              value: weyland
            - name: WEYLAND_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dagster-postgres-secret
                  key: password
            - name: DAGSTER_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dagster-postgres-secret
                  key: password
            # B25b: git-pull ingestion source (replaces the SSH/SFTP single-file read).
            - name: GIT_REPO_URL
              value: https://github.com/edtbl76/weyland-lab.git
            - name: GIT_REF
              value: ""                                        # empty = clone the default branch
            # Public repo — no auth needed. (For a private repo, source GIT_TOKEN from a Secret.)
            - name: GIT_TOKEN
              value: ""
            - name: QDRANT_HOST
              value: qdrant.weyland.svc.cluster.local
            - name: QDRANT_PORT
              value: "6333"
            - name: WEAVIATE_HOST
              value: weaviate.weyland.svc.cluster.local
            - name: WEAVIATE_PORT
              value: "8080"
            - name: WEAVIATE_GRPC_PORT
              value: "50051"
            - name: NEO4J_URI
              value: bolt://neo4j.weyland.svc.cluster.local:7687
            - name: NEO4J_USER
              value: neo4j
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neo4j-secret
                  key: password
          volumeMounts:
            - name: dagster-config
              mountPath: /opt/dagster/dagster_home/dagster.yaml
              subPath: dagster.yaml
      volumes:
        - name: dagster-config
          configMap:
            name: dagster-config
---
apiVersion: v1
kind: Service
metadata:
  name: dagster-user-code
  namespace: weyland
  labels:
    app: dagster-user-code
spec:
  type: ClusterIP
  selector:
    app: dagster-user-code
  ports:
    - name: grpc
      port: 4000
      targetPort: 4000
