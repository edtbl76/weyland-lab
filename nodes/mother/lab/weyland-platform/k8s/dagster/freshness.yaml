# B94 — Dagster PER-JOB watchdog (replaces the global freshness check).
#
# WHY THE OLD VERSION COULDN'T WORK: it asked "has ANY run succeeded in the last 90 min?"
#   SELECT ... FROM runs WHERE status='SUCCESS'    <- no job filter
# With timeseries (4h), ai_session (4h), catalog (6h) and datahub_catalog_emit (6h) all succeeding constantly,
# that clock NEVER ages. A weekly job can fail forever and the watchdog stays green BY CONSTRUCTION. That is
# exactly what happened: `weyland_dbt_job` failed 3 consecutive weekly runs (07-12, 07-19, 07-20) in total
# silence, while a freshness watchdog was deployed and "working". The noisy healthy jobs masked the quiet
# broken one.
#
# TWO conditions per job, because they catch different failures and neither implies the other:
#   1. FAILED  — the job's MOST RECENT run is a FAILURE               (it ran and broke)
#   2. STALE   — the job's last SUCCESS is older than its own cadence  (it stopped running at all)
# Condition 2 matters: the B94 audit found `weyland_ai_session_schedule` STOPPED with the job never having
# succeeded once — a failure-only alert would never have fired, because nothing was failing. Silence != health.
#
# WHY NOT `@run_failure_sensor`: the native run-status sensor is broken on this Dagster line (1.13.14,
# dagster#21526) — the reason the original check polled the DB externally. Keeping the proven mechanism; only
# the QUERY was wrong. Revisit the native sensor on a Dagster major upgrade.
#
# Meshed for STRICT-mTLS Postgres; weyland ns (same ns as dagster + its PG secret).
# NOTE: alerts carry no endsAt, so Alertmanager auto-resolves them after `resolve_timeout` (5m) and this CronJob
# re-fires them every 30m while the condition persists — deliberate: a stuck job should keep nagging.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dagster-freshness-check
  namespace: weyland
spec:
  schedule: "*/30 * * * *"
  timeZone: America/New_York   # schedules.md Design Rule #1 (one clock); a */30 cron fires the same in any TZ, but the field must be set
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 259200   # 72h: a failed Job alerts (and keeps its logs) for 3 days, then clears — never forever (2026-09-25)
      backoffLimit: 0
      activeDeadlineSeconds: 120   # backstop: if the istio sidecar refuses to exit, force-terminate rather than hang Forbid
      template:
        metadata:
          labels:
            sidecar.istio.io/inject: "true"
        spec:
          restartPolicy: Never
          containers:
            - name: check
              image: postgres:17-alpine # psql + busybox wget
              resources:
                requests: { memory: 64Mi, cpu: 50m }
                limits: { memory: 256Mi }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  AM=http://monitoring-kube-prometheus-alertmanager.monitoring.svc.cluster.local:9093/api/v2/alerts

                  JOBS_FILE="${JOBS_FILE:-/tmp/jobs.txt}"

                  # Istio sidecar-on-a-Job: the injected istio-proxy runs forever, so without this the Job never
                  # completes (pod stuck "error"/0/2) and concurrencyPolicy:Forbid deadlocks the next run. Tell the
                  # pilot-agent (15020) / Envoy admin (15000) to quit so the pod terminates. On EXIT, so a psql
                  # failure or the fail-closed exit below still releases the pod instead of waiting out the deadline.
                  quit_sidecar() { for _p in 15020 15000; do wget -q -O- --post-data='' "http://localhost:$_p/quitquitquit" 2>/dev/null && break; done || true; }
                  trap quit_sidecar EXIT

                  # Per-job staleness budget = ~1.25x-2x the schedule interval, so ONE late run doesn't page.
                  # ONE ROW PER JOB WHOSE SCHEDULE IS RUNNING — no more, no less. scripts/check-dagster-watchdog-budgets.sh
                  # (repo-guards, B196) parses this block against every ScheduleDefinition and fails CI on: a RUNNING
                  # schedule with no row, a budget under 1.10x its cron interval, a row for a STOPPED schedule, or a row
                  # naming a job with no schedule. On-demand jobs (hydrate/transform/aidlc_kb/__ASSET_JOB) and
                  # event-driven ones (lancedb_sync — its sensor idles for weeks BY DESIGN) must NOT be listed, or they
                  # alert forever for being idle, which is their correct state.
                  # Every listed job must also have RUN at least once: a listed job with no row in `runs` fires
                  # DagsterJobNeverRan (B196) — a schedule that never fires is the silent failure the query alone missed.
                  BUDGETS=$(cat <<'BUDGETS_EOF'
                  feast_materialize_job              108000  # daily 00:05  -> 30h (unwatched until 2026-09-27, B196)
                  weyland_timeseries_job             108000  # daily 00:20  -> 30h (was 4h->6h; daily since 2026-08-07, budget fixed 2026-09-27)
                  datahub_catalog_emit_job           108000  # daily 00:35  -> 30h (was 6h->8h; daily since 2026-08-07, budget fixed 2026-09-27)
                  weyland_catalog_job                108000  # daily 00:50  -> 30h (was 6h->8h; daily since 2026-08-07, budget fixed 2026-09-27)
                  weyland_ingestion_job              108000  # daily 02:17  -> 30h
                  weyland_datasets_music_land_job    108000  # daily 03:00  -> 30h
                  weyland_datasets_health_land_job   108000  # daily 04:00  -> 30h
                  linear_backup_job                  108000  # daily 05:20  -> 30h (B194 Linear backup, docs/dr.md)
                  soda_quality_job                   108000  # daily 05:30  -> 30h
                  registrations_reconcile_job        691200  # weekly Sun 05:00 -> 8d (unwatched until 2026-09-27, B196)
                  weyland_dbt_job                    691200  # weekly Sun 06:00 -> 8d
                  weyland_eval_job                   691200  # weekly Sat 03:00 -> 8d (now also scores; the separate score schedule is gone)
                  BUDGETS_EOF
                  )
                  threshold_for() {   # 0 = not monitored
                    echo "$BUDGETS" | awk -v j="$1" '$1==j {print $2; f=1; exit} END {if (!f) print 0}'
                  }

                  fire() {   # fire <alertname> <job> <severity> <summary> <description>
                    echo "ALERT $1 job=$2 :: $4"
                    wget -q -O- --header='Content-Type: application/json' \
                      --post-data="[{\"labels\":{\"alertname\":\"$1\",\"severity\":\"$3\",\"namespace\":\"weyland\",\"job_name\":\"$2\",\"source\":\"dagster-watchdog\"},\"annotations\":{\"summary\":\"$4\",\"description\":\"$5\"}}]" \
                      "$AM" || echo "  !! alertmanager POST failed"
                  }

                  # latest = most recent run per job (any status); succ = age of the last SUCCESS per job.
                  # LEFT JOIN so a job that has NEVER succeeded still appears (age sentinel 999999999).
                  SQL="WITH latest AS (
                         SELECT DISTINCT ON (pipeline_name) pipeline_name, status
                         FROM runs ORDER BY pipeline_name, update_timestamp DESC
                       ), succ AS (
                         SELECT pipeline_name,
                                EXTRACT(EPOCH FROM (now() - max(update_timestamp)))::bigint AS age
                         FROM runs WHERE status='SUCCESS' GROUP BY 1
                       )
                       SELECT l.pipeline_name, l.status, COALESCE(s.age, 999999999)
                       FROM latest l LEFT JOIN succ s USING (pipeline_name);"

                  PGPASSWORD="$DAGSTER_PG_PASSWORD" psql -t -A -F'|' \
                    -h weyland-postgres.weyland.svc.cluster.local -U weyland -d dagster \
                    -c "$SQL" > "$JOBS_FILE"

                  # Fail closed: an empty run list is the database answering nothing, not every job being healthy.
                  if ! grep -q '|' "$JOBS_FILE"; then
                    echo "no runs returned from the dagster run database — refusing to report 0 alerts"
                    exit 1
                  fi

                  ALERTS=0
                  while IFS='|' read -r JOB STATUS AGE; do
                    [ -n "$JOB" ] || continue
                    T=$(threshold_for "$JOB")
                    [ "$T" -gt 0 ] || continue                      # unmonitored (on-demand/event-driven)
                    echo "check $JOB status=$STATUS last_success_age=${AGE}s budget=${T}s"
                    if [ "$STATUS" = "FAILURE" ]; then
                      fire "DagsterJobFailed" "$JOB" "warning" \
                        "Dagster job $JOB last run FAILED" \
                        "The most recent run of $JOB failed. Inspect it at https://dagster.weyland.lab/runs (filter by job). A schedule TICK reading SUCCESS only means the run was LAUNCHED, not that it passed."
                      ALERTS=$((ALERTS+1))
                    fi
                    if [ "$AGE" -gt "$T" ]; then
                      fire "DagsterJobStale" "$JOB" "warning" \
                        "Dagster job $JOB has no success in ${AGE}s (budget ${T}s)" \
                        "$JOB has not completed successfully within its expected cadence — it may be failing, its schedule may be STOPPED, or the daemon may be stuck. Check https://dagster.weyland.lab/automation for the schedule state."
                      ALERTS=$((ALERTS+1))
                    fi
                  done < "$JOBS_FILE"

                  # A budgeted job with NO row in `runs` never appears above, so it could never alert (B196) — the
                  # budget promised a watch that was not happening. Found with B194's linear_backup_job, which sat
                  # there until its first scheduled run.
                  NEVER=$(echo "$BUDGETS" | awk 'NF && $1 !~ /^#/ {print $1}')
                  for JOB in $NEVER; do
                    grep -q "^$JOB|" "$JOBS_FILE" && continue
                    fire "DagsterJobNeverRan" "$JOB" "warning" \
                      "Dagster job $JOB has a freshness budget but has never run" \
                      "$JOB is watched by dagster-freshness-check but has no run in the run database: its schedule may be STOPPED in the UI, never loaded, or the job renamed. Check https://dagster.weyland.lab/automation."
                    ALERTS=$((ALERTS+1))
                  done
                  echo "done — $ALERTS alert(s) fired"
              env:
                - name: DAGSTER_PG_PASSWORD
                  valueFrom: { secretKeyRef: { name: dagster-postgres-secret, key: password } }
