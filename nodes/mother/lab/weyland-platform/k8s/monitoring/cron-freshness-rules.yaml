# B135 — scheduled-work freshness for k8s CronJobs.
#
# THE GAP THIS CLOSES: as of 2026-08-23 the estate had 41 alert rules and every one watched something
# that IS running (TrinoDown, MinioDown, NodeMemoryCritical, WeylandErrorLogSpike). The closest
# exception, DataMeshBackupFailed, fires on `kube_job_status_failed > 0` — a job that ran and FAILED.
# NOTHING fired when scheduled work never happened at all, which is why `nightly-images` could sit
# `enabled: false` for four days while docs/schedules.md documented it as running daily.
#
# `kube_cronjob_status_last_successful_time` already existed and had no consumer. This gives it one.
#
# WHY PER-CADENCE BUDGETS AND NOT ONE BLANKET RULE: the first draft was a single "no success in 24h".
# `sonar-scan` and `code-scan-suite` are WEEKLY, so it would have false-fired on both every single
# week — and a permanently-lit alert is worse than no alert, which is exactly what WeylandErrorLogSpike
# was found doing on 2026-08-22. Every budget below is the job's documented period plus slack, read
# from its manifest and cross-checked against docs/schedules.md before it was written here.
#
# WHY THIS DOES NOT COVER `nightly-images`: that is a Woodpecker cron, not a Kubernetes object. No
# CronJob, no Job, no pod — kube-state-metrics cannot see it and no `kube_cronjob_*` metric ever will.
# Its watchdog is the sibling CronJob in k8s/pr-lifecycle/cron-freshness.yaml, which asks the
# Woodpecker API directly.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cron-freshness
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: scheduled-work-freshness
      rules:
        # every 30m → 2h budget. dagster-freshness-check (k8s/dagster/freshness.yaml, `*/30`).
        - alert: ScheduledJobStale
          expr: |
            time() - kube_cronjob_status_last_successful_time{cronjob="dagster-freshness-check"} > 7200
          for: 30m
          labels:
            severity: warning
            source: cron-freshness
            cadence: 30m
          annotations:
            summary: "CronJob {{ $labels.cronjob }} has not succeeded in over 2h (runs every 30m)"
            description: "Last success was {{ $value | humanizeDuration }} ago. This alert fires on work that did NOT happen — the estate's other rules only watch things that are running."

        # every 6h → 8h budget. lancedb-sync (k8s/data-mesh/lancedb-viewer.yaml, `0 */6 * * *`).
        - alert: ScheduledJobStale
          expr: |
            time() - kube_cronjob_status_last_successful_time{cronjob="lancedb-sync"} > 28800
          for: 30m
          labels:
            severity: warning
            source: cron-freshness
            cadence: 6h
          annotations:
            summary: "CronJob {{ $labels.cronjob }} has not succeeded in over 8h (runs every 6h)"
            description: "Last success was {{ $value | humanizeDuration }} ago."

        # daily → 26h budget (24h + 2h slack). Schedules read from each manifest:
        #   minio-backup `30 2 * * *` · pg-backup `0 3 * * *` · postgres-backup `30 3 * * *`
        #   docs-site-rebuild 05:30 · pr-staleness-check `45 5 * * *` · cron-freshness-check `30 4 * * *`
        #
        # port-pr-reconcile (B144, `0 5 * * *`) is the ONLY job in this file that DESTROYS data, so its
        # failure rule matters more than its freshness rule: it fails CLOSED on any uncertain answer,
        # which means a broken run exits non-zero having reaped NOTHING while the catalog keeps
        # accumulating stale rows. Freshness alone would stay quiet as long as some later run succeeded.
        #
        # cron-freshness-check WATCHES ITSELF here, deliberately. It is the job that detects scheduled
        # work which stopped — so a silent failure of it re-opens the exact blind spot the whole rule
        # exists to close, and nothing else would notice. Found missing during the B135 DoD sweep:
        # every other live CronJob was covered and the watchdog was not.
        - alert: ScheduledJobStale
          expr: |
            time() - kube_cronjob_status_last_successful_time{cronjob=~"minio-backup|pg-backup|postgres-backup|docs-site-rebuild|pr-staleness-check|cron-freshness-check|port-pr-reconcile"} > 93600
          for: 1h
          labels:
            severity: warning
            source: cron-freshness
            cadence: daily
          annotations:
            summary: "Daily CronJob {{ $labels.cronjob }} has not succeeded in over 26h"
            description: "Last success was {{ $value | humanizeDuration }} ago in namespace {{ $labels.namespace }}. A daily job silently not running is the failure mode that cost four days on nightly-images."

        # weekly (Sunday) → 8d budget. sonar-scan 08:00 · code-scan-suite 09:00.
        # NOT 24h: on 2026-08-23 sonar-scan read 160.8h since last success and was entirely on
        # schedule — it is weekly and was due that afternoon. Checking the schedule before choosing
        # the number is the whole reason this rule is not one blanket threshold.
        - alert: ScheduledJobStale
          expr: |
            time() - kube_cronjob_status_last_successful_time{cronjob=~"sonar-scan|code-scan-suite"} > 691200
          for: 1h
          labels:
            severity: warning
            source: cron-freshness
            cadence: weekly
          annotations:
            summary: "Weekly CronJob {{ $labels.cronjob }} has not succeeded in over 8 days"
            description: "Last success was {{ $value | humanizeDuration }} ago. Both run Sunday morning."

        # ── FAILURE SIDE (B140) ────────────────────────────────────────────────────────────────
        # Everything above answers "did it STOP?". Nothing answered "did it RUN AND BREAK?" — and a
        # job can fail the second while passing the first, because one later success advances
        # `last_successful_time` and the freshness rule goes quiet.
        #
        # NOT theoretical: `dagster-freshness-check-29791170` sat `Failed` in ns weyland for 19 HOURS.
        # Later runs succeeded, freshness stayed green, nothing alerted, and by the time it was
        # noticed the pod and its events had aged out — the cause is permanently unrecoverable.
        #
        # These REPLACE `DataMeshBackupFailed` (formerly in k8s/data-mesh/monitoring.yaml), which was
        # the estate's only failure-side rule and covered half of what it claimed: its regex
        # `job_name=~"(minio|pg)-backup.*"` reads as both, while the `namespace="data-mesh"` selector
        # one line above excluded `minio-backup`, which lives in namespace `minio`. A failing MinIO
        # backup — the mlflow and tofu-state buckets, both irreplaceable — alerted nobody.
        #
        # NO namespace selector here, deliberately: these 10 CronJobs span `weyland`, `data-mesh` and
        # `minio`, and pinning a namespace is exactly the mistake being corrected. kube-state-metrics
        # names a CronJob-spawned Job `<cronjob>-<unix-minutes>`, hence the `-[0-9]+` suffix — which
        # also keeps ad-hoc Jobs (`scan-suite-adhoc`) out, since those are launched by hand.
        #
        # `scripts/check-cron-freshness-budgets.sh` asserts every CronJob is named by EXACTLY ONE of
        # these two rules — zero is a blind spot, two is a double page.

        # Backups are their own rule at CRITICAL: the others losing a run costs freshness, these
        # losing a run costs DATA. Kept separate from ScheduledJobFailed so the severity and the
        # message can differ — collapsing them would flatten that distinction.
        - alert: ScheduledBackupFailed
          expr: |
            kube_job_status_failed{job_name=~"(minio-backup|pg-backup|postgres-backup)-[0-9]+"} > 0
          for: 10m
          labels:
            severity: critical
            source: cron-freshness
          annotations:
            summary: "Backup job {{ $labels.job_name }} FAILED in {{ $labels.namespace }}"
            description: "A backup CronJob ran and failed. Data products, catalog metadata or the MinIO buckets (mlflow models, tofu state — both irreplaceable) may now be unprotected. Freshness alerts will NOT catch this if a later run succeeds."

        - alert: ScheduledJobFailed
          expr: |
            kube_job_status_failed{job_name=~"(sonar-scan|code-scan-suite|docs-site-rebuild|pr-staleness-check|cron-freshness-check|lancedb-sync|dagster-freshness-check|port-pr-reconcile)-[0-9]+"} > 0
          for: 10m
          labels:
            severity: warning
            source: cron-freshness
          annotations:
            summary: "CronJob {{ $labels.job_name }} ran and FAILED in {{ $labels.namespace }}"
            description: "The job executed and exited non-zero. This is the half freshness cannot see: if a later run succeeds inside the budget, the freshness rule goes quiet and the failure is lost with the pod's events."

        # A CronJob that has NEVER succeeded exports no series at all, so every threshold rule above
        # is silent for it — absence again, one level up.
        #
        # ⚠ REWRITTEN 2026-08-25. This was three hardcoded `absent()` clauses naming pr-staleness-check,
        # postgres-backup and minio-backup. `cron-freshness-check` was NOT among them — and it turned out
        # to be the one CronJob in the estate that had **never succeeded once**, from the day B140 shipped
        # it, because its Woodpecker URL had the wrong namespace AND the wrong port. The rule written to
        # catch "never succeeded" could not see the only job it was true of.
        #
        # That is the same blind spot as check-app-registry.sh reconciling two lists and missing a third
        # thing in neither: a hand-maintained subset silently stops covering what gets added later.
        #
        # So it is now GENERIC. `unless on(...)` returns every CronJob that has NO last-successful-time
        # series, whatever its name — new jobs are covered the moment they exist, and the alert names the
        # offender through its own labels instead of a sentence listing what someone remembered.
        - alert: ScheduledJobNeverSucceeded
          expr: |
            kube_cronjob_info
              unless on (namespace, cronjob) kube_cronjob_status_last_successful_time
          for: 2h
          labels:
            severity: critical
            source: cron-freshness
          annotations:
            summary: "CronJob {{ $labels.cronjob }} has NO recorded successful run at all ({{ $labels.namespace }})"
            description: "kube_cronjob_status_last_successful_time does not exist for {{ $labels.cronjob }}. Either it was just created and has not run yet, it has never completed successfully, or kube-state-metrics stopped exporting it. A threshold rule cannot fire on a series that does not exist, which is why this rule exists separately — and it is deliberately generic rather than a hand-listed subset, because the hand-listed version missed cron-freshness-check for the entire time that job was broken."
