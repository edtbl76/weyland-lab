apiVersion: batch/v1
kind: CronJob
metadata:
  name: placement-coverage
  namespace: monitoring
spec:
  schedule: "40 3 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 259200   # 72h: a failed Job alerts (and keeps its logs) for 3 days, then clears — never forever
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            sidecar.istio.io/inject: "false"   # Prometheus is unmeshed; see the header
        spec:
          restartPolicy: Never
          containers:
            - name: check
              image: alpine:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  apk add --no-cache python3 py3-yaml >/dev/null
                  python3 /opt/placement/placement_check.py --live --file /opt/placement/placement.yaml \
                    --prometheus http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
              resources:
                requests: { cpu: 25m, memory: 64Mi }
                limits: { memory: 192Mi }
              volumeMounts:
                - name: logic
                  mountPath: /opt/placement
          volumes:
            - name: logic
              configMap:
                name: placement-coverage-logic
