# kube-prometheus-stack — Weyland observability (B5).
# Install: helm install monitoring prometheus-community/kube-prometheus-stack
#          -n monitoring -f this-file  (see docs/b5-observability.md)
# Grafana is fronted by a standalone Traefik Ingress (grafana.weyland.lab) — see
# k8s/monitoring/grafana-ingress.yaml. Grafana admin creds come from a Secret created
# out-of-band (grafana-admin) — NOT committed here (U6 lesson).

# Alertmanager ON — default rules + firing-alert visibility from day one.
# Phase 2 DONE (2026-06-13): native Alertmanager -> Telegram. Chosen over Alertmanager->n8n->Telegram
# to keep deps minimal in the failure-detection path (n8n stays standby for actions/orchestration).
# Bot token lives in the weyland-alerts-telegram Secret (kubectl-created, NOT committed); the operator
# mounts it at /etc/alertmanager/secrets/<name>/ and Alertmanager reads it via bot_token_file.
alertmanager:
  enabled: true
  config:
    route:
      receiver: telegram
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: 'null'            # Watchdog = always-firing liveness alert; never notify on it
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: 'null'
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/weyland-alerts-telegram/bot-token
            chat_id: 8690429665
            send_resolved: true
            message: |
              Weyland alert ({{ .Alerts | len }}) — {{ .Status }}
              {{ range .Alerts }}- {{ .Labels.alertname }} [{{ .Labels.severity }}]: {{ .Annotations.summary }}{{ if .Annotations.description }} — {{ .Annotations.description }}{{ end }}
              {{ end }}
  alertmanagerSpec:
    # Operator mounts this Secret at /etc/alertmanager/secrets/weyland-alerts-telegram/
    secrets:
      - weyland-alerts-telegram
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 128Mi }

grafana:
  # Admin creds from a pre-created Secret (do NOT put the password in this file).
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Single-instance + RWO PVC -> Recreate so it doesn't deadlock on restart
  # (k8s-rwo-recreate-strategy lesson).
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    storageClassName: local-path
    accessModes: ["ReadWriteOnce"]
    size: 5Gi
  # We front Grafana with our own Ingress for TLS consistency — disable the chart's.
  ingress:
    enabled: false
  # B1.1 Phase 3 — inject the Keycloak OIDC client secret as GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET.
  # Secret created out-of-band (grafana-oauth, monitoring ns) — never committed. Must exist BEFORE this rolls.
  envFromSecret: grafana-oauth
  grafana.ini:
    server:
      root_url: https://grafana.weyland.lab
    # B1.1 Phase 3 — Keycloak SSO (first OIDC cutover). Non-secret config only; client_secret comes from the env above.
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      client_id: grafana
      scopes: openid email profile
      auth_url: https://keycloak.weyland.lab/realms/weyland/protocol/openid-connect/auth
      token_url: https://keycloak.weyland.lab/realms/weyland/protocol/openid-connect/token
      api_url: https://keycloak.weyland.lab/realms/weyland/protocol/openid-connect/userinfo
      role_attribute_path: "'Admin'"   # single-operator lab — every SSO login lands as Org Admin
      tls_skip_verify_insecure: true   # Grafana → Keycloak rides the internal-CA cert
  resources:
    # 256Mi was too tight — Grafana + its 2 sidecars run ~310Mi and OOMKilled (→502s).
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 512Mi }
  # Surface already-running backends INSIDE Grafana (no new services). Prometheus is auto-provisioned by the
  # chart; these are additions. (Jaeger removed — replaced by Tempo in B48.)
  additionalDataSources:
    # kube-prometheus-stack Alertmanager — view firing alerts in Grafana (routing stays Alertmanager→Telegram).
    - name: Alertmanager
      type: alertmanager
      uid: alertmanager
      access: proxy
      url: http://monitoring-kube-prometheus-alertmanager.monitoring.svc.cluster.local:9093
      jsonData:
        implementation: prometheus
        handleGrafanaManagedAlerts: false
    # Loki (logs, B48) — SingleBinary svc, no gateway. View via Explore → Loki / Logs Drilldown.
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
    # Tempo (traces, B48) — replaces Jaeger as the trace backend; HTTP API :3200. Unlocks the trace Drilldown.
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3200

prometheus:
  prometheusSpec:
    # Phase 2b: discover ALL ServiceMonitors cluster-wide, not just release-labelled ones.
    serviceMonitorSelectorNilUsesHelmValues: false
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    resources:
      # Prometheus memory grows with series count (Phase 2 ServiceMonitors add more) —
      # generous limit to avoid OOM as it accumulates.
      requests: { cpu: 200m, memory: 768Mi }
      limits: { memory: 2Gi }
    # Phase 1: scrapes the stack's own targets (kubelet, cAdvisor, node-exporter,
    # kube-state-metrics, etc.). Phase 2: add ServiceMonitors for app emitters
    # (APISIX, CoreDNS, Traefik, Qdrant, Weaviate) — may need
    # serviceMonitorSelectorNilUsesHelmValues: false to pick up un-labelled ones.

prometheus-node-exporter:
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 64Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 128Mi }
