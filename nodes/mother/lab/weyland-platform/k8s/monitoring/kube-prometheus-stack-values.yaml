# kube-prometheus-stack — Weyland observability (B5).
# Install: helm install monitoring prometheus-community/kube-prometheus-stack
#          -n monitoring -f this-file  (see docs/b5-observability.md)
# Grafana is fronted by a standalone Traefik Ingress (grafana.weyland.lab) — see
# k8s/monitoring/grafana-ingress.yaml. Grafana admin creds come from a Secret created
# out-of-band (grafana-admin) — NOT committed here (U6 lesson).

# Alertmanager ON — default rules + firing-alert visibility from day one.
# Phase 2 DONE (2026-06-13): native Alertmanager -> Telegram. Chosen over Alertmanager->n8n->Telegram
# to keep deps minimal in the failure-detection path (n8n stays standby for actions/orchestration).
# Bot token lives in the weyland-alerts-telegram Secret (kubectl-created, NOT committed); the operator
# mounts it at /etc/alertmanager/secrets/<name>/ and Alertmanager reads it via bot_token_file.
# k3s bundles kube-scheduler / kube-controller-manager / kube-proxy INTO the k3s process, so the stack's separate
# ServiceMonitors find no endpoint and fire {KubeScheduler,KubeControllerManager,KubeProxy}Down false-positives.
# Disable those component scrapes + rules — they don't apply to k3s (surfaced by the B45 incident sweep, 2026-08-04).
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

alertmanager:
  enabled: true
  config:
    route:
      receiver: telegram
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # B69 dead-man's-switch: the always-firing Watchdog pings hc-ping.com every 5m. If the pings STOP
        # (Prometheus/Alertmanager/the whole cluster is dead), healthchecks.io alerts you EXTERNALLY — the one
        # thing an in-cluster monitor can't do.
        - receiver: 'healthchecks-watchdog'
          matchers:
            - alertname = "Watchdog"
          group_wait: 0s
          group_interval: 5m
          repeat_interval: 5m
    receivers:
      - name: 'null'
      - name: 'healthchecks-watchdog'
        webhook_configs:
          # URL lives in a Secret (repo is PUBLIC — a plaintext ping URL anyone could hit would defeat the switch).
          - url_file: /etc/alertmanager/secrets/watchdog-healthcheck/url
            send_resolved: false
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/weyland-alerts-telegram/bot-token
            chat_id: 8690429665
            send_resolved: true
            message: |
              Weyland alert ({{ .Alerts | len }}) — {{ .Status }}
              {{ range .Alerts }}- {{ .Labels.alertname }} [{{ .Labels.severity }}]: {{ .Annotations.summary }}{{ if .Annotations.description }} — {{ .Annotations.description }}{{ end }}
              {{ end }}
  alertmanagerSpec:
    # Operator mounts this Secret at /etc/alertmanager/secrets/weyland-alerts-telegram/
    secrets:
      - weyland-alerts-telegram
      - watchdog-healthcheck   # B69 dead-man's-switch: hc-ping.com URL (key `url`), created out-of-band
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 128Mi }

grafana:
  # Admin creds from a pre-created Secret (do NOT put the password in this file).
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Single-instance + RWO PVC -> Recreate so it doesn't deadlock on restart
  # (k8s-rwo-recreate-strategy lesson).
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    storageClassName: local-path
    accessModes: ["ReadWriteOnce"]
    size: 5Gi
  # We front Grafana with our own Ingress for TLS consistency — disable the chart's.
  ingress:
    enabled: false
  # B1.1 Phase 3 — inject the Keycloak OIDC client secret as GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET.
  # Secret created out-of-band (grafana-oauth, monitoring ns) — never committed. Must exist BEFORE this rolls.
  envFromSecret: grafana-oauth
  # B1.1 harden — mount the mkcert root CA so Grafana VERIFIES Keycloak's cert (replaces the TLS skip).
  # Reuses the existing weyland-mkcert-ca secret (the same CA Uptime Kuma trusts), copied into the monitoring
  # ns out-of-band — must exist before this rolls.
  extraSecretMounts:
    - name: mkcert-root-ca
      secretName: weyland-mkcert-ca
      mountPath: /etc/grafana/mkcert-rootCA.pem
      subPath: rootCA.pem
      readOnly: true
  grafana.ini:
    server:
      root_url: https://grafana.weyland.lab
    security:
      # Allow Grafana panels to be <iframe>-embedded (the Ray dashboard's Metrics tab embeds d-solo panels).
      # ray.weyland.lab + grafana.weyland.lab are the same site (weyland.lab), so the Keycloak SSO cookie carries
      # into the iframe — no anonymous access or cookie_samesite change needed, just lift the X-Frame-Options deny.
      allow_embedding: true
    # B1.1 Phase 3 — Keycloak SSO (first OIDC cutover). Non-secret config only; client_secret comes from the env above.
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      client_id: grafana
      scopes: openid email profile
      auth_url: https://keycloak.weyland.lab/realms/weyland/protocol/openid-connect/auth
      token_url: https://keycloak.weyland.lab/realms/weyland/protocol/openid-connect/token
      api_url: https://keycloak.weyland.lab/realms/weyland/protocol/openid-connect/userinfo
      role_attribute_path: "'Admin'"   # single-operator lab — every SSO login lands as Org Admin
      tls_client_ca: /etc/grafana/mkcert-rootCA.pem   # verify Keycloak's cert against the mounted mkcert root
  resources:
    # 256Mi was too tight — Grafana + its 2 sidecars run ~310Mi and OOMKilled (→502s).
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 512Mi }
  # ── Grafana datasource pruning (B49 thread c, 2026-08-08) ───────────────────────────────────────────────────────
  # READ THIS before touching datasources — the terminology bites people:
  #   A Grafana "datasource" is ONLY a Grafana-side CONFIG POINTER to a backend. It is NOT the backend workload.
  #   Deleting a datasource removes Grafana's link to a backend — it NEVER deletes the pod/StatefulSet/Service.
  #   Also: Grafana datasource provisioning is ADD-ONLY — removing an entry from `additionalDataSources` does NOT
  #   delete the live datasource object; you must prune it explicitly here in `deleteDatasources`.
  #
  #   • Jaeger       — trace backend retired in B48 (replaced by Tempo). Dropped from config then, but the live
  #                    datasource orphaned and now health-errors on the dead istio tracing svc → prune it.
  #   • Alertmanager — Grafana 13 DEPRECATED the standalone `alertmanager` datasource and ships its plugin DISABLED,
  #                    so its health check returns "plugin unavailable". We remove the dead pointer.
  #                    ⚠️ THIS DOES NOT TOUCH ALERTING. The Alertmanager StatefulSet and the real notification path
  #                    Prometheus → Alertmanager → Telegram (configured by the `alertmanager:` block far above) are
  #                    SEPARATE and completely unaffected. You just lose the (already-broken) view of alerts *inside*
  #                    Grafana — view/silence alerts in Alertmanager's own UI instead. If you ever want alert-ops
  #                    back inside Grafana, wire the external Alertmanager via Grafana unified-alerting, NOT this
  #                    deprecated datasource.
  deleteDatasources:
    - name: Jaeger
      orgId: 1
    - name: Alertmanager
      orgId: 1
  # Surface already-running backends INSIDE Grafana (no new services). Prometheus is auto-provisioned by the chart;
  # these are additions. (Jaeger + Alertmanager pruned above — see the note.)
  additionalDataSources:
    # Loki (logs, B48) — SingleBinary svc, no gateway. View via Explore → Loki / Logs Drilldown.
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
    # Tempo (traces, B48) — replaces Jaeger as the trace backend; HTTP API :3200. Unlocks the trace Drilldown.
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3200
    # Pyroscope (continuous profiling, B111) — unlocks the Profiles Drilldown. Monolithic server :4040 (ns monitoring).
    - name: Pyroscope
      type: grafana-pyroscope-datasource
      uid: pyroscope
      access: proxy
      url: http://pyroscope.monitoring.svc.cluster.local:4040

prometheus:
  prometheusSpec:
    # Phase 2b: discover ALL ServiceMonitors cluster-wide, not just release-labelled ones.
    serviceMonitorSelectorNilUsesHelmValues: false
    # B69: same for PrometheusRules. The 17 data-mesh alert rules (k8s/data-mesh/*.yaml) are labelled `app:`,
    # not `release: monitoring`, so without this the operator's default `release` ruleSelector silently DROPS
    # every data-mesh down-alert (Nessie/lakeFS/DataHub/MinIO/Trino/GizmoSQL/Feast/Superset/all 10 Tier-2).
    ruleSelectorNilUsesHelmValues: false
    # B111 — accept remote_write from Tempo's metrics-generator (span-metrics + service-graphs derived from traces).
    # Without this the generator's remote_write is refused and the "traces → Prometheus metrics" path stays dead.
    enableRemoteWriteReceiver: true
    # Static scrape of the EXTERNAL rogueone Ray worker (off-cluster → no ServiceMonitor; it exposes
    # --metrics-export-port=8080 on .230). This is where the task/actor/node ray_* metrics actually live — the
    # head is a --num-cpus=0 coordinator with no work. Not-always-up (laptop) → the target flaps down on sleep,
    # which is expected. Rides the edge posture (B-RT #4c); firewall when the DMZ lands.
    additionalScrapeConfigs:
      - job_name: ray-worker-rogueone
        static_configs:
          - targets: ['192.168.1.230:8080']
            labels:
              ray_node_type: worker
    retention: 15d
    # Hard size cap BELOW the 20Gi PVC (2026-07-18) — Prometheus drops oldest blocks at whichever comes first,
    # 15d OR 16GB, so a series-count spike can never fill the volume and pressure the root disk (the eviction that
    # kicked off the DNS outage). ~4Gi headroom left for WAL/compaction.
    retentionSize: 16GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    resources:
      # Prometheus memory grows with series count (Phase 2 ServiceMonitors add more) —
      # generous limit to avoid OOM as it accumulates.
      requests: { cpu: 200m, memory: 768Mi }
      limits: { memory: 2Gi }
    # Phase 1: scrapes the stack's own targets (kubelet, cAdvisor, node-exporter,
    # kube-state-metrics, etc.). Phase 2: add ServiceMonitors for app emitters
    # (APISIX, CoreDNS, Traefik, Qdrant, Weaviate) — may need
    # serviceMonitorSelectorNilUsesHelmValues: false to pick up un-labelled ones.

prometheus-node-exporter:
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 64Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 128Mi }
