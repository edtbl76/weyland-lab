# B155 — nightly API drift check (the runtime half of API lifecycle governance).
#
# WHY THIS EXISTS: apis.yaml + check-api-lifecycle.sh govern the API catalog at PR time, but nothing
# noticed when a DEPLOYED API drifted from its governed contract — a route removed, a field dropped, a
# new required field — without the catalog + snapshot being updated and the version bumped. This fetches
# each catalogued API's LIVE spec and diffs it against the committed snapshot (docs/api/specs/) with the
# breaking-change engine (api_spec_diff.py). A breaking divergence fails the Job.
#
# NO kubectl / NO RBAC — like datahub-coverage, it only makes HTTP GETs (each API's `spec_source`: the
# in-cluster FastAPI `/openapi.json` on the `.svc` FQDNs + the realm A2A card). Runs UNMESHED (the
# targets are unmeshed FastAPI pods; a sidecar would proxy plain HTTP for no benefit).
#
# FAIL-CLOSED, but reachability-honest: a source that can't be fetched (a scaled-to-zero / down service)
# is SKIPPED and logged, not called drift — firing nightly on every asleep service would be noise. A
# breaking diff on a REACHABLE API → exit 1 → the failed Job raises kube_job_status_failed →
# ScheduledJobFailed (cron-freshness-rules.yaml) → Telegram.
#
# The logic ConfigMap (api-drift-configmap.yaml) is GENERATED by scripts/embed-api-drift.sh and carries
# the engine + runner + apis.yaml + every contract snapshot, all mounted flat at /opt/api-drift (both the
# module dir and the specs dir). api-drift.bats asserts the embedded engine + runner are byte-identical.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: api-drift
  namespace: monitoring
spec:
  schedule: "20 3 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            # Unmeshed on purpose — the targets are unmeshed FastAPI pods + the realm card. See the header.
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: Never
          containers:
            - name: check
              image: python:3.12-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  pip install --quiet pyyaml >/dev/null 2>&1
                  python /opt/api-drift/api_drift.py /opt/api-drift/apis.yaml /opt/api-drift
              volumeMounts:
                - name: logic
                  mountPath: /opt/api-drift
              resources:
                requests: { cpu: 25m, memory: 64Mi }
                limits: { memory: 192Mi }
          volumes:
            - name: logic
              configMap:
                name: api-drift-logic
