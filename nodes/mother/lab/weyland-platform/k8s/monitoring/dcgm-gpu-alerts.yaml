# B128 — rogueone GPU fault + thermal alerts (DCGM). rogueone is the lab's GPU training box (Ray + MLflow +
# genre/finance-trainer). dcgm.dcgm-exporter (snap) exposes DCGM_FI_DEV_* on :9400, scraped by the static
# `dcgm-exporter-rogueone` job in kube-prometheus-stack-values.yaml (gpu_host="rogueone").
#
# WHY THESE, and why NO dedicated down/absent alert (unlike node-memory-alerts.yaml's absent() meta-rule):
#   - Coverage is already provided by the BLANKET net: kube-prometheus-stack's `TargetDown` (for: 10m, warning)
#     fires for ANY scraped job that goes down, this one included — that is exactly the model check-alert-coverage
#     relies on (see alert-coverage.yaml: a per-service down alert would be redundant with TargetDown, called out
#     there as over-engineering for a lab). So a dedicated `absent(up{job=...})` here would add nothing.
#   - Caveat, not a fault: rogueone is a laptop that sleeps, so TargetDown DOES page on a long sleep (a brief
#     flap is absorbed by its 10m `for`). That known, tolerated page is identical to the existing
#     ray-worker-rogueone target — same box, same behavior — so this adds no new class of noise, just one more
#     job under the same net. A down target here means "asleep/off", not "GPU broken".
#   - The value these two rules add on top of the net is the FAULT signals that are silent today (only visible
#     post-mortem in dmesg):
#       * Xid errors — GPU-fault codes. The `NVRM Xid 16` (display-engine) events in the rogueone freeze
#         forensics (memory rogueone-gpu-freeze-vram / EMA-186) would surface HERE instead of only in dmesg.
#       * sustained high temperature — thermal-throttle risk during long training runs.
# `release: monitoring` so the operator's ruleSelector picks it up (same as every sibling rule file).
#
# VERIFY BEFORE TRUSTING (fail-closed): the exact DCGM field set the snap exports is confirmed against real
# `:9400/metrics` in the operator step — DCGM_FI_DEV_XID_ERRORS and DCGM_FI_DEV_GPU_TEMP must appear there, or
# these alerts are blind. If Xid is not in the default field set, enable it in the exporter's metrics config.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dcgm-gpu
  namespace: monitoring
  labels: { release: monitoring }
spec:
  groups:
    - name: dcgm-gpu
      rules:
        # A GPU fault code was reported. DCGM_FI_DEV_XID_ERRORS holds the last Xid code; nonzero = a fault
        # occurred and has not been cleared (persists until GPU reset / reboot). This is the early-warning the
        # item exists for — the freeze forensics only ever saw Xid post-mortem in dmesg.
        - alert: GpuXidError
          expr: DCGM_FI_DEV_XID_ERRORS{gpu_host="rogueone"} > 0
          for: 1m
          labels: { severity: critical }
          annotations:
            summary: "rogueone GPU Xid fault (code {{ $value }})"
            description: "DCGM reported a GPU Xid error on rogueone (last code {{ $value }}). Xid codes are hardware/driver fault signals — Xid 16 (display-engine) preceded the freeze incidents (EMA-186). Check `dmesg -T | grep -i xid` on rogueone and correlate with any wedged training run; a GPU reset or reboot clears it once the cause is understood."
        # Sustained high die temperature → thermal-throttle risk on long training runs. 85C is the warning
        # line for the RTX 5000 Ada; brief spikes are fine, `for: 5m` requires it to be sustained.
        - alert: GpuHighTemp
          expr: DCGM_FI_DEV_GPU_TEMP{gpu_host="rogueone"} > 85
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "rogueone GPU {{ $value }}C for 5m"
            description: "GPU die temperature has held above 85C for 5m — the card is at or near thermal throttling, which silently slows training. Check airflow/fan curve and current load (Ray/MLflow run); it is a performance signal, not yet a fault."
