# B5 Phase 2b — app ServiceMonitors. Prometheus discovers these via
# serviceMonitorSelectorNilUsesHelmValues: false (set in the kube-prometheus-stack values), so no
# release label is needed. Each selects its app's Service by label and scrapes the metrics port.
# (Traefik intentionally omitted — k3s-managed, load-bearing ingress; not worth the blast-radius.)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: qdrant
  namespace: weyland
spec:
  selector:
    matchLabels:
      app: qdrant
  endpoints:
    - port: http            # Qdrant serves /metrics on its 6333 HTTP port
      path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: weaviate
  namespace: weyland
spec:
  selector:
    matchLabels:
      app: weaviate
  endpoints:
    - port: metrics         # :2112 (PROMETHEUS_MONITORING_ENABLED=true)
      path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: weyland-apisix
  namespace: weyland
spec:
  selector:
    matchLabels:
      app: weyland-apisix
  endpoints:
    - port: prometheus      # :9091, APISIX prometheus plugin
      path: /apisix/prometheus/metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: weyland-lan-dns
  namespace: weyland
spec:
  selector:
    matchLabels:
      app: weyland-lan-dns
  endpoints:
    - port: metrics         # CoreDNS :9153 prometheus plugin
      path: /metrics
---
# B70 Part 2 — the weyland-tool-server ServiceMonitor was retired: its only series were the B14 guardrail verdicts,
# which now come from weyland-guard's ServiceMonitor. (Tool-server pod cpu/mem still come from cAdvisor.)
# MinIO (ns minio). Metrics served on the API port; requires MINIO_PROMETHEUS_AUTH_TYPE=public
# on the deployment (set there) so this scrape needs no bearer token. Cross-namespace discovery
# works because the stack sets serviceMonitorSelectorNilUsesHelmValues: false (all namespaces).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: minio
  namespace: minio
spec:
  selector:
    matchLabels:
      app: minio
  endpoints:
    - port: api             # :9000
      path: /minio/v2/metrics/cluster
