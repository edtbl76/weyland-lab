# Finance — Macro Indicators dashboard (B113 Phase 1). Reads the FRED macro series landed by the
# datasets_finance domain into TimescaleDB (hypertable `fred_macro` in database `timeseries`), via the
# existing `timescaledb-datasource` (grafana-postgresql, uid efqi782s57fnkf). NOT Prometheus: this is
# business/economic time-series, not infra metrics. The latest+YoY table computes year-over-year in SQL
# (LEFT JOIN LATERAL to the observation nearest 1y before the latest), mirroring the dbt
# mart_macro_indicators shape so the dashboard and the Iceberg mart agree. Provisioned via the
# grafana_dashboard sidecar, same pattern as lakefs-dashboard.yaml. Time range defaults to 10y because
# macro series are long-horizon (fred_macro spans 1919-2026); a metrics-style now-6h would show nothing.
apiVersion: v1
kind: ConfigMap
metadata:
  name: finance-macro-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  finance_macro_grafana_dashboard.json: |-
    {
      "annotations": {"list": [{"builtIn": 1, "datasource": "-- Grafana --", "enable": true, "hide": true, "name": "Annotations & Alerts", "type": "dashboard"}]},
      "editable": true,
      "graphTooltip": 1,
      "title": "Finance — Macro Indicators",
      "uid": "finance-macro",
      "tags": ["finance", "data-mesh", "fred", "macro"],
      "timezone": "browser",
      "time": {"from": "now-10y", "to": "now"},
      "refresh": "",
      "schemaVersion": 39,
      "templating": {"list": []},
      "panels": [
        {"type": "row", "title": "Latest snapshot", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0}},
        {"type": "table", "title": "Macro indicators — latest value & YoY (all 13 FRED series)",
         "datasource": {"type": "grafana-postgresql-datasource", "uid": "efqi782s57fnkf"},
         "gridPos": {"h": 11, "w": 24, "x": 0, "y": 1},
         "fieldConfig": {"defaults": {"custom": {"align": "auto", "filterable": true}},
           "overrides": [
             {"matcher": {"id": "byName", "options": "YoY %"}, "properties": [
               {"id": "unit", "value": "percent"},
               {"id": "custom.cellOptions", "value": {"type": "color-text"}},
               {"id": "thresholds", "value": {"mode": "absolute", "steps": [{"value": -1000000, "color": "red"}, {"value": 0, "color": "green"}]}}]},
             {"matcher": {"id": "byName", "options": "Latest"}, "properties": [{"id": "custom.align", "value": "right"}]},
             {"matcher": {"id": "byName", "options": "Prior yr"}, "properties": [{"id": "custom.align", "value": "right"}]}]},
         "options": {"showHeader": true, "sortBy": [{"displayName": "Series", "desc": false}]},
         "targets": [{"refId": "A", "datasource": {"type": "grafana-postgresql-datasource", "uid": "efqi782s57fnkf"}, "format": "table", "rawQuery": true,
           "rawSql": "SELECT l.series_id AS \"Series\", l.date AS \"Latest date\", l.value AS \"Latest\", p.value AS \"Prior yr\", round((100.0*(l.value-p.value)/NULLIF(p.value,0))::numeric,2) AS \"YoY %\" FROM (SELECT DISTINCT ON (series_id) series_id, date, value FROM fred_macro WHERE value IS NOT NULL ORDER BY series_id, date DESC) l LEFT JOIN LATERAL (SELECT value FROM fred_macro f WHERE f.series_id=l.series_id AND f.value IS NOT NULL AND f.date <= l.date - INTERVAL '1 year' ORDER BY f.date DESC LIMIT 1) p ON true ORDER BY l.series_id"}]},

        {"type": "row", "title": "Rates & yields (%)", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 12}},
        {"type": "timeseries", "title": "Policy & market rates",
         "datasource": {"type": "grafana-postgresql-datasource", "uid": "efqi782s57fnkf"},
         "gridPos": {"h": 9, "w": 24, "x": 0, "y": 13},
         "fieldConfig": {"defaults": {"unit": "percent", "custom": {"drawStyle": "line", "lineWidth": 2, "fillOpacity": 5, "spanNulls": true}}},
         "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["last", "min", "max"]}, "tooltip": {"mode": "multi"}},
         "targets": [
           {"refId": "A", "format": "time_series", "rawQuery": true, "rawSql": "SELECT date::timestamp AS time, value AS \"Fed Funds\" FROM fred_macro WHERE series_id='FEDFUNDS' AND value IS NOT NULL AND $__timeFilter(date) ORDER BY date"},
           {"refId": "B", "format": "time_series", "rawQuery": true, "rawSql": "SELECT date::timestamp AS time, value AS \"2Y Treasury\" FROM fred_macro WHERE series_id='DGS2' AND value IS NOT NULL AND $__timeFilter(date) ORDER BY date"},
           {"refId": "C", "format": "time_series", "rawQuery": true, "rawSql": "SELECT date::timestamp AS time, value AS \"10Y Treasury\" FROM fred_macro WHERE series_id='DGS10' AND value IS NOT NULL AND $__timeFilter(date) ORDER BY date"},
           {"refId": "D", "format": "time_series", "rawQuery": true, "rawSql": "SELECT date::timestamp AS time, value AS \"30Y Mortgage\" FROM fred_macro WHERE series_id='MORTGAGE30US' AND value IS NOT NULL AND $__timeFilter(date) ORDER BY date"},
           {"refId": "E", "format": "time_series", "rawQuery": true, "rawSql": "SELECT date::timestamp AS time, value AS \"Unemployment\" FROM fred_macro WHERE series_id='UNRATE' AND value IS NOT NULL AND $__timeFilter(date) ORDER BY date"}]},

        {"type": "row", "title": "Prices & production (index)", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 22}},
        {"type": "timeseries", "title": "CPI, Core CPI, Industrial Production",
         "datasource": {"type": "grafana-postgresql-datasource", "uid": "efqi782s57fnkf"},
         "gridPos": {"h": 9, "w": 24, "x": 0, "y": 23},
         "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "lineWidth": 2, "fillOpacity": 5, "spanNulls": true}}},
         "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["last", "max"]}, "tooltip": {"mode": "multi"}},
         "targets": [
           {"refId": "A", "format": "time_series", "rawQuery": true, "rawSql": "SELECT date::timestamp AS time, value AS \"CPI (all items)\" FROM fred_macro WHERE series_id='CPIAUCSL' AND value IS NOT NULL AND $__timeFilter(date) ORDER BY date"},
           {"refId": "B", "format": "time_series", "rawQuery": true, "rawSql": "SELECT date::timestamp AS time, value AS \"Core CPI\" FROM fred_macro WHERE series_id='CPILFESL' AND value IS NOT NULL AND $__timeFilter(date) ORDER BY date"},
           {"refId": "C", "format": "time_series", "rawQuery": true, "rawSql": "SELECT date::timestamp AS time, value AS \"Industrial Production\" FROM fred_macro WHERE series_id='INDPRO' AND value IS NOT NULL AND $__timeFilter(date) ORDER BY date"}]},

        {"type": "row", "title": "Output, money & demand ($ Billions)", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 32}},
        {"type": "timeseries", "title": "Real GDP, M2, PCE",
         "datasource": {"type": "grafana-postgresql-datasource", "uid": "efqi782s57fnkf"},
         "gridPos": {"h": 9, "w": 24, "x": 0, "y": 33},
         "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "lineWidth": 2, "fillOpacity": 5, "spanNulls": true}}},
         "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["last", "max"]}, "tooltip": {"mode": "multi"}},
         "targets": [
           {"refId": "A", "format": "time_series", "rawQuery": true, "rawSql": "SELECT date::timestamp AS time, value AS \"Real GDP\" FROM fred_macro WHERE series_id='GDPC1' AND value IS NOT NULL AND $__timeFilter(date) ORDER BY date"},
           {"refId": "B", "format": "time_series", "rawQuery": true, "rawSql": "SELECT date::timestamp AS time, value AS \"M2 money stock\" FROM fred_macro WHERE series_id='M2SL' AND value IS NOT NULL AND $__timeFilter(date) ORDER BY date"},
           {"refId": "C", "format": "time_series", "rawQuery": true, "rawSql": "SELECT date::timestamp AS time, value AS \"PCE\" FROM fred_macro WHERE series_id='PCE' AND value IS NOT NULL AND $__timeFilter(date) ORDER BY date"}]}
      ]
    }
