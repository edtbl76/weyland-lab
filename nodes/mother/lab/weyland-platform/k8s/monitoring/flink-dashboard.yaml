# Flink streaming dashboard (B83) — Apache Flink session cluster in data-mesh. Metrics come from the
# Flink Prometheus reporter scraped as job="weyland-flink-metrics" (~386 series); this is a CURATED
# view of the high-signal operational surface: cluster/manager health, job status + restarts,
# checkpointing, throughput + backpressure, and JVM heap/GC. Job-level series (job_name label) exist
# only while a job runs — validated live against two running jobs (cdc_cdc_demo_live, health_state_risk).
# Provisioned via the grafana_dashboard sidecar, same pattern as vector-stores-grafana-dashboard.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: flink-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  flink_grafana_dashboard.json: |-
    {
      "annotations": {"list": [{"builtIn": 1, "datasource": "-- Grafana --", "enable": true, "hide": true, "name": "Annotations & Alerts", "type": "dashboard"}]},
      "editable": true,
      "graphTooltip": 1,
      "title": "Flink",
      "uid": "flink",
      "tags": ["flink", "streaming", "observability"],
      "timezone": "browser",
      "time": {"from": "now-6h", "to": "now"},
      "refresh": "1m",
      "schemaVersion": 39,
      "templating": {"list": []},
      "panels": [
        {"type": "row", "title": "Cluster Health", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0}},
        {"type": "stat", "title": "Running Jobs", "datasource": {"type": "prometheus", "uid": "prometheus"},
         "gridPos": {"h": 8, "w": 4, "x": 0, "y": 1},
         "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"value": null, "color": "red"}, {"value": 1, "color": "green"}]}}},
         "options": {"colorMode": "background", "graphMode": "area"},
         "targets": [{"expr": "flink_jobmanager_numRunningJobs{job=\"weyland-flink-metrics\"}", "refId": "A"}]},
        {"type": "stat", "title": "Registered TaskManagers", "datasource": {"type": "prometheus", "uid": "prometheus"},
         "gridPos": {"h": 8, "w": 4, "x": 4, "y": 1},
         "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"value": null, "color": "red"}, {"value": 1, "color": "green"}]}}},
         "options": {"colorMode": "background", "graphMode": "area"},
         "targets": [{"expr": "flink_jobmanager_numRegisteredTaskManagers{job=\"weyland-flink-metrics\"}", "refId": "A"}]},
        {"type": "stat", "title": "Task Slots (available / total)", "datasource": {"type": "prometheus", "uid": "prometheus"},
         "gridPos": {"h": 8, "w": 8, "x": 8, "y": 1},
         "fieldConfig": {"defaults": {"unit": "short"}},
         "options": {"colorMode": "value", "graphMode": "none"},
         "targets": [{"expr": "flink_jobmanager_taskSlotsAvailable{job=\"weyland-flink-metrics\"}", "legendFormat": "available", "refId": "A"},
                     {"expr": "flink_jobmanager_taskSlotsTotal{job=\"weyland-flink-metrics\"}", "legendFormat": "total", "refId": "B"}]},
        {"type": "stat", "title": "Job Uptime", "datasource": {"type": "prometheus", "uid": "prometheus"},
         "gridPos": {"h": 8, "w": 8, "x": 16, "y": 1},
         "fieldConfig": {"defaults": {"unit": "ms"}},
         "options": {"colorMode": "value", "graphMode": "area"},
         "targets": [{"expr": "max by (job_name) (flink_jobmanager_job_uptime{job=\"weyland-flink-metrics\"})", "legendFormat": "{{job_name}}", "refId": "A"}]},

        {"type": "row", "title": "Job Health", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 9}},
        {"type": "timeseries", "title": "Job Restarts", "datasource": {"type": "prometheus", "uid": "prometheus"},
         "gridPos": {"h": 8, "w": 24, "x": 0, "y": 10},
         "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "fillOpacity": 10}}},
         "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["last"]}},
         "targets": [{"expr": "max by (job_name) (flink_jobmanager_job_numRestarts{job=\"weyland-flink-metrics\"})", "legendFormat": "{{job_name}}", "refId": "A"}]},

        {"type": "row", "title": "Checkpoints", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 18}},
        {"type": "timeseries", "title": "Completed vs Failed Checkpoints", "datasource": {"type": "prometheus", "uid": "prometheus"},
         "gridPos": {"h": 8, "w": 12, "x": 0, "y": 19},
         "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "fillOpacity": 10}}},
         "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["last"]}},
         "targets": [{"expr": "max by (job_name) (flink_jobmanager_job_numberOfCompletedCheckpoints{job=\"weyland-flink-metrics\"})", "legendFormat": "{{job_name}} completed", "refId": "A"},
                     {"expr": "max by (job_name) (flink_jobmanager_job_numberOfFailedCheckpoints{job=\"weyland-flink-metrics\"})", "legendFormat": "{{job_name}} failed", "refId": "B"}]},
        {"type": "timeseries", "title": "Last Checkpoint Duration", "datasource": {"type": "prometheus", "uid": "prometheus"},
         "gridPos": {"h": 8, "w": 6, "x": 12, "y": 19},
         "fieldConfig": {"defaults": {"unit": "ms"}},
         "targets": [{"expr": "max by (job_name) (flink_jobmanager_job_lastCheckpointDuration{job=\"weyland-flink-metrics\"})", "legendFormat": "{{job_name}}", "refId": "A"}]},
        {"type": "timeseries", "title": "Last Checkpoint Size", "datasource": {"type": "prometheus", "uid": "prometheus"},
         "gridPos": {"h": 8, "w": 6, "x": 18, "y": 19},
         "fieldConfig": {"defaults": {"unit": "bytes"}},
         "targets": [{"expr": "max by (job_name) (flink_jobmanager_job_lastCheckpointSize{job=\"weyland-flink-metrics\"})", "legendFormat": "{{job_name}}", "refId": "A"}]},

        {"type": "row", "title": "Throughput & Backpressure", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 27}},
        {"type": "timeseries", "title": "Records In / Out per second", "datasource": {"type": "prometheus", "uid": "prometheus"},
         "gridPos": {"h": 8, "w": 12, "x": 0, "y": 28},
         "fieldConfig": {"defaults": {"unit": "ops", "custom": {"drawStyle": "line", "fillOpacity": 10}}},
         "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["last", "max"]}},
         "targets": [{"expr": "sum by (job_name) (flink_taskmanager_job_task_numRecordsInPerSecond{job=\"weyland-flink-metrics\"})", "legendFormat": "{{job_name}} in", "refId": "A"},
                     {"expr": "sum by (job_name) (flink_taskmanager_job_task_numRecordsOutPerSecond{job=\"weyland-flink-metrics\"})", "legendFormat": "{{job_name}} out", "refId": "B"}]},
        {"type": "timeseries", "title": "Task Busy & Backpressure (ms/s)", "datasource": {"type": "prometheus", "uid": "prometheus"},
         "gridPos": {"h": 8, "w": 12, "x": 12, "y": 28},
         "fieldConfig": {"defaults": {"unit": "ms", "max": 1000, "custom": {"drawStyle": "line", "fillOpacity": 10}}},
         "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["last", "max"]}},
         "targets": [{"expr": "max by (task_name) (flink_taskmanager_job_task_busyTimeMsPerSecond{job=\"weyland-flink-metrics\"})", "legendFormat": "{{task_name}} busy", "refId": "A"},
                     {"expr": "max by (task_name) (flink_taskmanager_job_task_backPressuredTimeMsPerSecond{job=\"weyland-flink-metrics\"})", "legendFormat": "{{task_name}} backpressure", "refId": "B"}]},

        {"type": "row", "title": "JVM (managers)", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 36}},
        {"type": "timeseries", "title": "JVM Heap Used", "datasource": {"type": "prometheus", "uid": "prometheus"},
         "gridPos": {"h": 8, "w": 12, "x": 0, "y": 37},
         "fieldConfig": {"defaults": {"unit": "bytes", "custom": {"drawStyle": "line", "fillOpacity": 10}}},
         "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["last"]}},
         "targets": [{"expr": "flink_jobmanager_Status_JVM_Memory_Heap_Used{job=\"weyland-flink-metrics\"}", "legendFormat": "jobmanager", "refId": "A"},
                     {"expr": "sum(flink_taskmanager_Status_JVM_Memory_Heap_Used{job=\"weyland-flink-metrics\"})", "legendFormat": "taskmanager", "refId": "B"}]},
        {"type": "timeseries", "title": "GC Time (ms/s)", "datasource": {"type": "prometheus", "uid": "prometheus"},
         "gridPos": {"h": 8, "w": 12, "x": 12, "y": 37},
         "fieldConfig": {"defaults": {"unit": "ms", "custom": {"drawStyle": "line", "fillOpacity": 10}}},
         "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["last", "max"]}},
         "targets": [{"expr": "flink_jobmanager_Status_JVM_GarbageCollector_All_TimeMsPerSecond{job=\"weyland-flink-metrics\"}", "legendFormat": "jobmanager", "refId": "A"},
                     {"expr": "sum(flink_taskmanager_Status_JVM_GarbageCollector_All_TimeMsPerSecond{job=\"weyland-flink-metrics\"})", "legendFormat": "taskmanager", "refId": "B"}]}
      ]
    }
