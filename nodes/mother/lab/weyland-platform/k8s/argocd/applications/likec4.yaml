# B64 — LikeC4 standalone architecture explorer (likec4.weyland.lab). Auto-sync (new clean app).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: likec4
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/edtbl76/weyland-lab.git
    targetRevision: main
    path: nodes/mother/lab/weyland-platform/k8s/likec4
  destination:
    server: https://kubernetes.default.svc
    namespace: weyland
  syncPolicy:
    automated: { selfHeal: true, prune: true }
