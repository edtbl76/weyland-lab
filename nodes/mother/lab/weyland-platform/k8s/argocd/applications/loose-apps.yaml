# Bucket ① apps whose manifests are LOOSE files in k8s/ root → Application at the k8s/ dir, recurse:false +
# an include-glob so each owns only its files. AUTO-SYNC (selfHeal + prune) — git matches what's running.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/edtbl76/weyland-lab.git
    targetRevision: main
    path: nodes/mother/lab/weyland-platform/k8s
    directory:
      recurse: false
      include: '{postgres.yaml,postgres-pvc.yaml,postgres-backup.yaml}'  # B69: +full-instance pg_dumpall backup
  destination:
    server: https://kubernetes.default.svc
    namespace: weyland
  syncPolicy:
    automated: { selfHeal: true, prune: true }
