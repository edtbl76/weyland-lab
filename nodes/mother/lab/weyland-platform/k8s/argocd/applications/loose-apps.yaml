# Bucket ① apps whose manifests are LOOSE files in k8s/ root (not their own subdir) → Application points at the
# k8s/ dir with recurse:false + an include-glob so each owns only its files. OBSERVE-ONLY (no automated sync).
# The skipped loose files (headlamp-*, coredns-lan, rbac-default-sa-noautomount — bucket ③) are simply not
# included by any glob, so nothing manages them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/edtbl76/weyland-lab.git
    targetRevision: main
    path: nodes/mother/lab/weyland-platform/k8s
    directory:
      recurse: false
      include: '{postgres.yaml,postgres-pvc.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: weyland
---
