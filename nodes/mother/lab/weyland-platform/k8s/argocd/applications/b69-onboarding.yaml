---
# Istio MESH CONFIG (STRICT-mTLS PeerAuthentication, Telemetry, Kiali, VirtualServices, PodMonitor). MANUAL-first
# (mesh blast radius) + ServerSideApply for the CRD-bearing / large objects + prune:false so Argo NEVER deletes a
# mesh resource. The install CR (istio-install.yaml, IstioOperator) is EXCLUDED — istioctl-managed, not Argo's.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/edtbl76/weyland-lab.git
    targetRevision: main
    path: nodes/mother/lab/weyland-platform/k8s/istio
    directory:
      recurse: false
      exclude: 'istio-install.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy: # manual — review diff first; then add `automated: { selfHeal: true, prune: false }`
    syncOptions:
      - ServerSideApply=true
---
# B69 Wave 2 — sealed-secrets controller (Bitnami helm chart). INERT until we commit SealedSecret CRs. SSA for
# the SealedSecret CRD. Once running, `kubeseal` (defaults → kube-system / sealed-secrets-controller) seals the
# ~45 imperative secrets into git-safe SealedSecret CRs (only THIS controller's private key can decrypt them).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://bitnami-labs.github.io/sealed-secrets
      chart: sealed-secrets
      targetRevision: 2.18.6
      helm:
        releaseName: sealed-secrets
        valueFiles:
          - $values/nodes/mother/lab/weyland-platform/k8s/sealed-secrets/sealed-secrets-values.yaml
    - repoURL: https://github.com/edtbl76/weyland-lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { selfHeal: true, prune: true }
    syncOptions:
      - ServerSideApply=true

