# B69 — Argo-onboard the dirs/files that were reconciled by 0 Applications (silent-drift gaps). Discovered by
# the app-of-apps like every other file in this dir. The LOAD-BEARING ones (coredns DNS, istio mesh) are
# MANUAL-sync first: review the Argo diff (git vs live) before enforcing, then flip to `automated` once they
# match. The safe ones (rag-index, rbac, code-quality) are auto-sync.
---
# coredns-custom — LOAD-BEARING LAN DNS (weyland.lab → LAN resolver; kube-system ConfigMap). MANUAL-first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coredns-custom
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/edtbl76/weyland-lab.git
    targetRevision: main
    path: nodes/mother/lab/weyland-platform/k8s
    directory:
      recurse: false
      include: 'coredns-custom.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy: {} # manual — review diff, then add `automated: { selfHeal: true, prune: true }`
---
# coredns-lan (weyland ns — ConfigMap + Deployment + Service). LOAD-BEARING DNS. MANUAL-first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coredns-lan
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/edtbl76/weyland-lab.git
    targetRevision: main
    path: nodes/mother/lab/weyland-platform/k8s
    directory:
      recurse: false
      include: 'coredns-lan.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: weyland
  syncPolicy: {} # manual — review diff first
---
