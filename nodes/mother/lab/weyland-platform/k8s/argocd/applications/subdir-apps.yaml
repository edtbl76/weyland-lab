# B1.2 — data-mesh L1 storage foundation (Nessie + lakeFS). Secret examples excluded; real secrets out-of-band.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-mesh
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/edtbl76/weyland-lab.git
    targetRevision: main
    path: nodes/mother/lab/weyland-platform/k8s/data-mesh
    directory:
      # flink-pyflink.yaml is a run-once BOUNDED app-mode FlinkDeployment we kubectl-delete after each demo;
      # excluding it keeps the manifest in git but stops selfHeal from resurrecting (and re-running) it.
      exclude: '{*secret.example.yaml,flink-pyflink.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: data-mesh
  syncPolicy:
    automated: { selfHeal: true, prune: true }
    syncOptions: [CreateNamespace=true]
---
# B1.3 — raw manifests for the OpenSearch playground ns (forward-auth Middleware + Dashboards Ingress).
# *-values.yaml are Helm values (consumed by the opensearch / opensearch-dashboards Helm apps) — exclude them.
apiVersion: argoproj.io/v1alpha1
