# Bucket ① raw-manifest apps in their own k8s/ subdir → one Application each. AUTO-SYNC (selfHeal + prune):
# git is the source of truth; selfHeal reverts out-of-band drift, prune removes resources deleted from git.
# Safe for these — git matches what's running (only the Argo tracking annotation differs). No resources-finalizer.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dagster
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/edtbl76/weyland-lab.git
    targetRevision: main
    path: nodes/mother/lab/weyland-platform/k8s/dagster
  destination:
    server: https://kubernetes.default.svc
    namespace: weyland
  syncPolicy:
    automated: { selfHeal: true, prune: true }
