# Bucket ① raw-manifest apps that live in their own k8s/ subdir → one Application each, OBSERVE-ONLY (no
# automated sync) for the brownfield-safe onboard. They'll show Healthy + OutOfSync (just the tracking
# annotation, like open-webui); flip each to auto-sync once you've eyeballed the diff. No resources-finalizer.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dagster
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/edtbl76/weyland-lab.git
    targetRevision: main
    path: nodes/mother/lab/weyland-platform/k8s/dagster
  destination:
    server: https://kubernetes.default.svc
    namespace: weyland
---
