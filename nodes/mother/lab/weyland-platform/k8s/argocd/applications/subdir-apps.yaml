# B1.2 — data-mesh L1 storage foundation (Nessie + lakeFS). Secret examples excluded; real secrets out-of-band.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-mesh
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/edtbl76/weyland-lab.git
    targetRevision: main
    path: nodes/mother/lab/weyland-platform/k8s/data-mesh
    directory:
      exclude: '*secret.example.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: data-mesh
  syncPolicy:
    automated: { selfHeal: true, prune: true }
    syncOptions: [CreateNamespace=true]
---
# B1.3 — raw manifests for the OpenSearch playground ns (forward-auth Middleware + Dashboards Ingress).
# *-values.yaml are Helm values (consumed by the opensearch / opensearch-dashboards Helm apps) — exclude them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opensearch-extras
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/edtbl76/weyland-lab.git
    targetRevision: main
    path: nodes/mother/lab/weyland-platform/k8s/opensearch
    directory:
      exclude: '*-values.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: opensearch
  syncPolicy:
    automated: { selfHeal: true, prune: true }
    syncOptions: [CreateNamespace=true]
---
# Gatekeeper constraints (L5 Slice B) — the dryrun ConstraintTemplates + Constraints. Dir-sync of k8s/gatekeeper
# EXCLUDING the helm values file (consumed by the gatekeeper helm app). Argo retries through the apply-order race
# (constraint CRs need the chart's CRDs + the template-generated constraint CRDs) until it converges.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatekeeper-constraints
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/edtbl76/weyland-lab.git
    targetRevision: main
    path: nodes/mother/lab/weyland-platform/k8s/gatekeeper
    directory:
      exclude: '*-values.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: gatekeeper-system
  syncPolicy:
    automated: { selfHeal: true, prune: true }
    syncOptions: [ServerSideApply=true]
---
# cube — B1.7 L6 semantic/metrics layer (data-mesh). Adopts the kubectl-applied Cube; git = source of truth.
