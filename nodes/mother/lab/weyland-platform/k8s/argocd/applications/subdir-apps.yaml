# Istio MESH CONFIG (STRICT-mTLS PeerAuthentication, Telemetry, Kiali, VirtualServices, PodMonitor). MANUAL-first
# (mesh blast radius) + ServerSideApply. Install CR (istio-install.yaml, IstioOperator) EXCLUDED — istioctl-managed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/edtbl76/weyland-lab.git
    targetRevision: main
    path: nodes/mother/lab/weyland-platform/k8s/istio
    directory:
      exclude: 'istio-install.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy: # manual — review diff first; then add `automated: { selfHeal: true, prune: false }`
    syncOptions:
      - ServerSideApply=true
---
# B69 Wave 2 — applies the committed SealedSecret CRs (k8s/sealed-secrets/sealed/). Each self-specifies its ns;
# the controller decrypts each into its real Secret. prune:false — never auto-delete a live Secret.
apiVersion: argoproj.io/v1alpha1
