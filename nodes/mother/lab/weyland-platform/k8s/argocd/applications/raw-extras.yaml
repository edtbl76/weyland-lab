# Raw manifests that share the helm dirs → their own Applications (include/exclude globs so they don't collide
# with the helm Applications, which only consume *-values.yaml). AUTO-SYNC (selfHeal + prune) — git = running.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-rules
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/edtbl76/weyland-lab.git
    targetRevision: main
    path: nodes/mother/lab/weyland-platform/k8s/loki
    directory:
      recurse: false
      include: 'loki-rules-configmap.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { selfHeal: true, prune: true }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-extras
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/edtbl76/weyland-lab.git
    targetRevision: main
    path: nodes/mother/lab/weyland-platform/k8s/monitoring
    directory:
      recurse: false
      exclude: 'kube-prometheus-stack-values.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { selfHeal: true, prune: true }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opencost-ingress
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/edtbl76/weyland-lab.git
    targetRevision: main
    path: nodes/mother/lab/weyland-platform/k8s/opencost
    directory:
      recurse: false
      include: 'opencost-ingress.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: opencost
  syncPolicy:
    automated: { selfHeal: true, prune: true }
