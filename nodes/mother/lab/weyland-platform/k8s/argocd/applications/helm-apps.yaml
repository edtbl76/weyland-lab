# KEDA + its HTTP add-on were installed with DEFAULT values (no values file in the repo) → chart-only, single source.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    targetRevision: 2.20.1
    helm:
      releaseName: keda
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda-http-add-on
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda-add-ons-http
    targetRevision: 0.15.0
    helm:
      releaseName: http-add-on        # live release name
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
