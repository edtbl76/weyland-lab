# Flink Kubernetes Operator (B83 — streaming-processing tier). Chart from Apache's ARCHIVE (permanent — every
# release stays; downloads.apache.org only serves CURRENT and 404s old versions, which bit us once). Operator 1.13
# (recent, supports the Flink 1.20 runtime we deploy in step 2 — kept on 1.20 for Iceberg-connector maturity;
# newest operators 1.14/1.15 lean Flink 2.x). Webhook OFF (no cert-manager) via the values file. Installs the
# FlinkDeployment / FlinkSessionJob CRDs the session cluster + jobs use.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flink-operator
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://archive.apache.org/dist/flink/flink-kubernetes-operator-1.13.0/
      chart: flink-kubernetes-operator
      targetRevision: 1.13.0
      helm:
        releaseName: flink-kubernetes-operator
        valueFiles:
          - $values/nodes/mother/lab/weyland-platform/k8s/flink/flink-operator-values.yaml
    - repoURL: https://github.com/edtbl76/weyland-lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: data-mesh
  # Same CRD default-field drift as gatekeeper: the chart declares `spec.preserveUnknownFields: false` (apiserver
  # strips it). Ignore it. (If a flink CRD drifts on another field, add its jq path here.)
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - '.spec.preserveUnknownFields'
  syncPolicy:
    automated: { selfHeal: true, prune: true }
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true

