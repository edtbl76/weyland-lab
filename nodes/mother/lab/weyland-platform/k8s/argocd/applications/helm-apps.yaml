# KEDA + its HTTP add-on were installed with DEFAULT values (no values file in the repo) → chart-only, single source.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    targetRevision: 2.20.1
    helm:
      releaseName: keda
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    syncOptions:
      - ServerSideApply=true       # the scaledjobs.keda.sh CRD is what hit the 256KB annotation cap
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda-http-add-on
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda-add-ons-http
    targetRevision: 0.15.0
    helm:
      releaseName: http-add-on
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
---
# B1.3 — exposed OpenSearch 3.x search/log playground (standalone; NOT used by DataHub).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opensearch
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://opensearch-project.github.io/helm-charts
      chart: opensearch
      targetRevision: 3.7.0
      helm:
        releaseName: opensearch
        valueFiles:
          - $values/nodes/mother/lab/weyland-platform/k8s/opensearch/opensearch-values.yaml
    - repoURL: https://github.com/edtbl76/weyland-lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: opensearch
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
