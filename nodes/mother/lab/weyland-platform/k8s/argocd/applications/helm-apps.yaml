# dbt-native BI (metrics/explores from the dbt project over the marts) — complements Superset's ad-hoc SQL.
# Metadata in the lab Postgres `lightdash` DB (bundled PG off); browserless/NATS off for the tight node.
# Prereqs (out-of-band): the `lightdash` DB/role on weyland-postgres + Secret `lightdash-secret` in data-mesh.
# Post-deploy: connect the GitHub dbt project + Trino in the UI — see runbooks/lightdash.md.
