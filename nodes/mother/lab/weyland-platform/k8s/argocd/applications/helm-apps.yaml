# Bucket ② helm-installed apps → Argo multi-source Applications (chart from its helm repo + values from git via
# $values). Chart versions pinned to what's DEPLOYED (helm list -A); releaseName pinned to the LIVE release name
# so chart-templated resource names match. AUTO-SYNC (selfHeal + prune) as of B1.3 — the B58 Helm→Argo
# migration has settled, so push = deploy (no manual sync). Charts are git-pinned, so auto-sync only acts on a pushed change.
#
# ServerSideApply=true on ALL of them: several charts bundle LARGE CRDs (keda `scaledjobs`, kube-prometheus-stack
# `prometheuses`/`alertmanagers`). Client-side apply stuffs the whole CRD into the last-applied-configuration
# annotation → exceeds the 256KB cap → "metadata.annotations: Too long". SSA avoids that annotation entirely.
#
# (History: these were observe-only post-B58 because the Helm→Argo metadata migration showed a big diff; settled now.)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 6.55.0
      helm:
        releaseName: loki
        valueFiles:
          - $values/nodes/mother/lab/weyland-platform/k8s/loki/loki-values.yaml
    - repoURL: https://github.com/edtbl76/weyland-lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { selfHeal: true, prune: true }
    syncOptions:
      - ServerSideApply=true
