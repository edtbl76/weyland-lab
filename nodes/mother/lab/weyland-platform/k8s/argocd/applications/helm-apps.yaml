# Bucket ② helm-installed apps → Argo multi-source Applications (chart from its helm repo + values from git via
# $values). Chart versions pinned to what's DEPLOYED (helm list -A); releaseName pinned to the LIVE release name
# so chart-templated resource names match (else Argo would create duplicates). OBSERVE-ONLY. NOTE: these show a
# BIGGER diff than the raw apps — adopting a release from Helm→Argo swaps Helm's `managed-by` metadata for Argo's
# tracking, so expect more than just the tracking annotation. Safe under observe-only; review before syncing.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 6.55.0
      helm:
        releaseName: loki
        valueFiles:
          - $values/nodes/mother/lab/weyland-platform/k8s/loki/loki-values.yaml
    - repoURL: https://github.com/edtbl76/weyland-lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
---
