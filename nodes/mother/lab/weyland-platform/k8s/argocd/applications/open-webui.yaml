# First Argo CD onboard — open-webui (chat UI, weyland ns). Started observe-only (manual sync) as the brownfield-safe
# proof; now AUTOMATED with selfHeal + prune (below). Source = the public weyland-lab repo (Argo pulls — LAN-safe).
# selfHeal reverts a manual scale-down — a restore pauses auto-sync first (docs/runbooks/open-webui.md § Restore).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-webui
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/edtbl76/weyland-lab.git
    targetRevision: main
    path: nodes/mother/lab/weyland-platform/k8s/open-webui
  destination:
    server: https://kubernetes.default.svc
    namespace: weyland
  syncPolicy:
    automated:        # the first onboard — adopted + flipped to auto-sync live; git now matches that state.
      selfHeal: true  # revert out-of-band drift back to git
      prune: true     # remove resources deleted from git
