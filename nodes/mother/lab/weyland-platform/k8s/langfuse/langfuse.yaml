# B103 — Langfuse v3 (LLM observability). REUSE-FIRST deploy: only the two STATELESS compute pods (web + worker)
# live here; every stateful plane is an EXISTING lab service — Postgres (weyland-postgres, transactional),
# ClickHouse (clickhouse.data-mesh, the trace/observation/score OLAP firehose, a dedicated `langfuse` DB),
# Valkey (valkey.data-mesh, the ingestion queue), MinIO (the `langfuse` bucket, durable event landing zone).
# Marginal RAM ≈ web+worker only (~0.5Gi req / ~1.8Gi limit) — the 6-8Gi "won't schedule" note assumed a
# DEDICATED ClickHouse+PG+Redis stack; reuse voids it.
#
# Meshed (sidecar) so the app reaches STRICT-mTLS weyland-postgres (same ns). ClickHouse/Valkey/MinIO are
# reached cross-ns; Istio auto-mTLS falls back to plaintext for those un-sidecar'd services. Single web replica
# owns migrations (Prisma→Postgres + golang-migrate→ClickHouse) on boot — holdApplicationUntilProxyStarts so the
# sidecar is up before Prisma dials Postgres. UI behind Keycloak forward-auth at the edge (langfuse.weyland.lab);
# Langfuse's own NextAuth login sits behind that (first-registered user = owner, LAN-only).
# Config split: non-secret env → ConfigMap; passwords/keys → SealedSecret langfuse-secret (envFrom both).
apiVersion: v1
kind: ConfigMap
metadata:
  name: langfuse-config
  namespace: weyland
data:
  # --- ClickHouse (dedicated `langfuse` DB in the shared single-node instance) ---
  CLICKHOUSE_URL: http://clickhouse.data-mesh.svc:8123          # HTTP interface (runtime reads/writes)
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse.data-mesh.svc:9000  # native TCP (schema migrations)
  CLICKHOUSE_USER: "default"
  CLICKHOUSE_DB: langfuse
  CLICKHOUSE_CLUSTER_ENABLED: "false"   # single-node — MUST be false or migrations emit ON CLUSTER DDL and fail
  # --- Valkey (ingestion queue / cache) — NO AUTH ---
  # Use a credential-less connection STRING, not REDIS_HOST/REDIS_PORT. With the individual vars, Langfuse's
  # client still issued an AUTH command, which valkey.data-mesh's password-less `default` user rejects with
  # "ERR AUTH called without any password configured" → the queue never connects → worker /api/health 500s.
  # A redis:// URL with no user:pass@ sends no AUTH. (Do NOT add a password to the SHARED data-mesh Valkey.)
  REDIS_CONNECTION_STRING: redis://valkey.data-mesh.svc:6379
  # --- MinIO (event upload — the durable landing zone the worker flushes to ClickHouse) ---
  LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "true"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio.minio.svc:9000
  LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"   # MinIO needs path-style (no vhost buckets)
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: "events/"
  # --- web / misc ---
  NEXTAUTH_URL: https://langfuse.weyland.lab
  HOSTNAME: "0.0.0.0"
  PORT: "3000"
  TELEMETRY_ENABLED: "false"            # $0 LAN lab — no phone-home
  LANGFUSE_CSP_ENFORCE_HTTPS: "true"    # TLS terminates at Traefik; enforce https in CSP
  # V8 old-space ceiling — unset, V8 derives this from the cgroup limit and aborted (SIGABRT/134) near ~384MB
  # under the old 768Mi limit during the boot init spike. Pin it explicitly, ~1GB heap under a 1536Mi limit
  # (leaves ~512Mi for non-heap/buffers). Applies to both web + worker (both are Node).
  NODE_OPTIONS: "--max-old-space-size=1024"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-web
  namespace: weyland
  labels:
    app: langfuse-web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: langfuse-web
  template:
    metadata:
      labels:
        app: langfuse-web
        sidecar.istio.io/inject: "true"   # STRICT Postgres
      annotations:
        # web migrates on boot → hold the app until the sidecar is ready so Prisma's first Postgres dial is meshed
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
    spec:
      containers:
        - name: langfuse
          # nosemgrep: yaml.kubernetes.security.run-as-non-root.run-as-non-root
          image: langfuse/langfuse:3   # major-floating; pin to the resolved tag after the first green deploy
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef: { name: langfuse-config }
            - secretRef: { name: langfuse-secret }
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1536Mi   # V8 heap pinned to 1024 via NODE_OPTIONS; +512Mi non-heap headroom
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-worker
  namespace: weyland
  labels:
    app: langfuse-worker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: langfuse-worker
  template:
    metadata:
      labels:
        app: langfuse-worker
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: langfuse-worker
          # nosemgrep: yaml.kubernetes.security.run-as-non-root.run-as-non-root
          image: langfuse/langfuse-worker:3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          # Worker binds PORT (3000, inherited from the shared ConfigMap), NOT its 3030 default — probe + port
          # must match 3000 or istio's pilot-agent proxies the probe to a dead 3030 and returns HTTP 500.
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef: { name: langfuse-config }
            - secretRef: { name: langfuse-secret }
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1536Mi   # worker does the heavier ClickHouse batch flushes; same V8 ceiling as web
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse
  namespace: weyland
  labels:
    app: langfuse-web
spec:
  type: ClusterIP
  selector:
    app: langfuse-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: langfuse
  namespace: weyland
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: weyland-traefik-forward-auth@kubernetescrd
spec:
  tls:
    - hosts:
        - langfuse.weyland.lab
      secretName: weyland-wildcard-tls
  rules:
    - host: langfuse.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: langfuse
                port:
                  number: 3000
