# datahub-mcp — B17+B19 Phase 3, MCP server #6 (final). Official acryldata/mcp-server-datahub (built locally — no
# official HTTP image) exposing the DataHub catalog: metadata search + lineage traversal as MCP tools. FastMCP-based,
# HTTP transport on :8000 (FastMCP default path /mcp/). Unmeshed — DataHub GMS (ns data-mesh) is PERMISSIVE mesh.
#
# READ-ONLY BY DEFAULT: mutation/user/data-quality write tools are DISABLED unless TOOLS_IS_MUTATION_ENABLED=true
# (left unset) — confirmed by the server log "Mutation Tools DISABLED".
#
# No --host/--port flag (FastMCP): bind + port come from FASTMCP_HOST/FASTMCP_PORT (default 127.0.0.1 → force 0.0.0.0).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datahub-mcp
  namespace: weyland
  labels: { app: datahub-mcp, part-of: mcp-fleet }
spec:
  replicas: 1
  selector:
    matchLabels: { app: datahub-mcp }
  template:
    metadata:
      labels: { app: datahub-mcp }
    spec:
      containers:
        - name: datahub-mcp
          image: registry.weyland.lab/mcp-server-datahub:0.11   # 0.11 (2026-10-27, later) = 0.10 + Authlib 1.9.1 (empty-HMAC-key JWS forgery) + dnspython 2.9.0. 0.10 (2026-10-27) = 0.9 + Authlib 1.9.0 (GHSA-6v38-4h7w-rj9h, critical). 0.9 (2026-10-25, B227 follow-on) = 0.8 + fastmcp/fastmcp-slim 3.4.10 (GHSA-7xgj-8392-5q4r). 0.8 (2026-10-22, later) = 0.7 + opentelemetry-api 1.45.1 (GHSA-xcq7-p3pf-p88h). 0.7 (2026-10-22) = 0.6 with certifi 2026.10.19 (GHSA-6q48-6c7w-9gw2); still package 0.6.0. 0.6 (2026-10-19, B231) = 0.5 with aiohttp 3.14.5 (GHSA-2g87-pp6c-29x5, GHSA-5wr8-gcqf-gqf3). 0.5 (2026-10-16, B214) = 0.4 with PyJWT 2.15.0 (GHSA-42vr-xj54-vc7v, GHSA-x33g-cr3x-6449). 0.4 (2026-10-16) = 0.3's exact 117 packages, now pinned in requirements.txt. 0.3 = mcp-server-datahub 0.6.0 + mcp 1.30.0 — keeps `--transport http` (0.7.x dropped it → 0.2 crashlooped) AND gets the mcp-1.30 session-crash fix. Runtime-verified. Rebuild from services/mcp-server-datahub/Dockerfile.
          args: ["--transport", "http"]
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - { name: FASTMCP_HOST, value: 0.0.0.0 }     # FastMCP defaults to 127.0.0.1 → unreachable in-pod
            - { name: FASTMCP_PORT, value: "8000" }
            - { name: DATAHUB_GMS_URL, value: http://datahub-datahub-gms.data-mesh.svc.cluster.local:8080 }
            - name: DATAHUB_GMS_TOKEN
              valueFrom:
                secretKeyRef: { name: datahub-token, key: token }
          readinessProbe:
            tcpSocket: { port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8000 }
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { memory: 128Mi, cpu: 25m }
            limits: { memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: datahub-mcp
  namespace: weyland
  labels: { app: datahub-mcp, part-of: mcp-fleet }
spec:
  type: ClusterIP
  selector: { app: datahub-mcp }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
