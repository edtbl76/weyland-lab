# k8s-mcp — B17+B19 Phase 3, MCP server #3. containers/kubernetes-mcp-server (Red Hat) exposing cluster READ state
# (pods/deployments/events/…) as MCP tools. streamable-http on :8080/mcp.
#
# READ-ONLY BY CONSTRUCTION (defense-in-depth):
#   1. RBAC — its own ServiceAccount `k8s-mcp` bound to the built-in **view** ClusterRole (get/list/watch only, and
#      view EXCLUDES Secrets → an agent can't read secrets), PLUS the supplemental `k8s-mcp-crd-read` ClusterRole
#      (get/list/watch on argocd Applications + Prometheus Operator CRDs, which `view` does not aggregate). Both are
#      read-only; the API server denies any write regardless of the tool.
#   2. Server — the `--read-only` flag disables all write tools.
# The pod auto-uses its in-cluster SA token (same SA the RBAC targets — do NOT disable automount).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-mcp
  namespace: weyland
  labels: { app: k8s-mcp, part-of: mcp-fleet }
---
# Cluster-wide READ. `view` is the built-in read-only role (get/list/watch; no secrets, no writes).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-mcp-view
  labels: { app: k8s-mcp, part-of: mcp-fleet }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: k8s-mcp
    namespace: weyland
---
# Supplemental READ on CRDs the built-in `view` role does not aggregate — argocd Applications (sync/health) and
# the Prometheus Operator CRDs (rules/monitors). get/list/watch ONLY, so it is still read-only and the
# defense-in-depth holds (verbs are read-only AND the server runs `--read-only`). Added 2026-09-15 so the fleet
# MCP can inspect Argo app health + PrometheusRules directly instead of falling back to the operator's kubeconfig.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-mcp-crd-read
  labels: { app: k8s-mcp, part-of: mcp-fleet }
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "applicationsets", "appprojects"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheusrules", "servicemonitors", "podmonitors", "probes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-mcp-crd-read
  labels: { app: k8s-mcp, part-of: mcp-fleet }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-mcp-crd-read
subjects:
  - kind: ServiceAccount
    name: k8s-mcp
    namespace: weyland
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-mcp-config
  namespace: weyland
  labels: { app: k8s-mcp, part-of: mcp-fleet }
data:
  # Upstream moved runtime config from CLI flags to a TOML file. `port` set = streamable-HTTP mode at /mcp on
  # that port; `read_only = true` exposes only tools annotated readOnlyHint (the fleet is read-only by design,
  # the same posture the old `--read-only` flag gave). bind_address 0.0.0.0 so the ClusterIP Service reaches it.
  config.toml: |
    port = "8080"
    bind_address = "0.0.0.0"
    read_only = true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-mcp
  namespace: weyland
  labels: { app: k8s-mcp, part-of: mcp-fleet }
spec:
  replicas: 1
  selector:
    matchLabels: { app: k8s-mcp }
  template:
    metadata:
      labels: { app: k8s-mcp }
    spec:
      serviceAccountName: k8s-mcp
      containers:
        - name: k8s-mcp
          # PINNED by digest — was `:latest`, which drifted 2026-09-22: upstream (containers/kubernetes-mcp-server)
          # removed the `--read-only`/`--port` CLI flags in favour of a TOML config, and the unpinned image pulled
          # that new binary, crashlooping the flag-based args (usage + exit 1, 270 restarts). Bump: repull :latest,
          # confirm `--config` still parses, then update this digest.
          image: ghcr.io/containers/kubernetes-mcp-server@sha256:71d2cf69429874fc972388284e337fd892eabdbaea632ca6dcab3b3bdeb2fec4
          args: ["--config", "/config/config.toml"]   # read-only + HTTP :8080 now live in the TOML (was --read-only --port)
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { memory: 64Mi, cpu: 25m }
            limits: { memory: 192Mi }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
      volumes:
        - name: config
          configMap: { name: k8s-mcp-config }
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-mcp
  namespace: weyland
  labels: { app: k8s-mcp, part-of: mcp-fleet }
spec:
  type: ClusterIP
  selector: { app: k8s-mcp }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
