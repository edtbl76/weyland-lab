# trino-mcp — B17+B19 Phase 3, MCP server #2. tuannvm/mcp-trino (Go) exposing the lakehouse (Trino: iceberg.* + dbt
# marts) as MCP query/discovery tools. Connects to Trino directly as its own `mcp` login over HTTPS (B233, 2026-10-23;
# it used the trino-noauth proxy before). Unmeshed — Trino's sidecar is PERMISSIVE, so the TLS connection passes.
#
# READ-ONLY BY CONSTRUCTION: TRINO_USER=mcp, and Ranger (Trino authz) is DEFAULT-DENY — `mcp` can do ONLY what a Ranger
# policy grants (select/show), never write. NOT the `dbt` user (which can write iceberg.dbt). If a query returns
# "Access Denied", grant `mcp` select+show in Ranger (ranger.weyland.lab) — or confirm the existing `public` grant covers it.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-mcp
  namespace: weyland
  labels: { app: trino-mcp, part-of: mcp-fleet }
spec:
  replicas: 1
  selector:
    matchLabels: { app: trino-mcp }
  template:
    metadata:
      labels: { app: trino-mcp }
    spec:
      # mcp-trino tests the Trino connection ONCE at startup and exits 1 if it fails ("Failed to connect to Trino ...
      # connection refused"), with no retry. So any moment the Trino path is down while this pod starts — a Trino OOM
      # restart, or the 2026-09-29 05:14 UTC event that restarted 35 containers at once, trino-noauth-proxy included —
      # became a CrashLoopBackOff (24 restarts in 37 days). This init container waits until Trino reports it is serving
      # (`"starting":false` on /v1/info, on the same HTTPS port the server uses since B233; /v1/info needs no login), so a
      # blip means waiting in Init, not crash-looping. Once running, the server survives Trino outages (queries fail, the
      # process stays up). BusyBox wget verifies TLS and reads SSL_CERT_FILE (proven 2026-10-23: the lab CA accepted;
      # no CA, or a wrong hostname, refused).
      initContainers:
        - name: wait-for-trino
          image: alpine:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              until wget -q -T 5 -O- https://trino.data-mesh.svc.cluster.local:8443/v1/info 2>/dev/null | grep -q '"starting":false'; do
                echo "waiting for Trino to be ready"; sleep 5
              done
              echo "Trino ready"
          env:
            - { name: SSL_CERT_FILE, value: /etc/weyland-ca/rootCA.pem }
          volumeMounts:
            - { name: weyland-ca, mountPath: /etc/weyland-ca, readOnly: true }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { memory: 8Mi, cpu: 5m }
            limits: { memory: 32Mi }
      containers:
        - name: trino-mcp
          image: ghcr.io/tuannvm/mcp-trino:4.3.1   # pinned (ghcr tag is 4.3.1, no "v")
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: MCP_TRANSPORT, value: http }        # streamable-http on :8080/mcp
            - { name: MCP_HOST, value: 0.0.0.0 }          # default is localhost → unreachable in-pod without this
            - { name: MCP_PORT, value: "8080" }
            - { name: OAUTH_ENABLED, value: "false" }      # no JWT for trusted in-cluster use
            # B233 (2026-10-23): Trino directly, as the `mcp` login over HTTPS (was the trino-noauth proxy). The binary has
            # no CA option; Go reads SSL_CERT_FILE for its trust roots, and this process only dials Trino, so the lab CA
            # alone is the right root set. Proven against a throwaway Trino 468: with the CA `select current_user` = mcp;
            # without it "tls: failed to verify certificate". TRINO_SSL_INSECURE stays false.
            - { name: TRINO_HOST, value: trino.data-mesh.svc.cluster.local }
            - { name: TRINO_PORT, value: "8443" }
            - { name: TRINO_SCHEME, value: https }
            - { name: TRINO_SSL, value: "true" }
            - { name: TRINO_SSL_INSECURE, value: "false" }
            - { name: SSL_CERT_FILE, value: /etc/weyland-ca/rootCA.pem }
            - name: TRINO_USER                             # read-only identity (Ranger default-deny → grant select/show only)
              valueFrom: { secretKeyRef: { name: trino-mcp, key: username } }
            - name: TRINO_PASSWORD
              valueFrom: { secretKeyRef: { name: trino-mcp, key: password } }
            - { name: TRINO_CATALOG, value: iceberg }
          volumeMounts:
            - { name: weyland-ca, mountPath: /etc/weyland-ca, readOnly: true }   # B233
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { memory: 64Mi, cpu: 25m }
            # Limit raised 128Mi -> 256Mi (2026-08-22): OOMKilled 2026-08-21 at 104Mi steady-state — 81% of the
            # old ceiling. Same reasoning as postgres-mcp: cgroup OOM, not node pressure; request unchanged.
            limits: { memory: 256Mi }
      volumes:
        - name: weyland-ca
          secret: { secretName: weyland-mkcert-ca, items: [{ key: rootCA.pem, path: rootCA.pem }] }
---
apiVersion: v1
kind: Service
metadata:
  name: trino-mcp
  namespace: weyland
  labels: { app: trino-mcp, part-of: mcp-fleet }
spec:
  type: ClusterIP
  selector: { app: trino-mcp }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
