# B26 — LiteLLM secrets. DO NOT COMMIT REAL KEYS. Template only.
# Create the real secret from a file (no shell wrapping):
#   /tmp/litellm.env  with three lines:
#     GEMINI_API_KEY=...
#     OPENROUTER_API_KEY=...
#     LITELLM_MASTER_KEY=<any random string Hermes presents to the proxy>
#   kubectl create secret generic litellm-secrets -n weyland --from-env-file=/tmp/litellm.env
# Keys: Gemini -> aistudio.google.com/apikey (free, no billing) · OpenRouter -> openrouter.ai/keys
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: weyland
type: Opaque
stringData:
  GEMINI_API_KEY: REPLACE_ME_DO_NOT_COMMIT
  OPENROUTER_API_KEY: REPLACE_ME_DO_NOT_COMMIT
  LITELLM_MASTER_KEY: REPLACE_ME_DO_NOT_COMMIT
