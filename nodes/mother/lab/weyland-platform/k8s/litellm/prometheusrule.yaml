# B26 — off-LAN hosted-model egress alerts. Lives in `monitoring` ns with release:monitoring
# (kube-prometheus-stack ruleSelector). Routes to the Weyland Alerts Telegram chat (B5 P2a).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: litellm-egress
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: litellm-egress
      rules:
        # LiteLLMEgressEnabled (gate-open: fired whenever replicas > 0) was REMOVED 2026-09-25. LiteLLM is the
        # permanent agentic lane (gateway-lane-separation) and has run for 100+ days, so a "the valve is open"
        # alert was lit permanently — one of ~12 standing warnings that buried 13 days of no MinIO backup. The
        # valve is still there (valve.sh); what guards the $0 budget is SPEND, below. `./valve.sh status` answers
        # "is it open?" on demand. (weyland-operator's INCIDENT_SKIP_ALERTS still names it — harmless, never fires.)
        # Spend: metric name CONFIRMED from /metrics (B55): litellm_spend_metric_total (counter; the series
        # materializes once a request logs spend). Threshold $5/24h (2026-08-04): the weyland-operator runs LOCAL
        # gpt-oss:20b as its primary brain and Haiku only as a HEALTH FAILOVER, so steady-state paid spend is ≈ $0.
        # Sustained spend now means either the local engine (rogueone/Ollama) has been DOWN long enough that Haiku
        # carried real load, or a route meant to be free is hitting a paid model — both worth a look.
        - alert: LiteLLMSpendObserved
          expr: increase(litellm_spend_metric_total[24h]) > 5
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "LiteLLM reported > $5 spend in 24h (operator Haiku should be ~$0 — failover or misroute?)"
            description: "The operator's Haiku is failover-only (local gpt-oss primary). Sustained spend suggests rogueone/Ollama has been unavailable (check operator_brain_selected_total{brain=\"haiku\"}) or a free route hit a paid model — check LiteLLM logs."
