# B26 — LiteLLM egress proxy; the cut-off valve scales this to 0 (see valve.sh).
# B234 (2026-10-30): no longer stateless — virtual keys (per-app keys, scoped to aliases) + spend logs live in the
# `litellm` database on core Postgres (DATABASE_URL, SealedSecret litellm-db). Backed up by the core pg_dumpall
# (docs/dr.md). LiteLLM runs its own Prisma migrations at start, so a LiteLLM image bump is also a schema migration.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: weyland
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
        # B234 — core Postgres is STRICT mTLS, so a client must be in the mesh or its connection is reset (opaque
        # ECONNRESET). Inbound stays PERMISSIVE, so un-meshed callers (Traefik, notebooks, rogueone) are unaffected.
        sidecar.istio.io/inject: "true"
      annotations:
        # LiteLLM reads configmap.yaml only at start. Bump this with a config change so Argo rolls the pod itself
        # (no hand `rollout restart`). 2026-10-22: B222 wl-judge -> qwen3:14b, new wl-local lane.
        weyland.lab/litellm-config-rev: "2026-10-30-b234-virtual-keys-db"
    spec:
      containers:
        - name: litellm
          # B69 — pinned to an immutable DIGEST (was the mutable `main-stable` tag, which silently changes under
          # you: the same manifest yields a different image week to week, so a pod restart could swap LiteLLM
          # versions with no git change and no way to tell what was running when something broke).
          # Digest = the multi-arch INDEX digest of main-stable as of 2026-07-20 (not a per-arch manifest, so it
          # still resolves correctly on any node arch).
          # To bump: `docker buildx imagetools inspect ghcr.io/berriai/litellm:main-stable` → copy the Digest,
          # update the line below, push. Deliberate upgrades only.
          image: ghcr.io/berriai/litellm@sha256:a1745e629abfb17d434426ff48b115f54f4f4c4a0f5af241de569e93c63c411e  # main-stable @ 2026-07-20  # nosemgrep: yaml.kubernetes.security.run-as-non-root.run-as-non-root
          # B47 hardening: drop priv-esc + seccomp (see arch)
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          ports:
            - name: http
              containerPort: 4000
          # B111 — all provider keys come from the shared sealed secret (GROQ/OPENCODE_ZEN/PERPLEXITY/DEEPSEEK/
          # CEREBRAS/OPENAI/XAI/GEMINI/OPENROUTER/ANTHROPIC/…), so the wl-* router resolves os.environ/<PROVIDER>_API_KEY.
          # Named bifrost-provider-keys (B111 key-sealing) but shared by both gateways — rename to provider-api-keys later.
          envFrom:
            - secretRef:
                name: bifrost-provider-keys
          env:
            # B211 (2026-10-22): rogueone's Ollama front door asks remote callers for this bearer token.
            - name: OLLAMA_API_KEY
              valueFrom: { secretKeyRef: { name: ollama-proxy-token, key: token } }
            # LiteLLM's OWN Anthropic key (2026-10-17, after the OpenCode exposure). It used to read ANTHROPIC_API_KEY from
            # the envFrom above — Bifrost's secret — so the two gateways shared one key. The litellm-secrets
            # ANTHROPIC_API_KEY slot (set from ANTHROPIC_LITELLM_KEY in .env) is LiteLLM's own. docs/runbooks/secrets-map.md.
            - name: LITELLM_ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: ANTHROPIC_API_KEY
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_MASTER_KEY
            # B234 — the `litellm` database on core Postgres (virtual keys + spend logs). Created by the owner per
            # docs/runbooks/model-gateway.md § 1d; sealed as k8s/sealed-secrets/sealed/weyland__litellm-db.yaml.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-db
                  key: DATABASE_URL
            # B17 DoD: the realm-llm Bifrost VK — wl-agentic egresses THROUGH Bifrost so it records provider cost/usage
            # + per-VK attribution (no LiteLLM DB). Create the secret out-of-band (see the register/DoD steps).
            - name: BIFROST_REALM_VK
              valueFrom:
                secretKeyRef:
                  name: bifrost-realm-vk
                  key: BIFROST_REALM_VK
            # B103 — Langfuse callback creds. litellm-secrets is cherry-picked (explicit env, NOT blanket envFrom),
            # so these three keys must be named explicitly or the langfuse callback silently no-ops (no host = off).
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LANGFUSE_PUBLIC_KEY
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LANGFUSE_SECRET_KEY
            - name: LANGFUSE_HOST
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LANGFUSE_HOST
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 30
          # B234 — NOT /health/readiness: that answers 503 whenever the database is disconnected, so a core Postgres
          # outage would pull the ONLY replica out of the Service and take every lane down, although LiteLLM still serves
          # the master key and already-used keys (measured in Docker 2026-10-29). The DB outage is alerted instead:
          # probe.yaml + LiteLLMDatabaseDisconnected.
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi   # LiteLLM spikes on startup; 512Mi OOMKills (exit 137)
      volumes:
        - name: config
          configMap:
            name: litellm-config
