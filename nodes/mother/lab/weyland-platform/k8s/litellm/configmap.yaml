# B26 → reframed: LiteLLM as the hosted-model gateway AND the use-case ROUTER (B111).
# Wildcards expose EVERY model from each provider; the wl-* aliases add use-case routing with server-side
# fallback chains (the transparent failover Bifrost OSS gates behind Enterprise adaptive-LB). A client sends
# only an alias (e.g. wl-coding); LiteLLM picks the primary and fails over down the chain on
# network / 5xx / 429 / timeout. Diagram: docs/llm-routing-map.html (internal).
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: weyland
data:
  config.yaml: |
    model_list:
      # --- Wildcards: the whole provider, every model, zero enumeration ---
      - model_name: "gemini/*"
        litellm_params:
          model: "gemini/*"
          api_key: os.environ/GEMINI_API_KEY
      - model_name: "openrouter/*"
        litellm_params:
          model: "openrouter/*"
          api_key: os.environ/OPENROUTER_API_KEY
      # Anthropic — the agentic lane (operator, coding agents) routes tool-calling here (transparent passthrough).
      - model_name: "anthropic/*"
        litellm_params:
          model: "anthropic/*"
          api_key: os.environ/ANTHROPIC_API_KEY
      # --- Friendly aliases (existing convenience names — consumers depend on these) ---
      - model_name: claude-haiku
        litellm_params:
          model: anthropic/claude-haiku-4-5-20251001
          api_key: os.environ/ANTHROPIC_API_KEY
      - model_name: gemini-flash      # B17: via Bifrost (free fallback rung across many chains)
        litellm_params:
          model: openai/gemini/gemini-2.5-flash
          api_base: http://bifrost.weyland.svc.cluster.local:8080/v1
          api_key: os.environ/BIFROST_REALM_VK
      - model_name: gemini-pro
        litellm_params:
          model: gemini/gemini-2.5-pro
          api_key: os.environ/GEMINI_API_KEY

      # ================================================================================================
      # B111 USE-CASE ROUTING — wl-* aliases (primaries). Fallback chains in router_settings.fallbacks.
      # Keys resolve from the shared bifrost-provider-keys secret (envFrom on the pod). ollama = self-hosted
      # on rogueone (no key). Primaries below are the ones proven end-to-end during the Bifrost routing test.
      # ================================================================================================
      # B17: hosted lanes egress THROUGH Bifrost (realm-llm VK) — cost/usage obs + per-VK attribution. Bifrost model ids
      # confirmed via a direct batch test; `openai/` prefix makes LiteLLM treat Bifrost's /v1 as OpenAI-compatible.
      - model_name: wl-default        # general-purpose · free hosted (groq via Bifrost)
        litellm_params:
          model: openai/groq/openai/gpt-oss-120b
          api_base: http://bifrost.weyland.svc.cluster.local:8080/v1
          api_key: os.environ/BIFROST_REALM_VK
      - model_name: wl-speed          # lowest latency · free hosted (groq via Bifrost)
        litellm_params:
          model: openai/groq/openai/gpt-oss-120b
          api_base: http://bifrost.weyland.svc.cluster.local:8080/v1
          api_key: os.environ/BIFROST_REALM_VK
      - model_name: wl-coding         # code gen/edits · opencode-zen (via Bifrost)
        litellm_params:
          model: openai/opencode-zen/kimi-k3
          api_base: http://bifrost.weyland.svc.cluster.local:8080/v1
          api_key: os.environ/BIFROST_REALM_VK
      # B17 DoD: wl-agentic egresses THROUGH Bifrost (realm-llm VK) so Bifrost records provider cost/usage + per-VK
      # attribution (no LiteLLM DB). LiteLLM still owns the wl-* alias + the fallback chain below; Bifrost is just the
      # provider-egress layer for the primary Haiku hop. Model id `anthropic/claude-4.5-haiku` is Bifrost's, reached via
      # its OpenAI-compatible /v1 (openai/ prefix strips for LiteLLM). Auth = the realm-llm VK as the Bearer api_key.
      - model_name: wl-agentic        # tool orchestration · reliable cheap tool-calling
        litellm_params:
          model: openai/anthropic/claude-haiku-4-5   # Bifrost's routable Anthropic Haiku ID (NOT claude-4.5-haiku, which is a display alias Bifrost 403s)
          api_base: http://bifrost.weyland.svc.cluster.local:8080/v1
          api_key: os.environ/BIFROST_REALM_VK
      - model_name: wl-rag            # retrieval-grounded gen · free local (private)
        litellm_params:
          model: ollama_chat/gpt-oss:20b
          api_base: http://192.168.1.230:11434
      - model_name: wl-reason         # deep reasoning · free local
        litellm_params:
          model: ollama_chat/qwen3:30b-a3b
          api_base: http://192.168.1.230:11434
      - model_name: wl-judge          # eval / LLM-as-judge · free local
        litellm_params:
          model: ollama_chat/qwen2.5:7b
          api_base: http://192.168.1.230:11434
      - model_name: wl-search         # web-grounded · perplexity sonar (via Bifrost; id is perplexity/sonar, NOT the /v1/models perplexity/perplexity/sonar which 400s invalid_model)
        litellm_params:
          model: openai/perplexity/sonar
          api_base: http://bifrost.weyland.svc.cluster.local:8080/v1
          api_key: os.environ/BIFROST_REALM_VK
      - model_name: wl-big-oss        # big frontier OSS via aggregator (openrouter via Bifrost)
        litellm_params:
          model: openai/openrouter/minimax/minimax-m3
          api_base: http://bifrost.weyland.svc.cluster.local:8080/v1
          api_key: os.environ/BIFROST_REALM_VK

      # B111 media lane — text-to-speech. PRIMARY = Kokoro (self-hosted, $0, no quota) via Bifrost; ALTERNATE =
      # ElevenLabs (kept/listed, but its free tier blocks library voices via API — usable only on a paid plan).
      # Callers hit LiteLLM /v1/audio/speech with model wl-tts. NOTE: voice names differ per provider (Kokoro af_bella…
      # vs ElevenLabs voice IDs), so an actual failover to ElevenLabs needs a valid ElevenLabs voice.
      - model_name: wl-tts
        litellm_params:
          model: openai/kokoro/kokoro
          api_base: http://bifrost.weyland.svc.cluster.local:8080/v1
          api_key: os.environ/BIFROST_REALM_VK
        model_info:
          mode: audio_speech
      - model_name: elevenlabs-tts       # the deferred alternate (referenced by the wl-tts fallback chain)
        litellm_params:
          model: openai/elevenlabs/eleven_multilingual_v2
          api_base: http://bifrost.weyland.svc.cluster.local:8080/v1
          api_key: os.environ/BIFROST_REALM_VK
        model_info:
          mode: audio_speech

      # --- Fallback-only deployments (targets referenced by router_settings.fallbacks) ---
      # All via Bifrost. deepseek-chat/reasoner remapped to Bifrost's deepseek-v4-flash/pro. All providers funded.
      - model_name: deepseek-chat
        litellm_params:
          model: openai/deepseek/deepseek-v4-flash
          api_base: http://bifrost.weyland.svc.cluster.local:8080/v1
          api_key: os.environ/BIFROST_REALM_VK
      - model_name: deepseek-reasoner
        litellm_params:
          model: openai/deepseek/deepseek-v4-pro
          api_base: http://bifrost.weyland.svc.cluster.local:8080/v1
          api_key: os.environ/BIFROST_REALM_VK
      - model_name: cerebras-oss
        litellm_params:
          model: openai/cerebras/gpt-oss-120b
          api_base: http://bifrost.weyland.svc.cluster.local:8080/v1
          api_key: os.environ/BIFROST_REALM_VK
      - model_name: openai-mini
        litellm_params:
          model: openai/openai/gpt-4o-mini
          api_base: http://bifrost.weyland.svc.cluster.local:8080/v1
          api_key: os.environ/BIFROST_REALM_VK
      - model_name: xai-grok          # B17: via Bifrost; remapped grok-3 → grok-4.5 (Bifrost's routable xai id)
        litellm_params:
          model: openai/xai/grok-4.5
          api_base: http://bifrost.weyland.svc.cluster.local:8080/v1
          api_key: os.environ/BIFROST_REALM_VK

    litellm_settings:
      callbacks: ["prometheus"]
      require_auth_for_metrics_endpoint: false   # LAN-only scrape
      drop_params: true                          # tolerate params a given model doesn't support

    router_settings:
      # Ordered, server-side failover per use-case alias (network / 5xx / 429 / timeout triggers).
      # Targets are other model_names above — aliases (wl-default = groq, wl-agentic = anthropic) are reused
      # as rungs so the always-on-free tier is defined once. See docs/llm-routing-map.html.
      fallbacks:
        - {"wl-default":  ["gemini-flash", "wl-agentic"]}
        - {"wl-speed":    ["cerebras-oss", "gemini-flash"]}
        - {"wl-coding":   ["wl-agentic", "deepseek-chat", "wl-default"]}       # …then groq (free) so it always lands
        - {"wl-agentic":  ["openai-mini", "cerebras-oss", "gemini-flash"]}     # paid escalation, then gemini (free + tool-capable) as the guaranteed tail
        - {"wl-rag":      ["wl-default", "gemini-flash"]}
        - {"wl-reason":   ["deepseek-reasoner", "wl-default"]}
        - {"wl-judge":    ["wl-default", "gemini-flash"]}
        - {"wl-search":   ["xai-grok"]}
        - {"wl-big-oss":  ["wl-default"]}
        - {"wl-tts":      ["elevenlabs-tts"]}      # Kokoro primary → ElevenLabs alternate (media lane, B111)

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
