# LiteLLM · Traffic & Tokens dashboard (B17 DoD). ConfigMap in `monitoring` ns, `grafana_dashboard` label → Grafana
# sidecar auto-imports (Dashboards → LiteLLM · Traffic & Tokens). Metrics from k8s/litellm/servicemonitor.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-dashboard-traffic
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  litellm-traffic.json: |
    {
      "title": "LiteLLM · Traffic & Tokens",
      "uid": "litellm-traffic",
      "schemaVersion": 39,
      "editable": true,
      "tags": ["litellm", "llm", "traffic"],
      "time": { "from": "now-6h", "to": "now" },
      "refresh": "30s",
      "templating": { "list": [
        { "name": "datasource", "type": "datasource", "query": "prometheus", "current": {}, "hide": 0 }
      ] },
      "panels": [
        { "id": 1, "title": "Requests / s", "type": "stat", "gridPos": {"h":4,"w":4,"x":0,"y":0},
          "datasource": {"type":"prometheus","uid":"${datasource}"},
          "targets": [{"expr":"sum(rate(litellm_proxy_total_requests_metric_total[5m]))","refId":"A"}],
          "fieldConfig": {"defaults":{"unit":"reqps","decimals":2}} },
        { "id": 2, "title": "Failed / s", "type": "stat", "gridPos": {"h":4,"w":4,"x":4,"y":0},
          "datasource": {"type":"prometheus","uid":"${datasource}"},
          "targets": [{"expr":"sum(rate(litellm_proxy_failed_requests_metric_total[5m]))","refId":"A"}],
          "fieldConfig": {"defaults":{"unit":"reqps","decimals":3,"thresholds":{"steps":[{"color":"green","value":null},{"color":"red","value":0.01}]}}} },
        { "id": 3, "title": "In-flight", "type": "stat", "gridPos": {"h":4,"w":4,"x":8,"y":0},
          "datasource": {"type":"prometheus","uid":"${datasource}"},
          "targets": [{"expr":"sum(litellm_in_flight_requests)","refId":"A"}],
          "fieldConfig": {"defaults":{"unit":"short"}} },
        { "id": 4, "title": "Total tokens (range)", "type": "stat", "gridPos": {"h":4,"w":6,"x":12,"y":0},
          "datasource": {"type":"prometheus","uid":"${datasource}"},
          "targets": [{"expr":"sum(increase(litellm_total_tokens_metric_total[$__range]))","refId":"A"}],
          "fieldConfig": {"defaults":{"unit":"short"}} },
        { "id": 5, "title": "Cached input tokens (range)", "type": "stat", "gridPos": {"h":4,"w":6,"x":18,"y":0},
          "datasource": {"type":"prometheus","uid":"${datasource}"},
          "targets": [{"expr":"sum(increase(litellm_input_cached_tokens_metric_total[$__range]))","refId":"A"}],
          "description": "Prompt-cache reads — tokens billed at the cheap cached rate.",
          "fieldConfig": {"defaults":{"unit":"short"}} },
        { "id": 6, "title": "Requests / s by model", "type": "timeseries", "gridPos": {"h":8,"w":12,"x":0,"y":4},
          "datasource": {"type":"prometheus","uid":"${datasource}"},
          "targets": [{"expr":"sum by (model) (rate(litellm_requests_metric_total[5m]))","refId":"A","legendFormat":"{{model}}"}],
          "fieldConfig": {"defaults":{"unit":"reqps","custom":{"fillOpacity":10}}} },
        { "id": 7, "title": "Tokens / s — input vs output", "type": "timeseries", "gridPos": {"h":8,"w":12,"x":12,"y":4},
          "datasource": {"type":"prometheus","uid":"${datasource}"},
          "targets": [
            {"expr":"sum(rate(litellm_input_tokens_metric_total[5m]))","refId":"A","legendFormat":"input"},
            {"expr":"sum(rate(litellm_output_tokens_metric_total[5m]))","refId":"B","legendFormat":"output"},
            {"expr":"sum(rate(litellm_output_reasoning_tokens_metric_total[5m]))","refId":"C","legendFormat":"reasoning"}
          ],
          "fieldConfig": {"defaults":{"unit":"short","custom":{"fillOpacity":10,"stacking":{"mode":"normal"}}}} },
        { "id": 8, "title": "Total tokens by model (range)", "type": "bargauge", "gridPos": {"h":8,"w":12,"x":0,"y":12},
          "datasource": {"type":"prometheus","uid":"${datasource}"},
          "targets": [{"expr":"sum by (model) (increase(litellm_total_tokens_metric_total[$__range]))","refId":"A","legendFormat":"{{model}}","instant":true}],
          "options": {"displayMode":"gradient","orientation":"horizontal"},
          "fieldConfig": {"defaults":{"unit":"short"}} },
        { "id": 9, "title": "Requests by model (range)", "type": "bargauge", "gridPos": {"h":8,"w":12,"x":12,"y":12},
          "datasource": {"type":"prometheus","uid":"${datasource}"},
          "targets": [{"expr":"sum by (model) (increase(litellm_requests_metric_total[$__range]))","refId":"A","legendFormat":"{{model}}","instant":true}],
          "options": {"displayMode":"gradient","orientation":"horizontal"},
          "fieldConfig": {"defaults":{"unit":"short"}} }
      ]
    }
