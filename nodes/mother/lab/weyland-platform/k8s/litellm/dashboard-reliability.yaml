# LiteLLM · Reliability & Routing dashboard (B17 DoD). ConfigMap in `monitoring` ns, `grafana_dashboard` label →
# Grafana sidecar auto-imports (Dashboards → LiteLLM · Reliability & Routing). Errors, deployment health, the wl-*
# fallback chain hops, rate-limit headroom, cache, and guardrail activity.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-dashboard-reliability
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  litellm-reliability.json: |
    {
      "title": "LiteLLM · Reliability & Routing",
      "uid": "litellm-reliability",
      "schemaVersion": 39,
      "editable": true,
      "tags": ["litellm", "llm", "reliability"],
      "time": { "from": "now-6h", "to": "now" },
      "refresh": "30s",
      "templating": { "list": [
        { "name": "datasource", "type": "datasource", "query": "prometheus", "current": {}, "hide": 0 }
      ] },
      "panels": [
        { "id": 1, "title": "Success rate", "type": "stat", "gridPos": {"h":4,"w":6,"x":0,"y":0},
          "datasource": {"type":"prometheus","uid":"${datasource}"},
          "targets": [{"expr":"sum(rate(litellm_deployment_success_responses_total[$__range])) / clamp_min(sum(rate(litellm_deployment_total_requests_total[$__range])), 0.0001)","refId":"A"}],
          "fieldConfig": {"defaults":{"unit":"percentunit","min":0,"max":1,"thresholds":{"steps":[{"color":"red","value":null},{"color":"yellow","value":0.95},{"color":"green","value":0.99}]}}} },
        { "id": 2, "title": "Cache hit ratio", "type": "stat", "gridPos": {"h":4,"w":6,"x":6,"y":0},
          "datasource": {"type":"prometheus","uid":"${datasource}"},
          "targets": [{"expr":"sum(rate(litellm_cache_hits_metric_total[$__range])) / clamp_min(sum(rate(litellm_cache_hits_metric_total[$__range])) + sum(rate(litellm_cache_misses_metric_total[$__range])), 0.0001)","refId":"A"}],
          "fieldConfig": {"defaults":{"unit":"percentunit","min":0,"max":1}} },
        { "id": 3, "title": "Fallbacks OK (range)", "type": "stat", "gridPos": {"h":4,"w":6,"x":12,"y":0},
          "datasource": {"type":"prometheus","uid":"${datasource}"},
          "targets": [{"expr":"sum(increase(litellm_deployment_successful_fallbacks_total[$__range]))","refId":"A"}],
          "description": "The wl-* chain successfully failed over to a next rung.",
          "fieldConfig": {"defaults":{"unit":"short"}} },
        { "id": 4, "title": "Fallbacks failed (range)", "type": "stat", "gridPos": {"h":4,"w":6,"x":18,"y":0},
          "datasource": {"type":"prometheus","uid":"${datasource}"},
          "targets": [{"expr":"sum(increase(litellm_deployment_failed_fallbacks_total[$__range]))","refId":"A"}],
          "fieldConfig": {"defaults":{"unit":"short","thresholds":{"steps":[{"color":"green","value":null},{"color":"red","value":1}]}}} },
        { "id": 5, "title": "Failures / s by exception", "type": "timeseries", "gridPos": {"h":8,"w":12,"x":0,"y":4},
          "datasource": {"type":"prometheus","uid":"${datasource}"},
          "targets": [{"expr":"sum by (exception_class) (rate(litellm_llm_api_failed_requests_metric_total[5m]))","refId":"A","legendFormat":"{{exception_class}}"}],
          "fieldConfig": {"defaults":{"unit":"reqps","custom":{"fillOpacity":10}}} },
        { "id": 6, "title": "Deployment success vs failure / s", "type": "timeseries", "gridPos": {"h":8,"w":12,"x":12,"y":4},
          "datasource": {"type":"prometheus","uid":"${datasource}"},
          "targets": [
            {"expr":"sum(rate(litellm_deployment_success_responses_total[5m]))","refId":"A","legendFormat":"success"},
            {"expr":"sum(rate(litellm_deployment_failure_responses_total[5m]))","refId":"B","legendFormat":"failure"}
          ],
          "fieldConfig": {"defaults":{"unit":"reqps","custom":{"fillOpacity":10}}} },
        { "id": 7, "title": "Fallback events / s", "type": "timeseries", "gridPos": {"h":8,"w":12,"x":0,"y":12},
          "datasource": {"type":"prometheus","uid":"${datasource}"},
          "targets": [
            {"expr":"sum(rate(litellm_deployment_successful_fallbacks_total[5m]))","refId":"A","legendFormat":"succeeded"},
            {"expr":"sum(rate(litellm_deployment_failed_fallbacks_total[5m]))","refId":"B","legendFormat":"failed"},
            {"expr":"sum(rate(litellm_deployment_cooled_down_total[5m]))","refId":"C","legendFormat":"cooldowns"}
          ],
          "fieldConfig": {"defaults":{"unit":"short","custom":{"fillOpacity":10}}} },
        { "id": 8, "title": "Guardrail requests vs errors / s", "type": "timeseries", "gridPos": {"h":8,"w":12,"x":12,"y":12},
          "datasource": {"type":"prometheus","uid":"${datasource}"},
          "targets": [
            {"expr":"sum(rate(litellm_guardrail_requests_total[5m]))","refId":"A","legendFormat":"requests"},
            {"expr":"sum(rate(litellm_guardrail_errors_total[5m]))","refId":"B","legendFormat":"errors"}
          ],
          "fieldConfig": {"defaults":{"unit":"reqps","custom":{"fillOpacity":10}}} },
        { "id": 9, "title": "Remaining request headroom by model (rate limit)", "type": "timeseries", "gridPos": {"h":8,"w":12,"x":0,"y":20},
          "datasource": {"type":"prometheus","uid":"${datasource}"},
          "targets": [{"expr":"min by (model) (litellm_remaining_requests_metric)","refId":"A","legendFormat":"{{model}}"}],
          "fieldConfig": {"defaults":{"unit":"short"}} },
        { "id": 10, "title": "Remaining token headroom by model (rate limit)", "type": "timeseries", "gridPos": {"h":8,"w":12,"x":12,"y":20},
          "datasource": {"type":"prometheus","uid":"${datasource}"},
          "targets": [{"expr":"min by (model) (litellm_remaining_tokens_metric)","refId":"A","legendFormat":"{{model}}"}],
          "fieldConfig": {"defaults":{"unit":"short"}} }
      ]
    }
