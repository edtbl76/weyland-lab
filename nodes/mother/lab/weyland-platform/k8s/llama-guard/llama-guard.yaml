# Llama Guard — Classify layer of the guardrails platform (B115), TIER 1.
# Llama-Guard-3-1B, always-on: the default content-safety classifier weyland-guard (the Scan layer) calls on
# every classify. Served by llama.cpp (OpenAI-compatible /v1/chat/completions; the GGUF embeds the Llama Guard safety
# taxonomy chat template, so plain `messages` get wrapped for us). Output is `safe` or `unsafe\nS<category>`.
# ON timberback's GPU since 2026-11-17 (B134 follow-up). On mother's CPU a check took a median of ~7.5 s and up to 15 s;
# 214 of 4,089 calls in 14 days hit weyland-guard's 15 s timeout and failed open (up to 17% on a bad day). On the GPU
# a check takes ~50 ms using ~1.7 GB of VRAM (proved locally with this exact image). $0.
# TIER 2 = an on-demand Llama-Guard-3-8B on the rogueone GPU (llama.cpp server-cuda) — separate, not here.
# UNMESHED (no Istio sidecar): keeps the on-boot HuggingFace model pull off the mesh's proxy-startup egress ordering;
# a meshed client (weyland-guard) reaching a sidecar-less pod auto-negotiates to plaintext, so this still resolves.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-guard
  namespace: weyland
  labels:
    app: llama-guard
spec:
  replicas: 1
  strategy:
    type: Recreate            # single-instance, model-cache emptyDir — never two pods contending
  selector:
    matchLabels:
      app: llama-guard
  template:
    metadata:
      labels:
        app: llama-guard
        sidecar.istio.io/inject: "false"
    spec:
      # The GPU node. One time-slice of four; VRAM is NOT isolated, so this pod's ~1.7 GB is in the budget table in
      # docs/runbooks/timberback.md § GPU sharing and the VRAM budget.
      nodeSelector:
        kubernetes.io/hostname: timberback
      runtimeClassName: nvidia
      containers:
        - name: llama-guard
          # The CUDA server build of llama.cpp b12033, the release the timberback GPU benchmark ran (2026-11-17).
          # Pinned by digest; was the floating `:server` CPU tag.
          image: ghcr.io/ggml-org/llama.cpp:server-cuda-b12033@sha256:0a9f6c7cfe5a6b90b6c048b7a86865bf55a88af34bada927482eab2ef5f25b4a
          imagePullPolicy: IfNotPresent
          args:
            - "-hf"
            - "QuantFactory/Llama-Guard-3-1B-GGUF:Q8_0"   # ungated GGUF mirror; llama.cpp pulls + caches on first boot
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "-c"
            - "4096"                                       # context: a short conversation + the taxonomy fits easily
            - "--temp"
            - "0"                                          # deterministic — Llama Guard goes random above temp 0
            - "-ngl"
            - "99"                                         # every layer on the GPU (the 1B model fits whole)
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 40    # first boot downloads the ~1.3 GB GGUF before /health goes green
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
          resources:
            # On the GPU the model lives in VRAM: measured 267 MiB of host memory (238 MiB anon) after load and three
            # classifications, 2026-11-17. The CPU-era sizing (request 1Gi, limit 4Gi; p95 0.62Gi) was for CPU inference.
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/llama.cpp   # persists the GGUF across container restarts within the pod
      volumes:
        - name: model-cache
          emptyDir:
            sizeLimit: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: llama-guard
  namespace: weyland
  labels:
    app: llama-guard
spec:
  type: ClusterIP
  selector:
    app: llama-guard
  ports:
    - name: http
      port: 8080
      targetPort: 8080
