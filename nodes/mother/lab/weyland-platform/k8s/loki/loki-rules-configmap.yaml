# B51 — Loki ruler alert rules (LogQL). Mounted into the Loki SingleBinary at /rules/fake (the single-tenant
# "fake" dir the ruler scans). Alerts fire to the existing Alertmanager (rulerConfig.alertmanager_url) → Telegram,
# so log alerts share the same pipeline as metric alerts. Add more rules under `groups:`; re-apply + restart loki.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rules
  namespace: monitoring
  labels:
    app: loki
data:
  weyland.yaml: |
    groups:
      - name: weyland-log-alerts
        rules:
          # Error/exception log spike across the weyland namespace (catches storms, not single errors).
          # Threshold 100/5m is a starting baseline (an active debug session hit ~114) — tune to your noise floor:
          # lower if real incidents slip under it, raise if it cries wolf. A level-aware rule would be more precise
          # but needs consistent structured logging across apps (deferred).
          #
          # ⚠ THE `\b` IS LOAD-BEARING. Without it this matched `NOERROR` — the SUCCESS code CoreDNS writes on
          # every resolved query — so `weyland-lan-dns` alone contributed ~6,158 "errors" per 30 minutes and this
          # alert was PERMANENTLY FIRING (found 2026-08-22). A permanently-lit alert is worse than no alert: a real
          # error storm in weyland or data-mesh would have changed nothing anyone would notice.
          # Leading boundary only, deliberately: `\berror` still matches `[ERROR]`, `Error:` and `errors`, while
          # `NOERROR` has a word character before `ERROR` and so no longer matches. A trailing `\b` would lose
          # `errors`. RE2 (Loki's engine) supports `\b` as an ASCII word boundary.
          - alert: WeylandErrorLogSpike
            expr: sum by (namespace) (count_over_time({namespace=~"weyland|data-mesh"} |~ `(?i)\b(error|exception|traceback)` [5m])) > 100
            for: 2m
            labels:
              severity: warning
              source: loki
            annotations:
              summary: "Error-log spike (logs) in {{ $labels.namespace }}"
              description: "{{ $value }} error/exception log lines in the last 5m in namespace {{ $labels.namespace }}."
          # data-store-mageddon: a store-load table/dataset failed inside a datasets hydrate job. Catches even a
          # single per-table failure the loader swallows (it logs `<store> <db>.<table>: <exc>` at ERROR but keeps
          # going) — the "don't silently drop a table" signal. Generalizes to every store's hydrate job.
          # B201 (2026-10-05) — Woodpecker's SQLite store. `database is locked` preceded the `task expired` kill of
          # in-flight pipeline #252 when the 01:00 nightly fired (9 locks on 2026-10-04 05:01-08:26Z). Fixed with a
          # one-connection pool (woodpecker-values.yaml); these say if it comes back. Any single occurrence matters.
          - alert: WoodpeckerDatabaseLocked
            expr: sum (count_over_time({namespace="woodpecker", container="server"} |= `database is locked` [10m])) > 0
            for: 0m
            labels:
              severity: warning
              source: loki
            annotations:
              summary: "Woodpecker's SQLite store reported `database is locked`"
              description: "{{ $value }} lock error(s) in 10m on woodpecker-server — a lock on the cron list or an agent lease can kill an in-flight pipeline (`task expired`). See runbooks/woodpecker.md and B201."
          - alert: WoodpeckerTaskExpired
            expr: sum (count_over_time({namespace="woodpecker", container="server"} |= `task expired` [10m])) > 0
            for: 0m
            labels:
              severity: warning
              source: loki
            annotations:
              summary: "A Woodpecker pipeline was killed: `task expired`"
              description: "The server expired an in-flight task (agent lost its lease) — the pipeline's remaining steps are `killed`, with no code verdict. Re-run it; see runbooks/woodpecker.md (the nightly-cron kill) and B201."
          - alert: WeylandDatasetHydrationFailure
            expr: sum (count_over_time({namespace="weyland"} |~ `hydrate_job` |~ `(?i)\b(error|exception|traceback)` [10m])) > 0
            for: 1m
            labels:
              severity: warning
              source: loki
            annotations:
              summary: "Dataset store hydration failure"
              description: "{{ $value }} error line(s) during a datasets hydrate job in the last 10m — a store-load failed. See runbooks/datasets-hydration.md."
