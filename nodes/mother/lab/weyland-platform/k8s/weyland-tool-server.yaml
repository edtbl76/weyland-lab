# B207 (2026-10-13): a DEDICATED identity, so weyland-guard can admit /guard/act from the tool-server ALONE
# (k8s/istio/authz-guard-act.yaml). The tool-server ran as `default`, shared with ~95 pods in this namespace, which made
# an identity rule meaningless. It never calls the Kubernetes API, so no token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: weyland-tool-server
  namespace: weyland
  labels: { app: weyland-tool-server }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weyland-tool-server
  namespace: weyland
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weyland-tool-server
  template:
    metadata:
      labels:
        app: weyland-tool-server
        sidecar.istio.io/inject: "true"   # B8 — Istio sidecar (per-workload injection; weyland ns is unlabeled)
    spec:
      serviceAccountName: weyland-tool-server
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: weyland-tool-server
          image: registry.weyland.lab/weyland-tool-server:git-514d5158   # tag is CI-managed (git-<sha>, B57a pipeline) — don't hand-bump. U13: no torch — the bge query-embedder runs on raw ONNX Runtime now (main.py OnnxBge); the old CUDA-layer-corruption concern is moot.
          resources:
            requests: { memory: 512Mi, cpu: 250m }
            # 3Gi (was 2Gi, raised 2026-07-21). Steady state is ~929Mi (it loads the embedding model), so 2Gi
            # looked like ample headroom — until the B96 eval experiment raised EVAL_ASK_LIMIT 3 -> 8. Retrieving
            # 8 contexts per question instead of 3, across a 120-question matrix, OOMKilled it (exit 137) three
            # results into the run. Every subsequent call got `503 Service Unavailable` from /context/ask, and
            # 117 of 120 eval results recorded that 503 as their error — a "1 minute, SUCCESS" eval run that had
            # almost no data in it.
            # Diagnostic note: a 503 from this service means the POD went away — check
            # `lastState.terminated.reason` on the pod, not the caller's logs. Same shape as the Trino 503 that
            # surfaced as a dbt failure on 2026-07-20.
            limits: { memory: 3Gi }
          imagePullPolicy: IfNotPresent
          # B47 hardening: non-root uid 10001 + drop caps + no priv-esc + seccomp
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
          # Liveness = process up (/health); Readiness = model loaded + pgvector (/ready).
          # /ready returns 503 until the embed model is loaded, so traffic only arrives
          # once the server can actually serve search.
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          env:
            - name: WEYLAND_DB_HOST
              value: weyland-postgres.weyland.svc.cluster.local
            - name: WEYLAND_DB_PORT
              value: "5432"
            - name: WEYLAND_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: weyland-postgres-secret
                  key: POSTGRES_DB
            - name: WEYLAND_DB_USER
              valueFrom:
                secretKeyRef:
                  name: weyland-postgres-secret
                  key: POSTGRES_USER
            - name: WEYLAND_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: weyland-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: QDRANT_HOST
              value: qdrant.weyland.svc.cluster.local
            - name: QDRANT_PORT
              value: "6333"
            - name: WEAVIATE_HOST
              value: weaviate.weyland.svc.cluster.local
            - name: WEAVIATE_PORT
              value: "8080"
            - name: WEAVIATE_GRPC_PORT
              value: "50051"
            - name: NEO4J_URI
              value: bolt://neo4j.weyland.svc.cluster.local:7687
            - name: NEO4J_USER
              value: neo4j
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neo4j-secret
                  key: password
            - name: DAGSTER_URL
              value: http://dagster-webserver.weyland.svc.cluster.local:3000
            # B7: local model serving (Ollama on weyland CT 102, OpenAI-compatible /v1).
            # IP is DHCP-reserved; default model is overridable per request via /context/ask.
            - name: OLLAMA_BASE_URL
              value: http://192.168.1.230:11434/v1
            # B51 — error tracking → GlitchTip. Internal-service DSN (in-cluster apps can't resolve the
            # *.weyland.lab ingress); empty/unset DSN = SDK no-op.
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: tool-server-sentry
                  key: SENTRY_DSN
            - name: OLLAMA_MODEL
              value: gpt-oss:20b   # B4 panel-validated most-faithful RAG model (2026-06-13)
            # B70 Part 2 — shared guard service (fail-open; default matches the in-cluster svc, set explicit for clarity).
            - name: GUARD_BASE_URL
              value: http://weyland-guard.weyland.svc.cluster.local:8080
            # B100 Phase 1 — MLflow RAG tracing (manual spans; fail-safe — empty/unreachable = tracing disabled,
            # the request still answers). Experiment `tool-server-rag`.
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.weyland.svc.cluster.local:5000
            # B49 thread (b) — app-level spans → Tempo OTLP (HTTP :4318; OPT-IN, unset = no tracing). FastAPI + httpx
            # auto-instrumentation nests app spans under the Istio mesh trace. Runbook: observability.md.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.monitoring.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: weyland-tool-server
            # B103 prompt federation — Langfuse prompt-linked RAG tracing (alongside MLflow). Reuses the already-sealed
            # litellm-secrets project keys (same weyland ns) to avoid a duplicate sealed CR. Unset = Langfuse tracing off.
            - name: LANGFUSE_HOST
              value: http://langfuse.weyland.svc:3000
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LANGFUSE_PUBLIC_KEY
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LANGFUSE_SECRET_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: weyland-tool-server
  namespace: weyland
  labels:
    app: weyland-tool-server   # selected by the ServiceMonitor (B14 guardrail /metrics scrape)
spec:
  type: NodePort
  selector:
    app: weyland-tool-server
  ports:
    - name: http               # named so the ServiceMonitor endpoint can reference it
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
# B207 DoD (2026-10-14) — the tool-server is scraped again. B70 Part 2 retired its ServiceMonitor when the verdict metrics
# moved to weyland-guard; it now exports tool_server_guard_failures_total{hook,cause}: guard calls that got no usable
# answer. Content hooks fail open and act fails closed, and both are only safe when someone hears about it.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: weyland-tool-server
  namespace: weyland
spec:
  selector:
    matchLabels:
      app: weyland-tool-server
  endpoints:
    - port: http
      path: /metrics
---
# GuardCallsFailing — routes to the Weyland Alerts Telegram chat (release: monitoring, kube-prometheus-stack ruleSelector).
# act is critical and fires on the first failure: real acts are rare (none in the 21 days before B207), so one refused act
# means the authority path is broken (guard down, or the mesh refusing the tool-server's identity: authz-guard-act.yaml).
# input/output is a warning held 10m: answers went out unguarded, the product kept working.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: weyland-tool-server
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: weyland-tool-server-guard
      rules:
        - alert: GuardCallsFailing
          expr: sum by (cause) (increase(tool_server_guard_failures_total{job="weyland-tool-server",hook="act"}[10m])) > 0
          labels:
            severity: critical
          annotations:
            summary: "The tool-server could not get an act verdict ({{ $labels.cause }}): acts are being refused"
            description: "weyland-tool-server's guard calls on the ACT hook got no usable answer, so it refused the act (fail closed, B207). cause=bad_response with weyland-guard healthy usually means the mesh denied the tool-server's identity (k8s/istio/authz-guard-act.yaml, ServiceAccount weyland-tool-server). Check: kubectl -n weyland logs deploy/weyland-tool-server | grep '\\[guard\\]'"
        - alert: GuardCallsFailing
          expr: sum by (hook, cause) (increase(tool_server_guard_failures_total{job="weyland-tool-server",hook=~"input|output"}[10m])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "The tool-server is answering unguarded: {{ $labels.hook }} guard calls failing ({{ $labels.cause }})"
            description: "weyland-tool-server's {{ $labels.hook }} guard calls got no usable answer for 10m, so answers went out unguarded (content fails open). Check weyland-guard: kubectl -n weyland rollout status deploy/weyland-guard"
