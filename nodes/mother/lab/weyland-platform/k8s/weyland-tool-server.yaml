apiVersion: apps/v1
kind: Deployment
metadata:
  name: weyland-tool-server
  namespace: weyland
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weyland-tool-server
  template:
    metadata:
      labels:
        app: weyland-tool-server
    spec:
      containers:
        - name: weyland-tool-server
          image: weyland-tool-server:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: WEYLAND_DB_HOST
              value: weyland-postgres.weyland.svc.cluster.local
            - name: WEYLAND_DB_PORT
              value: "5432"
            - name: WEYLAND_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: weyland-postgres-secret
                  key: POSTGRES_DB
            - name: WEYLAND_DB_USER
              valueFrom:
                secretKeyRef:
                  name: weyland-postgres-secret
                  key: POSTGRES_USER
            - name: WEYLAND_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: weyland-postgres-secret
                  key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: weyland-tool-server
  namespace: weyland
spec:
  type: NodePort
  selector:
    app: weyland-tool-server
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
