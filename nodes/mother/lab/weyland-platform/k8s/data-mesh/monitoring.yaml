# B1 / B69 data-mesh-now — Prometheus scrape + alerting for the data-mesh services.
# Prometheus picks these up automatically (serviceMonitorSelectorNilUsesHelmValues=false).
# Down-alerts use kube-state-metrics (always available) so they fire even if an app's own
# /metrics is absent. Alerts route to Telegram via the existing Alertmanager severity routing.
# NOTE: selector labels assume `app: <name>` — verify against the live pod/service labels
# (`kubectl -n data-mesh get pod --show-labels`) and adjust if different.
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: nessie
  namespace: data-mesh
spec:
  selector:
    matchLabels:
      app: nessie
  podMetricsEndpoints:
    - port: mgmt # containerPort 9000 (Quarkus management)
      path: /q/metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lakefs
  namespace: data-mesh
spec:
  selector:
    matchLabels:
      app: lakefs
  endpoints:
    - port: http # 8000
      path: /metrics
---
# minio ServiceMonitor removed here — it's single-owned in monitoring/servicemonitors.yaml now. Two apps owning one
# SM (this data-mesh app vs monitoring-extras) flip-flopped the Argo tracking-id → perpetual OutOfSync.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: data-mesh-alerts
  namespace: data-mesh
spec:
  groups:
    - name: data-mesh.rules
      rules:
        - alert: DataMeshComponentDown
          expr: kube_deployment_status_replicas_available{namespace="data-mesh", deployment=~"nessie|lakefs|datahub-.*"} == 0
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "data-mesh: {{ $labels.deployment }} has 0 available replicas"
            description: "{{ $labels.deployment }} in namespace data-mesh has been down for 5m."
        - alert: MinioDown
          expr: kube_deployment_status_replicas_available{namespace="minio", deployment="minio"} == 0
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "MinIO (data-mesh object store) has 0 available replicas"
            description: "MinIO is down — Iceberg warehouse, lakeFS data, and aidlc-kb are unreachable."
        # DataMeshBackupFailed was REMOVED 2026-08-24 (B140) and replaced by `ScheduledBackupFailed`
        # in k8s/monitoring/cron-freshness-rules.yaml. It is NOT a silent deletion — it was BROKEN
        # and covered half of what it read as covering:
        #
        #     expr: kube_job_status_failed{namespace="data-mesh", job_name=~"(minio|pg)-backup.*"} > 0
        #
        # The regex names both backups; the namespace selector one line up pinned it to `data-mesh`.
        # `minio-backup` lives in namespace `minio`, so a failing MinIO backup — the mlflow models and
        # tofu state, both irreplaceable — alerted NOBODY. A label selector and a name regex
        # disagreeing is invisible unless you check where the objects actually live.
        #
        # The replacement carries no namespace selector (the 10 CronJobs span `weyland`, `data-mesh`
        # and `minio`), covers `postgres-backup` too, is CRITICAL rather than warning, and is enforced
        # by scripts/check-cron-freshness-budgets.sh, which fails CI if any CronJob loses its failure
        # rule. Do not re-add a namespace-scoped copy here.
