# B1.2 — Nessie: Iceberg catalog + git-style versioning for TABLE data products. Postgres JDBC2 version store
# + built-in Iceberg REST catalog backed by MinIO. Meshed (sidecar) so it reaches STRICT-mTLS Postgres
# (read ECONNRESET otherwise). Config verified against the Nessie 0.107 (post-0.99 Quarkus) layout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nessie
  namespace: data-mesh
  labels: { app: nessie }
spec:
  replicas: 1
  selector: { matchLabels: { app: nessie } }
  template:
    metadata:
      labels:
        app: nessie
        sidecar.istio.io/inject: "true"   # reach STRICT-mTLS Postgres
    spec:
      containers:
        - name: nessie
          image: ghcr.io/projectnessie/nessie:0.107.9
          ports:
            - { name: http, containerPort: 19120 }
            - { name: mgmt, containerPort: 9000 }   # Quarkus management/health (pod-local; not MinIO's 9000)
          env:
            # --- Postgres version store. GOTCHA: JDBC2 needs the *named* datasource (postgresql); mixing it
            # with the legacy unnamed QUARKUS_DATASOURCE_JDBC_URL silently fails to find the DB. Schema auto-migrates. ---
            - { name: NESSIE_VERSION_STORE_TYPE, value: JDBC2 }
            - { name: NESSIE_VERSION_STORE_PERSIST_JDBC_DATASOURCE, value: postgresql }
            - { name: QUARKUS_DATASOURCE_POSTGRESQL_DB_KIND, value: postgresql }
            - { name: QUARKUS_DATASOURCE_POSTGRESQL_JDBC_URL, value: "jdbc:postgresql://weyland-postgres.weyland.svc.cluster.local:5432/nessie" }
            - { name: QUARKUS_DATASOURCE_POSTGRESQL_USERNAME, value: nessie }
            - name: QUARKUS_DATASOURCE_POSTGRESQL_PASSWORD
              valueFrom: { secretKeyRef: { name: nessie-secret, key: postgres-password } }
            # --- Iceberg REST catalog → MinIO warehouse. PATH_STYLE_ACCESS + AUTH_TYPE=STATIC both mandatory
            # for MinIO+static creds; region required even for MinIO. Creds vended to clients by Nessie. ---
            - { name: NESSIE_CATALOG_DEFAULT_WAREHOUSE, value: warehouse }
            - { name: NESSIE_CATALOG_WAREHOUSES_WAREHOUSE_LOCATION, value: "s3://warehouse/" }
            - { name: NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_ENDPOINT, value: "http://minio.minio.svc.cluster.local:9000/" }
            - { name: NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_REGION, value: us-east-1 }
            - { name: NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_PATH_STYLE_ACCESS, value: "true" }
            - { name: NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_AUTH_TYPE, value: STATIC }
            - { name: NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_ACCESS_KEY, value: "urn:nessie-secret:quarkus:s3-creds" }
            - name: S3_CREDS_NAME      # the urn:nessie-secret 's3-creds.name' = MinIO access key
              valueFrom: { secretKeyRef: { name: nessie-secret, key: s3-access-key } }
            - name: S3_CREDS_SECRET    # 's3-creds.secret' = MinIO secret key
              valueFrom: { secretKeyRef: { name: nessie-secret, key: s3-secret-key } }
          readinessProbe:
            httpGet: { path: /q/health/ready, port: 9000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /q/health/live, port: 9000 }
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: nessie
  namespace: data-mesh
  labels: { app: nessie }
spec:
  type: ClusterIP
  selector: { app: nessie }
  ports:
    - { name: http, port: 19120, targetPort: 19120 }
---
# UI + Iceberg REST (/iceberg) + API v2 (/api/v2) all served on 19120. Forward-auth gates the lot.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nessie
  namespace: data-mesh
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: data-mesh-traefik-forward-auth@kubernetescrd
spec:
  tls:
    - hosts: [nessie.weyland.lab]
      secretName: weyland-wildcard-tls
  rules:
    - host: nessie.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: nessie, port: { number: 19120 } }
