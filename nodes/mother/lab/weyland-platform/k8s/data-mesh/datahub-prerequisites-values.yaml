# B1.3 — DataHub prerequisites (chart 0.3.0): bundled OpenSearch 2.19.5 + single-pod KRaft Kafka.
# DataHub uses its OWN bundled OpenSearch here (Apache-2.0, engine OPENSEARCH_2) — NOT the
# opensearch-ns 3.x playground. MySQL off (DataHub metadata store = the shared Postgres / datahub DB);
# neo4j off (graph rides OpenSearch). Kafka left at chart default (single-pod KRaft, no Zookeeper).

opensearch:
  enabled: true              # chart default — bundled OpenSearch 2.19.5 (security plugin already disabled)
  singleNode: true
  opensearchJavaOpts: "-Xms1g -Xmx1g"
  resources:
    requests:
      cpu: "50m"             # low reservation — node CPU requests are ~98% committed (actual use ~5%); bursts under limit
      memory: "2Gi"
    limits:
      memory: "2Gi"          # heap must be <= 50% of this

elasticsearch:
  enabled: false             # chart default — superseded by the bundled OpenSearch above

mysql:
  enabled: false             # DataHub metadata store = the shared Postgres (datahub DB)

neo4j:
  enabled: false             # graph rides OpenSearch, no Neo4j

# ── DISABLED 2026-08-29 — DataHub now uses REDPANDA (B88 follow-on) ─────────────────────────────
# This chart's bundled broker ran `docker.io/bitnamilegacy/kafka`: the namespace Bitnami froze when
# it moved its catalog behind a paid tier, which receives **no security updates**. B88's first
# Gatekeeper dryrun audit surfaced it as the one entry of 44 third-party publishers that made the
# estate less safe rather than merely unsigned.
#
# Redpanda was already running in this namespace, speaks the Kafka API, and auto-creates topics —
# so it replaced this broker outright. Verified 2026-08-29 after the repoint: all 8 DataHub topics
# created on redpanda, GMS ready with 0 restarts, both system-update Jobs Completed (including the
# DataHubUpgradeHistory rebuild), and the mae/mce/usage/doc-propagation consumer groups Stable.
# Catalog intact throughout — 175,388 Postgres aspect rows, 4,196 OpenSearch datasets — because
# DataHub's source of truth is Postgres + OpenSearch and Kafka is only the event bus.
#
# ⚠ `enabled: false` IS WHAT MAKES THE DELETION STICK. This app runs selfHeal, so
# `kubectl delete statefulset prerequisites-kafka-controller` alone is reverted within ~3 minutes
# (see the `argocd-gitops-gotchas` memory — the same mechanism that makes `argocd app rollback` a
# trap). The bootstrap repoint lives in `datahub-values.yaml` → `global.kafka.bootstrap.server`.
kafka:
  enabled: false
  # Resource block kept for the rollback path: re-enabling means flipping the flag above, not
  # reconstructing this from the chart defaults.
  controller:
    resources:
      requests: { memory: 1Gi, cpu: 250m }
      limits: { memory: 2Gi }   # actual ~1Gi; KRaft controller JVM heap must stay under this
