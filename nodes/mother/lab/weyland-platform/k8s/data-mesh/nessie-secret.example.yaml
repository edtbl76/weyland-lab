# Template only — the real secret is applied out-of-band (kubectl) and NEVER committed. Argo excludes *secret.example.yaml.
#   postgres-password = the `nessie` Postgres user's password
#   s3-access-key / s3-secret-key = MinIO credentials with access to the `warehouse` bucket
apiVersion: v1
kind: Secret
metadata:
  name: nessie-secret
  namespace: data-mesh
type: Opaque
stringData:
  postgres-password: CHANGE_ME
  s3-access-key: CHANGE_ME
  s3-secret-key: CHANGE_ME
