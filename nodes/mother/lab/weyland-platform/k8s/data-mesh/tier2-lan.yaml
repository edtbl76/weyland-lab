# B81 (JupyterHub notebook library, query nb 22) — LAN NodePort reach for the six Tier-2 stores.
#
# These stores' primary Services are ClusterIP: they were only ever queried IN-CLUSTER (by the dagster
# loaders / DataHub emitters), so no external endpoint existed. To reach them from rogueone (DataGrip, and the
# notebook-22 validation run) the lab convention is a dedicated `-lan` NodePort Service per store — the same
# pattern as `minio-s3-lan` / `sonarqube-api-lan` / `lakefs-lan` / `gizmosql`. NodePorts ONLY; never a
# `kubectl port-forward` workaround.
#
#   ClickHouse  192.168.1.243:30123 -> :8123  (HTTP interface; clickhouse-connect)
#   Cassandra   192.168.1.243:30942 -> :9042  (CQL native)
#   MongoDB     192.168.1.243:30017 -> :27017
#   CockroachDB 192.168.1.243:30257 -> :26257 (pg-wire; insecure dev mode)
#   TimescaleDB 192.168.1.243:30543 -> :5432  (pg-wire)
#   MySQL       192.168.1.243:30306 -> :3306
#
# All six pods are UNMESHED — plain protocol on the wire, no TLS; the store's own auth (or none, for the
# AllowAllAuthenticator Cassandra + insecure CockroachDB) is the gate. LAN-only lab; these ports are now LAN-
# reachable, so credentials remain the sole guard. NodePorts are all inside the 30000-32767 range and were
# free at creation (2026-09-01). Auto-synced by the existing `data-mesh` Argo app (whole-dir, selfHeal+prune).
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-lan
  namespace: data-mesh
  labels: { app: clickhouse }
spec:
  type: NodePort
  selector: { app: clickhouse }
  ports:
    - { name: http, port: 8123, targetPort: http, protocol: TCP, nodePort: 30123 }
---
apiVersion: v1
kind: Service
metadata:
  name: cassandra-lan
  namespace: data-mesh
  labels: { app: cassandra }
spec:
  type: NodePort
  selector: { app: cassandra }
  ports:
    - { name: cql, port: 9042, targetPort: cql, protocol: TCP, nodePort: 30942 }
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-lan
  namespace: data-mesh
  labels: { app: mongodb }
spec:
  type: NodePort
  selector: { app: mongodb }
  ports:
    - { name: mongodb, port: 27017, targetPort: mongodb, protocol: TCP, nodePort: 30017 }
---
apiVersion: v1
kind: Service
metadata:
  name: cockroachdb-lan
  namespace: data-mesh
  labels: { app: cockroachdb }
spec:
  type: NodePort
  selector: { app: cockroachdb }
  ports:
    - { name: sql, port: 26257, targetPort: sql, protocol: TCP, nodePort: 30257 }
---
apiVersion: v1
kind: Service
metadata:
  name: timescaledb-lan
  namespace: data-mesh
  labels: { app: timescaledb }
spec:
  type: NodePort
  selector: { app: timescaledb }
  ports:
    - { name: tcp-postgres, port: 5432, targetPort: tcp-postgres, protocol: TCP, nodePort: 30543 }
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-lan
  namespace: data-mesh
  labels: { app: mysql }
spec:
  type: NodePort
  selector: { app: mysql }
  ports:
    - { name: tcp-mysql, port: 3306, targetPort: tcp-mysql, protocol: TCP, nodePort: 30306 }
