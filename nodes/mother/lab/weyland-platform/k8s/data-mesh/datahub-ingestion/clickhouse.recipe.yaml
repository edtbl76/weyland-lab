# DataHub managed-ingestion recipe — ClickHouse (Tier-2 columnar OLAP: datasets_music + datasets_health).
# Source-of-record for the ALREADY-LIVE UI-configured source (no committed recipe before → non-durable).
# In-cluster HTTP (:8123). The `default` user HAS a password (set via the users.d/weyland-users.xml Secret) —
# DataHub's clickhouse-sqlalchemy can't auth against a no-password user, which is exactly why that password
# exists. ${CLICKHOUSE_PASSWORD} = pod ENV on acryl-datahub-actions (data-mesh/datahub-ingestion-secrets,
# durable) = weyland_dev_password. Profiling cheap (columnar). Schedule: weekly (Sun). See [[clickhouse-tier2-hydration]].
source:
  type: clickhouse
  config:
    host_port: "clickhouse.data-mesh.svc.cluster.local:8123"
    username: "default"
    password: "${CLICKHOUSE_PASSWORD}"
    database_pattern:
      allow:
        - "datasets_music"
        - "datasets_health"
    profiling:
      enabled: false
