# DataHub managed-ingestion recipe — MongoDB (datasets_* collections + aidlc-kb).
# Source-of-record only (the live source is UI-configured). MONGO_PASSWORD is injected as pod ENV on the
# acryl-datahub-actions pod (data-mesh/datahub-ingestion-secrets) — NOT a UI-entered DataHub Secret — so it
# survives GMS resets. Value = the shared lab dev cred (see runbooks/secrets.md). Mongo is meshed; the executor
# reaches it over the cluster svc. Schema inferred by sampling (Mongo is schemaless). Schedule: daily.
source:
  type: mongodb
  config:
    # Creds embedded IN the URI (with authSource=admin) — the separate username/password fields didn't
    # authenticate ("Command listDatabases requires authentication"). ${MONGO_PASSWORD} is pod env (durable).
    connect_uri: "mongodb://weyland:${MONGO_PASSWORD}@mongodb.data-mesh.svc.cluster.local:27017/?authSource=admin"
    enableSchemaInference: true
    useRandomSampling: true
    maxSchemaSize: 300
    database_pattern:
      deny:
        - "^(admin|config|local)$"
    env: PROD
