# DataHub managed-ingestion recipe — Iceberg (Nessie REST catalog + MinIO warehouse).
# Source-of-record only (the live source is UI-configured). MINIO_ACCESS_KEY/SECRET are
# DataHub Secrets (Ingestion → Secrets), sourced from nessie-secret's S3 creds.
source:
  type: iceberg
  config:
    processing_threads: 1
    catalog:
      nessie:
        type: rest
        uri: "http://nessie.data-mesh.svc.cluster.local:19120/iceberg"
        warehouse: "warehouse"
        s3.endpoint: "http://minio.minio.svc.cluster.local:9000"
        s3.region: "us-east-1"
        s3.path-style-access: "true"
        s3.access-key-id: "${MINIO_ACCESS_KEY}"
        s3.secret-access-key: "${MINIO_SECRET_KEY}"
    profiling:
      enabled: true
      profile_table_level_only: true   # B80 Stats-wide: row count + size only — cheap, no per-column histogram scans
