# DataHub managed-ingestion recipe — Postgres (ALL databases on weyland-postgres).
# Source-of-record only (UI-configured). Connects over the mesh to STRICT-mTLS weyland-postgres (the
# executor is meshed). Omitting `database` ingests EVERY DB on the instance — weyland, dagster, mlflow,
# nessie, lakefs, datahub, keycloak, sonarqube, glitchtip, unleash — so it needs a role that can read
# them all = the Postgres SUPERUSER (POSTGRES_USER in weyland-postgres-secret). If that superuser IS
# `weyland`, username below is correct and the password is dagster-postgres-secret/password
# (= weyland-postgres-secret/POSTGRES_PASSWORD). If it's a different superuser, set username to it and
# point the DataHub Secret at weyland-postgres-secret/POSTGRES_PASSWORD.
# Catalogs tables/views/columns (+ view lineage) across all DBs. database_pattern trims the noise.
# Schedule: daily.
source:
  type: postgres
  config:
    host_port: "weyland-postgres.weyland.svc.cluster.local:5432"
    username: "weyland"
    password: "${WEYLAND_PG_PASSWORD}"
    database_pattern:
      deny:
        - "^template[0-9]$"
    profiling:
      enabled: true
      profile_table_level_only: true   # B80 Stats-wide: row count + size only — cheap, no per-column histogram scans
