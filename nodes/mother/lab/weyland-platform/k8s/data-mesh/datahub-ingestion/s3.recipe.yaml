# DataHub managed-ingestion recipe — S3 (MinIO) datasets lake. ONE source, many datasets.
# Source-of-record only (UI-configured). MINIO_ACCESS_KEY/SECRET are DataHub Secrets.
#
# Catalogs the bronze→silver `datasets` lake (B72): raw CSVs + their converted Parquet, one dataset
# per {table} folder, schema inferred. The s3 source only handles STRUCTURED files (CSV/Parquet/
# JSON/Avro) — it SKIPS Markdown, so the aidlc-kb corpus is NOT here (it's represented via the Dagster
# aidlc_kb_ingest asset). The warehouse bucket is cataloged by the Iceberg source, not s3 (redundant).
# Profiling needs Spark → left off. Schedule: daily.
source:
  type: s3
  config:
    aws_config:
      aws_endpoint_url: "http://minio.minio.svc.cluster.local:9000"
      aws_access_key_id: "${MINIO_ACCESS_KEY}"
      aws_secret_access_key: "${MINIO_SECRET_KEY}"
      aws_region: "us-east-1"
    # CSV (bronze) + Parquet + Avro (silver). The s3 source supports CSV/Parquet/JSON/Avro only —
    # Arrow/Feather and Lance have NO s3-source support, so those two zones aren't catalogued here
    # (custom-emit a dataset entry if they need to appear). Iceberg gold tables = the iceberg source.
    path_specs:
      - include: "s3://datasets/raw/{table}/*.csv"
      - include: "s3://datasets/parquet/{table}/*.parquet"
      - include: "s3://datasets/avro/{table}/*.avro"
    env: "PROD"
    profiling:
      enabled: false
