# DataHub managed-ingestion recipe — S3 (MinIO) for the aidlc-kb RAG corpus bucket.
# Source-of-record only (UI-configured). MINIO_ACCESS_KEY/SECRET are DataHub Secrets.
#
# Scope note (storage→DataHub completeness): only `aidlc-kb` is cataloged here. The `warehouse`
# bucket is already cataloged structurally by the Iceberg source (tables + schema), and the
# Dagster assets represent the pipeline outputs — so an s3 raw-file pass over those is redundant.
# `lakefs` is lakeFS-internal storage and lakeFS has no native DataHub connector — intentionally skipped.
source:
  type: s3
  config:
    platform: s3
    aws_config:
      aws_endpoint_url: "http://minio.minio.svc.cluster.local:9000"
      aws_access_key_id: "${MINIO_ACCESS_KEY}"
      aws_secret_access_key: "${MINIO_SECRET_KEY}"
      aws_region: "us-east-1"
    path_specs:
      - include: "s3://aidlc-kb/**/*.md"
    use_s3_bucket_tags: false
    use_s3_object_tags: false
