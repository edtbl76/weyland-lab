# DataHub managed-ingestion recipe — Lightdash (dbt-native BI over the marts).
# Source-of-record only (UI-configured). Catalogs Lightdash dashboards/charts/explores AND draws lineage from
# each chart back to the dbt models it's built on — so DataHub gets the BI layer: gold → dbt mart → Lightdash.
# In-cluster svc (`lightdash` ClusterIP :8080, NOT the own-login ingress). ${LIGHTDASH_API_KEY} = a Lightdash
# personal-access-token, injected as pod ENV on the acryl-datahub-actions pod (data-mesh/datahub-ingestion-secrets
# → durable across GMS resets, NOT a UI DataHub Secret). Mint it in Lightdash → Settings → Personal access tokens.
# Schedule: daily.
source:
  type: lightdash
  config:
    instance: "http://lightdash.data-mesh.svc.cluster.local:8080"
    api_key: "${LIGHTDASH_API_KEY}"
