# DataHub managed-ingestion recipe — dbt (the B1.5 transform tier).
# Source-of-record only (UI-configured: Ingestion → Sources → Create → paste this recipe).
#
# Emits the dbt models, their TESTS (as DataHub assertions), model/column docs, and model→model +
# source→model (+ column-level) lineage — the richer view the hand-rolled `datahub_emit.emit_dbt`
# can't produce. With `target_platform: trino` the models are siblinged onto the SAME Trino dataset
# URNs the marts already have (`iceberg.<schema>.<table>`, e.g. iceberg.dbt.mart_spotify_audio), so
# the dbt-platform node and the trino-platform node merge into one entity in the catalog. The dbt
# `source.*` nodes resolve to the Iceberg gold tables (also trino URNs) → full gold → staging → mart
# lineage with tests attached.
#
# Artifacts are read from MinIO (`s3://warehouse/_dbt_artifacts/`), published by the weyland_dbt_assets run (which runs
# `dbt docs generate` against a LIVE Trino — reliable, unlike the dbt-docs pod's boot-time generate that left
# catalog.json missing → the connector died on JSONDecodeError). This decouples the connector from the dbt-docs
# pod lifecycle and gives it BOTH manifest + catalog (so column TYPES/STATS land, not just lineage).
#
# BOOTSTRAP: the s3:// objects only exist after a publish — run once before the first ingestion:
#   kubectl -n weyland exec deploy/dagster-user-code -- python /app/scripts/publish_dbt_artifacts.py
# thereafter the weekly weyland_dbt_assets run refreshes them.
#
# Creds: MINIO_ACCESS_KEY/SECRET are the SAME DataHub Secrets the iceberg recipe uses (nessie-secret S3 creds),
# which own the `warehouse` bucket. path-style addressing is required for MinIO (no virtual-host DNS).
# FALLBACK if the s3 read misbehaves: revert to manifest-only over HTTP —
#   manifest_path: "http://dbt-docs.weyland.svc.cluster.local:8080/manifest.json"  (drop catalog_path + aws_connection)
# Schedule: daily.
source:
  type: dbt
  config:
    manifest_path: "s3://warehouse/_dbt_artifacts/manifest.json"
    catalog_path: "s3://warehouse/_dbt_artifacts/catalog.json"
    aws_connection:
      aws_endpoint_url: "http://minio.minio.svc.cluster.local:9000"
      aws_access_key_id: "${MINIO_ACCESS_KEY}"
      aws_secret_access_key: "${MINIO_SECRET_KEY}"
      aws_region: "us-east-1"
      aws_advanced_config:
        s3:
          addressing_style: path   # MinIO needs path-style (bucket in path, not virtual-host)
    # the marts are Iceberg tables queried through Trino — same platform the marts are cataloged under,
    # so dbt models sibling onto iceberg.dbt.mart_* instead of creating a parallel set of nodes.
    target_platform: trino
    # column-level lineage parsed from the compiled model SQL in the manifest.
    include_column_lineage: true
    entities_enabled:
      test_results: Yes
      test_definitions: Yes
      models: Yes
      sources: Yes
      seeds: Yes
      snapshots: Yes
    stateful_ingestion:
      enabled: true
      remove_stale_metadata: true
