# MusicBrainz DB import Job — runs musicbrainz-docker's OWN importer (createdb.sh -fetch) against our dedicated
# musicbrainz-postgres instance. mbdocker is MB's official tooling, so the schema ALWAYS matches the current
# dump — the fidelity that community mbslave (stuck on 2024's schema 29) couldn't give.
#
# WHY not compose: mbdocker is compose-native, but we only need its IMAGE, not its stack. We build the image
# once on mother (docker compose build) → import to containerd → run the importer as this k8s Job pointed at
# our external instance (MUSICBRAINZ_POSTGRES_SERVER). No compose stack, no snowflake; refresh = re-run this Job
# (a CronJob later). The instance holds the data; this Job is the transient importer.
#
# The importer connects as musicbrainz/musicbrainz (mbdocker's postgres.env default) — provisioned as a
# SUPERUSER in the instance so createdb.sh can create the DB + the cube/earthdistance extensions.
apiVersion: batch/v1
kind: Job
metadata:
  name: musicbrainz-import
  namespace: data-mesh
  labels:
    app: musicbrainz-import
spec:
  backoffLimit: 0        # a multi-hour 100GB import must NOT silently auto-retry — inspect + rerun deliberately
  template:
    metadata:
      labels:
        app: musicbrainz-import
        # Disable Istio injection via the LABEL (data-mesh uses revision-based injection, which ignores the
        # annotation form). The import talks to the un-meshed instance directly, so it needs no sidecar.
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      containers:
        - name: musicbrainz
          image: musicbrainz-mb-import:local
          imagePullPolicy: Never          # built on mother + imported into containerd (docker save | ctr import)
          # fetch-dump.sh prompts interactively ("commercial or non-commercial?") and dies on EOF in a non-TTY
          # container. It skips the prompt if a marker file exists — so pre-touch the non-commercial one
          # (homelab use) in the shared dbdump volume, then exec the real import. `sh -c` runs under the image's
          # docker-entrypoint (which sets up local::lib), so createdb.sh keeps its Perl env.
          args:
            - sh
            - -c
            - touch /media/dbdump/.for-non-commercial-use && exec createdb.sh -fetch
          env:
            - name: MUSICBRAINZ_POSTGRES_SERVER
              value: musicbrainz-postgres.data-mesh.svc.cluster.local
            - name: MUSICBRAINZ_POSTGRES_READONLY_SERVER
              value: musicbrainz-postgres.data-mesh.svc.cluster.local
            - name: POSTGRES_USER
              value: musicbrainz
            - name: POSTGRES_PASSWORD
              value: musicbrainz
          volumeMounts:
            - name: dbdump
              mountPath: /media/dbdump    # createdb.sh -fetch downloads + extracts the dump tarballs here
      volumes:
        - name: dbdump
          persistentVolumeClaim:
            claimName: musicbrainz-dbdump   # persist the downloaded dumps across retries (createdb.sh reuses
                                            # "existing dumps" instead of re-fetching ~15GB every run)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: musicbrainz-dbdump
  namespace: data-mesh
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 40Gi
