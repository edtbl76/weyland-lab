# B65 Tier-2 — Trino: single-node federation query engine (the keystone Superset/dbt/B73 sit on).
# RUN MODE: always-on (~2GB heap) — revisit KEDA scale-to-zero at the footprint gate (cold start ~min).
# DATA: federates EXISTING real stores — iceberg (Nessie REST + MinIO: the datasets.* music gold + eval)
#   and postgres (weyland DB). No data of its own.
# Meshed (sidecar) → reaches STRICT-mTLS Postgres + PERMISSIVE Nessie/MinIO. In-cluster clients hit the
# svc directly (ungated); the web UI is forward-auth gated at the ingress. Creds from trino-secret
# (data-mesh ns, imperative — MINIO_ACCESS_KEY/MINIO_SECRET_KEY/WEYLAND_PG_PASSWORD). Deployed by the
# data-mesh Argo app (push → sync). Image pinned to 468 — bump to latest stable as desired.
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-config
  namespace: data-mesh
data:
  config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=true
    http-server.http.port=8080
    discovery.uri=http://localhost:8080
    query.max-memory=2GB
    query.max-memory-per-node=2GB
    # Behind Traefik + Istio, which add X-Forwarded-* headers; Trino's Jetty rejects forwarded requests
    # by default (406 "does not allow processing of the X-Forwarded-For header"). Trust the proxy.
    http-server.process-forwarded=true
    # B233 — the password front door. Without an authenticator every caller self-asserted X-Trino-User, so Ranger's
    # per-user policies could be bypassed by claiming a privileged name. Each caller now has its own identity and
    # password (password.db, bcrypt; scripts/trino-credentials.sh). Trino accepts a password ONLY over HTTPS, so 8443
    # serves TLS with a cert from the lab's mkcert CA (clients verify it with weyland-mkcert-ca).
    http-server.authentication.type=PASSWORD
    http-server.https.enabled=true
    http-server.https.port=8443
    http-server.https.keystore.path=/etc/trino/auth/tls.pem
    internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}
    # The web UI runs as a fixed read-only identity: Keycloak forward-auth already gates trino.weyland.lab to the
    # owner, so a second Trino login would add nothing (owner decision, 2026-10-23).
    web-ui.authentication.type=fixed
    web-ui.user=trino-ui
    # TRANSITION (stage 1-2 of runbooks/trino.md § Authentication): plain HTTP on 8080 still trusts X-Trino-User, so
    # nothing breaks while callers move to 8443 one by one. In Trino 468 this flag means exactly that: on HTTP,
    # authentication is NOT checked (a no-credential request got 200 on the throwaway). Stage 3 sets it false, after
    # which 8080 answers only Traefik's UI path (X-Forwarded-Proto: https) and refuses everything else.
    http-server.authentication.allow-insecure-over-http=true
  password-authenticator.properties: |
    password-authenticator.name=file
    file.password-file=/etc/trino/auth/password.db
  jvm.config: |
    -server
    -Xmx4G
    -XX:+UseG1GC
    -XX:G1HeapRegionSize=32M
    -XX:+ExitOnOutOfMemoryError
    -XX:-OmitStackTraceInFastThrow
    -Djdk.attach.allowAttachSelf=true
  node.properties: |
    node.environment=production
    node.data-dir=/data/trino
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-catalogs
  namespace: data-mesh
data:
  iceberg.properties: |
    connector.name=iceberg
    # Trino's NATIVE Nessie catalog (Nessie API v2), not the generic REST client — the generic
    # iceberg.catalog.type=rest path 403'd against Nessie's /iceberg endpoint (client-side, infra proven
    # clean: curl from the pod → Nessie returns 200). Reads the same `main` ref pyiceberg writes to.
    iceberg.catalog.type=nessie
    iceberg.nessie-catalog.uri=http://nessie.data-mesh.svc.cluster.local:19120/api/v2
    iceberg.nessie-catalog.ref=main
    iceberg.nessie-catalog.default-warehouse-dir=s3://warehouse
    fs.native-s3.enabled=true
    s3.endpoint=http://minio.minio.svc.cluster.local:9000
    s3.path-style-access=true
    s3.region=us-east-1
    s3.aws-access-key=${ENV:MINIO_ACCESS_KEY}
    s3.aws-secret-key=${ENV:MINIO_SECRET_KEY}
  postgresql.properties: |
    connector.name=postgresql
    connection-url=jdbc:postgresql://weyland-postgres.weyland.svc.cluster.local:5432/weyland
    connection-user=weyland
    connection-password=${ENV:WEYLAND_PG_PASSWORD}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
  namespace: data-mesh
  labels: { app: trino }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: trino } }
  template:
    metadata:
      labels:
        app: trino
        sidecar.istio.io/inject: "true"   # STRICT-mTLS Postgres + mesh to Nessie/MinIO
      annotations:
        proxy.istio.io/config: '{"accessLogFile": "/dev/stdout"}'   # sidecar access logs (debug + ops visibility)
    spec:
      containers:
        - name: trino
          image: trinodb/trino:468  # nosemgrep: yaml.kubernetes.security.run-as-non-root.run-as-non-root
          # B47 hardening: drop priv-esc + seccomp (see arch)
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          ports:
            - { name: http, containerPort: 8080 }
            - { name: https, containerPort: 8443 }
          envFrom:
            - secretRef: { name: trino-secret }
          env:
            # B233 — internal-communication.shared-secret (required once an authenticator is on). Not optional: a
            # missing Secret must stop the rollout loudly, not start Trino without it.
            - name: TRINO_SHARED_SECRET
              valueFrom: { secretKeyRef: { name: trino-auth, key: TRINO_SHARED_SECRET } }
            # 2026-10-21: the container's working set creeps ~0.4 GiB/day after each restart (1.2 → 4.4 GiB over a week,
            # Prometheus), all outside the 4G heap, until the Sunday dbt build tips it over the 8Gi limit (OOMKilled
            # 10-11 and 10-18). glibc gives every busy thread its own malloc arena and rarely returns them; capping the
            # arenas is the standard fix for that JVM native-memory growth. An EXPERIMENT: if the daily climb does not
            # flatten (runbooks/trino.md § Memory creep), the next suspect is the Ranger plugin's native/Truffle memory.
            - { name: MALLOC_ARENA_MAX, value: "2" }
          readinessProbe:
            # B233: on the TLS port, so the probe also proves the cert loaded. /v1/info needs no credential.
            httpGet: { path: /v1/info, port: 8443, scheme: HTTPS }
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - { name: config, mountPath: /etc/trino/config.properties, subPath: config.properties }
            - { name: config, mountPath: /etc/trino/jvm.config, subPath: jvm.config }
            - { name: config, mountPath: /etc/trino/node.properties, subPath: node.properties }
            - { name: config, mountPath: /etc/trino/password-authenticator.properties, subPath: password-authenticator.properties }
            - { name: auth, mountPath: /etc/trino/auth, readOnly: true }   # password.db + tls.pem (B233)
            - { name: catalogs, mountPath: /etc/trino/catalog }
            # A2 — native Ranger access control (default-deny; the trino Ranger service has public-allow policies).
            # Rollback = remove these 3 mounts + the ranger volume, restart Trino.
            - { name: ranger, mountPath: /etc/trino/access-control.properties, subPath: access-control.properties }
            - { name: ranger, mountPath: /etc/trino/ranger-trino-security.xml, subPath: ranger-trino-security.xml }
            - { name: ranger, mountPath: /etc/trino/ranger-trino-audit.xml, subPath: ranger-trino-audit.xml }
            - { name: data, mountPath: /data/trino }
          resources:
            # memory 3Gi -> 5.5Gi (B134, 2026-08-27). THE ONLY POD ON THIS NODE WITH A DEMONSTRATED
            # FAILURE FROM UNDER-RESERVATION: OOMKilled 2026-08-23, 16 restarts. Measured over 7 days
            # it sits at p50 4.91Gi / p95 6.80Gi against a 3Gi request — the scheduler believed it
            # occupied 3Gi while it held nearly 5, so new pods were placed into space Trino was
            # already using. The limit stays 8Gi; this raises the FLOOR, it does not cap anything.
            #
            # 5.5 not 6.8: requests must sum under 72Gi allocatable, and honest per-pod reservations
            # across this cluster sum to ~97Gi (see below). 5.5 covers steady state with headroom and
            # leaves the dbt-run peaks to the limit.
            requests: { cpu: "150m", memory: 5.5Gi }
            # 8Gi limit for a 4G heap. History: 2G heap / 3Gi limit OOM-crashed under dbt's Iceberg aggregations;
            # raised to 4G heap / 6Gi. That 6Gi assumed "4G heap + ~2G off-heap/G1/direct + sidecar" — a budget
            # computed BEFORE the L5 Ranger plugin. Ranger runs a GraalVM/Truffle JavaScript engine inside the
            # coordinator (RangerScriptConditionEvaluator) plus its policy engine + tag refresher, and that cost is
            # NON-HEAP (native/metaspace/Truffle). So the container hit its ceiling while the heap was fine:
            # OOMKilled/137 mid-`dbt build`, surfacing to dbt as `error 503: service unavailable` at model 34 of 37
            # (2026-07-20). Raising -Xmx would have made it WORSE — the heap was never the thing overflowing.
            # Deliberately limit-only: the REQUEST stays 3Gi because node memory requests are already ~92%, and
            # raising the request could make Trino unschedulable. Only the ceiling moves.
            limits: { memory: 8Gi }
      volumes:
        - { name: config, configMap: { name: trino-config } }
        - { name: catalogs, configMap: { name: trino-catalogs } }
        - { name: ranger, configMap: { name: trino-ranger } }
        - name: auth
          secret:
            secretName: trino-auth
            items: [{ key: password.db, path: password.db }, { key: tls.pem, path: tls.pem }]
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: trino
  namespace: data-mesh
  # `labels` IS LOad-BEARING and its absence cost 59 days of Trino metrics (B148). The ServiceMonitor
  # below selects SERVICES by `matchLabels: {app: trino}`, and that reads THIS block — not the
  # `spec.selector` on the next line, which selects PODS. Both say `app: trino`, which is exactly why
  # the manifest looked correct: the two selectors point at different objects.
  #
  # With this empty, no Service matched, so Prometheus never created a scrape pool and there was no
  # `up{job="trino"}` series to be missing — `kubectl get servicemonitor` said 60d, the Grafana panel
  # looked idle, and nothing anywhere reported a fault. scripts/check-servicemonitor-coverage.sh now
  # reconciles every ServiceMonitor against the workload it monitors so this cannot recur silently.
  labels: { app: trino }
spec:
  selector: { app: trino }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
    - { name: https, port: 8443, targetPort: 8443 }   # B233 — the only port that accepts a password
---
# Trino exposes OpenMetrics at /metrics on the HTTP port (built-in since Trino 424). Prometheus
# auto-discovers this ServiceMonitor (serviceMonitorSelectorNilUsesHelmValues:false); query in
# Grafana Explore (PromQL: trino_*) once scraping. data-mesh is PERMISSIVE mesh → plaintext scrape OK.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: trino
  namespace: data-mesh
  labels: { app: trino }
spec:
  selector:
    matchLabels: { app: trino }
  endpoints:
    - port: https
      scheme: https
      path: /metrics
      interval: 30s
      # B233: /metrics needs an authenticated user, and a password is accepted only over HTTPS (the plain port
      # answers a Basic-auth scrape with 401 even in the transition mode — measured on the throwaway). Prometheus
      # logs in as `prometheus` (trino-metrics-auth, written by scripts/trino-credentials.sh) and verifies the cert.
      tlsConfig:
        ca: { secret: { name: weyland-mkcert-ca, key: rootCA.pem } }
        serverName: trino.data-mesh.svc.cluster.local
      basicAuth:
        username: { name: trino-metrics-auth, key: username }
        password: { name: trino-metrics-auth, key: password }
---
# Alert must FIRE, not just sit on a dashboard → Alertmanager → Telegram. Trino down = no query engine
# for Superset/dbt/B73. kube_deployment_status_replicas_available is from kube-state-metrics (always scraped),
# so this fires even if Trino's own /metrics scrape is broken.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: trino-alerts
  namespace: data-mesh
  labels: { app: trino }
spec:
  groups:
    - name: trino
      rules:
        - alert: TrinoDown
          expr: kube_deployment_status_replicas_available{namespace="data-mesh", deployment="trino"} == 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Trino has 0 available replicas — the federation query engine is down (Superset/dbt/B73 blocked)."
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trino
  namespace: data-mesh
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: data-mesh-traefik-forward-auth@kubernetescrd
spec:
  tls:
    - hosts: [trino.weyland.lab]
      secretName: weyland-wildcard-tls
  rules:
    - host: trino.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: trino, port: { number: 8080 } }
