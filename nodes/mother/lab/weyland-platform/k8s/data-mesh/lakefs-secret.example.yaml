# Template only — the real secret is applied out-of-band (kubectl) and NEVER committed. Argo excludes *secret.example.yaml.
#   database-connection-string = postgres://lakefs:<pw>@weyland-postgres.weyland.svc.cluster.local:5432/lakefs?sslmode=disable
#                                (sslmode=disable — the istio sidecar does the mTLS to STRICT Postgres)
#   s3-access-key / s3-secret-key = MinIO credentials with access to the `lakefs` bucket
#   encrypt-key = openssl rand -hex 32  — STABLE forever; changing it invalidates every stored credential
apiVersion: v1
kind: Secret
metadata:
  name: lakefs-secret
  namespace: data-mesh
type: Opaque
stringData:
  database-connection-string: CHANGE_ME
  s3-access-key: CHANGE_ME
  s3-secret-key: CHANGE_ME
  encrypt-key: CHANGE_ME
