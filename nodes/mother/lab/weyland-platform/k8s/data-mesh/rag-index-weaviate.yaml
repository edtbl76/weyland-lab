# rag-index consumer — weaviate (B-RAG-STREAM step 5). Own group, replays rag.chunks from earliest.
# SIDECAR OFF: streaming plane; weaviate is permissive-meshed, reached over plaintext http+grpc (like qdrant).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-index-weaviate
  namespace: data-mesh
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rag-index-weaviate
  template:
    metadata:
      labels:
        app: rag-index-weaviate
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: rag-index
          image: weyland-rag-index:local
          imagePullPolicy: Never
          env:
            - name: STORE
              value: weaviate
            - name: GROUP_ID
              value: rag-index-weaviate
            - name: REDPANDA_BOOTSTRAP
              value: redpanda.data-mesh.svc.cluster.local:9092
            - name: SCHEMA_REGISTRY_URL
              value: http://redpanda.data-mesh.svc.cluster.local:8081
            - name: WEAVIATE_HOST
              value: weaviate.weyland.svc.cluster.local
            - name: WEAVIATE_PORT
              value: "8080"
            - name: WEAVIATE_GRPC_PORT
              value: "50051"
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
