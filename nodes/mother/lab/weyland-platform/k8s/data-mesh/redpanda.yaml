# Redpanda (B1.5 streaming — the always-on DATA PLANE) — Kafka-wire broker + BUILT-IN Schema Registry in one
# binary (no ZooKeeper, KRaft). Serves the grid `Redpanda`/`Avro/Kafka` column (event-stream datasets), the
# B73 Avro-in-motion demo, Debezium CDC (via a Kafka Connect worker, added separately), and the future Flink
# target. Isolated from DataHub's internal Kafka (its metadata bus) so a DataHub reset can't nuke our topics.
# Single-node, --overprovisioned (disables Seastar CPU busy-poll — essential on the CPU-tight shared node),
# RF=1. Sidecar OFF: the Kafka protocol is opaque long-lived TCP; a meshed client (Dagster, PERMISSIVE) reaches
# a non-meshed broker fine — and it dodges the half-open-Bolt-behind-Envoy stall class we hit with neo4j.
# Ports: 9092 kafka · 8081 schema-registry · 8082 http-proxy · 9644 admin · 33145 rpc.
# Console UI at redpanda.weyland.lab (forward-auth). See docs/runbooks (redpanda) + backlog B1.5.
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: data-mesh
  labels:
    app: redpanda
spec:
  clusterIP: None                 # headless — StatefulSet stable pod DNS; clients bootstrap redpanda.data-mesh.svc:9092
  publishNotReadyAddresses: true  # so the advertised pod DNS resolves during broker bring-up
  selector:
    app: redpanda
  ports:
    - { name: kafka, port: 9092 }
    - { name: schema-registry, port: 8081 }
    - { name: http-proxy, port: 8082 }
    - { name: admin, port: 9644 }
    - { name: rpc, port: 33145 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: data-mesh
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
          command: ["/usr/bin/rpk"]
          args:
            - redpanda
            - start
            - --smp=1
            - --overprovisioned              # no thread-per-core busy-poll — mandatory on the shared/tight node
            - --memory=1500M
            - --reserve-memory=0M
            - --node-id=0
            - --check=false                  # skip the production-tuning preflight (dev/lab broker)
            - --kafka-addr=PLAINTEXT://0.0.0.0:9092
            # advertised MUST be cluster-resolvable — clients bootstrap, then reconnect to this pod DNS
            - --advertise-kafka-addr=PLAINTEXT://redpanda-0.redpanda.data-mesh.svc.cluster.local:9092
            - --pandaproxy-addr=0.0.0.0:8082
            - --schema-registry-addr=0.0.0.0:8081
            - --rpc-addr=0.0.0.0:33145
            - --advertise-rpc-addr=redpanda-0.redpanda.data-mesh.svc.cluster.local:33145
          ports:
            - { containerPort: 9092, name: kafka }
            - { containerPort: 8081, name: schema-reg }
            - { containerPort: 8082, name: http-proxy }
            - { containerPort: 9644, name: admin }
            - { containerPort: 33145, name: rpc }
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { memory: 2Gi }          # --memory 1500M Seastar heap + overhead
          readinessProbe:
            httpGet: { path: /v1/status/ready, port: 9644 }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: redpanda-data
              mountPath: /var/lib/redpanda/data
  volumeClaimTemplates:
    - metadata:
        name: redpanda-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
---
# Redpanda Console — the streaming UI (topics, schemas, consumer groups, message browse). Read-mostly; the
# learning surface. Config points at the broker's Kafka + Schema Registry + Admin API (all in-cluster).
apiVersion: v1
kind: ConfigMap
metadata:
  name: redpanda-console-config
  namespace: data-mesh
data:
  config.yaml: |
    kafka:
      brokers: ["redpanda.data-mesh.svc.cluster.local:9092"]
      schemaRegistry:
        enabled: true
        urls: ["http://redpanda.data-mesh.svc.cluster.local:8081"]
    redpanda:
      adminApi:
        enabled: true
        urls: ["http://redpanda.data-mesh.svc.cluster.local:9644"]
    server:
      listenPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-console
  namespace: data-mesh
  labels:
    app: redpanda-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda-console
  template:
    metadata:
      labels:
        app: redpanda-console
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: console
          image: docker.redpanda.com/redpandadata/console:v2.7.2
          args: ["--config.filepath=/etc/console/config.yaml"]
          ports:
            - { containerPort: 8080, name: http }
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/console
      volumes:
        - name: config
          configMap:
            name: redpanda-console-config
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda-console
  namespace: data-mesh
  labels:
    app: redpanda-console
spec:
  selector:
    app: redpanda-console
  ports:
    - { name: http, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redpanda-console
  namespace: data-mesh
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: data-mesh-traefik-forward-auth@kubernetescrd
spec:
  tls:
    - hosts: [redpanda.weyland.lab]
      secretName: weyland-wildcard-tls
  rules:
    - host: redpanda.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: redpanda-console, port: { number: 8080 } }
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: redpanda-alerts
  namespace: data-mesh
  labels: { app: redpanda }
spec:
  groups:
    - name: redpanda
      rules:
        - alert: RedpandaDown
          expr: kube_statefulset_status_replicas_ready{namespace="data-mesh", statefulset="redpanda"} == 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Redpanda StatefulSet has 0 ready replicas — the streaming data plane is down (topics/CDC/producers blocked)."
