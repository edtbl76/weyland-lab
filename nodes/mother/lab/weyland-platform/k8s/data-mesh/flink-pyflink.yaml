# B83 Job 4 - PyFlink (music) as an APPLICATION-MODE FlinkDeployment (its own cluster), NOT a FlinkSessionJob.
# Application mode lets the operator run a local:// entry (the flink-python driver jar baked in the dist) - unlike
# session mode, which forced the http jar-server for the SQL/Java jobs. Isolated image weyland-flink-py:local keeps
# the ~1GB python+pyflink runtime off the shared session cluster and its running CDC job. Bounded job: it reads the
# lastfm replay to completion, then FINISHES - delete this FlinkDeployment afterward (no steady-state cost).
# SIDECAR OFF (streaming plane, long-lived Kafka TCP). No S3/AWS env - the sink is upsert-kafka, not Iceberg.
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: flink-pyflink
  namespace: data-mesh
spec:
  image: registry.weyland.lab/weyland-flink-py:git-7f12ae0c
  imagePullPolicy: IfNotPresent
  flinkVersion: v1_20
  serviceAccount: flink
  podTemplate:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        # AWS_* creds for the S3 archive write (job history -> MinIO). Same nessie-secret + region the session
        # cluster uses; the default Hadoop/S3FileIO credential chain reads them. Merges into JM + TM.
        - name: flink-main-container
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: nessie-secret, key: s3-access-key } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: nessie-secret, key: s3-secret-key } }
            - name: AWS_REGION
              value: us-east-1
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "1"
    # Prometheus reporter, same as the session cluster - JM+TM expose /metrics on :9249 (B83 observability).
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: "9249"
    # Archive the FINISHED bounded job to the SAME dir the session cluster uses, so the shared History Server
    # (flink-history.weyland.lab) lists this app-mode run too. Needs the s3-fs-hadoop plugin (in the image) + the
    # AWS_* env above. s3.path.style.access for MinIO.
    jobmanager.archive.fs.dir: s3://warehouse/_flink/completed-jobs
    s3.endpoint: http://minio.minio.svc.cluster.local:9000
    s3.path.style.access: "true"
  jobManager:
    resource:
      memory: "1024m"
      cpu: 0.25
  taskManager:
    resource:
      memory: "1600m"      # extra headroom over the Java jobs: the PyFlink worker runs a separate python process
      cpu: 0.5
  job:
    # The python driver jar ships in the dist; application mode runs it locally on the app JobManager. PythonDriver
    # compiles music_tier.py into a job graph and submits it. -pyclientexec/-pyexec pin BOTH the graph-compile
    # python (JM) and the per-row worker python (TM) to the image's interpreter.
    jarURI: local:///opt/flink/opt/flink-python-1.20.1.jar
    entryClass: org.apache.flink.client.python.PythonDriver
    args:
      - "-pyclientexec"
      - "/usr/bin/python3"
      - "-pyexec"
      - "/usr/bin/python3"
      - "-py"
      - "/opt/flink/usrlib/music_tier.py"
    parallelism: 1
    upgradeMode: stateless
