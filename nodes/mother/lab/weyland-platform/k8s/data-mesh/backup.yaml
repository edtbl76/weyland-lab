# B1 / B69 data-mesh-now — Postgres backup of the catalog/version metadata to mother's NVMe
# (local-path), so it survives a USB (/mnt/minio) failure. Daily, with rotation. The MinIO
# object backup is the sibling in k8s/minio/backup.yaml (kept there to be same-namespace with
# minio-creds + the data — secretKeyRef can't cross namespaces).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-mesh-backup
  namespace: data-mesh
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      # local-path reports the underlying disk capacity (50Gi) as status.capacity, and a PVC request
      # can't be LESS than that → must be >= 50Gi or Argo sync fails "field can not be less than capacity".
      storage: 50Gi
---
# pg_dump the nessie + lakefs DBs (Iceberg commit history / lakeFS branch refs — losing them orphans
# the warehouse). Meshed so it reaches STRICT-mTLS weyland-postgres; native sidecars let the Job exit.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: data-mesh
spec:
  # 23:00 America/New_York. Was `0 3 * * *` with a "03:00 local" comment and no `spec.timeZone`, so it
  # actually fired at 03:00 UTC = 23:00 EDT (observed 03:00:10Z, 2026-08-23). Pinned 2026-08-23 to the
  # time it already ran. Stays 30 min behind minio-backup and outside the pre-dawn window on purpose —
  # see docs/schedules.md for the carve-out.
  schedule: "0 23 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            sidecar.istio.io/inject: "true"
        spec:
          restartPolicy: Never
          containers:
            - name: pgdump
              image: postgres:17-alpine # pg_dump >= server version; bump if a version mismatch surfaces
              resources:
                requests: { memory: 128Mi, cpu: 100m }
                limits: { memory: 512Mi }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  TS=$(date -u +%Y%m%d)
                  mkdir -p /backup/pg
                  echo "dumping nessie ..."
                  PGPASSWORD="$NESSIE_PW" pg_dump -h weyland-postgres.weyland.svc.cluster.local -U nessie -d nessie -Fc -f "/backup/pg/nessie-$TS.dump"
                  echo "dumping lakefs ..."
                  pg_dump "$LAKEFS_DSN" -Fc -f "/backup/pg/lakefs-$TS.dump"
                  # rotation: keep the 7 most recent of each
                  ls -1t /backup/pg/nessie-*.dump | tail -n +8 | xargs -r rm -f
                  ls -1t /backup/pg/lakefs-*.dump | tail -n +8 | xargs -r rm -f
                  echo "pg backup complete: $(date -u)"
              env:
                - name: NESSIE_PW
                  valueFrom: { secretKeyRef: { name: nessie-secret, key: postgres-password } }
                - name: LAKEFS_DSN
                  valueFrom: { secretKeyRef: { name: lakefs-secret, key: database-connection-string } }
              volumeMounts:
                - { name: backup, mountPath: /backup }
          volumes:
            - name: backup
              persistentVolumeClaim: { claimName: data-mesh-backup }
