# B1 / B69 data-mesh-now — backups of the data products + catalog metadata to mother's NVMe
# (local-path storageClass), so a failure of the single USB disk (/mnt/minio) doesn't lose data.
# Daily, with rotation. Disk-failure protection (not host loss) — the $0 single-node win.
#
# Namespacing: each backup lives in the namespace of the secrets/data it needs (secretKeyRef can't
# cross namespaces) — pg backup in data-mesh (nessie/lakefs secrets), MinIO backup in minio
# (minio-creds). Both PVCs are local-path = the NVMe, not the USB.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-mesh-backup
  namespace: data-mesh
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-backup
  namespace: minio
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi
---
# MinIO: mirror the data-product buckets to the backup volume (idempotent; --remove keeps it in sync).
# mlflow excluded (artifacts can be large); add it here if you want it covered.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minio-backup
  namespace: minio
spec:
  schedule: "30 2 * * *" # 02:30 local
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: mc
              image: minio/mc:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  mc alias set src http://minio.minio.svc.cluster.local:9000 "$MC_USER" "$MC_PASS"
                  for b in warehouse lakefs aidlc-kb; do
                    echo "mirroring $b ..."
                    mc mirror --overwrite --remove "src/$b" "/backup/minio/$b"
                  done
                  echo "minio backup complete: $(date -u)"
              env:
                - name: MC_USER
                  valueFrom: { secretKeyRef: { name: minio-creds, key: MINIO_ROOT_USER } }
                - name: MC_PASS
                  valueFrom: { secretKeyRef: { name: minio-creds, key: MINIO_ROOT_PASSWORD } }
              volumeMounts:
                - { name: backup, mountPath: /backup }
          volumes:
            - name: backup
              persistentVolumeClaim: { claimName: minio-backup }
---
# Postgres: pg_dump the nessie + lakefs DBs (Iceberg commit history / lakeFS branch refs — losing them
# orphans the warehouse). Meshed so it reaches STRICT-mTLS weyland-postgres; native sidecars let the Job exit.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: data-mesh
spec:
  schedule: "0 3 * * *" # 03:00 local
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            sidecar.istio.io/inject: "true"
        spec:
          restartPolicy: Never
          containers:
            - name: pgdump
              image: postgres:17-alpine # pg_dump >= server version; bump if a version mismatch surfaces
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  TS=$(date -u +%Y%m%d)
                  mkdir -p /backup/pg
                  echo "dumping nessie ..."
                  PGPASSWORD="$NESSIE_PW" pg_dump -h weyland-postgres.weyland.svc.cluster.local -U nessie -d nessie -Fc -f "/backup/pg/nessie-$TS.dump"
                  echo "dumping lakefs ..."
                  pg_dump "$LAKEFS_DSN" -Fc -f "/backup/pg/lakefs-$TS.dump"
                  # rotation: keep the 7 most recent of each
                  ls -1t /backup/pg/nessie-*.dump | tail -n +8 | xargs -r rm -f
                  ls -1t /backup/pg/lakefs-*.dump | tail -n +8 | xargs -r rm -f
                  echo "pg backup complete: $(date -u)"
              env:
                - name: NESSIE_PW
                  valueFrom: { secretKeyRef: { name: nessie-secret, key: postgres-password } }
                - name: LAKEFS_DSN
                  valueFrom: { secretKeyRef: { name: lakefs-secret, key: database-connection-string } }
              volumeMounts:
                - { name: backup, mountPath: /backup }
          volumes:
            - name: backup
              persistentVolumeClaim: { claimName: data-mesh-backup }
