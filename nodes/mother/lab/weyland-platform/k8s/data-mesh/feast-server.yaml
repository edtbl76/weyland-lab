# Feast feature server (grid Feast) — the SERVED capability: HTTP/REST online-feature retrieval by entity key,
# for non-Python consumers (Hermes tools, Stud.IO). In DATA-MESH (with the other stores) — and critically,
# data-mesh is istio-injected, so this pod is MESHED → mTLS to STRICT weyland-postgres (the registry) works
# (an unmeshed pod gets ECONNRESET — the postgres-strict-needs-mesh lesson). Slim feast image (not the fat
# dagster one → no OOM). `feast serve` reads feast_repo/feature_store.yaml. REST 6566 at feast.weyland.lab
# (NO forward-auth — it's an API reached by code, not a browser UI). Needs the PG password secret in data-mesh
# (copy dagster-postgres-secret across). See docs/runbooks (feast) + backlog B1.8.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feast-server
  namespace: data-mesh
  labels:
    app: feast-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: feast-server
  template:
    metadata:
      labels:
        app: feast-server
      annotations:
        # feast serve does a one-shot Postgres connect at startup + exits on failure — so it must not race the
        # Envoy sidecar. Hold the app container until the proxy is ready.
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
    spec:
      containers:
        - name: feast-server
          image: registry.weyland.lab/feast-server:git-ffd7ee54
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 6566, name: http }
          env:
            - name: WEYLAND_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dagster-postgres-secret   # copied into data-mesh (see runbook)
                  key: password
          # httpGet, not tcpSocket: a bound listener is not a serving feature store. `feast serve` runs
          # uvicorn, and /health is a real route on it (verified 2026-08-23: HTTP 200, alongside
          # /get-online-features, /push, /materialize in its OpenAPI). The socket check passed the
          # instant the port bound, which is before uvicorn routes anything.
          #
          # What this does and does not prove: it proves the app is serving HTTP. It does NOT re-check
          # the Postgres registry — but it does not need to, because `feast serve` does a one-shot
          # registry connect at startup and EXITS on failure (see the holdApplicationUntilProxyStarts
          # annotation above), so a registry problem kills the pod rather than leaving it half-up.
          # The gap this closes is the wedged-uvicorn case, which tcpSocket could not see.
          readinessProbe:
            httpGet: { path: /health, port: 6566 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }   # slim image — feast serve + uvicorn is light
---
apiVersion: v1
kind: Service
metadata:
  name: feast-server
  namespace: data-mesh
  labels:
    app: feast-server
spec:
  selector:
    app: feast-server
  ports:
    - { name: http, port: 6566 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: feast-server
  namespace: data-mesh
  # NO forward-auth — REST API reached by code, not a browser (api.md data-backend convention). LAN-only open.
spec:
  tls:
    - hosts: [feast.weyland.lab]
      secretName: weyland-wildcard-tls
  rules:
    - host: feast.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: feast-server, port: { number: 6566 } }
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: feast-server-alerts
  namespace: data-mesh
  labels: { app: feast-server }
spec:
  groups:
    - name: feast-server
      rules:
        - alert: FeastServerDown
          expr: kube_deployment_status_replicas_available{namespace="data-mesh", deployment="feast-server"} == 0
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Feast feature server has 0 available replicas — online feature serving (REST :6566) is down."
