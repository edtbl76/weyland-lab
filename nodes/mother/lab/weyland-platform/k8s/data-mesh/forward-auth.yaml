# B1.2 — forward-auth Middleware local to the data-mesh ns (cross-namespace Traefik middleware refs are
# blocked by default), targeting the shared traefik-forward-auth service in weyland. Nessie + lakeFS
# ingresses reference data-mesh-traefik-forward-auth@kubernetescrd to gate their UIs behind Keycloak.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-forward-auth
  namespace: data-mesh
spec:
  forwardAuth:
    address: http://traefik-forward-auth.weyland.svc.cluster.local:4181
    trustForwardHeader: true
    authResponseHeaders:
      - X-Forwarded-User
