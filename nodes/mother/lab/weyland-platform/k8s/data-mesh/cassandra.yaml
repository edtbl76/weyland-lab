# Cassandra (B65 Tier-2 #9) — grid "Cassandra" cell. Single-node, wide-column store for the four
# Cassandra=Y datasets (music: uci_year_prediction, lastfm; health: big_five, who_gho). Heap capped
# (this is the heaviest Tier-2 store — a JVM; mother was bumped 44→50Gi to fit it). StatefulSet =
# idiomatic for Cassandra (stable identity + volumeClaimTemplates). Sidecar disabled — CQL is TCP and
# the meshed Dagster loader reaches a non-meshed Cassandra over plain 9042 fine (PERMISSIVE client).
# See docs/runbooks/datasets-hydration.md.
---
apiVersion: v1
kind: Service
metadata:
  name: cassandra
  namespace: data-mesh
  labels:
    app: cassandra
spec:
  clusterIP: None          # headless — StatefulSet stable DNS; clients use cassandra.data-mesh.svc:9042
  selector:
    app: cassandra
  ports:
    - name: cql
      port: 9042
    - name: intra-node
      port: 7000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  namespace: data-mesh
spec:
  serviceName: cassandra
  # PARKED by default — B199 (2026-10-01): mother runs at 72-75 of 78 GB and freezes from page-cache thrash; parking
  # the idle Tier-2 stores returns ~9 GB. Wake: set replicas: 1 here and push (Argo selfHeal reverts a live scale).
  # UNDO when new hardware lands — tracked in B134 (EMA-195) § Undo on hardware.
  replicas: 0
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      terminationGracePeriodSeconds: 120   # let Cassandra drain/flush on stop
      containers:
        - name: cassandra
          image: cassandra:5.0
          ports:
            - containerPort: 9042
              name: cql
            - containerPort: 7000
              name: intra-node
          env:
            - name: CASSANDRA_CLUSTER_NAME
              value: weyland
            - name: CASSANDRA_ENDPOINT_SNITCH
              value: SimpleSnitch          # single-node — no DC/rack topology
            - name: MAX_HEAP_SIZE
              value: 3G                     # bumped from 2G — the 17M-row Last.fm load pushed 4Gi (mother has RAM now)
            - name: HEAP_NEWSIZE
              value: 600M
          resources:
            requests:
              cpu: 250m
              memory: 3Gi
            limits:
              memory: 6Gi                   # heap 3G + off-heap (memtables/caches under heavy write) + overhead
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "nodetool status | grep -q '^UN'"]
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 10
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "nodetool status | grep -q '^UN'"]
            periodSeconds: 15
            failureThreshold: 20            # up to ~5 min for first boot
          volumeMounts:
            - name: cassandra-data
              mountPath: /var/lib/cassandra
  volumeClaimTemplates:
    - metadata:
        name: cassandra-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cassandra-alerts
  namespace: data-mesh
  labels: { app: cassandra }
spec:
  groups:
    - name: cassandra
      rules:
        # StatefulSet metric (not deployment_status like the other stores — Cassandra is a StatefulSet).
        - alert: CassandraDown
          # B199 (2026-10-01): parked by default (replicas: 0 in git) — fires only when git wants it running and it is not.
          expr: max by (namespace, statefulset) (kube_statefulset_status_replicas_ready{namespace="data-mesh", statefulset="cassandra"}) < max by (namespace, statefulset) (kube_statefulset_replicas{namespace="data-mesh", statefulset="cassandra"})
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Cassandra StatefulSet has 0 ready replicas — the wide-column store is down (datasets_music/datasets_health queries blocked)."
