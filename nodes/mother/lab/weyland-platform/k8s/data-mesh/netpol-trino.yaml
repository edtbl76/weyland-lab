# Trino's front door. B211 (2026-10-14) made it the only control: Trino had no authenticator, so X-Trino-User was
# self-asserted and Ranger could be bypassed by claiming a privileged user. B233 (2026-10-23) added the real control —
# a password per caller, over HTTPS only, and Ranger letting a login act only as itself (runbooks/trino.md
# § Authentication) — so this policy is now defence in depth: it still limits WHO can connect, port by port.
#   8443 (HTTPS, the only port that takes a password): every real caller, each logging in as its own identity, and
#        rogueone (192.168.1.230: IntelliJ via the trino-lan NodePort 30843, query-lan.yaml, which keeps the client IP —
#        externalTrafficPolicy Local). The NodePort admits only rogueone, not the whole LAN.
#   8080 (plain HTTP): Traefik only — the forward-auth'd web UI (a fixed read-only identity). Since stage 3 Trino refuses
#        anything else on HTTP (allow-insecure-over-http=false); the no-auth proxy and the :30808 NodePort are gone.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: trino-front-door-only, namespace: data-mesh}
spec:
  podSelector:
    matchLabels: {app: trino}
  policyTypes: [Ingress]
  ingress:
  - from:
    # Dagster user-code (dbt, the mart export, Feast, Soda, GE — login dbt) and dbt-docs (dbt).
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: weyland}
      podSelector:
        matchLabels: {app: dagster-user-code}
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: weyland}
      podSelector:
        matchLabels: {app: dbt-docs}
    - podSelector:
        matchLabels: {app.kubernetes.io/name: acryl-datahub-actions}   # DataHub managed ingestion (datahub)
    - podSelector:
        matchLabels: {app: superset}
    - podSelector:
        matchLabels: {app: cube}
    - podSelector:
        matchLabels: {app.kubernetes.io/name: lightdash}
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: weyland}
      podSelector:
        matchLabels: {app: trino-mcp}
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: weyland}
      podSelector:
        matchLabels: {app: datahub-coverage}
    # Ranger Admin's Trino resource lookup (login ranger). B211 never listed it, so the lookup was refused 2026-10-14 → B233.
    - podSelector:
        matchLabels: {app: ranger-admin}
    # The on-demand perf baseline Job (scripts/perf/trino-baseline.sh, login perf). Also refused 2026-10-14 → B233.
    - podSelector:
        matchLabels: {job-name: perf-trino-k6}
    - &id001
      namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: monitoring}
      podSelector:
        matchLabels: {app.kubernetes.io/name: prometheus}             # the /metrics scrape (login prometheus)
    # The owner's JupyterHub server (notebooks 20/40/62/71/72/81, login notebook; 72 also analyst). Selected by label,
    # not IP — a server's pod IP changes on every spawn — and narrowed to the owner's server by the spawner's username
    # label (B233), not every singleuser server.
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: jupyterhub}
      podSelector:
        matchLabels: {component: singleuser-server, hub.jupyter.org/username: emangini}
    - ipBlock: {cidr: 192.168.1.230/32}
    ports:
    - {protocol: TCP, port: 8443}
  - from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
      podSelector:
        matchLabels: {app.kubernetes.io/name: traefik}
    ports:
    - {protocol: TCP, port: 8080}
  - from:
    - *id001
    ports:
    - {protocol: TCP, port: 15020}
    - {protocol: TCP, port: 15090}
