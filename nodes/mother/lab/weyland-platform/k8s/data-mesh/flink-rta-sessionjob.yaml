# B83 - RTA trending job as a DECLARATIVE FlinkSessionJob (this is what the vanished imperative `flink run`
# submit should have been: GitOps-managed, survives JM restarts, visible). Runs rta_trending.sql (BOUNDED via
# scan.bounded.mode=latest-offset) through the in-repo sql-runner jar baked into weyland-flink:local. Bounded:
# it reads the lastfm topic to the end, closes all tumbling windows, writes to Iceberg analytics.trending_artists,
# then FINISHES - which archives it to s3://warehouse/_flink/completed-jobs so the History Server shows it.
# (The continuous flagship is the CDC job, next.)
apiVersion: flink.apache.org/v1beta1
kind: FlinkSessionJob
metadata:
  name: rta-trending
  namespace: data-mesh
spec:
  deploymentName: weyland-flink       # must match the FlinkDeployment (the session cluster)
  job:
    jarURI: local:///opt/flink/usrlib/sql-runner.jar
    entryClass: lab.weyland.flink.SqlRunner
    args:
      - /opt/flink/sql/rta_trending.sql
    parallelism: 1
    upgradeMode: stateless            # bounded, no state to carry across upgrades
