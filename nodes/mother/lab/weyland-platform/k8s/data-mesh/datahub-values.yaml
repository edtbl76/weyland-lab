# B1.3 — DataHub (chart 1.0.1 / DataHub v1.6.0). Core-first; Keycloak OIDC added in a follow-up step.
# Search/graph = the bundled OpenSearch 2.19.5 (chart defaults already point at opensearch-cluster-master,
# AUTO_DETECT, INTERNAL schema registry, embedded consumers) — so only sql + mesh + ingress + lean CPU here.

global:
  # Mesh every DataHub pod so GMS + the systemUpdate Job can reach STRICT-mTLS Postgres.
  # Native sidecars (enabled on istiod) let the Job's sidecar terminate so the Job completes.
  podLabels:
    sidecar.istio.io/inject: "true"
  # Node CPU requests run ~98% committed; istio-proxy defaults to 100m. Shrink the sidecar reservation.
  podAnnotations:
    sidecar.istio.io/proxyCPU: "25m"

  datahub:
    # The chart's autoGenerate REGENERATES datahub-auth-secrets on every render → GMS/frontend end up with
    # different system-client-secret + token-signing-key (frontend's system token → 401 at GMS, "Failed to
    # provision user"), AND selfHeal sees the churning secret as perpetual drift → GMS never reports Healthy
    # → syncs hang. Pin it: we create datahub-auth-secrets ourselves (fixed values, out of git).
    metadata_service_authentication:
      provisionSecrets:
        enabled: false

  # Metadata store = the shared Postgres, datahub DB, dedicated `datahub` role (password in datahub-secret).
  sql:
    datasource:
      host: "weyland-postgres.weyland.svc.cluster.local:5432"
      hostForpostgresqlClient: "weyland-postgres.weyland.svc.cluster.local"
      port: "5432"
      url: "jdbc:postgresql://weyland-postgres.weyland.svc.cluster.local:5432/datahub"
      driver: "org.postgresql.Driver"
      database: "datahub"
      username: "datahub"
      password:
        secretRef: datahub-secret
        secretKey: postgres-password

# GMS — core backend. Lean CPU (node CPU requests run hot).
datahub-gms:
  # In-cluster only — default LoadBalancer stays <pending> on k3s, which pins Argo's sync op to "waiting for
  # healthy state of Service" forever (perpetual Progressing, blocked syncs). ClusterIP is instantly healthy.
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: "25m"
      memory: "1Gi"
    limits:
      memory: "2Gi"

# Frontend — React UI + ingress + native Keycloak OIDC.
datahub-frontend:
  enabled: true
  # Exposed via the Ingress below, not a LoadBalancer — ClusterIP (same pending-LB reason as GMS).
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: "25m"
      memory: "512Mi"
    limits:
      memory: "1400Mi"
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    pathType: Prefix
    hosts:
      - host: datahub.weyland.lab
        paths:
          - "/"
    tls:
      - secretName: weyland-wildcard-tls
        hosts:
          - datahub.weyland.lab
  # Native OIDC to Keycloak. The back-channel to keycloak.weyland.lab uses the mkcert cert, so the JVM
  # needs a truststore = system cacerts + the mkcert root (built by the initContainer below).
  extraEnvs:
    - name: AUTH_OIDC_ENABLED
      value: "true"
    - name: AUTH_OIDC_CLIENT_ID
      value: "datahub"
    - name: AUTH_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: datahub-oidc
          key: client-secret
    - name: AUTH_OIDC_DISCOVERY_URI
      value: "https://keycloak.weyland.lab/realms/weyland/.well-known/openid-configuration"
    - name: AUTH_OIDC_BASE_URL
      value: "https://datahub.weyland.lab"
    - name: AUTH_OIDC_USER_NAME_CLAIM
      value: "preferred_username"
    - name: JAVA_TOOL_OPTIONS
      value: "-Djavax.net.ssl.trustStore=/trust/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
  extraVolumes:
    - name: truststore
      emptyDir: {}
    - name: mkcert-ca
      secret:
        secretName: weyland-mkcert-ca
  extraVolumeMounts:
    - name: truststore
      mountPath: /trust
  # The frontend image is a trimmed JRE (no keytool, JAVA_HOME unset), so build the truststore in a JDK
  # image instead. The PKCS12/JKS cacerts format is portable — the frontend JVM just reads it via JAVA_TOOL_OPTIONS.
  extraInitContainers:
    - name: build-truststore
      image: eclipse-temurin:21-jdk
      command: ["sh", "-c"]
      args:
        - cp "$JAVA_HOME/lib/security/cacerts" /trust/cacerts && keytool -importcert -noprompt -alias mkcert -file /ca/rootCA.pem -keystore /trust/cacerts -storepass changeit && echo "truststore built"
      volumeMounts:
        - name: truststore
          mountPath: /trust
        - name: mkcert-ca
          mountPath: /ca

# Actions framework — trim its default 300m CPU request. This pod ALSO runs managed-ingestion; 512Mi
# OOM-killed (exit 137) on profiling-enabled Postgres/MusicBrainz runs → hung ingestions. Ceiling raised
# to 1Gi for burst headroom; request stays low (256Mi) so it reserves little on the tight node — it only
# uses the extra while an ingestion is active. Profiling kept ON (we want the stats) — if a big profiling
# run still exit-137s, bump further (1.5–2Gi) or sleep the idle data stores (store-scaler) to free node RAM.
acryl-datahub-actions:
  resources:
    requests:
      cpu: "25m"
      memory: "256Mi"
    limits:
      memory: "1Gi"

# system-update bootstrap Job (runs as a hook on every sync) — trim its default 300m CPU so it schedules
# on the CPU-tight node. Memory left roomy (it does ES index + Postgres schema work).
datahubSystemUpdate:
  resources:
    requests:
      cpu: "50m"
      memory: "512Mi"
    limits:
      memory: "1Gi"
