# MongoDB (data-mesh Tier-2) — document store for the grid's MongoDB=Y datasets (WHO GHO — nested JSON;
# Open Food Facts — doc per product) + the aidlc-kb methodology corpus (frontmatter → queryable fields).
# Always-on (like the other data-mesh stores); single instance, RWO + Recreate. Un-meshed first cut (loaders
# connect from the user-code pod); add the Istio sidecar + a DataHub source when meshing/cataloging.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: data-mesh
  labels:
    app: mongodb
spec:
  # PARKED by default — B199 (2026-10-01): mother runs at 72-75 of 78 GB and freezes from page-cache thrash; parking
  # the idle Tier-2 stores returns ~9 GB. Wake: set replicas: 1 here and push (Argo selfHeal reverts a live scale).
  # UNDO when new hardware lands — tracked in B134 (EMA-195) § Undo on hardware.
  replicas: 0
  strategy:
    type: Recreate            # single-instance RWO — kill-old-before-new ([[k8s-rwo-recreate-strategy]])
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:8
          envFrom:
            - secretRef:
                name: mongodb-secret   # MONGO_INITDB_ROOT_USERNAME / _PASSWORD — imperative, not in git
          ports:
            - name: mongodb
              containerPort: 27017
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              memory: "4Gi"     # OFF is ~3M docs; give the working set + index builds headroom
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongodb-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data
  namespace: data-mesh
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 30Gi          # OFF ~3M product docs + who_gho + aidlc-kb, with headroom
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: data-mesh
spec:
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mongodb-alerts
  namespace: data-mesh
  labels: { app: mongodb }
spec:
  groups:
    - name: mongodb
      rules:
        - alert: MongodbDown
          # B199 (2026-10-01): parked by default (replicas: 0 in git) — fires only when git wants it running and it is not.
          expr: max by (namespace, deployment) (kube_deployment_status_replicas_available{namespace="data-mesh", deployment="mongodb"}) < max by (namespace, deployment) (kube_deployment_spec_replicas{namespace="data-mesh", deployment="mongodb"})
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "MongoDB has 0 available replicas — the document store is down (OFF/WHO-GHO/aidlc-kb queries blocked)."
