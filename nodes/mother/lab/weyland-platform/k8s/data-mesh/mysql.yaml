# B65 Tier-2 — MySQL: health, fitness, and personality profiling datasets.
# Hosts 7 public datasets: NHANES, Big Five (IPIP), WHO GHO, CDC Physical Activity,
# BRFSS, MyFitnessPal public data, UK Biobank (where accessible).
# Always-on (stateful DB; data-mesh ns). Meshed → Trino postgresql catalog federates it.
# Creds: mysql-secret (imperative, not in git) — MYSQL_ROOT_PASSWORD / MYSQL_USER / MYSQL_PASSWORD / MYSQL_DATABASE.
# IntelliJ: standard MySQL JDBC via k8s port-forward (DataGrip "MySQL" datasource).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: data-mesh
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: data-mesh
  labels:
    app: mysql
spec:
  replicas: 1
  strategy:
    type: Recreate   # single-instance RWO PVC
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - name: tcp-mysql
              containerPort: 3306
          envFrom:
            - secretRef:
                name: mysql-secret
          args:
            - --max_connections=200
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            # B113/B137: runs as root on EVERY startup (idempotent). Grants `weyland` schema-level DDL/DML
            # across *.* so the dagster loader self-provisions a database per NEW dataset domain (CREATE
            # DATABASE IF NOT EXISTS) — killing the old per-dataset root-grant toil that broke finance
            # ("Access denied to database 'company_financials'"). No server-admin privileges are granted.
            - --init-file=/etc/mysql/init/bootstrap.sql
          readinessProbe:
            exec:
              # SEC-1: read the password from the env (envFrom mysql-secret) instead of inlining it. An exec probe
              # doesn't expand $(VAR), so wrap in a shell.
              command: ["sh", "-c", "mysqladmin ping -h localhost -u weyland --password=\"$MYSQL_PASSWORD\""]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              memory: "2Gi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /etc/mysql/init
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
        - name: init
          configMap:
            name: mysql-bootstrap
---
# B113/B137 — the standing grant, run as root by `--init-file` on every mysqld startup. Idempotent: GRANT to
# an already-granted user is a no-op, so a restart never errors. `weyland` gets the full schema-level DDL/DML
# set on *.* (create/own any dataset database + its tables) but NONE of the server-admin globals (no FILE,
# PROCESS, SUPER, SHUTDOWN, RELOAD, GRANT OPTION). This is what lets the loader run CREATE DATABASE IF NOT
# EXISTS for a new domain instead of needing a hand-issued `GRANT ALL ON <dataset>.*` first.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-bootstrap
  namespace: data-mesh
data:
  bootstrap.sql: |
    GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, ALTER, INDEX, REFERENCES,
          CREATE TEMPORARY TABLES, LOCK TABLES, CREATE VIEW, SHOW VIEW, TRIGGER,
          EVENT, EXECUTE, CREATE ROUTINE, ALTER ROUTINE
      ON *.* TO 'weyland'@'%';
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: data-mesh
spec:
  selector:
    app: mysql
  ports:
    - name: tcp-mysql
      port: 3306
      targetPort: 3306
      appProtocol: tcp
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mysql-alerts
  namespace: data-mesh
  labels: { app: mysql }
spec:
  groups:
    - name: mysql
      rules:
        - alert: MySQLDown
          expr: kube_deployment_status_replicas_available{namespace="data-mesh", deployment="mysql"} == 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "MySQL has 0 available replicas — health/wellness dataset store is down."
