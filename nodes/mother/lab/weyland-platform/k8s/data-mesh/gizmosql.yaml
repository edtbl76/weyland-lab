# B65 Tier-2 — DuckDB served over Arrow Flight SQL (GizmoSQL).
#
# WHY: DataGrip's native DuckDB driver is embedded-only (jdbc:duckdb:<file>, no host:port) — you cannot
# point it at a cluster DuckDB. GizmoSQL fronts an in-process DuckDB with an Arrow Flight SQL *server*
# (a real host:port), so DataGrip connects with the Arrow Flight SQL JDBC driver (+ SSH tunnel to mother).
#
# Being IN-CLUSTER, its DuckDB reads the CURRENT lakeFS Parquet via the gateway (s3://music/main/parquet)
# — the versioned data, which rogueone-direct couldn't reach (lakeFS ingress is forward-auth gated).
#
# Creds + init SQL are NOT here (they carry the lakeFS keys) — create `gizmosql-secret` imperatively
# (see runbook). First cut: NO Istio sidecar (omit the inject label) to keep the Flight SQL path clean;
# mesh it in slice 2 once it's proven. TLS off — the LAN + the SSH tunnel handle transport.
#
# gizmosql-secret keys: GIZMOSQL_USERNAME · GIZMOSQL_PASSWORD · INIT_SQL_COMMANDS
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gizmosql
  namespace: data-mesh
  labels:
    app: gizmosql
spec:
  replicas: 1
  # Recreate (not RollingUpdate): terminate the old pod BEFORE creating the new one. The node runs ~98%
  # CPU-committed, so a rolling update double-books the CPU request and the new pod can never schedule
  # while the old (even crashing) one still holds its slot. Kill-old-first frees the slot for the new.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gizmosql
  template:
    metadata:
      labels:
        app: gizmosql
        sidecar.istio.io/inject: "true"   # slice-2 mesh: Istio mTLS secures the in-cluster hop → GizmoSQL
                                           # runs plaintext (TLS_ENABLED=0) + clients drop TLS_SKIP_VERIFY.
    spec:
      # k8s injects Docker-link service env vars (GIZMOSQL_PORT=tcp://<ip>:31337, …) for the same-named
      # Service into the pod — and GizmoSQL reads its own GIZMOSQL_PORT config var as an int, so the
      # injected URL crashes it on boot. Disable the injection (GizmoSQL then uses its default port 31337).
      enableServiceLinks: false
      containers:
        - name: gizmosql
          image: gizmodata/gizmosql@sha256:1f1371cf649a4acb4f3fce6131ce5f3979b3e2b8b3902943ae03a66fb981af0b  # pinned from :latest 2026-07-10
          # DATABASE_FILENAME → a PERSISTED DuckDB on the PVC below: the silver is materialised as DuckDB
          # *tables* (INIT_SQL_COMMANDS runs `CREATE TABLE IF NOT EXISTS … AS SELECT read_parquet(...)` per
          # file — generated by scripts/gen_gizmosql_init.py tables). Tables not views because GizmoSQL's
          # Flight SQL GetTables surfaces base tables but NOT views — so tables show up + browse in DataGrip/
          # IntelliJ (views are queryable by name yet invisible to the IDE tree), and queries hit native
          # columnar storage instead of re-reading Parquet. GizmoSQL runs each *client* Flight SQL statement in
          # an isolated session, so the DDL must live in INIT_SQL (one shared startup session) — not driven by a
          # client. `IF NOT EXISTS` + the persisted DB → materialise ONCE on first boot, skip on every restart
          # (the startupProbe below absorbs that slow first boot).
          envFrom:
            - secretRef:
                name: gizmosql-secret
          env:
            # Run PLAINTEXT so Istio mTLS (the sidecar above) provides transport security instead of the
            # app's ephemeral self-signed cert — this is what lets the clients drop TLS_SKIP_VERIFY.
            # CONFIRMED honoured: boot log shows "TLS is disabled … will listen on grpc+tcp://".
            - name: TLS_ENABLED
              value: "0"
            - name: DATABASE_FILENAME       # persisted DuckDB on the PVC → materialised tables survive restarts
              value: /data/weyland.duckdb
          volumeMounts:
            - name: duckdb
              mountPath: /data
          ports:
            - name: tcp-flightsql        # tcp- → Istio TCP passthrough (mTLS at L4; gRPC rides inside)
              containerPort: 31337
          # First boot runs INIT_SQL's CREATE TABLE-per-Parquet materialise (reads every silver file, incl.
          # usda ~26M rows) before the port serves — minutes. The startupProbe holds off readiness/liveness
          # for up to 20 min (120 × 10s) so k8s doesn't kill + CrashLoop it mid-materialise. Restarts after
          # are instant (IF NOT EXISTS skips the already-persisted tables), so this only bites the first boot.
          startupProbe:
            tcpSocket:
              port: 31337
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: 31337
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              memory: "4Gi"
      volumes:
        - name: duckdb
          persistentVolumeClaim:
            claimName: gizmosql-duckdb
---
apiVersion: v1
kind: Service
metadata:
  name: gizmosql
  namespace: data-mesh
spec:
  # NodePort so DataGrip on rogueone reaches it at mother:31337 (direct, or via the DataGrip SSH tunnel
  # to mother → localhost:31337). 31337 is inside the 30000-32767 NodePort range.
  type: NodePort
  selector:
    app: gizmosql
  ports:
    - name: tcp-flightsql
      port: 31337
      targetPort: 31337
      nodePort: 31337
---
# Persisted DuckDB store for GizmoSQL (RWO + Recreate strategy above — single instance). DuckDB compresses
# the silver well but this duplicates it, so 20Gi headroom. Refresh = re-run `gen_gizmosql_init.py tables`
# (CREATE OR REPLACE, in place); a full reset = delete this PVC + re-materialise.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gizmosql-duckdb
  namespace: data-mesh
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gizmosql-alerts
  namespace: data-mesh
  labels: { app: gizmosql }
spec:
  groups:
    - name: gizmosql
      rules:
        # GizmoSQL exposes no /metrics + Flight SQL is gRPC (no HTTP page) — so the down signal is the
        # k8s deployment availability (kube-state-metrics), same as TrinoDown. A Kuma TCP monitor on the
        # NodePort (mother:31337) is the optional shallow LAN ping (Kuma can't resolve cluster svc names).
        - alert: GizmosqlDown
          expr: kube_deployment_status_replicas_available{namespace="data-mesh", deployment="gizmosql"} == 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "GizmoSQL has 0 available replicas — the DuckDB Flight SQL query engine is down (IDEA + emit_duckdb blocked)."
