# Feast UI — the registry BROWSER (feature views / entities / feature services / lineage, read-only). A face for
# the feature store; today only feast-server (REST online serving) is exposed. Same slim `feast-server:local`
# image (which now carries the grpc* deps `feast ui`'s REST mode imports). MESHED (data-mesh is istio-injected)
# so it reaches the STRICT-mTLS `feast` Postgres SQL registry. Browser UI → Keycloak forward-auth.
#
# WHY THE LAUNCHER (not just `feast ui`): feast 0.58's `feast ui` hands the bundled React frontend
# registryPath="/api/v1" (the REST base), but THAT frontend actually wants a `registry.json` dump (its own docs
# example: "registryPath": "/registry.json") and parses it client-side. With a SQL registry feast never writes
# that dump → the UI loads but shows nothing (bare GET /api/v1 → 404). The launcher runs `feast ui` (serves the
# SPA + REST + writes its own projects-list.json), then OVERWRITES projects-list.json to point at /registry.json
# and generates that dump — proto3-JSON of registry.proto(), the exact format the frontend parses — into the
# served UI dir, refreshed every 5 min. Deterministic, same feast version, no frontend/version guessing.
# Picked up by the existing `data-mesh` Argo app. See docs/diagrams/flow-feast.md + query/feast.md.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: feast-ui-launch
  namespace: data-mesh
  labels:
    app: feast-ui
data:
  launch.sh: |
    #!/bin/sh
    # start feast ui (serves the SPA + writes its own — wrong — projects-list.json), then take over the registry
    # data the bundled frontend actually wants (a /registry.json dump). See the header of feast-ui.yaml.
    feast -c /app/feast_repo ui -h 0.0.0.0 -p 8888 &
    FPID=$!
    # Write the dump ASAP, retrying fast until the registry is reachable — so there's no empty-UI window after a
    # (re)start. feast's get_app writes its own projects-list.json synchronously before serving, so ours (written
    # here, after the port is up) always wins. Then refresh every 5 min to track registry changes.
    until python /scripts/dump.py; do
      kill -0 "$FPID" 2>/dev/null || { echo "feast-ui: feast ui exited during startup"; exit 1; }
      echo "feast-ui: registry not ready yet — retry in 5s"; sleep 5
    done
    while kill -0 "$FPID" 2>/dev/null; do
      sleep 300
      python /scripts/dump.py || echo "feast-ui: refresh dump failed (keeping last good)"
    done
    echo "feast-ui: feast ui process exited — failing so k8s restarts the pod"
    exit 1
  dump.py: |
    """Write the registry as a /registry.json dump (proto3-JSON) + a projects-list.json that points the bundled
    feast UI frontend at it — fixing feast 0.58's SQL-registry empty-UI bug (registryPath hardcoded to /api/v1)."""
    import json
    import os

    import feast
    from google.protobuf.json_format import MessageToJson

    uidir = os.path.join(os.path.dirname(feast.__file__), "ui", "build")
    fs = feast.FeatureStore("/app/feast_repo")
    # proto3-JSON of the whole RegistryProto — the exact shape the frontend parses (same camelCase as /api/v1/*).
    with open(os.path.join(uidir, "registry.json"), "w") as f:
        f.write(MessageToJson(fs.registry.proto()))
    projects = [
        {
            "name": p.name.replace("_", " ").title(),
            "description": p.description or f"Project: {p.name}",
            "id": p.name,
            "registryPath": "/registry.json",   # <-- the fix: point at the dump, not /api/v1
        }
        for p in fs.registry.list_projects(allow_cache=True)
    ]
    with open(os.path.join(uidir, "projects-list.json"), "w") as f:
        f.write(json.dumps({"projects": projects}))
    print(f"feast-ui: wrote registry.json + projects-list.json ({len(projects)} project(s))")
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feast-ui
  namespace: data-mesh
  labels:
    app: feast-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: feast-ui
  template:
    metadata:
      labels:
        app: feast-ui
      annotations:
        # feast ui + the dump both connect to the SQL registry (Postgres) at startup → hold the app until the
        # Envoy sidecar is up (the one-shot-connect race feast-server hits too).
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
    spec:
      containers:
        - name: feast-ui
          image: registry.weyland.lab/feast-server:git-a48b43ed
          imagePullPolicy: IfNotPresent
          command: ["sh", "/scripts/launch.sh"]
          ports:
            - { containerPort: 8888, name: http }
          env:
            - name: WEYLAND_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dagster-postgres-secret   # copied into data-mesh (same as feast-server)
                  key: password
          volumeMounts:
            - name: launch
              mountPath: /scripts
          readinessProbe:
            # ready only once the dump exists (data is browsable), not just when the SPA serves.
            httpGet: { path: /registry.json, port: 8888 }
            initialDelaySeconds: 25
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 768Mi }
      volumes:
        - name: launch
          configMap:
            name: feast-ui-launch
---
apiVersion: v1
kind: Service
metadata:
  name: feast-ui
  namespace: data-mesh
  labels:
    app: feast-ui
spec:
  selector:
    app: feast-ui
  ports:
    - { name: http, port: 8888 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: feast-ui
  namespace: data-mesh
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: data-mesh-traefik-forward-auth@kubernetescrd
spec:
  tls:
    - hosts: [feast-ui.weyland.lab]
      secretName: weyland-wildcard-tls
  rules:
    - host: feast-ui.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: feast-ui, port: { number: 8888 } }
