# Apache Ranger Admin (L5 — data-plane authz for Trino). Prebuilt image mr3project/ranger:2.6.0.
# Policy DB = weyland-postgres (ns weyland) DB `ranger`, role `rangeradmin` (pre-created).
# Meshed (istio sidecar) so it can reach STRICT-mTLS Postgres. Audit deferred (audit_store empty) — Slice A
# refinement wires the shared ES later. UI on :6080; ingress added after we validate via port-forward.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ranger-admin-install
  namespace: data-mesh
data:
  # Full install.properties (mr3 image template) with our overrides. setup.sh renders ranger-admin-site.xml
  # from this, so every key the template sets must be present.
  install.properties: |
    PYTHON_COMMAND_INVOKER=python3
    DB_FLAVOR=POSTGRES
    SQL_CONNECTOR_JAR=/opt/mr3-run/lib/postgresql-42.3.2.jar
    db_root_user=rangeradmin
    db_root_password=weyland_dev_password
    db_host=weyland-postgres.weyland.svc.cluster.local
    db_ssl_enabled=false
    db_ssl_required=false
    db_ssl_verifyServerCertificate=false
    db_ssl_auth_type=2-way
    javax_net_ssl_keyStore=
    javax_net_ssl_keyStorePassword=
    javax_net_ssl_trustStore=
    javax_net_ssl_trustStorePassword=
    javax_net_ssl_trustStore_type=jks
    javax_net_ssl_keyStore_type=jks
    db_ssl_certificate_file=
    db_name=ranger
    db_user=rangeradmin
    db_password=weyland_dev_password
    is_override_db_connection_string=false
    db_override_connection_string=
    rangerAdmin_password=Weyland_dev_password1
    rangerTagsync_password=Weyland_dev_password1
    rangerUsersync_password=Weyland_dev_password1
    keyadmin_password=Weyland_dev_password1
    audit_store=
    audit_elasticsearch_urls=
    audit_elasticsearch_port=
    audit_elasticsearch_protocol=
    audit_elasticsearch_user=
    audit_elasticsearch_password=
    audit_elasticsearch_index=
    audit_elasticsearch_bootstrap_enabled=true
    audit_solr_urls=
    audit_solr_user=
    audit_solr_password=
    audit_solr_zookeepers=
    audit_solr_collection_name=ranger_audits
    audit_solr_config_name=ranger_audits
    audit_solr_configset_location=
    audit_solr_no_shards=1
    audit_solr_no_replica=1
    audit_solr_max_shards_per_node=1
    audit_solr_acl_user_list_sasl=solr,infra-solr
    audit_solr_bootstrap_enabled=true
    audit_cloudwatch_region=
    audit_cloudwatch_log_group=
    audit_cloudwatch_log_stream_prefix=
    policymgr_external_url=https://ranger.weyland.lab
    policymgr_http_enabled=true
    policymgr_https_keystore_file=
    policymgr_https_keystore_keyalias=rangeradmin
    policymgr_https_keystore_password=
    policymgr_supportedcomponents=
    unix_user=ranger
    unix_user_pwd=ranger
    unix_group=ranger
    authentication_method=NONE
    remoteLoginEnabled=true
    authServiceHostName=localhost
    authServicePort=5151
    ranger_unixauth_keystore=keystore.jks
    ranger_unixauth_keystore_password=password
    ranger_unixauth_truststore=cacerts
    ranger_unixauth_truststore_password=changeit
    xa_ldap_url=
    xa_ldap_userDNpattern=
    xa_ldap_groupSearchBase=
    xa_ldap_groupSearchFilter=
    xa_ldap_groupRoleAttribute=
    xa_ldap_base_dn=
    xa_ldap_bind_dn=
    xa_ldap_bind_password=
    xa_ldap_referral=
    xa_ldap_userSearchFilter=
    xa_ldap_ad_domain=
    xa_ldap_ad_url=
    xa_ldap_ad_base_dn=
    xa_ldap_ad_bind_dn=
    xa_ldap_ad_bind_password=
    xa_ldap_ad_referral=
    xa_ldap_ad_userSearchFilter=
    spnego_principal=
    spnego_keytab=
    token_valid=30
    cookie_domain=
    cookie_path=/
    admin_principal=
    admin_keytab=
    lookup_principal=
    lookup_keytab=
    hadoop_conf=/etc/hadoop/conf
    sso_enabled=false
    sso_providerurl=https://127.0.0.1:8443/gateway/knoxsso/api/v1/websso
    sso_publickey=
    RANGER_ADMIN_LOG_DIR=$PWD
    RANGER_ADMIN_LOGBACK_CONF_FILE=
    RANGER_PID_DIR_PATH=/var/run/ranger
    XAPOLICYMGR_DIR=$PWD
    app_home=$PWD/ews/webapp
    TMPFILE=$PWD/.fi_tmp
    LOGFILE=$PWD/logfile
    LOGFILES="$LOGFILE"
    JAVA_BIN='java'
    JAVA_VERSION_REQUIRED='1.8'
    JAVA_ORACLE='Java(TM) SE Runtime Environment'
    java_opts=''
    ranger_admin_max_heap_size=1g
    PATCH_RETRY_INTERVAL=120
    STALE_PATCH_ENTRY_HOLD_TIME=10
    mysql_core_file=db/mysql/optimized/current/ranger_core_db_mysql.sql
    mysql_audit_file=db/mysql/xa_audit_db.sql
    oracle_core_file=db/oracle/optimized/current/ranger_core_db_oracle.sql
    oracle_audit_file=db/oracle/xa_audit_db_oracle.sql
    postgres_core_file=db/postgres/optimized/current/ranger_core_db_postgres.sql
    postgres_audit_file=db/postgres/xa_audit_db_postgres.sql
    sqlserver_core_file=db/sqlserver/optimized/current/ranger_core_db_sqlserver.sql
    sqlserver_audit_file=db/sqlserver/xa_audit_db_sqlserver.sql
    sqlanywhere_core_file=db/sqlanywhere/optimized/current/ranger_core_db_sqlanywhere.sql
    sqlanywhere_audit_file=db/sqlanywhere/xa_audit_db_sqlanywhere.sql
    cred_keystore_filename=$app_home/WEB-INF/classes/conf/.jceks/rangeradmin.jceks
---
# The image expects /opt/mr3-run/ranger/conf/ (normally mounted by the MR3 helm chart) — start-ranger.sh cp's
# krb5.conf + ranger-log4j.properties from here and sed-appends ranger-admin-site.xml.append. Minimal, no-Kerberos.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ranger-admin-conf
  namespace: data-mesh
data:
  krb5.conf: |
    [libdefaults]
        default_realm = WEYLAND.LAB
        dns_lookup_realm = false
        dns_lookup_kdc = false
  # NOTE: start-ranger.sh deletes the original </configuration> and splices this in — so it MUST set
  # ranger.service.host (else Tomcat: "Host name is required") AND re-close the <configuration> block.
  ranger-admin-site.xml.append: |
    <property>
        <name>ranger.service.host</name>
        <value>0.0.0.0</value>
    </property>
    <property>
        <name>ranger.service.http.port</name>
        <value>6080</value>
    </property>
    <property>
        <name>ranger.service.http.enabled</name>
        <value>true</value>
    </property>
    </configuration>
  ranger-log4j.properties: |
    log4j.rootLogger=INFO,console
    log4j.appender.console=org.apache.log4j.ConsoleAppender
    log4j.appender.console.target=System.out
    log4j.appender.console.layout=org.apache.log4j.PatternLayout
    log4j.appender.console.layout.ConversionPattern=%d{ISO8601} [%t] %-5p %c{2} - %m%n
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranger-admin
  namespace: data-mesh
  labels: { app: ranger-admin }
spec:
  replicas: 1
  strategy: { type: Recreate }   # single instance; policy state is in Postgres, not local
  selector:
    matchLabels: { app: ranger-admin }
  template:
    metadata:
      labels: { app: ranger-admin }
      annotations:
        # setup.sh connects to STRICT-mTLS Postgres at boot — hold the app until the sidecar is up.
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
    spec:
      terminationGracePeriodSeconds: 5   # the sleep-infinity pod ignores SIGTERM; don't wait 30s under Recreate
      containers:
        - name: ranger-admin
          image: weyland/ranger:2.6.0-py3   # baked = mr3project/ranger:2.6.0 + python3 (services/ranger/Dockerfile)
          imagePullPolicy: IfNotPresent            # local ctr-imported image (same pattern as the dagster image)
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              # python3 is baked into the image now (Ranger 2.6 setup needs it; base ships only python2.7). Just strip
              # the unconditional MySQL-connector wget (we're on Postgres + LAN; dev.mysql.com would hang) and run.
              sed -i '/wget https:\/\/dev.mysql.com/,+2d' /opt/mr3-run/ranger/start-ranger.sh
              exec /opt/mr3-run/ranger/start-ranger.sh
          ports:
            - { name: http, containerPort: 6080 }
          resources:
            requests: { memory: 1Gi, cpu: 250m }
            limits: { memory: 2Gi }
          readinessProbe:
            httpGet: { path: /login.jsp, port: 6080 }
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 20
          volumeMounts:
            # install.properties lives in the key/ dir (RANGER_ADMIN_CONF); conf/ holds krb5/log4j/append.
            - { name: key, mountPath: /opt/mr3-run/ranger/key }
            - { name: conf, mountPath: /opt/mr3-run/ranger/conf }
      volumes:
        - name: key
          configMap: { name: ranger-admin-install }
        - name: conf
          configMap: { name: ranger-admin-conf }
---
apiVersion: v1
kind: Service
metadata:
  name: ranger-admin
  namespace: data-mesh
  labels: { app: ranger-admin }
spec:
  selector: { app: ranger-admin }
  ports:
    - { name: http, port: 6080, targetPort: 6080 }
---
# Ranger's Tomcat ignores X-Forwarded-Proto and emits absolute http:// redirects (→ /login.jsp), downgrading the
# browser off https before forward-auth sees it, so forward-auth builds an http redirect_uri Keycloak rejects.
# This middleware upgrades any http hop back to https (no-op when already https) — chained BEFORE forward-auth.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: data-mesh
spec:
  redirectScheme:
    scheme: https
    permanent: false
---
# ranger.weyland.lab — Policy Manager UI behind traefik-forward-auth (Keycloak SSO), mirroring the
# clickhouse/cockroach/trino data-mesh UIs. Ranger keeps its own admin login too, so this is a double gate
# (Keycloak perimeter → Ranger admin login); native Ranger↔Keycloak SSO is a later refinement.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ranger-admin
  namespace: data-mesh
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: data-mesh-redirect-https@kubernetescrd,data-mesh-traefik-forward-auth@kubernetescrd
spec:
  tls:
    - hosts: [ranger.weyland.lab]
      secretName: weyland-wildcard-tls
  rules:
    - host: ranger.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ranger-admin
                port: { number: 6080 }
