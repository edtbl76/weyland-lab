# B51 — GlitchTip (error tracking, Sentry-SDK-compatible). web + celery worker + a small Valkey (6.2's cache
# backend `django_vcache` is REQUIRED — the allauth rate-limiter uses it, so without it every auth request 500s;
# Valkey also serves as the Celery broker). Meshed for STRICT-mTLS Postgres (db/role `glitchtip`). GlitchTip does
# NOT auto-migrate → migrate initContainer. Own login (admin via createsuperuser). Apps send via the Sentry SDK.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glitchtip-valkey
  namespace: weyland
  labels:
    app: glitchtip-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glitchtip-valkey
  template:
    metadata:
      labels:
        app: glitchtip-valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine  # nosemgrep: yaml.kubernetes.security.run-as-non-root.run-as-non-root
          # B47 hardening: drop priv-esc + seccomp (see arch)
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: glitchtip-valkey
  namespace: weyland
  labels:
    app: glitchtip-valkey
spec:
  selector:
    app: glitchtip-valkey
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glitchtip-web
  namespace: weyland
  labels:
    app: glitchtip-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glitchtip-web
  template:
    metadata:
      labels:
        app: glitchtip-web
        sidecar.istio.io/inject: "true"   # STRICT Postgres
    spec:
      # GlitchTip does NOT auto-migrate — run it before web starts (native Istio sidecar is up first in 1.30, so
      # this reaches STRICT Postgres; if a fresh deploy fails here, run `./manage.py migrate` manually).
      initContainers:
        # B1.1 — build a combined CA bundle (system trust + mkcert root) so the allauth OIDC back-channel can
        # VERIFY Keycloak's cert. requests ignores the system store unless REQUESTS_CA_BUNDLE points at a bundle;
        # concat keeps public CAs working too. (If this initContainer errors on the cat path, the image's CA
        # bundle lives elsewhere — adjust /etc/ssl/certs/ca-certificates.crt.)
        - name: ca-bundle
          image: glitchtip/glitchtip:6.2.0
          command: ["sh", "-c", "cat /etc/ssl/certs/ca-certificates.crt /mkcert/rootCA.pem > /cabundle/ca-bundle.crt"]
          volumeMounts:
            - { name: mkcert-ca, mountPath: /mkcert, readOnly: true }
            - { name: ca-bundle, mountPath: /cabundle }
        - name: migrate
          image: glitchtip/glitchtip:6.2.0
          command: ["./manage.py", "migrate", "--noinput"]
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: glitchtip-secret
                  key: SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: glitchtip-secret
                  key: DATABASE_URL
      containers:
        - name: glitchtip
          image: glitchtip/glitchtip:6.2.0  # nosemgrep: yaml.kubernetes.security.run-as-non-root.run-as-non-root
          imagePullPolicy: IfNotPresent
          # B47 hardening: drop priv-esc + seccomp (see arch)
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: GLITCHTIP_DOMAIN
              value: https://glitchtip.weyland.lab
            - name: ALLOWED_HOSTS
              value: "*"   # k8s readiness probe hits the pod IP — a restricted host list 400s it. LAN-only behind Traefik.
            - name: REDIS_URL
              value: redis://glitchtip-valkey:6379/0
            - name: VALKEY_URL
              value: valkey://glitchtip-valkey:6379/0
            - name: EMAIL_URL
              value: consolemail://
            - name: DEFAULT_FROM_EMAIL
              value: glitchtip@weyland.lab
            - name: ENABLE_USER_REGISTRATION
              value: "false"   # locked — admin created via createsuperuser; open registration 500s anyway
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: glitchtip-secret
                  key: SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: glitchtip-secret
                  key: DATABASE_URL
            # B1.1 — point Python/requests at the combined CA bundle so the OIDC back-channel trusts Keycloak.
            - name: REQUESTS_CA_BUNDLE
              value: /cabundle/ca-bundle.crt
            - name: SSL_CERT_FILE
              value: /cabundle/ca-bundle.crt
          volumeMounts:
            - { name: ca-bundle, mountPath: /cabundle, readOnly: true }
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
      volumes:
        - name: mkcert-ca
          secret:
            secretName: weyland-mkcert-ca
        - name: ca-bundle
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glitchtip-worker
  namespace: weyland
  labels:
    app: glitchtip-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glitchtip-worker
  template:
    metadata:
      labels:
        app: glitchtip-worker
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: glitchtip
          image: glitchtip/glitchtip:6.2.0  # nosemgrep: yaml.kubernetes.security.run-as-non-root.run-as-non-root
          imagePullPolicy: IfNotPresent
          # B47 hardening: drop priv-esc + seccomp (see arch)
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          command: ["./bin/run-celery-with-beat.sh"]
          env:
            - name: GLITCHTIP_DOMAIN
              value: https://glitchtip.weyland.lab
            - name: REDIS_URL
              value: redis://glitchtip-valkey:6379/0
            - name: VALKEY_URL
              value: valkey://glitchtip-valkey:6379/0
            - name: EMAIL_URL
              value: consolemail://
            - name: DEFAULT_FROM_EMAIL
              value: glitchtip@weyland.lab
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: glitchtip-secret
                  key: SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: glitchtip-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: glitchtip
  namespace: weyland
  labels:
    app: glitchtip-web
spec:
  type: ClusterIP
  selector:
    app: glitchtip-web
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: glitchtip
  namespace: weyland
spec:
  tls:
    - hosts:
        - glitchtip.weyland.lab
      secretName: weyland-wildcard-tls
  rules:
    - host: glitchtip.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: glitchtip
                port:
                  number: 8000
