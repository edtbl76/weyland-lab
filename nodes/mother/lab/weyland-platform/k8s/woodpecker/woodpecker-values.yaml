# CI/CD category — Woodpecker CI on k3s. Server (UI + orchestration) + agent (KUBERNETES backend: pipeline
# steps run as pods IN the cluster, so pipelines can build/deploy the weyland apps). LAN-only
# (woodpecker.weyland.lab); GitHub OAuth login; manual/cron triggers (GitHub can't reach the LAN for push
# webhooks). Intended as the shared build farm — Stud.IO migrates onto it later. Chart: woodpecker-ci/woodpecker.
agent:
  env:
    WOODPECKER_SERVER: 'woodpecker-server:9000'
    WOODPECKER_BACKEND: kubernetes
    WOODPECKER_BACKEND_K8S_NAMESPACE: woodpecker
    WOODPECKER_BACKEND_K8S_STORAGE_CLASS: local-path
    WOODPECKER_BACKEND_K8S_VOLUME_SIZE: 5G
    WOODPECKER_BACKEND_K8S_STORAGE_RWX: false        # single-node k3s → local-path is RWO; steps run sequentially
    WOODPECKER_CONNECT_RETRY_COUNT: '3'
  persistence:
    enabled: false
  serviceAccount:
    create: true                                     # + chart RBAC: lets the agent spawn step pods/PVCs in ns woodpecker

server:
  enabled: true
  env:
    WOODPECKER_HOST: 'https://woodpecker.weyland.lab'
    WOODPECKER_ADMIN: 'edtbl76'                       # GitHub username → first admin
    WOODPECKER_GITHUB: 'true'                         # forge = GitHub
    WOODPECKER_OPEN: 'false'                          # no open registration (admin-gated)
    # SQLite in WAL mode. The path is the chart's own default (/var/lib/woodpecker/woodpecker.sqlite on the
    # `data` PVC) — restated here ONLY because the DSN is the sole place these pragmas can be set.
    #
    # WHY: the server logged 8 × "database is locked" between 2026-08-10 and 2026-08-22 — 6 on the metrics
    # writer, 2 on "obtain cron list". Every one landed between 00:16 and 03:05 EDT, i.e. inside the overnight
    # Dagster/DataHub batch window when mother's disk is saturated; Woodpecker itself is idle then. Cause is a
    # default, not a bug: WOODPECKER_DATABASE_MAX_CONNECTIONS defaults to **100**, and a 100-connection pool
    # against SQLite in its default journal_mode=DELETE means any write blocks every reader for its duration.
    # mattn/go-sqlite3's default busy timeout is 5s, which a contended disk can exceed.
    #
    # WAL is the real fix (readers no longer block the writer, or the writer them); the timeout is margin for
    # the genuinely slow moments. Verified against v3.17.0 rather than assumed: it links
    # mattn/go-sqlite3 v1.14.49, whose DSN accepts `_journal_mode`/`_busy_timeout`, and
    # server/store/datastore/engine.go passes the datasource UNMODIFIED to xorm.NewEngine.
    #
    # PRECONDITION: WAL requires local storage — it is unsafe on network filesystems. `local-path` is a local
    # ext4 dir on mother, so this is fine. It adds `-wal`/`-shm` files beside the DB on the 5Gi PVC.
    # NOT TRIVIALLY REVERSIBLE: journal_mode lives in the DB header, so removing this line does NOT restore
    # DELETE mode — that needs an explicit `PRAGMA journal_mode=DELETE`.
    # MAX_CONNECTIONS deliberately left at its 100 default: with WAL, concurrent readers are no longer the
    # problem. Lower it only if locks persist, and change one thing at a time.
    WOODPECKER_DATABASE_DATASOURCE: '/var/lib/woodpecker/woodpecker.sqlite?_journal_mode=WAL&_busy_timeout=15000'
  # GitHub OAuth client + secret live in the woodpecker-secret you create (WOODPECKER_GITHUB_CLIENT/SECRET).
  extraSecretNamesForEnvFrom:
    - woodpecker-secret
    - woodpecker-grpc-secret                          # stable WOODPECKER_GRPC_SECRET — the server signs agent session tokens with
                                                       # it; random-per-restart otherwise, so a server bounce invalidates every
                                                       # agent's session token. Server-only; sealed under k8s/sealed-secrets/sealed/.
    - woodpecker-default-agent-secret                 # REQUIRED with createAgentSecret:false — the chart only auto-wires this
                                                       # into the SERVER when it generates it. Without this line the server has no
                                                       # WOODPECKER_AGENT_SECRET, so it can't match the agent's token as the shared
                                                       # secret and rejects every agent ("individual agent not found by token").
  createAgentSecret: false                            # we own woodpecker-default-agent-secret via SealedSecret (stable value).
                                                       # The chart's generated secret rotates under Argo (helm `lookup` can't
                                                       # preserve it on every render), and a rotated token no longer matches the
                                                       # agent rows in the server's persistent DB → agents fatal on auth
                                                       # ("individual agent not found by token"). A stable owned secret removes
                                                       # that drift. See k8s/sealed-secrets/sealed/woodpecker__woodpecker-default-agent-secret.yaml
  persistentVolume:
    enabled: true
    size: 5Gi
    storageClass: local-path                          # SQLite DB at /var/lib/woodpecker
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    ingressClassName: traefik
    # Keycloak SSO gate (forward-auth). NOTE: woodpecker also has its own GitHub-forge login, so this is
    # double-auth (Keycloak THEN GitHub) — gated per "everything behind Keycloak"; drop it if the double-login grates.
    annotations:
      traefik.ingress.kubernetes.io/router.middlewares: woodpecker-traefik-forward-auth@kubernetescrd
    hosts:
      - host: woodpecker.weyland.lab
        paths:
          - path: /
            backend:
              serviceName: woodpecker-server
              servicePort: 80
    tls:
      - secretName: weyland-wildcard-tls
        hosts:
          - woodpecker.weyland.lab
