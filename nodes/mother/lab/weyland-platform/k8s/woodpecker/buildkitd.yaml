# B57a — persistent BuildKit daemon for the weyland image CI pipeline.
# WHY a daemon (not build-in-the-step-pod): daemonless BuildKit inside an ephemeral Woodpecker step pod could not
# perform its snapshot bind-mounts on this k3s cluster — EPERM even with privileged + AppArmor-unconfined +
# repo trusted-security + overlayfs-on-a-real-fs. A long-lived buildkitd runs those mounts in its OWN stable mount
# namespace (the standard buildkit-in-k8s pattern) and the CI step becomes a thin `buildctl --addr tcp://…` client
# that mounts nothing. Small idle footprint (request 128Mi); spikes ~1-3 GB during a build (off-hours cron), on the
# overlayfs snapshotter over a real-fs PVC. LAN/in-ns only, plain tcp (no TLS) — ns-internal Service.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buildkitd-cache
  namespace: woodpecker
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 40Gi
---
# Pillar-7 acceptances (scoped to buildkitd only, so the guard stays active on every other manifest):
# trivy:ignore:AVD-KSV-0017 buildkitd MUST be privileged — it performs the snapshot/overlay mounts image builds need; internal CI daemon, ns-isolated (runbook B57a)
# trivy:ignore:AVD-KSV-0014 buildkitd needs a writable rootfs (build scratch in /tmp, /run) — readOnlyRootFilesystem is incompatible
# trivy:ignore:AVD-KSV-0118 buildkitd runs as root by design (a privileged build daemon)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
  namespace: woodpecker
  labels: { app: buildkitd }
spec:
  replicas: 1
  strategy: { type: Recreate }        # RWO cache PVC → single writer
  selector:
    matchLabels: { app: buildkitd }
  template:
    metadata:
      labels: { app: buildkitd }
      annotations:
        sidecar.istio.io/inject: "false"                                        # buildkit tcp must not go via Envoy
    spec:
      containers:
        - name: buildkitd
          image: moby/buildkit:latest
          args:
            - --addr
            - tcp://0.0.0.0:1234
            - --oci-worker-snapshotter=overlayfs
            - --root
            - /var/lib/buildkit
          securityContext:
            privileged: true            # buildkit needs mount/overlay; honored here (its own manifest, not a Woodpecker step)
            appArmorProfile:
              type: Unconfined          # let buildkitd do its mounts (k8s ≥1.30 field; replaces the deprecated annotation)
          ports:
            - { name: grpc, containerPort: 1234 }
          readinessProbe:
            exec: { command: ["buildctl", "--addr", "tcp://0.0.0.0:1234", "debug", "workers"] }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 6Gi }
          volumeMounts:
            - { name: cache, mountPath: /var/lib/buildkit }
      volumes:
        - name: cache
          persistentVolumeClaim: { claimName: buildkitd-cache }
---
apiVersion: v1
kind: Service
metadata:
  name: buildkitd
  namespace: woodpecker
  labels: { app: buildkitd }
spec:
  selector: { app: buildkitd }
  ports:
    - { name: grpc, port: 1234, targetPort: 1234, protocol: TCP }
---
# B211 (2026-10-14) — buildkitd's front door. It's privileged, with no TLS or auth on :1234, and any pod could ask it to
# build and push an image. Only the two CI steps that build talk to it (scripts/ci/build-images.sh via BUILDKIT_HOST, and
# scripts/run-golden-path-jobs.sh), so only pods carrying those Woodpecker step labels are admitted. The step label is the
# step's name in .woodpecker.yml (no PR-triggered pipelines run, so only someone who can push to main can set it);
# scripts/tests/write-surface-netpol.bats ties both names to the pipeline file so a rename can't silently lock CI out.
# The readinessProbe is an exec inside the pod, so the policy never sees it. mTLS (buildkitd --tlscacert…) would add
# identity on top; deferred, it needs a hand-made CA (no cert-manager here).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: buildkitd-ci-build-steps-only
  namespace: woodpecker
spec:
  podSelector:
    matchLabels: { app: buildkitd }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: woodpecker-ci.org/step, operator: In, values: [build, golden-path-smoke] }
      ports:
        - { protocol: TCP, port: 1234 }
