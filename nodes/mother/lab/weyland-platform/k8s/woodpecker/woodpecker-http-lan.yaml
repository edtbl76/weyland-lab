# B57 — LAN NodePort for the Woodpecker server's HTTP (REST API + UI) port.
# The public route (woodpecker.weyland.lab) is behind traefik-forward-auth (Keycloak), which 302-redirects
# Bearer API calls to the login page → woodpecker-cli / API clients can't authenticate through it. This NodePort
# bypasses Traefik and hits the server directly, giving a stable LAN endpoint for the CLI (replaces an ad-hoc
# port-forward; the lab is NodePorts only):
#   192.168.1.243:30980 → server http:80
# Trust boundary = the caller's Woodpecker PAT (same token model as the public API); LAN-only, plaintext HTTP.
# Mirrors woodpecker-grpc-lan.yaml. Synced by the `woodpecker-http` raw-extras Argo app (raw manifest in the helm
# dir; the helm `woodpecker` app consumes only *-values.yaml).
apiVersion: v1
kind: Service
metadata:
  name: woodpecker-http-lan
  namespace: woodpecker
  labels:
    app.kubernetes.io/instance: woodpecker
    app.kubernetes.io/name: server
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: woodpecker
    app.kubernetes.io/name: server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      nodePort: 30980
---
# 2026-11-24: `traefik-forward-auth` is a CHAIN — upgrade http to https FIRST, then authenticate. Over plain http the
# proxy built redirect_uri=http://auth.weyland.lab/_oauth, which Keycloak rejects ("Invalid parameter: redirect_uri").
# Same shape in every namespace's copy (this one was hand-made on 2026-06-25 and is now in git); test: scripts/tests/write-surface-netpol.bats.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-forward-auth
  namespace: woodpecker
spec:
  chain:
    middlewares:
      - name: traefik-forward-auth-https
      - name: traefik-forward-auth-core
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-forward-auth-https
  namespace: woodpecker
spec:
  redirectScheme: { scheme: https, permanent: false }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-forward-auth-core
  namespace: woodpecker
spec:
  forwardAuth:
    address: http://traefik-forward-auth.weyland.svc.cluster.local:4181
    trustForwardHeader: true
    authResponseHeaders:
      - X-Forwarded-User
