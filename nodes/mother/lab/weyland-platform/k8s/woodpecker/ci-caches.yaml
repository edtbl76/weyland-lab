# B88 #6 — persistent toolchain caches for the CI lanes.
#
# Every lane reinstalled its toolchain per run — `cargo install cargo-llvm-cov/cargo-audit/cargo-deny`
# (compiled from source, minutes each), maven plugins, go modules, npm packages, and (since #3) the
# 109 MB trivy vuln DB. These PVCs persist those across runs; the steps mount them (in the .woodpecker/ workflows)
# at each toolchain's cache dir with the matching cache env var.
#
# HAND-APPLIED, like `buildkitd-cache` — `k8s/woodpecker/` raw manifests are not Argo-synced (the Helm
# app deploys woodpecker itself; these are operator-applied). MUST exist before a workflow mounts them, or step pods
# stay Pending on a missing PVC.
#
# MOTHER'S caches (B200, 2026-11-18): local-path volumes live on mother, so only workflows on the mother agent pool may
# mount them: maven (platform: test/scan-java) and trivy (deliver: build). The cargo, go and npm caches moved to
# timberback with fixtures-b (ci-caches-timberback.yaml, `-tb`, Argo-managed) and were removed from here at the B200
# close-out (2026-11-19). scripts/tests/pipeline-layout.bats enforces the node match.
#
# RWO + local-path: each cache is mounted by ONE workflow, whose steps run in order, so one writer at a time keeps
# each cache intact (concurrent writers would corrupt a shared cargo/maven dir). Node-local, on mother's disk.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: ci-cache-maven, namespace: woodpecker }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 4Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: ci-cache-trivy, namespace: woodpecker }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 2Gi } }
