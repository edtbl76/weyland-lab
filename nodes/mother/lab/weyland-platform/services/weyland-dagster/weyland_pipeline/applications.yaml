# ============================================================================
# Canonical Application registry — B82 app taxonomy (the ONE source of truth).
# Design: aidlc-docs/application-taxonomy.md.
#
# Consumed by:
#   - datahub_emit.py :: emit_applications()  (baked into the Dagster image via COPY weyland_pipeline/)
#   - tofu/port/catalog.tf                     (yamldecode — a Port `component` per `applications:` entry)
#   - docs + diagrams                          (written from + DoD-checked against this)
#
# COMPLETENESS: every deployed Argo CD Application (k8s/argocd/applications/, ~74) + the non-k8s services
# (whisper/ollama CTs) + the data-mesh sub-components must appear here — either as an `applications:` entry
# (it's a component) or in `excluded:` (a store or plumbing). Nothing unaccounted. A drift check diffs the
# live Argo app list against this file. If it's not here, it's in no surface AND it's a drift finding.
#
# SCHEMA — applications[] (things that get a Port `component`):
#   key                 stable id — the Port component identifier + (where applicable) the k8s workload
#   name                display name (DataHub Application + docs)
#   group               core-producer | ai-serving | data-platform | bi | operational | observability |
#                       serving | gateway | ui | platform
#   datahub_application  true → gets a DataHub Application entity + owns assets; false → Port component only
#   owns                URN-substring patterns, producer-based, FIRST-MATCH in list order (specific→broad,
#                       weyland-dagster last). [] = modeled now, owns nothing yet ("plausibly will").
#   traces              optional MLflow experiment (the explicit-tag path — trace URNs don't reveal producer)
#   port_component      the Port component entity id (== key)
#
# SCHEMA — excluded[] (accounted-for, but NOT a component): { key, kind: store|plumbing, reason }
# Catalog `owns` status verified 2026-08-05 vs pg_database on weyland-postgres + the DataHub platform list.
# ============================================================================

applications:

