# Planted-violation config for the architecture tests (B152). Mirrors the real `.importlinter` forbidden
# contracts but points at fixture modules that DO commit each violation, so import-linter must report all
# three BROKEN — proving each rule catches a real violation, not merely that the config loads.
[importlinter]
root_package = badleaf_pkg
include_external_packages = True

[importlinter:contract:leaves-are-dagster-free]
name = fixture leaf must not import dagster
type = forbidden
source_modules =
    badleaf_pkg.leaf
forbidden_modules =
    dagster

[importlinter:contract:leaves-are-resource-free]
name = fixture leaf must not import resources
type = forbidden
source_modules =
    badleaf_pkg.leaf
forbidden_modules =
    badleaf_pkg.resource

[importlinter:contract:resources-are-independent]
name = fixture resources must not import the pipeline assets layer
type = forbidden
source_modules =
    badleaf_pkg.resource
forbidden_modules =
    badleaf_pkg.asset
