# Planted-violation config for the architecture test (B152). Mirrors the real `.importlinter` forbidden
# contract but points at a fixture leaf that DOES import dagster, so import-linter must report it BROKEN.
[importlinter]
root_package = badleaf_pkg
include_external_packages = True

[importlinter:contract:leaves-are-dagster-free]
name = fixture leaf must not import dagster
type = forbidden
source_modules =
    badleaf_pkg.leaf
forbidden_modules =
    dagster
