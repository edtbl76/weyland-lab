version: 2

sources:
  - name: datasets_finance
    description: "Iceberg gold (Nessie `main`) for the finance domain — produced by the datasets_lib pipeline from the FRED macro series (B113 Phase 1). dbt reads these; it does not write them."
    database: iceberg          # Trino catalog
    schema: datasets_finance   # flat Nessie namespace
    tables:
      # Single-file raw folders → per-folder Iceberg tables (ice_ident): identifier == the folder name.
      - name: fred_macro
        identifier: fred_macro
        description: "FRED macro series, LONG/tidy: (series_id, date, value) for all 13 series stacked."
      - name: fred_series_meta
        identifier: fred_series_meta
        description: "FRED series dimension: (series_id, title, units, frequency, seasonal_adjustment)."
      # SEC EDGAR XBRL slice (B113 Phase 2) — landed by datasets_finance_edgar_land.
      - name: company_financials
        identifier: company_financials
        description: "SEC EDGAR company facts, LONG/tidy: (cik, ticker, company, concept, unit, period_end, fy, fp, form, filed, value) for ~50 curated companies."
      - name: company_meta
        identifier: company_meta
        description: "SEC EDGAR company dimension: (cik, ticker, company, sic, sic_description, exchange)."
      # Market daily OHLCV (B113 Phase 4) — landed by datasets_finance_market_land (yfinance).
      - name: price_daily
        identifier: price_daily
        description: "Daily OHLCV bars: (ticker, date, open, high, low, close, adj_close, volume) — full history for the ~50 finance mega-caps."
