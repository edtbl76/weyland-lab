version: 2

models:
  - name: mart_spotify_audio
    description: >
      ML/analysis-ready Spotify audio features: the 11 audio descriptors + track_genre, one row per track,
      rare genres (< 20 tracks) dropped. The tested source of truth for the genre classifier + Feast
      track_audio_features. Feeds mart_genre_audio_profile.
    columns:
      - name: track_id
        description: "Spotify track id — unique after dedup."
        meta: {metrics: {track_count: {type: count_distinct, label: "Tracks"}}}
        tests:
          - unique
          - not_null
      - name: track_genre
        description: "Genre label (>= 20 tracks)."
        tests:
          - not_null
      - name: danceability
        description: "Danceability (0–1): suitability for dancing from tempo, rhythm stability, beat strength."
        meta: {metrics: {avg_danceability: {type: average}}}
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1
      - name: energy
        description: "Energy (0–1): perceptual measure of intensity and activity."
        meta: {metrics: {avg_energy: {type: average}}}
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1
      - name: valence
        description: "Valence (0–1): musical positiveness — high = happy/cheerful, low = sad/angry."
        meta: {metrics: {avg_valence: {type: average}}}
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1
      - name: tempo
        description: "Estimated tempo in beats per minute (BPM)."
        meta: {metrics: {avg_tempo: {type: average}}}
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 300
      - name: key
        description: "Estimated musical key as a pitch class (0=C … 11=B; -1 if undetected)."
      - name: loudness
        description: "Overall loudness averaged across the track, in decibels (~ -60 to 0)."
        meta: {metrics: {avg_loudness: {type: average}}}
      - name: mode
        description: "Modality: major (1) / minor (0)."
      - name: speechiness
        description: "Speechiness (0–1): presence of spoken words."
        meta: {metrics: {avg_speechiness: {type: average}}}
      - name: acousticness
        description: "Acousticness (0–1): confidence the track is acoustic."
        meta: {metrics: {avg_acousticness: {type: average}}}
      - name: instrumentalness
        description: "Instrumentalness (0–1): likelihood the track contains no vocals."
        meta: {metrics: {avg_instrumentalness: {type: average}}}
      - name: liveness
        description: "Liveness (0–1): probability the track was performed with a live audience."
        meta: {metrics: {avg_liveness: {type: average}}}

  - name: mart_genre_audio_profile
    description: >
      Per-genre audio signature: mean + stddev of the 11 audio features + track count, one row per genre.
      Built on mart_spotify_audio — the interpretable baseline for the genre classifier.
    columns:
      - name: track_genre
        description: "Genre — one row per genre (unique)."
        meta: {metrics: {genre_count: {type: count_distinct, label: "Genres"}}}
        tests:
          - unique
          - not_null
      - name: n_tracks
        description: "Tracks contributing to the genre's profile (>= 20 by construction)."
        meta: {metrics: {total_tracks: {type: sum, label: "Total tracks"}}}
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 20
      - name: danceability_mean
        description: "Mean danceability across the genre's tracks."
      - name: danceability_std
        description: "Std dev of danceability across the genre's tracks."
      - name: energy_mean
        description: "Mean energy across the genre's tracks."
      - name: energy_std
        description: "Std dev of energy across the genre's tracks."
      - name: key_mean
        description: "Mean key across the genre's tracks."
      - name: key_std
        description: "Std dev of key across the genre's tracks."
      - name: loudness_mean
        description: "Mean loudness (dB) across the genre's tracks."
      - name: loudness_std
        description: "Std dev of loudness across the genre's tracks."
      - name: mode_mean
        description: "Mean mode across the genre's tracks (fraction in major key)."
      - name: mode_std
        description: "Std dev of mode across the genre's tracks."
      - name: speechiness_mean
        description: "Mean speechiness across the genre's tracks."
      - name: speechiness_std
        description: "Std dev of speechiness across the genre's tracks."
      - name: acousticness_mean
        description: "Mean acousticness across the genre's tracks."
      - name: acousticness_std
        description: "Std dev of acousticness across the genre's tracks."
      - name: instrumentalness_mean
        description: "Mean instrumentalness across the genre's tracks."
      - name: instrumentalness_std
        description: "Std dev of instrumentalness across the genre's tracks."
      - name: liveness_mean
        description: "Mean liveness across the genre's tracks."
      - name: liveness_std
        description: "Std dev of liveness across the genre's tracks."
      - name: valence_mean
        description: "Mean valence across the genre's tracks."
      - name: valence_std
        description: "Std dev of valence across the genre's tracks."
      - name: tempo_mean
        description: "Mean tempo (BPM) across the genre's tracks."
      - name: tempo_std
        description: "Std dev of tempo across the genre's tracks."

  - name: mart_fma_genre_tree
    description: >
      FMA genre taxonomy dimension — genre_id, title, parent (id + title), and a top-level flag. One row per genre.
    columns:
      - name: genre_id
        description: "FMA genre id (unique)."
        meta: {metrics: {genre_count: {type: count_distinct, label: "Genres"}}}
        tests:
          - unique
          - not_null
      - name: genre_title
        description: "Genre name."
        tests:
          - not_null
      - name: parent_id
        description: "Parent genre id (null / 0 for top-level)."
      - name: parent_title
        description: "Parent genre name (null for top-level)."
      - name: is_top_level
        description: "True for root genres."

  - name: mart_artist_popularity
    description: >
      Per-artist Last.fm popularity — total plays + distinct listeners, one row per artist_name, with a
      best-effort MusicBrainz URL joined on mbid.
    columns:
      - name: artist_name
        description: "Artist name (unique)."
        meta: {metrics: {artist_count: {type: count_distinct, label: "Artists"}}}
        tests:
          - unique
          - not_null
      - name: total_plays
        description: "Sum of Last.fm play counts for the artist."
        meta: {metrics: {total_plays_sum: {type: sum, label: "Total plays"}, avg_plays: {type: average}, max_plays: {type: max}}}
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: n_listeners
        description: "Approx-distinct listeners (HyperLogLog)."
        meta: {metrics: {total_listeners: {type: sum, label: "Total listeners"}, avg_listeners: {type: average}}}
      - name: mbid
        description: "MusicBrainz artist id (mbid)."
      - name: musicbrainz_url
        description: "Best-effort MusicBrainz artist URL (joined on mbid; null if unmatched)."
