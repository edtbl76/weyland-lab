# dbt-trino → the in-cluster Trino coordinator (data-mesh, meshed). `database` = the Trino CATALOG (iceberg = native-Nessie
# on the main ref); `schema` = the flat Nessie namespace dbt writes its models into (kept flat — Trino's native Nessie
# catalog can't see nested namespaces). Host overridable by env for local runs.
# B233 (2026-10-23): Trino authenticates. dbt logs in as `dbt` with a password (method `ldap` is dbt-trino's name for
# username + password, whatever Trino checks it against — here the file authenticator) over HTTPS on 8443, and verifies
# Trino's cert against the lab's mkcert CA. TRINO_USER / TRINO_PASSWORD come from the `trino-dbt` Secret.
weyland:
  target: prod
  outputs:
    prod:
      type: trino
      method: ldap
      user: "{{ env_var('TRINO_USER', 'dbt') }}"
      # '' default: the image build runs `dbt parse` with no credentials (Dockerfile). At run time an unset password
      # is a loud 401 from Trino, never a silent unauthenticated connection.
      password: "{{ env_var('TRINO_PASSWORD', '') }}"
      host: "{{ env_var('DBT_TRINO_HOST', 'trino.data-mesh.svc.cluster.local') }}"
      port: 8443
      http_scheme: https
      cert: "{{ env_var('TRINO_CA', '/etc/weyland-ca/rootCA.pem') }}"
      database: iceberg
      schema: dbt
      # 1, not 2 (2026-10-21): Trino was OOM-killed at its 8Gi limit one minute into the Sunday build on 10-11 and 10-18
      # (its non-heap memory creeps ~0.4 GiB/day, so a week-old Trino has little headroom). At 1 thread the whole build
      # takes ~37 s and adds ~1.9 GiB at peak (measured 2026-10-21); speed is not the constraint, memory is.
      threads: 1
