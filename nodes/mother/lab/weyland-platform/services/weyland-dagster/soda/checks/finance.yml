# Soda data-quality — finance-domain SILVER/GOLD (data source weyland_finance = iceberg.datasets_finance).
# B113 Phase 1: the FRED macro slice — a tidy/long series table + its dimension. Mirrors the mart/silver rigor
# (music.yml/health.yml/music_silver.yml): row presence, key non-null, and missing_percent(col)<100 "not 100%
# NULL" tripwires (a min/max check passes vacuously on an all-null column — these do not). fred_macro carries a
# genuine gap (FRED encodes a missing observation as "." → value NULL), so `value` is NOT asserted non-null —
# only that the whole column is not 100% NULL. series_id + date are the (series_id, date) grain keys and must be
# complete. The mart_macro_indicators dbt mart lives in iceberg.dbt and is covered by the `weyland` marts scan +
# the for-each-dataset baseline (baseline.yml).

checks for fred_macro:
  - row_count > 0
  - missing_count(series_id) = 0
  - missing_count(date) = 0
  - missing_percent(value) < 100      # the series can carry gaps ("." → NULL), but must not be 100% empty

checks for fred_series_meta:
  - row_count > 0
  - duplicate_count(series_id) = 0    # one row per FRED series
  - missing_count(series_id) = 0
  - missing_count(title) = 0

# B113 Phase 2 — SEC EDGAR XBRL slice: the long financials table, the company dim, and the 10-K/10-Q filing
# history feeding the Neo4j graph. `value` carries genuine gaps (a company may not report every concept every
# period) so it is only "not 100% NULL", like fred_macro.value.
checks for company_financials:
  - row_count > 0
  - missing_count(cik) = 0
  - missing_count(concept) = 0
  - missing_count(period_end) = 0
  - missing_percent(value) < 100      # a concept can be absent for a period, but the column must not be all-NULL

checks for company_meta:
  - row_count > 0
  - duplicate_count(cik) = 0          # one row per company
  - missing_count(cik) = 0
  - missing_count(company) = 0

checks for company_filings:
  - row_count > 0
  - duplicate_count(accn) = 0         # accession number is globally unique per filing
  - missing_count(cik) = 0
  - missing_count(accn) = 0
  - missing_count(form) = 0

# B113 Phase 3 — SEC EDGAR filings-text slice: section-aware 10-K narrative chunks feeding the vector RAG
# fan-out (Qdrant/Weaviate/LanceDB). Every chunk must carry non-empty text (an empty chunk embeds to noise) and
# a section tag; (accn, chunk_id) is the grain, so text/section/cik must be complete.
checks for filings_text:
  - row_count > 0
  - missing_count(cik) = 0
  - missing_count(accn) = 0
  - missing_count(section) = 0
  - missing_count(text) = 0
  - missing_percent(text) < 100

# B113 Phase 4 — market daily OHLCV: the `price_daily` hypertable/analytical source feeding the Timescale +
# ClickHouse + Cassandra fan-out and the `mart_price_daily` mart. (ticker, date) is the grain — both complete
# and jointly unique — and close must be present on every landed bar (the lander drops NaN/in-progress bars).
checks for price_daily:
  - row_count > 0
  - missing_count(ticker) = 0
  - missing_count(date) = 0
  - missing_count(close) = 0
  - duplicate_count(ticker, date) = 0     # one bar per (ticker, trading day)
