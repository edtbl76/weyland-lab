  - missing_percent(numericvalue) < 100

checks for who_gho_hypertension:
  - row_count > 0
  - missing_percent(numericvalue) < 100

checks for who_gho_alcohol_consumption:
  - row_count > 0
  - missing_percent(numericvalue) < 100

checks for who_gho_tobacco_smoking:
  - row_count > 0
  - missing_percent(numericvalue) < 100

checks for who_gho_mental_health_disorders:
  - row_count > 0
  - missing_percent(numericvalue) < 100

checks for brfss_brfss_prevalence_2011_present:
  - row_count > 0
