# Soda Core data source → the in-cluster Trino coordinator (data-mesh, meshed). Same passwordless path dbt uses:
# no `password` → the trino client sends X-Trino-User only (no Authorization), so Soda presents as user `dbt`, which
# Ranger already authorizes on iceberg.dbt (dbt owns the marts). `http_scheme: http` mirrors profiles.yml — Trino's
# :8080 is plaintext on the LAN (Istio mTLS wraps it transparently between the meshed pods). This is L5 Slice C:
# an INDEPENDENT contract scan over the published marts, complementary to dbt's in-transform tests.
data_source weyland:
  type: trino
  host: trino.data-mesh.svc.cluster.local
  port: 8080
  http_scheme: http
  username: dbt
  catalog: iceberg
  schema: dbt
