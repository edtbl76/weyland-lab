# Soda Core data source → Trino via the `trino-noauth` nginx proxy (data-mesh, meshed). Soda's Trino connector
# ALWAYS sends HTTP Basic auth (like Lightdash's), and Trino — which runs no authenticator — rejects a password over
# plaintext ("Password not allowed for insecure authentication"). The proxy clears the Authorization header so Trino
# sees only X-Trino-User: dbt (the same no-auth path dbt uses; Ranger authorizes `dbt` on iceberg.dbt). Do NOT point
# this at trino.data-mesh directly — it 401s. `http_scheme: http` = plaintext on the LAN (Istio mTLS wraps the hop).
# L5 Slice C: an INDEPENDENT contract scan over the published marts, complementary to dbt's in-transform tests.
data_source weyland:
  type: trino
  host: trino-noauth.data-mesh.svc.cluster.local
  port: 8080
  http_scheme: http
  username: dbt
  catalog: iceberg
  schema: dbt
