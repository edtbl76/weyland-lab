# Generated by scripts/gen_odcs_contract.py from Trino + Soda + dbt substance (B157). Enrich the description prose by hand.
apiVersion: v3.0.0
kind: DataContract
id: weyland-health-personality-profiles
name: Personality Profiles
version: 1.0.0
status: active
domain: health
dataProduct: Personality Profiles
tenant: weyland
description:
  purpose: Big Five OCEAN traits aggregated to country level (mean of the 10 Likert items per trait; countries
    with >= 30 respondents). One row per country.
  usage: Query the iceberg.dbt.mart_personality_by_country table in Trino; see docs/demos/health-domain.md
    for worked queries and the BI surfaces.
servers:
- server: trino-dbt
  type: trino
  catalog: iceberg
  schema: dbt
  physicalName: iceberg.dbt.mart_personality_by_country
schema:
- name: mart_personality_by_country
  physicalName: iceberg.dbt.mart_personality_by_country
  properties:
  - name: country
    logicalType: string
    physicalType: varchar
    description: Country (unique).
  - name: n_respondents
    logicalType: integer
    physicalType: bigint
    description: Respondents contributing to the country's trait means (>= 30 by construction).
  - name: extraversion
    logicalType: number
    physicalType: decimal(21,1)
    description: Mean Extraversion (OCEAN), 1–5 Likert scale.
  - name: neuroticism
    logicalType: number
    physicalType: decimal(21,1)
    description: Mean Neuroticism (OCEAN), 1–5 Likert scale.
  - name: agreeableness
    logicalType: number
    physicalType: decimal(21,1)
    description: Mean Agreeableness (OCEAN), 1–5 Likert scale.
  - name: conscientiousness
    logicalType: number
    physicalType: decimal(21,1)
    description: Mean Conscientiousness (OCEAN), 1–5 Likert scale.
  - name: openness
    logicalType: number
    physicalType: decimal(21,1)
    description: Mean Openness (OCEAN), 1–5 Likert scale.
quality:
- property: table
  rule: row_count > 0
- property: table
  rule: duplicate_count(country) = 0
- property: table
  rule: missing_count(country) = 0
- property: table
  rule: min(extraversion) >= 1
- property: table
  rule: max(extraversion) <= 5
- property: table
  rule: min(openness) >= 1
- property: table
  rule: max(openness) <= 5
slaProperties:
- property: frequency
  value: on-demand
- property: retention
  value: indefinite
team:
- role: owner
  username: ed@timberbacklabs.com
support:
- channel: runbook
  url: docs/demos/health-domain.md
customProperties:
- property: medallion_layer
  value: gold
- property: source_system
  value: Big-Five
