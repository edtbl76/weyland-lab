# Generated by scripts/gen_odcs_contract.py from Trino + Soda + dbt substance (B157). Enrich the description prose by hand.
apiVersion: v3.0.0
kind: DataContract
id: weyland-health-chronic-trends
name: Chronic Health Trends
version: 1.0.0
status: active
domain: health
dataProduct: Chronic Health Trends
tenant: weyland
description:
  purpose: 'Chronic-condition prevalence (% "Yes", "Overall" break-out) by US state x year from BRFSS:
    diabetes, asthma, COPD, depression. The tested source for Feast state_health_risk. One row per (state,
    year).'
  usage: Query the iceberg.dbt.mart_state_health_trends table in Trino; see docs/demos/health-domain.md
    for worked queries and the BI surfaces.
servers:
- server: trino-dbt
  type: trino
  catalog: iceberg
  schema: dbt
  physicalName: iceberg.dbt.mart_state_health_trends
schema:
- name: mart_state_health_trends
  physicalName: iceberg.dbt.mart_state_health_trends
  properties:
  - name: state
    logicalType: string
    physicalType: varchar
    description: US state / territory abbreviation (BRFSS locationabbr).
  - name: year
    logicalType: integer
    physicalType: integer
    description: BRFSS survey year.
  - name: diabetes_pct
    logicalType: number
    physicalType: double
    description: Crude prevalence % of diagnosed diabetes.
  - name: asthma_pct
    logicalType: number
    physicalType: double
    description: Crude prevalence % of current asthma.
  - name: copd_pct
    logicalType: number
    physicalType: double
    description: Crude prevalence % of COPD.
  - name: depression_pct
    logicalType: number
    physicalType: double
    description: Crude prevalence % of diagnosed depression.
quality:
- property: table
  rule: row_count > 0
- property: table
  rule: duplicate_count(state, year) = 0
- property: table
  rule: missing_count(state) = 0
- property: table
  rule: missing_count(year) = 0
- property: table
  rule: min(diabetes_pct) >= 0
- property: table
  rule: max(diabetes_pct) <= 100
- property: table
  rule: min(depression_pct) >= 0
- property: table
  rule: max(depression_pct) <= 100
slaProperties:
- property: frequency
  value: on-demand
- property: retention
  value: indefinite
team:
- role: owner
  username: ed@timberbacklabs.com
support:
- channel: runbook
  url: docs/demos/health-domain.md
customProperties:
- property: medallion_layer
  value: gold
- property: source_system
  value: CDC-BRFSS
