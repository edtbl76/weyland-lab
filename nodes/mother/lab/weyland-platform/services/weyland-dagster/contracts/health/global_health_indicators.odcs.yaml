# Generated by scripts/gen_odcs_contract.py from Trino + Soda + dbt substance (B157). Enrich the description prose by hand.
apiVersion: v3.0.0
kind: DataContract
id: weyland-health-global-indicators
name: Global Health Indicators
version: 1.0.0
status: active
domain: health
dataProduct: Global Health Indicators
tenant: weyland
description:
  purpose: WHO GHO population-health indicators by country x year — 8 indicators pivoted, country-total
    disaggregation. One row per (country, year).
  usage: Query the iceberg.dbt.mart_country_health table in Trino; see docs/demos/health-domain.md for
    worked queries and the BI surfaces.
servers:
- server: trino-dbt
  type: trino
  catalog: iceberg
  schema: dbt
  physicalName: iceberg.dbt.mart_country_health
schema:
- name: mart_country_health
  physicalName: iceberg.dbt.mart_country_health
  properties:
  - name: country
    logicalType: string
    physicalType: varchar
    description: Country name (WHO GHO).
  - name: year
    logicalType: integer
    physicalType: integer
    description: Reporting year.
  - name: diabetes_prevalence
    logicalType: number
    physicalType: double
    description: Diabetes prevalence among adults (%).
  - name: adult_obesity
    logicalType: number
    physicalType: double
    description: Adult obesity prevalence (%).
  - name: hypertension
    logicalType: number
    physicalType: double
    description: Raised blood pressure / hypertension prevalence among adults (%).
  - name: life_expectancy
    logicalType: number
    physicalType: double
    description: Life expectancy at birth, in years.
  - name: healthy_life_expectancy
    logicalType: number
    physicalType: double
    description: Healthy life expectancy at birth (HALE), in years.
  - name: alcohol_consumption
    logicalType: number
    physicalType: double
    description: Total alcohol consumption per capita, in litres of pure alcohol.
  - name: tobacco_smoking
    logicalType: number
    physicalType: double
    description: Tobacco smoking prevalence among adults (%).
  - name: mental_health_disorders
    logicalType: number
    physicalType: double
    description: Mental-health disorder prevalence (%).
quality:
- property: table
  rule: row_count > 0
- property: table
  rule: duplicate_count(country, year) = 0
- property: table
  rule: missing_count(country) = 0
- property: table
  rule: missing_count(year) = 0
- property: table
  rule: min(life_expectancy) >= 0
- property: table
  rule: max(life_expectancy) <= 120
- property: table
  rule: min(healthy_life_expectancy) >= 0
- property: table
  rule: max(healthy_life_expectancy) <= 120
- property: table
  rule: missing_percent(life_expectancy) < 100
- property: table
  rule: missing_percent(healthy_life_expectancy) < 100
- property: table
  rule: missing_percent(diabetes_prevalence) < 100
- property: table
  rule: missing_percent(adult_obesity) < 100
- property: table
  rule: missing_percent(hypertension) < 100
- property: table
  rule: missing_percent(tobacco_smoking) < 100
- property: table
  rule: missing_percent(alcohol_consumption) < 100
- property: table
  rule: missing_percent(mental_health_disorders) < 100
slaProperties:
- property: frequency
  value: on-demand
- property: retention
  value: indefinite
team:
- role: owner
  username: ed@timberbacklabs.com
support:
- channel: runbook
  url: docs/demos/health-domain.md
customProperties:
- property: medallion_layer
  value: gold
- property: source_system
  value: WHO-GHO
