# Generated by scripts/gen_odcs_contract.py from Trino + Soda + dbt substance (B157). Enrich the description prose by hand.
apiVersion: v3.0.0
kind: DataContract
id: weyland-music-spotify-audio
name: Spotify Audio
version: 1.0.0
status: active
domain: music
dataProduct: Spotify Audio
tenant: weyland
description:
  purpose: 'ML/analysis-ready Spotify audio features: the 11 audio descriptors + track_genre, one row
    per track, rare genres (< 20 tracks) dropped. The tested source of truth for the genre classifier
    + Feast track_audio_features. Feeds mart_genre_audio_profile.'
  usage: Query the iceberg.dbt.mart_spotify_audio table in Trino; see docs/demos/music-domain.md for worked
    queries and the BI surfaces.
servers:
- server: trino-dbt
  type: trino
  catalog: iceberg
  schema: dbt
  physicalName: iceberg.dbt.mart_spotify_audio
schema:
- name: mart_spotify_audio
  physicalName: iceberg.dbt.mart_spotify_audio
  properties:
  - name: track_id
    logicalType: string
    physicalType: varchar
    description: Spotify track id — unique after dedup.
  - name: track_genre
    logicalType: string
    physicalType: varchar
    description: Genre label (>= 20 tracks).
  - name: danceability
    logicalType: number
    physicalType: double
    description: 'Danceability (0–1): suitability for dancing from tempo, rhythm stability, beat strength.'
  - name: energy
    logicalType: number
    physicalType: double
    description: 'Energy (0–1): perceptual measure of intensity and activity.'
  - name: key
    logicalType: number
    physicalType: double
    description: Estimated musical key as a pitch class (0=C … 11=B; -1 if undetected).
  - name: loudness
    logicalType: number
    physicalType: double
    description: Overall loudness averaged across the track, in decibels (~ -60 to 0).
  - name: mode
    logicalType: number
    physicalType: double
    description: 'Modality: major (1) / minor (0).'
  - name: speechiness
    logicalType: number
    physicalType: double
    description: 'Speechiness (0–1): presence of spoken words.'
  - name: acousticness
    logicalType: number
    physicalType: double
    description: 'Acousticness (0–1): confidence the track is acoustic.'
  - name: instrumentalness
    logicalType: number
    physicalType: double
    description: 'Instrumentalness (0–1): likelihood the track contains no vocals.'
  - name: liveness
    logicalType: number
    physicalType: double
    description: 'Liveness (0–1): probability the track was performed with a live audience.'
  - name: valence
    logicalType: number
    physicalType: double
    description: 'Valence (0–1): musical positiveness — high = happy/cheerful, low = sad/angry.'
  - name: tempo
    logicalType: number
    physicalType: double
    description: Estimated tempo in beats per minute (BPM).
quality:
- property: table
  rule: row_count > 0
- property: table
  rule: duplicate_count(track_id) = 0
- property: table
  rule: missing_count(track_genre) = 0
- property: table
  rule: min(danceability) >= 0
- property: table
  rule: max(danceability) <= 1
- property: table
  rule: min(energy) >= 0
- property: table
  rule: max(energy) <= 1
- property: table
  rule: min(valence) >= 0
- property: table
  rule: max(valence) <= 1
- property: table
  rule: min(tempo) >= 0
- property: table
  rule: max(tempo) <= 300
slaProperties:
- property: frequency
  value: on-demand
- property: retention
  value: indefinite
team:
- role: owner
  username: ed@timberbacklabs.com
support:
- channel: runbook
  url: docs/demos/music-domain.md
customProperties:
- property: medallion_layer
  value: gold
- property: source_system
  value: Spotify
