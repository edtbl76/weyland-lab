# Planted-violation config for the weyland-guard architecture test (B152). Mirrors the real `.importlinter`
# forbidden contract but points at a fixture guardrail (a validators SUBMODULE) that DOES import fastapi, so
# import-linter must report it BROKEN — proving the rule catches a real violation, not merely that it loads.
[importlinter]
root_package = badguard_pkg
include_external_packages = True

[importlinter:contract:guardrails-are-framework-free]
name = fixture guardrail must not import the web framework
type = forbidden
source_modules =
    badguard_pkg
forbidden_modules =
    fastapi
    starlette
