# Planted-violation config for the weyland-tool-server architecture test (B152). Mirrors the real
# `.importlinter` forbidden contract but points at a fixture guardrail that DOES import fastapi, so
# import-linter must report it BROKEN — proving the rule catches a real violation, not merely that it loads.
[importlinter]
root_package = badtool_pkg
include_external_packages = True

[importlinter:contract:guardrails-are-framework-free]
name = fixture guardrail must not import the web framework
type = forbidden
source_modules =
    badtool_pkg
forbidden_modules =
    fastapi
    starlette
