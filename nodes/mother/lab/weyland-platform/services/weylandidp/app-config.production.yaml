# Production overrides for the weyland IDP (B3). Loaded after app-config.yaml (Dockerfile CMD passes both).
# Tool-agnostic on purpose — nothing says "backstage". The platform catalog is read straight from the public
# repo (catalog.locations type: url, B41) — Backstage's UrlReader polls it and re-ingests on change, so there
# is no catalog ConfigMap copy to keep in sync. TechDocs are auto-published to MinIO by a Dagster job (B41).
app:
  # Same as backend.baseUrl when using the app-backend plugin (single origin behind Traefik TLS).
  baseUrl: https://idp.weyland.lab

organization:
  name: Weyland

backend:
  baseUrl: https://idp.weyland.lab
  listen: ':7007'
  # Service-to-service signing secret — the new backend system wants a key even for a single backend.
  auth:
    keys:
      - secret: ${BACKEND_SECRET}
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: https://idp.weyland.lab
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
    # Backstage creates one DB per plugin (backstage_plugin_*) — the role needs CREATEDB.

# Pin internal (backend-to-backend) discovery to literal 127.0.0.1 instead of "localhost". Node resolves
# "localhost" in a way the Istio sidecar then proxies + cuts (ERR_STREAM_PREMATURE_CLOSE on techdocs/search
# -> catalog). 127.0.0.1 stays on the loopback (Envoy doesn't intercept it); browser calls still use the
# external URL. Keeps the pod fully meshed.
discovery:
  endpoints:
    - target:
        # Route internal backend-to-backend calls over the k8s SERVICE (a real network hop to the pod IP),
        # not loopback. Backstage's same-process loopback self-call to its own catalog is cut
        # (ERR_STREAM_PREMATURE_CLOSE) — proven NOT to be Istio (port 7007 + 127.0.0.1 are RETURN'd in
        # iptables) and NOT Node/DNS. The cross-process network path (what the browser uses) works.
        internal: http://weyland-idp.weyland.svc.cluster.local:7007/api/{{pluginId}}
        external: https://idp.weyland.lab/api/{{pluginId}}
      plugins: [catalog]

# github.com integration. The catalog read (below) is public/unauthenticated, but the Scaffolder PR step
# (B3 slice C, publish:github:pull-request) needs a write token — a fine-grained PAT scoped to
# edtbl76/weyland-lab with Contents + Pull requests: write, injected from the weyland-idp-secret.
integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

auth:
  providers:
    # Guest provider is dev-only by default and returns 403 under NODE_ENV=production; this opt-in flag
    # allows it outside development. Acceptable here: LAN-only, single operator, allow-all permission policy.
    guest:
      dangerouslyAllowOutsideDevelopment: true

catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, Domain, Template]
  # Read the catalog straight from the public repo (B41). Backstage's UrlReader polls this (~150s) and
  # re-ingests on change — the catalog stays in sync with git with no ConfigMap copy and no restart.
  locations:
    - type: url
      target: https://github.com/edtbl76/weyland-lab/blob/main/nodes/mother/lab/weyland-platform/catalog/weyland-catalog.yaml
      rules:
        - allow: [Component, System, API, Resource, Location, Domain, User, Group, Template]

# TechDocs (B3 slice B) — docs are built externally (techdocs-cli) and published to the MinIO `techdocs`
# bucket; Backstage just serves them (no mkdocs/Docker in the pod). MinIO is the in-cluster S3 endpoint.
techdocs:
  builder: 'external'
  publisher:
    type: 'awsS3'
    awsS3:
      bucketName: 'techdocs'
      endpoint: 'http://minio.minio.svc.cluster.local:9000'
      s3ForcePathStyle: true
      region: 'us-east-1'   # MinIO ignores it, but the S3 client requires a value
      credentials:
        accessKeyId: ${MINIO_ACCESS_KEY}
        secretAccessKey: ${MINIO_SECRET_KEY}
