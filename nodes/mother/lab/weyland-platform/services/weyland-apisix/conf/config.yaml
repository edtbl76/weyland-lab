apisix:
  node_listen: 9080
  enable_ipv6: false

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    allow_admin:
      - 127.0.0.1/32
      - 172.16.0.0/12
    admin_listen:
      ip: 127.0.0.1
      port: 9180
    admin_key:
      - name: admin
        key: ${APISIX_ADMIN_KEY}
        role: admin
  etcd:
    host:
      - "http://weyland-apisix-etcd:2379"
    prefix: /apisix
    timeout: 30

plugin_attr:
  prometheus:
    export_uri: /apisix/prometheus/metrics
    export_addr:
      ip: 127.0.0.1
      port: 9091

plugins:
  - prometheus
  - proxy-rewrite
  - cors
