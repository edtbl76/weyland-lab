# B3 slice C — golden-path Scaffolder template: "new k8s service".
# Renders a meshed Deployment + Service + Ingress (Traefik TLS) + a catalog-info.yaml + a runbook stub,
# then opens a PR against the repo. Registered via a Location in weyland-catalog.yaml (so it auto-syncs
# in with the rest of the catalog — B41). Needs integrations.github[].token with Contents+PR write.
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-k8s-service
  title: New k8s service (weyland golden path)
  description: >
    Scaffold a meshed Deployment + Service + Ingress (Traefik TLS at <name>.weyland.lab) plus a
    catalog-info.yaml and a runbook stub, and open a pull request.
  tags: [recommended, kubernetes, weyland]
spec:
  owner: weyland-ops
  type: service
  parameters:
    - title: Service
      required: [name, image]
      properties:
        name:
          title: Name
          type: string
          description: DNS-safe service name. Also the subdomain — <name>.weyland.lab.
          pattern: '^[a-z0-9]([a-z0-9-]{1,40}[a-z0-9])?$'
          ui:autofocus: true
        image:
          title: Container image
          type: string
          description: e.g. ghcr.io/org/app:1.2.3, or a local <name>:local image imported into k3s.
        port:
          title: Container port
          type: number
          default: 8080
        namespace:
          title: Namespace
          type: string
          default: weyland
  steps:
    - id: render
      name: Render the skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          image: ${{ parameters.image }}
          port: ${{ parameters.port }}
          namespace: ${{ parameters.namespace }}
    - id: publish
      name: Open a pull request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=edtbl76&repo=weyland-lab
        branchName: scaffold/${{ parameters.name }}
        title: 'Scaffold k8s service: ${{ parameters.name }}'
        description: |
          Golden-path scaffold for **${{ parameters.name }}**, generated by the weyland IDP (B3).

          - k8s manifest (Deployment + Service + Ingress, Traefik TLS, Istio-meshed)
          - catalog-info.yaml (Component)
          - runbook stub

          Review, then merge. After merge, add the service to `docs/arch.md` / `docs/hosts.md` / `docs/api.md`.
  output:
    links:
      - title: Open the pull request
        url: ${{ steps.publish.output.remoteUrl }}
