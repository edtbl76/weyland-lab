# ${{ values.name }} — scaffolded by the weyland IDP golden path (B3).
# Deployment + Service + Ingress (Traefik TLS at ${{ values.name }}.weyland.lab). Istio-meshed by default
# (the sidecar.istio.io/inject label is required to reach STRICT-mTLS Postgres). If this service does NOT
# need the mesh, delete the label below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.namespace }}
  labels:
    app: ${{ values.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${{ values.name }}
  template:
    metadata:
      labels:
        app: ${{ values.name }}
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: ${{ values.name }}
          image: ${{ values.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: ${{ values.port }}
          readinessProbe:
            tcpSocket:
              port: ${{ values.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.namespace }}
  labels:
    app: ${{ values.name }}
spec:
  type: ClusterIP
  selector:
    app: ${{ values.name }}
  ports:
    - name: http
      port: ${{ values.port }}
      targetPort: ${{ values.port }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.namespace }}
spec:
  tls:
    - hosts:
        - ${{ values.name }}.weyland.lab
      secretName: weyland-wildcard-tls
  rules:
    - host: ${{ values.name }}.weyland.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${{ values.name }}
                port:
                  number: ${{ values.port }}
