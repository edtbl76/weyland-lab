# B3 — Backstage Software Catalog for the weyland platform.
# Derived from docs/arch.md (component inventory). Multi-doc YAML: one Backstage entity per `---` block.
# Backstage discovery points `catalog.locations` at this file (type: file or git url). Owner = weyland-ops.
#
# Model: Domain `weyland` > Systems {rag-platform, agents, model-serving} > Components / Resources / APIs.

# ---------------------------------------------------------------------------------------- org
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: emangini
spec:
  memberOf: [weyland-ops]
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: weyland-ops
  description: Solo operator of the weyland homelab.
spec:
  type: team
  children: []
---
# ---------------------------------------------------------------------------------------- domain + systems
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: weyland
  description: The weyland homelab — a single-node AI platform (Minisforum MS-A2, Proxmox + k3s).
spec:
  owner: weyland-ops
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: rag-platform
  description: Retrieval, ingestion, eval, and the 4 vector/graph datastores. The platform's data plane.
spec:
  owner: weyland-ops
  domain: weyland
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: agents
  description: Autonomous agents and their front doors (Hermes).
spec:
  owner: weyland-ops
  domain: weyland
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: model-serving
  description: LLM + STT inference and the hosted-model gateway.
spec:
  owner: weyland-ops
  domain: weyland
---
# ---------------------------------------------------------------------------------------- components (services)
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: weyland-tool-server
  description: FastAPI platform boundary — RAG retrieval (4 backends), /context/ask, /evals/*, /pipeline/trigger, /mcp + /mcp-act, B14 guardrails. mother:30080.
  annotations:
    backstage.io/source-location: url:https://github.com/edtbl76/weyland-lab/tree/main/nodes/mother/lab/weyland-platform/services/weyland-tool-server/
  tags: [python, fastapi, rag, mcp]
spec:
  type: service
  lifecycle: production
  owner: weyland-ops
  system: rag-platform
  providesApis: [weyland-mcp, weyland-rest]
  consumesApis: [litellm-openai, ollama-api]
  dependsOn: [resource:postgres-pgvector, resource:qdrant, resource:weaviate, resource:neo4j]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: dagster
  description: Pipeline orchestration — git-pull ingestion (docs/+nodes/), eval jobs, model_catalog (6h), AIDLC-KB ingest (on-demand). dagster.weyland.lab.
  tags: [python, dagster, etl]
spec:
  type: service
  lifecycle: production
  owner: weyland-ops
  system: rag-platform
  dependsOn: [resource:postgres-pgvector, resource:qdrant, resource:weaviate, resource:neo4j, resource:minio, resource:aidlc-kb-corpus]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: hermes
  description: Primary autonomous agent (CT 104). qwen3-coder brain via Ollama, MCP client of the tool-server, Telegram front door, native SQLite Kanban (B27).
  tags: [agent, mcp, telegram]
spec:
  type: service
  lifecycle: production
  owner: weyland-ops
  system: agents
  consumesApis: [weyland-mcp, ollama-api, litellm-openai]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: litellm-gateway
  description: OpenAI-compatible hosted-model gateway fronting Gemini + OpenRouter (free tiers); off-LAN egress valve + spend alerts. mother:30400.
  tags: [litellm, gateway, llm]
spec:
  type: service
  lifecycle: production
  owner: weyland-ops
  system: model-serving
  providesApis: [litellm-openai]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ollama
  description: CPU LLM serving (CT 102) — 6 GGUF models, OpenAI /v1, one model resident. ollama.weyland.lab:11434.
  tags: [ollama, llm, cpu]
spec:
  type: service
  lifecycle: production
  owner: weyland-ops
  system: model-serving
  providesApis: [ollama-api]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: whisper-stt
  description: CPU speech-to-text (CT 103) — whisper.cpp native /inference + OpenAI-compatible shim. whisper.weyland.lab.
  tags: [whisper, stt, cpu]
spec:
  type: service
  lifecycle: production
  owner: weyland-ops
  system: model-serving
  providesApis: [whisper-stt-api]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: open-webui
  description: Browser voice/chat front door — chat to Ollama, STT via the whisper shim. chat.weyland.lab.
  tags: [ui, chat]
spec:
  type: website
  lifecycle: production
  owner: weyland-ops
  system: model-serving
  consumesApis: [ollama-api, whisper-stt-api]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: neodash
  description: Neo4j dashboard/viz UI (free Bloom-alternative). mother:30088.
  tags: [ui, neo4j, viz]
spec:
  type: website
  lifecycle: production
  owner: weyland-ops
  system: rag-platform
  dependsOn: [resource:neo4j]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: n8n
  description: Workflow automation (ingestion role retired -> Dagster; retained for other automation). n8n.weyland.lab.
  tags: [ui, automation]
spec:
  type: service
  lifecycle: production
  owner: weyland-ops
  system: rag-platform
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: weyland-docs
  description: Platform documentation (runbooks, architecture, diagrams, concepts) — rendered as TechDocs.
  annotations:
    backstage.io/techdocs-ref: dir:.   # built externally (techdocs-cli) -> MinIO; Backstage serves it
  tags: [docs, techdocs]
spec:
  type: documentation
  lifecycle: production
  owner: weyland-ops
  system: rag-platform
---
# ---------------------------------------------------------------------------------------- resources (datastores / infra)
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: postgres-pgvector
  description: Primary RAG store — rag_documents/rag_chunks (384-dim bge) + eval_* + model_catalog. In-cluster :5432.
  tags: [postgres, pgvector, database]
spec:
  type: database
  owner: weyland-ops
  system: rag-platform
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: qdrant
  description: Vector store — collection weyland_chunks. mother:30083/30084.
  tags: [qdrant, vector]
spec:
  type: database
  owner: weyland-ops
  system: rag-platform
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: weaviate
  description: Vector store — class WeylandChunk. mother:30087.
  tags: [weaviate, vector]
spec:
  type: database
  owner: weyland-ops
  system: rag-platform
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: neo4j
  description: Graph + vector index (APOC + GDS). GraphRAG Document/Chunk + the B37 AIDLC :Entry graph. mother:30085/30086.
  tags: [neo4j, graph, gds]
spec:
  type: database
  owner: weyland-ops
  system: rag-platform
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: minio
  description: S3-compatible object storage (8 TB USB -> mother). Hosts the aidlc-kb bucket. s3.weyland.lab.
  tags: [minio, s3, storage]
spec:
  type: object-store
  owner: weyland-ops
  system: rag-platform
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: aidlc-kb-corpus
  description: B37 AIDLC knowledge corpus (~510 brand-neutral entries) in MinIO bucket aidlc-kb, ingested to all 4 backends + Neo4j :Entry graph.
  tags: [corpus, rag, aidlc]
spec:
  type: dataset
  owner: weyland-ops
  system: rag-platform
---
# ---------------------------------------------------------------------------------------- apis
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: weyland-mcp
  description: System-view MCP server (read-only tools — status, context_search, context_ask, list_models). Streamable HTTP at /mcp.
  tags: [mcp]
spec:
  type: openapi
  lifecycle: production
  owner: weyland-ops
  system: rag-platform
  definition: |
    MCP (Streamable HTTP) read-only tool surface. See docs/api.md and docs/diagrams/flow-agent-mcp.md.
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: weyland-rest
  description: Tool-server REST — /context/search, /context/ask, /evals/*, /pipeline/trigger, /metrics, health.
  tags: [rest]
spec:
  type: openapi
  lifecycle: production
  owner: weyland-ops
  system: rag-platform
  definition: |
    REST surface of weyland-tool-server. Full endpoint list in docs/api.md.
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: litellm-openai
  description: OpenAI-compatible /v1 gateway (Gemini + OpenRouter). mother:30400.
  tags: [openai, llm]
spec:
  type: openapi
  lifecycle: production
  owner: weyland-ops
  system: model-serving
  definition: |
    OpenAI-compatible /v1 (chat/completions, models). See docs/runbooks/model-gateway.md.
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: ollama-api
  description: Ollama OpenAI-compatible /v1 + native /api. CT 102, ollama.weyland.lab:11434.
  tags: [ollama, openai]
spec:
  type: openapi
  lifecycle: production
  owner: weyland-ops
  system: model-serving
  definition: |
    Ollama /v1 (OpenAI-compatible) + native /api/tags. See docs/runbooks/model-serving-ollama.md.
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: whisper-stt-api
  description: OpenAI-compatible STT shim + native whisper.cpp /inference. CT 103.
  tags: [whisper, stt]
spec:
  type: openapi
  lifecycle: production
  owner: weyland-ops
  system: model-serving
  definition: |
    /v1/audio/transcriptions (OpenAI shim) + native /inference. See docs/runbooks/transcription-whisper.md.
---
# ---------------------------------------------------------------------------------------- scaffolder templates
# B3 slice C — register the golden-path Scaffolder templates. Relative target resolves against this file's
# own location URL (the GitHub url Backstage polls), so it self-syncs with the rest of the catalog (B41).
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: weyland-scaffolder-templates
  description: Golden-path Scaffolder templates for the weyland platform.
spec:
  type: url
  targets:
    - ./templates/k8s-service/template.yaml
