# mother k3s server config — mirrors /etc/rancher/k3s/config.yaml on the host.
# Apply:  sudo cp this → /etc/rancher/k3s/config.yaml  &&  sudo systemctl restart k3s
# (k3s restart = brief API-server blip; workloads keep running under containerd.)
kubelet-arg:
  # Raised from the 110 default after JupyterHub hit the cap (see hosts.md).
  - "max-pods=250"

  # --- B98/B99 — node MEMORY guardrails (added 2026-07-22) — BACKSTOP, not the primary fix ---
  # The 2026-07-21 outage (mother off the LAN, apiserver TLS timeouts) was ROOT-CAUSED to SWAP, not to a missing
  # kubelet guardrail. A/B test proved it: swap ON → memory pressure THRASHES (kernel swaps out apiserver/networkd
  # pages) → control plane stalls → node unreachable; swap OFF → same pressure → fast kernel-OOM of the offender →
  # node stays Ready. THE FIX is `swapoff -a` + removing swap from fstab (see the host swap-off note). These kubelet
  # reserves/eviction are DEFENSE-IN-DEPTH: the test showed they did NOT fire (a fast runaway outran the ~10s
  # eviction poll; the kernel OOM-killer caught it first). They still shrink the overcommit and give the kubelet an
  # earlier shot in slow-growth cases. B98's NodeMemory alerts warn before either trips. Tune if evictions bite
  # legit workloads.
  - "system-reserved=memory=2Gi"
  - "kube-reserved=memory=1Gi"
  - "eviction-hard=memory.available<1.5Gi"
