# needrestart override on mother — NEVER auto-restart k3s after a package upgrade.
#
# Why (found 2026-09-29): unattended-upgrades ran at 06:30 UTC and upgraded dracut-install, python3-jwt and
# python3-requests; needrestart then ran `systemctl restart k3s.service` (recorded in
# /var/log/unattended-upgrades/unattended-upgrades-dpkg.log). Restarting k3s restarts the whole control plane: every API
# connection dropped (kubectl exec / watchers), and the in-flight Woodpecker step pod of the nightly image build (CI
# #203, golden-path-smoke) was killed mid-build, failing the pipeline. None of the three upgraded packages is used by
# k3s (a static Go binary); needrestart restarted it anyway.
#
# Effect: needrestart lists k3s under "Service restarts being deferred" (as it already does for docker.service) instead
# of restarting it. Security updates still install on schedule; k3s picks up any new library at its next deliberate
# restart (a k3s upgrade or a reboot).
#
# Deploy (manual — host config, like nodes/mother/host/systemd/):
#   rsync -av nodes/mother/host/needrestart/weyland-k3s.conf emangini@mother:/tmp/
#   sudo install -m 0644 /tmp/weyland-k3s.conf /etc/needrestart/conf.d/weyland-k3s.conf
# Verify (lists what needrestart WOULD do now; k3s must never appear as a service it restarts):
#   sudo needrestart -r l -b | grep -i k3s ; sudo perl -c /etc/needrestart/conf.d/weyland-k3s.conf
$nrconf{override_rc}{qr(^k3s\.service$)} = 0;
