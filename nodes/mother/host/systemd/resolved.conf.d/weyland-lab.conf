# mother node — resolve *.weyland.lab via the LAN DNS (weyland-lan-dns @ 192.168.1.243:53); EXTERNAL DNS stays on
# the per-link router resolver, INDEPENDENT of any in-cluster pod.
#
# WHY (2026-07-18 outage, see docs/runbooks/lan-dns.md): weyland-lan-dns was exposed via k3s ServiceLB, whose
# svclb hostPort:53 (0.0.0.0) produced a CNI DNAT matching `dst-type LOCAL` — which captured the node's own
# 127.0.0.53 systemd-resolved stub. When the pod died, ALL host DNS black-holed (containerd couldn't pull `pause`
# → repo-server + a whole pod wave stuck). This drop-in makes the node's external path depend on NOTHING in the
# cluster; only *.weyland.lab is routed to the LAN DNS, and if that pod is down only weyland.lab fails (fail-safe).
#
# Deploy (manual rsync — no hand-editing live):
#   rsync -av nodes/mother/host/systemd/resolved.conf.d/weyland-lab.conf emangini@mother:/tmp/weyland-lab.conf
#   sudo install -m 0644 /tmp/weyland-lab.conf /etc/systemd/resolved.conf.d/weyland-lab.conf
#   sudo systemctl restart systemd-resolved
[Resolve]
DNS=192.168.1.243
Domains=~weyland.lab
