# mother host sysctl — codified 2026-08-18 (B57a). Was live-only in /etc/sysctl.d.
# Woodpecker's rootless BuildKit build pods create inotify watchers (BuildKit's local-context filesync). At the
# prior fs.inotify.max_user_instances=512 — already exhausted by Istio sidecars + the always-on fleet — the build
# pod's inotify_init returns EMFILE ("failed to create fsnotify watcher: too many open files") and the build fails.
# Raise the per-user inotify instance cap. Each instance is a few KB of kernel memory; 8192 is the common
# BuildKit-on-k8s value and cheap on this node. max_user_watches is already ample (610605), so left alone.
#
# Apply on mother (host op, not Argo-managed):
#   sudo cp nodes/mother/host/sysctl.d/99-weyland-buildkit.conf /etc/sysctl.d/ && sudo sysctl --system
fs.inotify.max_user_instances = 8192
