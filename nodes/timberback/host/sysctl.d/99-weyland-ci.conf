# timberback host sysctl (B200, 2026-11-18). Same setting and reason as mother's 99-weyland-buildkit.conf.
# Since B200 step 3 timberback runs six CI workflows at once beside its own pods (Istio sidecars, buildkitd), and
# CI #690's test-scala died at the Ubuntu default of 128: "java.io.IOException: User limit of inotify instances
# reached or too many open files" (sbt watches its build files). mother hit the same wall in 2026-08 and runs 8192.
# Each instance is a few KB of kernel memory. max_user_watches is already ample here (757026), so left alone.
#
# Install on timberback (host op, not Argo-managed): docs/runbooks/timberback.md § Host sysctl.
fs.inotify.max_user_instances = 8192
