# needrestart override on timberback — NEVER auto-restart k3s after a package upgrade.
#
# Same lesson as mother (nodes/mother/host/needrestart/weyland-k3s.conf, 2026-09-29): unattended-upgrades + needrestart
# restarted k3s after upgrading packages k3s does not even use, dropping every connection and killing in-flight CI pods.
# timberback is a k3s WORKER (ADR-0012), so its unit is k3s-agent.service; the pattern covers both unit names in case the
# node's role ever changes.
#
# Effect: needrestart lists k3s under "Service restarts being deferred" instead of restarting it. Security updates still
# install on schedule; k3s picks up new libraries at its next deliberate restart (a k3s upgrade or a reboot).
#
# Deploy (manual — host config):
#   rsync -av nodes/timberback/host/needrestart/weyland-k3s.conf emangini@timberback:/tmp/
#   sudo install -m 0644 /tmp/weyland-k3s.conf /etc/needrestart/conf.d/weyland-k3s.conf
# Verify (list-only, plain-text UI). PASS = k3s under "Service restarts being deferred", never "Services to be restarted":
#   sudo needrestart -r l -u NeedRestart::UI::stdio 2>&1 | grep -iE "Services to be restarted|restarts being deferred|k3s"
$nrconf{override_rc}{qr(^k3s(-agent)?\.service$)} = 0;
