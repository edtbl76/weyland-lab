# rogueone — Ollama listen address. Installed as the systemd drop-in
#   /etc/systemd/system/ollama.service.d/override.conf
# (the name `systemctl edit ollama` gives it; installed 2026-07-12, brought into git 2026-09-29 by the B180 audit —
# it had no repo copy). Paired with ollama-gpu-guardrails.conf (the other drop-in in that directory).
#
# B211 (2026-10-22): LOOPBACK ONLY. It was 0.0.0.0 so the cluster could reach Ollama at 192.168.1.230:11434; that
# address now belongs to the front door (systemd/ollama-proxy.service, nodes/rogueone/ollama-proxy/), which asks every
# remote caller for a bearer token and forwards here. Install this only AFTER the proxy and every caller's token are in
# place (runbook model-serving-ollama.md § Front door), or every in-cluster LLM call fails.
#
# Deploy:  sudo install -m 0644 nodes/rogueone/systemd/ollama-host.conf /etc/systemd/system/ollama.service.d/override.conf
#          sudo systemctl daemon-reload && sudo systemctl restart ollama
[Service]
Environment="OLLAMA_HOST=127.0.0.1:11434"
