# rogueone — Ollama VRAM guardrails. Install as a systemd DROP-IN:
#   /etc/systemd/system/ollama.service.d/gpu-guardrails.conf
# A drop-in (not an edit of ollama.service) so an Ollama package upgrade can't silently revert it. Multiple
# `Environment=` lines are CUMULATIVE with the unit's existing ones, so the PATH set by the installer survives.
#
# WHY (2026-07-20): rogueone has ONE GPU — RTX 5000 Ada Laptop, **16 GB VRAM** — and NO usable iGPU (BIOS is set
# to Discrete, so the Raptor-Lake integrated graphics isn't even on the PCI bus). That single GPU drives BOTH the
# desktop compositor and Ollama. A 30b model (`qwen3:30b-a3b`, `qwen3-coder:30b`) can claim nearly all 16 GB and
# starve the compositor: the DESKTOP HARD-FREEZES while Ollama keeps answering fine over the network — no OOM, no
# Xid, no kernel panic, nothing in the journal. It looks healthy from every angle except the one you're sitting at.
# Happened during a `weyland_eval_score_job` run; the box had to be powered off by hand.
#
# ✅ VALIDATED 2026-07-20 UNDER CONTENTION: with these in place, a full eval run (6 models through the matrix +
# a 3-judge scoring pass, run 6) completed with the desktop IN ACTIVE USE and no freeze. The prior freeze happened
# without them. BIOS → Hybrid Graphics (desktop on the iGPU, all 16 GB free) remains the structural fix and is
# DEFERRED, not needed — revisit only if a freeze recurs with these settings applied.
[Service]
# Never keep two models resident at once. The eval loop cycles 6 models, and with the default keep-alive the
# previous model is often STILL loaded when the next arrives — two ~15 GB models overlapping on a 16 GB card is
# exactly the moment the compositor gets squeezed out.
Environment="OLLAMA_MAX_LOADED_MODELS=1"

# Unload aggressively (default is 5m). Shortens the window in which a finished model still holds VRAM. Costs a
# reload on the next request — irrelevant for batch eval, mildly slower for interactive chat.
Environment="OLLAMA_KEEP_ALIVE=30s"

# Reserve 1.5 GiB of VRAM that Ollama will not allocate, leaving headroom for the desktop compositor. Bytes.
Environment="OLLAMA_GPU_OVERHEAD=1610612736"
