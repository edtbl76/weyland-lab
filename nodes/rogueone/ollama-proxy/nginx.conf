# rogueone — the Ollama front door (B211, 2026-10-22). Ollama binds 127.0.0.1:11434 (systemd/ollama-host.conf); this
# nginx listens on rogueone's LAN and docker0 addresses on the same port and forwards to it.
#
# WHY: Ollama has no authentication, and ufw cannot tell one pod from another. Every pod's traffic reaches rogueone
# SNATed to mother's address, so "admit mother" admitted the whole cluster. This asks every remote caller for a bearer
# token (one SealedSecret, `ollama-proxy-token`, sent as OLLAMA_API_KEY), and refuses model management (`/api/pull`,
# `/api/push`, `/api/create`, `/api/copy`, `/api/delete`, `/api/blobs`) to remote callers even WITH the token: nothing in
# the cluster needs it, and those calls change what Ollama serves. rogueone's own processes (loopback, its LAN
# address, the docker0 bridge, see local-sources.conf) need no token, so local tools are unchanged.
#
# Site files in /etc/ollama-proxy (this directory, mounted read-only): listen.conf, local-sources.conf, upstream.conf.
# The token map is NOT in git: /etc/ollama-proxy-secret/token.map on rogueone, mounted at /run/secrets/.
# Proof against a real Ollama: test-proxy.sh. Runbook: docs/runbooks/model-serving-ollama.md § Front door.
worker_processes 2;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    access_log /dev/stdout combined;   # `combined` has no Authorization header, so the token is never logged
    # The token map's key is `Bearer <64 hex>` (71 chars), longer than the default 64-byte bucket: without this nginx
    # refuses to start ("could not build map_hash"), which is how the first live flip failed (2026-10-22).
    map_hash_bucket_size 128;
    include /etc/ollama-proxy/upstream.conf;

    geo $local_source {
        default 0;
        include /etc/ollama-proxy/local-sources.conf;
    }
    map $http_authorization $token_ok {
        default 0;
        include /run/secrets/ollama-proxy-token.map;
    }
    map $uri $management {
        default 0;
        ~^/api/(pull|push|create|copy|delete|blobs) 1;
    }
    # remote = local_source 0. A remote management call is refused (403) before the token is even considered.
    map "$local_source$management" $refuse_management {
        default 0;
        "01" 1;
    }
    map "$local_source$token_ok" $admitted {
        default 0;
        "01" 1;
        "10" 1;
        "11" 1;
    }

    server {
        include /etc/ollama-proxy/listen.conf;
        client_max_body_size 64m;      # images in a vision prompt

        location / {
            if ($refuse_management) { return 403; }
            if ($admitted = 0) { return 401; }
            proxy_pass http://ollama;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Ollama bound to loopback accepts only a loopback Host (its DNS-rebinding guard), so present one.
            proxy_set_header Host 127.0.0.1:11434;
            proxy_set_header Authorization "";   # the token stops here
            proxy_buffering off;                 # stream tokens as Ollama emits them
            proxy_request_buffering off;
            proxy_read_timeout 3600s;            # a cold 30B load plus a long generation
            proxy_send_timeout 3600s;
        }
    }
}
