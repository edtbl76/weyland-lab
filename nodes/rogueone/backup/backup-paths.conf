# B130 — static include roots for the rogueone backup (restic-backup.sh reads this).
# One path per line; ~ expands to $HOME. Missing paths are skipped with a warning.
# Reproducible bulk inside these roots is carved out by restic-excludes.txt + --exclude-caches.
#
# Git repos are NOT listed here — see backup-repos.conf (they use the untracked-minus-bulk policy).

# ── dotfiles / shell ──
~/.bashrc
~/.bash_profile
~/.profile
~/.bash_logout
~/.bash_history
~/.gitconfig
~/.gitignore_global
~/.vimrc
~/.tmux.conf
~/.inputrc

# ── secrets / keys (small, precious, IRREPLACEABLE) ──
~/.ssh
~/.gnupg
~/.local/share/keyrings          # GNOME keyring — stored passwords
~/.local/share/mkcert            # local root CA for *.weyland.lab certs

# ── app config (curated; giants + caches excluded in restic-excludes.txt) ──
~/.config

# ── Claude Code memory + settings (transcripts/plugins excluded in restic-excludes.txt) ──
~/.claude

# ── curated ~/Documents (media lives in Google Drive; code lives in git) ──
~/Documents/Presentations
~/Documents/websites
~/Documents/LinkedIn Backgrounds
~/Documents/Jobby
~/Documents/Fitness
~/Documents/ScratchPad
~/Documents/ObsidianVault
~/Documents/Obsidian Vault
~/Documents/Vault
~/Documents/Method
~/Documents/Home
~/Documents/NotesAndStuff
~/Documents/ToolsAndStaging
~/Documents/TechStuff/WhitePapers
