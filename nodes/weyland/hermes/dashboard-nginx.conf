# Weyland — TLS + dev-password reverse proxy for the Hermes dashboard (localhost:9119) on CT 104.
# Install: /etc/nginx/sites-available/hermes-dashboard  ->  symlink into sites-enabled.
# Certs: the *.weyland.lab mkcert wildcard (extracted from the k8s secret weyland-wildcard-tls).
# Auth:  /etc/nginx/.htpasswd (user admin / dev password).
server {
    listen 443 ssl;
    server_name dashboard.weyland.lab;

    ssl_certificate     /etc/nginx/certs/weyland.crt;
    ssl_certificate_key /etc/nginx/certs/weyland.key;

    # Access control by source IP, NOT basic-auth: the dashboard's SPA does XHR + websockets that can't carry
    # an Authorization header, so basic-auth storm-prompts on every sub-request. IP allowlist is
    # websocket-friendly and tighter (only the dev box, not the whole LAN — the dashboard exposes config/keys).
    allow 192.168.1.230;   # rogueone (dev box)
    allow 127.0.0.1;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:9119;
        proxy_http_version 1.1;
        proxy_set_header Host              localhost;   # the dashboard validates Host — only trusts localhost
        proxy_set_header X-Forwarded-Host  $host;       # preserve the real hostname for the app if it needs it
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;   # websockets (live sessions / kanban updates)
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 3600s;
    }
}
server {
    listen 80;
    server_name dashboard.weyland.lab;
    return 301 https://$host$request_uri;
}
