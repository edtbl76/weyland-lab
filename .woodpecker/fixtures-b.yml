# fixtures-b — sample-app lanes: node, react-native, flutter, dart, rust, go, c, cpp, lua, php (every lane that mounts the npm, cargo or go cache).
# One of 8 workflows (B200, 2026-11-18): the pipeline that was .woodpecker.yml, split so independent work runs in
# parallel. Layout, ordering and the rules every file follows: .woodpecker/README.md.
labels:
  backend: kubernetes
  node: mother        # the agent pool (B200 step 1). Every workflow names one: see README.md § Agent pools.
when:
  - event: manual
  - event: cron
steps:

  - name: test-node
    when: [{event: [manual, cron], evaluate: 'SMOKE_ONLY != "smoke" && RUN_FIXTURES != "0" && (FIXTURE_LANES == "" || (" " + FIXTURE_LANES + " ") contains " node ")'}]
    image: node:24-alpine
    environment:
      LANG_JUNIT_DIR: reports/junit   # B189 (see test-python)
      # B189 phase 2b: jest's JUnit reporter, installed OUTSIDE the projects (first command below) so the golden paths
      # carry no CI plumbing; run-lang-tests.sh passes it to jest by this path. Owner-approved 2026-11-06: jest-junit 17.0.0.
      JEST_JUNIT_REPORTER: /tmp/jest-junit/node_modules/jest-junit
      npm_config_cache: /cache/npm            # B88 #6 — persist the npm package cache
    volumes:
      - ci-cache-npm:/cache/npm
    commands:
      # Four archetypes on ONE toolchain. Each lane's fixture is now its GOLDEN PATH (B153 switch,
      # replacing the retired B88 hello apps): javascript=node/express, typescript=node/nestjs,
      # react=frontend/vite-react, nextjs=frontend/nextjs — all real services, so all npm install
      # from their committed lockfiles (roadie's cache makes it a near no-op on the common path).
      - apk add --no-cache bash >/dev/null
      - npm install --prefix /tmp/jest-junit --no-audit --no-fund --silent jest-junit@17.0.0   # B189 (see JEST_JUNIT_REPORTER)
      - bash scripts/run-lang-tests.sh typescript --self-check
      - bash scripts/run-lang-tests.sh typescript
      - bash scripts/run-lang-tests.sh javascript --self-check
      - bash scripts/run-lang-tests.sh javascript
      - bash scripts/run-lang-tests.sh react --self-check
      - bash scripts/run-lang-tests.sh react
      - bash scripts/run-lang-tests.sh nextjs --self-check
      - bash scripts/run-lang-tests.sh nextjs
      # Coverage ratchet — node's built-in coverage for ts/js, jest --coverage for react/next.
      - bash scripts/coverage-ratchet.sh run typescript
      - bash scripts/coverage-ratchet.sh run javascript
      - bash scripts/coverage-ratchet.sh run react
      - bash scripts/coverage-ratchet.sh run nextjs

  - name: scan-node
    when: [{event: [manual, cron], evaluate: 'SMOKE_ONLY != "smoke" && RUN_FIXTURES != "0" && (FIXTURE_LANES == "" || (" " + FIXTURE_LANES + " ") contains " node ")'}]
    image: node:24-alpine
    environment:
      npm_config_cache: /cache/npm            # B88 #6 — same npm cache as test-node
    volumes:
      - ci-cache-npm:/cache/npm
    commands:
      - apk add --no-cache bash >/dev/null
      - bash scripts/run-lang-scan.sh typescript
      - bash scripts/run-lang-scan.sh javascript
      - bash scripts/run-lang-scan.sh react
      - bash scripts/run-lang-scan.sh nextjs

  # B164 mobile workstream — CLIENTS, not services (no HTTP contract, no Dockerfile, no k8s Job, so
  # golden-path-smoke auto-skips them). The lane's smoke is a HEADLESS BUNDLE/RENDER: the client's
  # analogue of a service golden path's run-to-completion Job. node:24 (Debian, glibc) NOT node:24-alpine:
  # expo's export toolchain pulls native modules that fail on musl. swift-ios needs NO lane of its own —
  # it rides test-swift's discovery (Package.swift + *Tests.swift); the iOS/SwiftUI surface is parked on
  # the Mac hardware gate and #if canImport(SwiftUI)-guarded so the Linux build stays green.
  - name: test-react-native
    when: [{event: [manual, cron], evaluate: 'SMOKE_ONLY != "smoke" && RUN_FIXTURES != "0" && (FIXTURE_LANES == "" || (" " + FIXTURE_LANES + " ") contains " react-native ")'}]
    image: node:24
    environment:
      npm_config_cache: /cache/npm            # same npm cache as test-node
      LANG_JUNIT_DIR: reports/junit   # B189 (see test-python)
      # B189: jest-expo is jest, so the same jest-junit as test-node (owner-approved 17.0.0 for this step too),
      # installed outside the project by the first command and passed to jest by this path.
      JEST_JUNIT_REPORTER: /tmp/jest-junit/node_modules/jest-junit
    volumes:
      - ci-cache-npm:/cache/npm
    commands:
      - npm install --prefix /tmp/jest-junit --no-audit --no-fund --silent jest-junit@17.0.0   # B189 (see JEST_JUNIT_REPORTER)
      - bash scripts/run-lang-tests.sh react-native --self-check
      - bash scripts/run-lang-tests.sh react-native
      # headless bundle smoke — prove the Expo app actually bundles for web (expo export). node_modules
      # already installed by the test dispatch above (same step, same pod → workspace persists).
      # CI=true (2026-10-27): Woodpecker sets CI=woodpecker, and Expo SDK 58's CLI reads CI as a strict boolean
      # (`GetEnv.NoBoolean: woodpecker is not a boolean`, CI #528). Reproduced locally with CI=woodpecker; CI=true bundles.
      # --max-workers 2 (2026-10-30, B234): Metro starts one worker per visible CPU, and this step runs under the
      # woodpecker ns LimitRange's 2Gi default, so on mother the bundle was OOM-killed (exit 137: nightly #546, #549).
      # Measured in node:24 capped at 2Gi: default workers -> killed at 2048 MiB; --max-workers 2 -> exported, peak 1652 MiB.
      - cd golden-paths/mobile/react-native && CI=true npm run bundle -- --max-workers 2 && cd -

  # B164 mobile scan lanes. react-native reuses eslint (eslint.config.mjs); flutter uses `flutter analyze`.
  - name: scan-react-native
    when: [{event: [manual, cron], evaluate: 'SMOKE_ONLY != "smoke" && RUN_FIXTURES != "0" && (FIXTURE_LANES == "" || (" " + FIXTURE_LANES + " ") contains " react-native ")'}]
    image: node:24
    environment:
      npm_config_cache: /cache/npm            # same npm cache as test-node/scan-node
    volumes:
      - ci-cache-npm:/cache/npm
    commands:
      - bash scripts/run-lang-scan.sh react-native

  - name: test-flutter
    when: [{event: [manual, cron], evaluate: 'SMOKE_ONLY != "smoke" && RUN_FIXTURES != "0" && (FIXTURE_LANES == "" || (" " + FIXTURE_LANES + " ") contains " flutter ")'}]
    image: ghcr.io/cirruslabs/flutter:stable   # the standard Flutter CI image (Ubuntu; bash + flutter SDK)
    environment:
      LANG_JUNIT_DIR: reports/junit
    commands:
      # B189 phase 2b: the same junitreport 2.0.2 converter as test-dart (flutter test writes the same JSON format)
      - dart pub global activate junitreport 2.0.2
      - export PATH="$PATH:$HOME/.pub-cache/bin"
      - bash scripts/run-lang-tests.sh flutter --self-check
      - bash scripts/run-lang-tests.sh flutter
      # headless render smoke — build the web target (the Flutter client's bundle analogue)
      - cd golden-paths/mobile/flutter && flutter build web && cd -

  - name: scan-flutter
    when: [{event: [manual, cron], evaluate: 'SMOKE_ONLY != "smoke" && RUN_FIXTURES != "0" && (FIXTURE_LANES == "" || (" " + FIXTURE_LANES + " ") contains " flutter ")'}]
    image: ghcr.io/cirruslabs/flutter:stable
    commands:
      - bash scripts/run-lang-scan.sh flutter

  - name: test-dart
    when: [{event: [manual, cron], evaluate: 'SMOKE_ONLY != "smoke" && RUN_FIXTURES != "0" && (FIXTURE_LANES == "" || (" " + FIXTURE_LANES + " ") contains " dart ")'}]
    image: dart:stable
    environment:
      LANG_JUNIT_DIR: reports/junit
    commands:
      # B189 phase 2b: junitreport (owner-approved 2.0.2) converts `dart test --file-reporter json:` output to JUnit.
      # Global activation sits outside the project; the PATH export lasts the step (its commands share one shell).
      - dart pub global activate junitreport 2.0.2
      - export PATH="$PATH:$HOME/.pub-cache/bin"
      - bash scripts/run-lang-tests.sh dart --self-check
      - bash scripts/run-lang-tests.sh dart

  - name: scan-dart
    when: [{event: [manual, cron], evaluate: 'SMOKE_ONLY != "smoke" && RUN_FIXTURES != "0" && (FIXTURE_LANES == "" || (" " + FIXTURE_LANES + " ") contains " dart ")'}]
    image: dart:stable
    commands:
      - bash scripts/run-lang-scan.sh dart

  - name: test-rust
    when: [{event: [manual, cron], evaluate: 'SMOKE_ONLY != "smoke" && RUN_FIXTURES != "0" && (FIXTURE_LANES == "" || (" " + FIXTURE_LANES + " ") contains " rust ")'}]
    image: rust:1-slim
    # B88 #6 — persist CARGO_HOME (registry + cargo-installed bins, so cargo-llvm-cov is not recompiled
    # every run). PATH is set LITERALLY (image PATH + the cache bin) rather than with $PATH, so the
    # scripts' `command -v cargo-llvm-cov` finds the cached binary; RUSTUP_HOME stays the image default.
    environment:
      CARGO_HOME: /cache/cargo
      PATH: /cache/cargo/bin:/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LANG_JUNIT_DIR: reports/junit   # B189 (see test-python)
    volumes:
      - ci-cache-cargo:/cache/cargo
    # OOM-killed mid-compile (exit 137, nightly #253, 2026-10-04) during the cargo-llvm-cov coverage rebuild — the
    # first failure in 10 nightlies (81-113s each). No memory request = best-effort QoS, first to die when the node is
    # tight; same class + fix as test-swift / the syft-trivy step. MEMORY ONLY — no cpu request (mother's cpu wall).
    backend_options:
      kubernetes:
        resources:
          requests:
            memory: 1Gi
          limits:
            memory: 4Gi
    commands:
      # B189 phase 2b: cargo-nextest (owner-approved 0.9.149) writes JUnit for Trunk. Release binary, checked against
      # GitHub's published sha256 before use, into the IMAGE's cargo bin (not the persistent cache, so no stale version
      # outlives a bump). The slim image has no curl.
      - sh scripts/ci/apt-install.sh --no-install-recommends curl ca-certificates >/dev/null
      - curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/nextest.tgz https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.149/cargo-nextest-0.9.149-x86_64-unknown-linux-gnu.tar.gz
      - echo "32d1d8c0567b7a80bee2bad8bb09125c846da96bc009b2de11ec08557290c770  /tmp/nextest.tgz" | sha256sum -c -
      - tar -xzf /tmp/nextest.tgz -C /usr/local/cargo/bin
      - bash scripts/run-lang-tests.sh rust --self-check
      - bash scripts/run-lang-tests.sh rust
      # Coverage ratchet — cargo-llvm-cov (the standard Rust line-coverage tool) is not in the base
      # image, so install it here. A missing tool is a BROKEN lane (exit 2), never a silent pass.
      - rustup component add llvm-tools-preview >/dev/null 2>&1 || true
      - cargo install cargo-llvm-cov --quiet 2>/dev/null || true
      - bash scripts/coverage-ratchet.sh run rust

  # ── 1e. per-language SCANNERS (B88 Phase 2) ─────────────────────────────────
  # The analysis sibling of the test lanes above. Kept OUT of the scan-suite image on purpose: that
  # image already carries python + a full Go toolchain + a JRE, and adding Rust/Java/Node toolchains
  # would roughly triple it — oversized layers have broken builds here before (`unpigz: invalid
  # deflate`). Registry: quality-tools.yaml, `runner: lang-scan`; check-quality-tools.sh fails if
  # this script and the registry disagree in either direction.
  #
  # FINDINGS DO NOT FAIL THE BUILD (exit 0 with counts); only an inability to LOOK does (exit 2).
  # Gating CI on lint counts turns every nit into a merge blocker and gets the gate muted — the same
  # argument this repo makes about permanently-lit alerts.
  #
  # ⚠ DELIBERATELY NO `failure: ignore` HERE. The first draft of these steps had it, which would
  # have swallowed exit 2 — "the scanner could not run" — along with the findings, so a lane with a
  # missing toolchain would have reported green forever. That is precisely the absence-as-success
  # defect this whole item exists to remove, reintroduced in the CI wiring. The exit-code contract
  # in run-lang-scan.sh already does the filtering: findings are 0, broken is 2.
  - name: scan-rust
    when: [{event: [manual, cron], evaluate: 'SMOKE_ONLY != "smoke" && RUN_FIXTURES != "0" && (FIXTURE_LANES == "" || (" " + FIXTURE_LANES + " ") contains " rust ")'}]
    image: rust:1-slim
    environment:                              # B88 #6 — same cargo cache as test-rust (audit/deny bins persist)
      CARGO_HOME: /cache/cargo
      PATH: /cache/cargo/bin:/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ci-cache-cargo:/cache/cargo
    commands:
      - rustup component add clippy rustfmt >/dev/null 2>&1 || true
      - cargo install cargo-audit cargo-deny --locked >/dev/null 2>&1 || true
      - bash scripts/run-lang-scan.sh rust

  - name: test-go
    when: [{event: [manual, cron], evaluate: 'SMOKE_ONLY != "smoke" && RUN_FIXTURES != "0" && (FIXTURE_LANES == "" || (" " + FIXTURE_LANES + " ") contains " go ")'}]
    image: golang:1.26
    environment:                              # B88 #6 — persist the go module + build caches
      GOMODCACHE: /cache/go/mod
      GOCACHE: /cache/go/build
      LANG_JUNIT_DIR: reports/junit   # B189 (see test-python)
    volumes:
      - ci-cache-go:/cache/go
    commands:
      # NOT -alpine: `go test -race` needs cgo, and alpine without build-base cannot race-detect —
      # it would silently run without the detector.
      # B189 phase 2b: gotestsum (owner-approved v1.13.0) writes JUnit for Trunk from go test's own -json. The release
      # binary is checked against its published sha256 before use; a mismatch fails the step.
      - curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/gotestsum.tgz https://github.com/gotestyourself/gotestsum/releases/download/v1.13.0/gotestsum_1.13.0_linux_amd64.tar.gz
      - echo "11ccddeaf708ef228889f9fe2f68291a75b27013ddfc3b18156e094f5f40e8ee  /tmp/gotestsum.tgz" | sha256sum -c -
      - tar -xzf /tmp/gotestsum.tgz -C /usr/local/bin gotestsum
      - bash scripts/run-lang-tests.sh go --self-check
      - bash scripts/run-lang-tests.sh go
      - bash scripts/coverage-ratchet.sh run go   # B88 gap #1 — coverage ratchet

  - name: test-c
    when: [{event: [manual, cron], evaluate: 'SMOKE_ONLY != "smoke" && RUN_FIXTURES != "0" && (FIXTURE_LANES == "" || (" " + FIXTURE_LANES + " ") contains " c ")'}]
    image: gcc:14
    environment:
      LANG_JUNIT_DIR: reports/junit
    commands:
      - sh scripts/ci/apt-install.sh --no-install-recommends cmake pkg-config libmicrohttpd-dev >/dev/null
      - bash scripts/run-lang-tests.sh c --self-check
      - bash scripts/run-lang-tests.sh c

  - name: scan-c
    when: [{event: [manual, cron], evaluate: 'SMOKE_ONLY != "smoke" && RUN_FIXTURES != "0" && (FIXTURE_LANES == "" || (" " + FIXTURE_LANES + " ") contains " c ")'}]
    image: gcc:14
    commands:
      - sh scripts/ci/apt-install.sh --no-install-recommends cppcheck >/dev/null
      - bash scripts/run-lang-scan.sh c

  - name: test-cpp
    when: [{event: [manual, cron], evaluate: 'SMOKE_ONLY != "smoke" && RUN_FIXTURES != "0" && (FIXTURE_LANES == "" || (" " + FIXTURE_LANES + " ") contains " cpp ")'}]
    image: gcc:14   # trixie-based; cmake + git for FetchContent (cpp-httplib + doctest)
    environment:
      LANG_JUNIT_DIR: reports/junit
    commands:
      - sh scripts/ci/apt-install.sh --no-install-recommends cmake git >/dev/null
      - bash scripts/run-lang-tests.sh cpp --self-check
      - bash scripts/run-lang-tests.sh cpp

  - name: scan-cpp
    when: [{event: [manual, cron], evaluate: 'SMOKE_ONLY != "smoke" && RUN_FIXTURES != "0" && (FIXTURE_LANES == "" || (" " + FIXTURE_LANES + " ") contains " cpp ")'}]
    image: gcc:14
    commands:
      - sh scripts/ci/apt-install.sh --no-install-recommends cppcheck >/dev/null
      - bash scripts/run-lang-scan.sh cpp

  - name: test-lua
    when: [{event: [manual, cron], evaluate: 'SMOKE_ONLY != "smoke" && RUN_FIXTURES != "0" && (FIXTURE_LANES == "" || (" " + FIXTURE_LANES + " ") contains " lua ")'}]
    image: alpine:3.20
    environment:
      LANG_JUNIT_DIR: reports/junit
    commands:
      # OpenResty ships LuaJIT but no luarocks; busted runs on lua5.4 (the handlers are pure string ops,
      # version-agnostic) — install lua5.4 + luarocks + a C toolchain (busted's deps have C parts).
      - apk add --no-cache bash lua5.4 lua5.4-dev luarocks5.4 gcc musl-dev make   # bash: the lane driver uses arrays (alpine ships only busybox sh)
      - luarocks-5.4 install busted
      - ln -sf /usr/bin/lua5.4 /usr/local/bin/lua
      - bash scripts/run-lang-tests.sh lua --self-check
      - bash scripts/run-lang-tests.sh lua

  - name: scan-lua
    when: [{event: [manual, cron], evaluate: 'SMOKE_ONLY != "smoke" && RUN_FIXTURES != "0" && (FIXTURE_LANES == "" || (" " + FIXTURE_LANES + " ") contains " lua ")'}]
    image: alpine:3.20
    commands:
      - apk add --no-cache bash lua5.4 lua5.4-dev luarocks5.4 gcc musl-dev make   # bash: the lane driver uses arrays (alpine ships only busybox sh)
      - luarocks-5.4 install luacheck
      - ln -sf /usr/bin/lua5.4 /usr/local/bin/lua
      - bash scripts/run-lang-scan.sh lua

  - name: test-php
    when: [{event: [manual, cron], evaluate: 'SMOKE_ONLY != "smoke" && RUN_FIXTURES != "0" && (FIXTURE_LANES == "" || (" " + FIXTURE_LANES + " ") contains " php ")'}]
    image: composer:2.7
    environment:
      LANG_JUNIT_DIR: reports/junit
    commands:
      - apk add --no-cache bash >/dev/null   # the composer image is alpine; the runner needs bash (arrays)
      - bash scripts/run-lang-tests.sh php --self-check
      - bash scripts/run-lang-tests.sh php
      # (coverage ratchet for php is a fast-follow, like dotnet/kotlin/scala)

  - name: scan-php
    when: [{event: [manual, cron], evaluate: 'SMOKE_ONLY != "smoke" && RUN_FIXTURES != "0" && (FIXTURE_LANES == "" || (" " + FIXTURE_LANES + " ") contains " php ")'}]
    image: composer:2.7
    commands:
      - apk add --no-cache bash >/dev/null
      - bash scripts/run-lang-scan.sh php

  # ── test results → Trunk Flaky Tests (B189; one upload per workflow since B200) ──────────────────────────
  # Uploads this workflow's JUnit to Trunk, after a failure too. Gated exactly like its lanes (the same
  # SMOKE_ONLY / RUN_FIXTURES / FIXTURE_LANES test, OR-ed over this workflow's lane keys), so it runs
  # exactly when at least one lane here ran, and then a run with no report is red (fail closed).
  # trunk-upload.sh judges each upload from the CLI's printed output. Runbook: docs/runbooks/trunk-flaky-tests.md.
  - name: trunk-upload
    image: alpine:3.20
    when:
      - event: [manual, cron]
        status: [success, failure]
        evaluate: 'SMOKE_ONLY != "smoke" && RUN_FIXTURES != "0" && (FIXTURE_LANES == "" || (" " + FIXTURE_LANES + " ") contains " node " || (" " + FIXTURE_LANES + " ") contains " react-native " || (" " + FIXTURE_LANES + " ") contains " flutter " || (" " + FIXTURE_LANES + " ") contains " dart " || (" " + FIXTURE_LANES + " ") contains " rust " || (" " + FIXTURE_LANES + " ") contains " go " || (" " + FIXTURE_LANES + " ") contains " c " || (" " + FIXTURE_LANES + " ") contains " cpp " || (" " + FIXTURE_LANES + " ") contains " lua " || (" " + FIXTURE_LANES + " ") contains " php ")'
    environment:
      TRUNK_API_TOKEN:
        from_secret: trunk_org_token
      TRUNK_COLLECTION_ID: ZuFEh5e5
      TRUNK_CLI_VERSION: 0.16.1
      TRUNK_CLI_SHA256: 8c34f99a41d4b3151f711aca05d01478b2f707dd698d3980d2524646021af5f2
    commands:
      - apk add --no-cache bash curl git >/dev/null
      - curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/trunk-cli.tgz "https://github.com/trunk-io/analytics-cli/releases/download/$TRUNK_CLI_VERSION/trunk-analytics-cli-x86_64-unknown-linux.tar.gz"
      - echo "$TRUNK_CLI_SHA256  /tmp/trunk-cli.tgz" | sha256sum -c -
      - tar -xzf /tmp/trunk-cli.tgz -C /usr/local/bin trunk-analytics-cli
      - bash scripts/ci/trunk-upload.sh reports/junit
