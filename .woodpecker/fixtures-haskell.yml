# fixtures-haskell — the Haskell sample-app lanes (the longest, ~17 min, so on their own).
# One of 8 workflows (B200, 2026-11-18): the pipeline that was .woodpecker.yml, split so independent work runs in
# parallel. Layout, ordering and the rules every file follows: .woodpecker/README.md.
labels:
  backend: kubernetes
  node: timberback    # the agent pool (B200 step 3: sample-app and golden-path work runs on timberback). See README.md.
when:
  - event: manual
  - event: cron
steps:

  - name: test-haskell
    when: [{event: [manual, cron], evaluate: 'SMOKE_ONLY != "smoke" && RUN_FIXTURES != "0" && (FIXTURE_LANES == "" || (" " + FIXTURE_LANES + " ") contains " haskell ")'}]
    image: haskell:9.8
    # GHC rebuilds Scotty's whole dep graph cold (no cabal cache volume yet) — heavy + best-effort, so
    # full-parallelism ($ncpus packages at once) OOM-killed the step pod on the RAM-tight node (#122).
    # Memory request → Burstable (not first-to-die); CABAL_BUILD_JOBS caps package parallelism so peak
    # stays under the (GHC-sized) 6Gi limit. Same class/fix as test-swift. A cabal cache volume is a
    # fast-follow (like the kotlin/scala note) that would also make this lane fast.
    environment:
      LANG_JUNIT_DIR: reports/junit   # B189 (see test-python)
      CABAL_BUILD_JOBS: "2"
    backend_options:
      kubernetes:
        resources:
          requests:
            memory: 1Gi
          limits:
            memory: 6Gi
    commands:
      - cabal update
      - bash scripts/run-lang-tests.sh haskell --self-check
      - bash scripts/run-lang-tests.sh haskell

  - name: scan-haskell
    when: [{event: [manual, cron], evaluate: 'SMOKE_ONLY != "smoke" && RUN_FIXTURES != "0" && (FIXTURE_LANES == "" || (" " + FIXTURE_LANES + " ") contains " haskell ")'}]
    image: haskell:9.8
    # `cabal install hlint` builds hlint + its deps (aeson/conduit/yaml/vector/…) FROM SOURCE — the same
    # heavy source-build OOM class as test-haskell (#125), and best-effort by default. Burstable request +
    # --jobs=2 cap + 6Gi limit. run-lang-scan.sh's hlint run itself is light; the install is the heavy part.
    backend_options:
      kubernetes:
        resources:
          requests:
            memory: 1Gi
          limits:
            memory: 6Gi
    commands:
      - cabal update
      - cabal install hlint --jobs=2 --installdir=/usr/local/bin --overwrite-policy=always
      - bash scripts/run-lang-scan.sh haskell

  # ── test results → Trunk Flaky Tests (B189; one upload per workflow since B200) ──────────────────────────
  # Uploads this workflow's JUnit to Trunk, after a failure too. Gated exactly like its lanes (the same
  # SMOKE_ONLY / RUN_FIXTURES / FIXTURE_LANES test, OR-ed over this workflow's lane keys), so it runs
  # exactly when at least one lane here ran, and then a run with no report is red (fail closed).
  # trunk-upload.sh judges each upload from the CLI's printed output. Runbook: docs/runbooks/trunk-flaky-tests.md.
  - name: trunk-upload
    image: alpine:3.20
    when:
      - event: [manual, cron]
        status: [success, failure]
        evaluate: 'SMOKE_ONLY != "smoke" && RUN_FIXTURES != "0" && (FIXTURE_LANES == "" || (" " + FIXTURE_LANES + " ") contains " haskell ")'
    environment:
      TRUNK_API_TOKEN:
        from_secret: trunk_org_token
      TRUNK_COLLECTION_ID: ZuFEh5e5
      TRUNK_CLI_VERSION: 0.16.1
      TRUNK_CLI_SHA256: 8c34f99a41d4b3151f711aca05d01478b2f707dd698d3980d2524646021af5f2
    commands:
      - apk add --no-cache bash curl git >/dev/null
      - curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/trunk-cli.tgz "https://github.com/trunk-io/analytics-cli/releases/download/$TRUNK_CLI_VERSION/trunk-analytics-cli-x86_64-unknown-linux.tar.gz"
      - echo "$TRUNK_CLI_SHA256  /tmp/trunk-cli.tgz" | sha256sum -c -
      - tar -xzf /tmp/trunk-cli.tgz -C /usr/local/bin trunk-analytics-cli
      - bash scripts/ci/trunk-upload.sh reports/junit
