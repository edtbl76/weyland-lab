# Accepted findings for the DEPLOYED-IMAGE scan (scan-suite `trivy-images`), applied with --ignorefile (B220,
# 2026-10-17). The source scan keeps using .trivyignore. Same discipline as .trivyignore / osv-scanner.toml: every entry
# says why it is fine and what would lift it. Every entry is scoped by PURL to its one package, so an acceptance never
# hides the same id in another package, and carries an expiry so it is re-reviewed, never forgotten.
#
# weyland-jupyter (registry.weyland.lab/weyland-jupyter:v2, ubuntu-26.04 base) — linux-libc-dev 7.0.0-38.38.
# Kernel HEADERS: C header files the compiler reads. The advisories are bugs in the Linux kernel; a container runs on
# the host's kernel (mother) and never executes these files. The package is there because the notebook image keeps a C
# compiler (gcc → libc6-dev → linux-libc-dev) so users can `pip install` packages that need building — the owner chose
# to keep it (2026-10-17). Ubuntu has published no fixed version yet (apt-cache policy: 7.0.0-38.38 is the candidate).
# LIFT: rebuild weyland-jupyter when Ubuntu ships a fixed linux-libc-dev, then delete these entries.
vulnerabilities:
  - id: CVE-2022-50240
    purls:
      - pkg:deb/ubuntu/linux-libc-dev
    statement: kernel headers, never executed in a container; no Ubuntu fix yet (weyland-jupyter v2; B220)
    expired_at: 2027-01-17
  - id: CVE-2025-40190
    purls:
