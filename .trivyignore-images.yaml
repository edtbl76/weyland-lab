# weyland-dagster-user-code — adbc_driver_flightsql 1.12.0 (PyPI's newest), libadbc_driver_flightsql.so. The wheel bundles
# a compiled Go library with its own runtime + modules (go1.26.5, grpc 1.82.1, x/net 0.57.0, x/text 0.40.0); pip cannot
# upgrade those, and no published wheel is newer. Only emit_duckdb() uses it (GizmoSQL → DataHub catalog, in-cluster).
# The owner chose to wait for upstream over building the driver from Arrow's source (2026-10-17). Scoped to the driver's
# PATH as well as the package, so the same stdlib/grpc ids in any other Go binary are still reported.
