# Canonical registry of the weyland build / code-quality / security suite — THE source of truth.
#
# weyland houses the build suite going forward, so this registry is the single place the toolset is declared. The
# docs (docs/tools.md, arch.md, runbooks/code-quality.md, diagrams/flow-code-quality.md, schedules.md) CITE this file
# instead of re-listing tools by hand (a hand-copied list is how the "9 vs 10" drift happened), and
# scripts/check-quality-tools.sh diffs scan.py + the docs against it. B82's applications.yaml pattern, applied to
# the quality suite.
#
# The suite is MULTI-LANGUAGE by design: it scans polyglot repos (Stud.io = 3 Go modules + a TS frontend + Python),
# so a tool that no-ops on weyland's OWN code (0 Go / 0 TS today) still belongs — it runs against the other repos.
#
# Fields per tool:
#   id         canonical name (matches scan.py's post("<id>", ...) string for scan-suite tools)
#   category   secrets | sast | sca | iac | k8s | dockerfile | lint | vuln | hotspots | http-headers | quality-gate | managed | ai-code-review
#   languages  which languages/targets it covers ([any] = language-agnostic)
#   engine     what it runs
#   install    binary | pip | go-install | jar | server | builtin | saas
#   runner     scan-suite | sonarqube | deepsource | codescene | github-app | cli-gateway | ide   (HOW it executes)
#   enabled    true = active now; false = inventoried, wiring tracked in `wired_by`
#   config     repo path of its config, if any
#   notes      short rationale / gotcha

tools:
  # ---- scan-suite runner: the code-scan-suite CronJob (services/scan-suite/scan.py) ----
  - {id: gitleaks,       category: secrets,     languages: [any],                 engine: gitleaks,     install: binary,     runner: scan-suite, enabled: true,  notes: "committed-secret detection; honors .gitignore (see secret-files for the gap it leaves)"}
  - {id: secret-files,   category: secrets,     languages: [any],                 engine: "git check-ignore --no-index", install: builtin, runner: scan-suite, enabled: true, notes: "B97 — tracked AND gitignored files = a secret hidden after commit; gitleaks skips these"}
  - {id: detect-secrets, category: secrets,     languages: [any],                 engine: detect-secrets, install: pip,      runner: scan-suite, enabled: true,  notes: "3rd secrets engine (Yelp); excludes sealed-secrets ciphertext; a .secrets.baseline is the follow-up to quiet the shared-dev-password FPs"}
  - {id: semgrep,        category: sast,        languages: [multi],               engine: semgrep,      install: pip,        runner: scan-suite, enabled: true,  notes: "rule-based SAST; excludes sealed-secrets/"}
  - {id: bandit,         category: sast,        languages: [python],              engine: bandit,       install: pip,        runner: scan-suite, enabled: true,  notes: "Python SAST"}
  - {id: gosec,          category: sast,        languages: [go],                  engine: gosec,        install: go-install, runner: scan-suite, enabled: true,  notes: "Go SAST; per go.mod module; no-op on 0-Go repos"}
  - {id: ruff,           category: lint,        languages: [python],              engine: ruff,         install: pip,        runner: scan-suite, enabled: true,  notes: "Python lint+format — weyland's 2029 .py had no linter; a ruff.toml can tune the ruleset later"}
  - {id: staticcheck,    category: lint,        languages: [go],                  engine: staticcheck,  install: go-install, runner: scan-suite, enabled: true,  notes: "Go static analysis; per go.mod module"}
  - {id: go-vet,         category: lint,        languages: [go],                  engine: "go vet",     install: builtin,    runner: scan-suite, enabled: true,  notes: "ships with the Go toolchain; per go.mod module"}
  - {id: osv-scanner,    category: sca,         languages: [any],                 engine: osv-scanner,  install: binary,     runner: scan-suite, enabled: true,  notes: "dependency CVEs (OSV feed) across manifests"}
  - {id: pip-audit,      category: sca,         languages: [python],              engine: pip-audit,    install: pip,        runner: scan-suite, enabled: true,  notes: "Python dep CVEs (PyPI advisory DB) — 2nd engine next to osv; per requirements*.txt"}
  - {id: govulncheck,    category: sca,         languages: [go],                  engine: govulncheck,  install: go-install, runner: scan-suite, enabled: true,  notes: "Go dep+stdlib vulns (call-graph aware); per go.mod module"}
  - {id: checkov,        category: iac,         languages: [terraform, yaml, k8s], engine: checkov,     install: pip,        runner: scan-suite, enabled: true,  notes: "IaC misconfig"}
  - {id: kubescape,      category: k8s,         languages: [k8s],                 engine: kubescape,    install: binary,     runner: scan-suite, enabled: true,  notes: "k8s security posture (scoreFactor → severity band)"}
  - {id: hadolint,       category: dockerfile,  languages: [docker],              engine: hadolint,     install: binary,     runner: scan-suite, enabled: true,  notes: "Dockerfile lint"}
  - {id: shellcheck,     category: lint,        languages: [shell],               engine: shellcheck,   install: binary,     runner: scan-suite, enabled: true,  notes: "shell-script lint"}
  - {id: trivy,          category: vuln,        languages: [any],                 engine: trivy,        install: binary,     runner: scan-suite, enabled: true,  config: .trivyignore, notes: "vuln + misconfig + secret; --offline-scan; honors .trivyignore"}
  - {id: headers,        category: http-headers, languages: [live-http],          engine: "urllib HEAD", install: builtin,   runner: scan-suite, enabled: true,  notes: "NOVEL to weyland — probes the ingress hosts in docs/hosts.md for HSTS/CSP/X-Frame-Options/X-Content-Type-Options/Referrer-Policy; live-probe, not a repo scan"}
  - {id: code-maat,      category: hotspots,    languages: [any],                 engine: code-maat,    install: jar,        runner: scan-suite, enabled: true,  notes: "B90 — change-hotspots (churn); posts to Port code_hotspot (kind:hotspot), not a severity count"}

  # ── B88 Phase 2 — per-language scanners ──────────────────────────────────────────────────────────
  # WHY runner: lang-scan AND NOT scan-suite. The scan-suite is ONE image already carrying python + a
  # full Go toolchain + a JRE. Adding Rust, Java and Node toolchains to it would roughly triple it,
  # and oversized layers have already broken builds here once (`unpigz: invalid deflate`, memory
  # buildkit-large-layer-corruption). These run in the per-language lanes instead — pinned images,
  # same pattern as the B88 test lanes — via scripts/run-lang-scan.sh. Small tools that fit the
  # existing image (mypy, shfmt) stay on runner: scan-suite.
  - {id: mypy,           category: lint,        languages: [python],                    engine: mypy,          install: pip,        runner: scan-suite, enabled: true,  notes: "B88 — static type check; ruff covers style/lint but NOT types. Fits the existing image (pip, no toolchain)"}
  - {id: shfmt,          category: lint,        languages: [shell],                     engine: shfmt,         install: binary,     runner: scan-suite, enabled: true,  notes: "B88 — shell formatter/diff check; shellcheck finds bugs, shfmt finds inconsistency. Single static binary"}

  - {id: clippy,         category: lint,        languages: [rust],                      engine: "cargo clippy", install: rustup,    runner: lang-scan,  enabled: true,  notes: "B88 — Rust had ZERO registry entries before this. The canonical Rust linter; ships with the toolchain"}
  - {id: rustfmt,        category: lint,        languages: [rust],                      engine: "cargo fmt --check", install: rustup, runner: lang-scan, enabled: true,  notes: "B88 — formatting drift as a check, not a rewrite"}
  - {id: cargo-audit,    category: sca,         languages: [rust],                      engine: cargo-audit,   install: cargo,      runner: lang-scan,  enabled: true,  notes: "B88 — Rust dep CVEs (RustSec advisory DB); the cargo-native sibling of pip-audit/govulncheck"}
  - {id: cargo-deny,     category: license,     languages: [rust],                      engine: cargo-deny,    install: cargo,      runner: lang-scan,  enabled: true,  notes: "B88 — licence + banned-crate + duplicate-dependency policy. Also the FIRST licence-compliance tool in this registry"}

  - {id: spotbugs,       category: sast,        languages: [java],                      engine: spotbugs,      install: maven-plugin, runner: lang-scan, enabled: true,  notes: "B88 — Java bug-pattern SAST (FindBugs successor). Java had only SonarQube before this"}
  - {id: pmd,            category: lint,        languages: [java],                      engine: pmd,           install: maven-plugin, runner: lang-scan, enabled: true,  notes: "B88 — Java source analysis: dead code, complexity, bad practice"}
  - {id: checkstyle,     category: lint,        languages: [java],                      engine: checkstyle,    install: maven-plugin, runner: lang-scan, enabled: true,  notes: "B88 — Java style/convention enforcement"}
  - {id: error-prone,    category: sast,        languages: [java],                      engine: error-prone,   install: maven-plugin, runner: lang-scan, enabled: true,  notes: "B88 — Google's compile-time bug detector; catches at BUILD time what the others catch after"}

  - {id: eslint,         category: lint,        languages: [typescript, javascript, react, nextjs], engine: eslint, install: npm,   runner: lang-scan,  enabled: true,  notes: "B88 — the JS/TS ecosystem had NO linter in this registry; SonarQube covered TS and DeepSource covered JS, neither is eslint"}
  - {id: tsc,            category: typecheck,   languages: [typescript, react, nextjs],  engine: "tsc --noEmit", install: npm,       runner: lang-scan,  enabled: true,  notes: "B88 — a type error means it cannot BUILD; closer to compilation than to lint, which is why it rides the lane"}
  - {id: npm-audit,      category: sca,         languages: [typescript, javascript, react, nextjs], engine: "npm audit", install: builtin, runner: lang-scan, enabled: true, notes: "B88 — npm dep CVEs; ships with npm, no install"}
  - {id: next-lint,      category: lint,        languages: [nextjs],                    engine: "next lint",   install: npm,        runner: lang-scan,  enabled: true,  notes: "B88 — Next.js's own rule set (App Router, image/font/script correctness) that generic eslint does not carry"}
  - {id: license-checker, category: license,    languages: [typescript, javascript, react, nextjs], engine: license-checker, install: npm, runner: lang-scan, enabled: true, notes: "B88 — npm dependency licence inventory; the JS half of the licence-compliance gap"}

  # ── B88 Phase 3 — software supply chain ──────────────────────────────────────────────────────────
  # THE FINDING: every one of these existed in this lab as KNOWLEDGE and nowhere as IMPLEMENTATION.
  # syft, cosign, sigstore, SBOM, CycloneDX, SPDX, SLSA, provenance, attestation and Renovate
  # appeared ONLY under knowledge-repos/. The estate documented a supply chain it did not have.
  # runner: supply-chain -> scripts/supply-chain.sh, invoked per image by the ship loop.
  - {id: syft,           category: sbom,        languages: [any],  engine: syft,            install: binary, runner: supply-chain, enabled: true,  notes: "B88 — SBOM per image in BOTH CycloneDX and SPDX: CycloneDX feeds vuln tooling, SPDX feeds licence/compliance. Emitting one and calling it an SBOM is half an artifact"}
  - {id: cosign,         category: signing,     languages: [any],  engine: cosign,          install: binary, runner: supply-chain, enabled: true,  notes: "B88 — image signing with a KEY PAIR, not keyless: keyless needs Fulcio/OIDC over the internet and this is a LAN-only lab. Private key = SealedSecret cosign-signing-key"}
  - {id: slsa-provenance, category: provenance, languages: [any],  engine: "cosign attest", install: binary, runner: supply-chain, enabled: true,  notes: "B88 — in-toto SLSA predicate: which commit, which pipeline, which builder. A signature vouches for a blob; provenance says where the blob came from"}
  - {id: trivy-license,  category: license,     languages: [any],  engine: "trivy --scanners license", install: binary, runner: supply-chain, enabled: true, notes: "B88 — licence compliance is a DIFFERENT question from trivy's vuln scan (which the scan-suite already runs). The estate had no licence tooling at all before B88"}
  - {id: cosign-verify,  category: signing,     languages: [any],  engine: "cosign verify", install: binary, runner: supply-chain, enabled: true,  notes: "B88 — the read-only half. Runs in CI BEFORE deploy; Gatekeeper cannot verify signatures at admission (no egress from the admission path), so k8s/gatekeeper/image-signatures.yaml asserts registry provenance instead and ships in dryrun"}
  - {id: renovate,       category: dep-updates, languages: [any],  engine: renovate,        install: saas,   runner: github-app,   enabled: false, notes: "B88 — NOT deployed. Declared so the gap is visible rather than forgotten; B131's open-PR lifecycle covers dependency PRs today. Flip enabled when a Renovate instance exists"}

  # ---- sonarqube runner: its own CronJob (needs the server + a Java build) ----
  - {id: sonarqube,      category: quality-gate, languages: [python, typescript, go, java], engine: sonar-scanner, install: server, runner: sonarqube, enabled: true, config: sonar-project.properties, notes: "quality gate + issues → Port code_quality; separate because it needs the SonarQube server + Maven compile of the Flink modules"}

  # ---- ai-code-review lane (B106): LLM contextual + AI-SAST review, ON TOP of the scan-suite. All $0; all ADOPTED +
  #      validated end-to-end on PR #6 (2026-08-08). Install + wiring: runbooks/code-review-stack.md ----
  - {id: deepsource,     category: ai-code-review, languages: [python, javascript, go, secrets, shell, docker, sql], engine: deepsource, install: saas, runner: github-app, enabled: true , wired_by: B118, config: .deepsource.toml, notes: "AI SAST + Autofix PRs; CI + continuous (works direct-to-main); free public repo. NO usable IntelliJ plugin (delisted/2026.2-incompat) — SaaS/CI covers it"}
  - {id: codescene,      category: ai-code-review, languages: [any],              engine: codescene,    install: saas,       runner: github-app, enabled: true,  wired_by: B118, config: .mcp.json, notes: "behavioral/hotspots (richer code-maat); web + CI; free OSS. In-IDE via the CodeHealth MCP → Claude Code (verified 5/5 2026-08-08; JetBrains plugin won't launch on IntelliJ 2026.2)"}
  - {id: sourcery,       category: ai-code-review, languages: [python],           engine: sourcery,     install: saas,       runner: github-app, enabled: true,  wired_by: B106, config: .sourcery.yaml, notes: "Python review/refactor; PyCharm plugin + GitHub app; free public. Verified working in-IDE 2026-08-08"}
  - {id: coderabbit,     category: ai-code-review, languages: [any],              engine: coderabbit,   install: saas,       runner: github-app, enabled: true , wired_by: B106, config: .coderabbit.yaml, notes: "PR summaries/walkthroughs; kept on the FREE tier (paid CANCELLED); nice format"}
  - {id: greptile,       category: ai-code-review, languages: [any],              engine: greptile,     install: saas,       runner: github-app, enabled: true , wired_by: B106, notes: "codebase-graph LLM review (cross-file); PR-native; free OSS/public"}
  - {id: pr-agent,       category: ai-code-review, languages: [any],              engine: "PR-Agent (Qodo Merge OSS)", install: cli, runner: cli-gateway, enabled: true , wired_by: B106, config: .pr_agent.toml, notes: "self-hosted LLM PR review via LiteLLM :30400 (wl-coding); scripts/pr-agent-review.sh on rogueone; $0, gateway-metered"}
  - {id: proxyai,        category: ai-code-review, languages: [any],              engine: "ProxyAI (CodeGPT)", install: ide, runner: ide,        enabled: true,  wired_by: B106, notes: "ADOPTED in-IDE LLM assistant (JetBrains, custom OpenAI provider → LiteLLM :30400 wl-coding); replaces paid Qodo Gen; $0. Verified working 2026-08-08. Fallback: Continue CLI (`cn`, .continue/config.yaml) — Continue's JetBrains plugin is deprecated (Cursor acquisition)"}
  # Qodo (paid) — CANCELLED per B106; Continue replaces its Gen IDE plugin.
