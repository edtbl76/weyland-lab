reason = "nemo-guardrails and rogueone's basic-memory only (the 28 advisories published 2026-10-20/21, all fixed in 13.0.0: TIFF/JPEG/GIF/PDF/EPS decoder and encoder memory bugs, decompression-bomb gaps, the Ghostscript argument injection). Both are held at 12.3.0 by fastembed, which caps pillow<13 in every release including the latest (0.9.0, checked 2026-10-22); every other lockfile moved to 13.0.0. The guardrails service runs text rails only: no code in it opens an image, and fastembed is used for text embeddings. Basic Memory opens an image only when asked to read one, and the shared store holds Markdown notes only. So no untrusted image bytes reach Pillow in either. Lift when a fastembed release allows pillow 13. Accepted 2026-10-22 (B214 leftovers)."
