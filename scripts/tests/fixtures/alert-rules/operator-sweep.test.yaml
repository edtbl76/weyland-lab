# promtool unit tests for WeylandOperatorSweepDeferred (2026-10-02). The incident sweep no longer fails over to paid
# Haiku: while the local brain is busy it defers. An eval keeps rogueone's Ollama busy for up to ~5h (the 2026-09-26
# burst ran 03:00-08:00 NY), so deferring that long is normal; 6h straight means the local brain is really gone and
# alert enrichment has stopped. A sweep runs every 3 min. Run by scripts/tests/alert-rules.bats (CI shell-tests).
rule_files:
- rules.yaml
evaluation_interval: 1m
tests:
- name: 'WeylandOperatorSweepDeferred: deferring every sweep for 7h fires'
  interval: 3m
  input_series:
  - series: operator_incident_sweeps_total{outcome="deferred",namespace="weyland",job="weyland-operator"}
    values: 0+1x140
  alert_rule_test:
  - eval_time: 7h
    alertname: WeylandOperatorSweepDeferred
    exp_alerts:
    - exp_labels:
        outcome: deferred
        namespace: weyland
        job: weyland-operator
        severity: warning
- name: 'WeylandOperatorSweepDeferred: a 5h eval window of deferrals is silent'
  interval: 3m
  input_series:
  - series: operator_incident_sweeps_total{outcome="deferred",namespace="weyland",job="weyland-operator"}
    values: 0+1x100 100x40
  alert_rule_test:
  - eval_time: 5h
    alertname: WeylandOperatorSweepDeferred
    exp_alerts: []
  - eval_time: 7h
    alertname: WeylandOperatorSweepDeferred
    exp_alerts: []
