# gitleaks config for this repo (2026-10-17, B220). gitleaks loads `.gitleaks.toml` from the scanned root, so the
# scan-suite's `gitleaks dir /src` and a local run both read it. The default ruleset stays on (useDefault); this file
# only ALLOWS specific, re-checkable false positives — each with the reason it is not a secret.
#
# Why it exists: gitleaks 8.21.2 → 8.30.1 (scan-suite bump) found 111 new matches on a clean checkout where 8.21 found 0
# — newer generic-api-key / curl-auth-user rules. All 111 were reviewed (values redacted) and none is a plaintext secret.
# A real secret anywhere outside these exact paths/patterns is still reported.

[extend]
useDefault = true

[[allowlists]]
description = "SealedSecret ciphertext — values encrypted to the cluster's sealed-secrets controller key; committing them is the design (docs/runbooks/secrets.md). 108 of the 111 matches."
paths = [
  '''k8s/sealed-secrets/sealed/[^/]+\.ya?ml$''',
  '''(^|/)sealedsecret\.ya?ml$''',
]

[[allowlists]]
description = "Golden-path Phoenix hello-world: dev/test secret_key_base fixtures generated by `mix phx.new`; never used outside a local dev/test run (prod reads SECRET_KEY_BASE from env)."
paths = [
  '''golden-paths/elixir/phoenix/config/(dev|test)\.exs$''',
]

[[allowlists]]
description = "Docs: a deliberately dummy basic-auth user (`-u metrics:x`) showing an endpoint ignores auth — not a credential."
paths = [
  '''docs/demos/servicemonitor-coverage\.md$''',
]
regexes = [
  '''metrics:x''',
]
