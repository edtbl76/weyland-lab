# Golden path — Rust / Actix-web (B153). Mature, among the fastest Rust web frameworks. Contract:
# /health /ready /metrics /hello. `cargo test` runs the 4; `cargo test -- --ignored` runs the selfcheck.
[package]
name = "golden-rust-actix"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
# No default features (2026-10-26): the sample serves plain HTTP/1 JSON. The defaults pulled in HTTP/2 (h2 0.3, whose
# fix exists only in 0.4) and zstd/brotli compression (zstd 0.13, 15 advisories), none of which it uses.
actix-web = { version = "4", default-features = false, features = ["macros"] }
serde_json = "1"
prometheus = "0.14"
