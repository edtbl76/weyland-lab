# Golden-path dart/shelf test config.
#
# The `selfcheck` tag is skipped by default, so a plain `dart test` runs only the 4 contract
# tests and passes (the selfcheck reports as skipped, exit 0). The lane self-check runs
#   dart test -t selfcheck --run-skipped
# which forces the skip-tagged deliberate failure to actually EXECUTE and exit non-zero, proving
# the runner propagates a real failure.
#
# WHY --run-skipped (package:test gotcha): package:test cannot both exclude a tag from a bare
# `dart test` via config AND let a bare `dart test -t selfcheck` run it — a `skip` config makes
# `-t selfcheck` report "All tests skipped" (exit 0, a fail-open trap), and `exclude_tags` makes it
# report "No tests match" (exit 79 — non-zero, but the failing test never runs, so it proves
# nothing). Only `--run-skipped` makes the selfcheck genuinely run and fail.
tags:
  selfcheck:
    skip: "deliberately-failing selfcheck; run explicitly with: dart test -t selfcheck --run-skipped"
