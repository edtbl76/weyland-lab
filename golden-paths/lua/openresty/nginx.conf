# Golden path — Lua / OpenResty. nginx + content_by_lua_block wiring the pure handlers onto the contract.
# Runs non-root: the whole process is the container's non-root user, so no `user` directive (that only
# applies when the master runs as super-user). Everything writable points at /tmp; port 8080 is > 1024 so
# an unprivileged user can bind it. Started with `openresty -p /app -c /app/nginx.conf -g 'daemon off;'`.

worker_processes  1;
error_log  /dev/stderr  notice;
pid        /tmp/openresty.pid;

events {
    worker_connections  256;
}

http {
    # handlers.lua lives under /app/lua/ in the image; `;;` keeps the default path too.
    lua_package_path  "/app/lua/?.lua;;";

    access_log  /dev/stdout;

    # Non-root-writable temp locations (defaults live under the read-only prefix).
    client_body_temp_path  /tmp/client_body;
    proxy_temp_path        /tmp/proxy;
    fastcgi_temp_path      /tmp/fastcgi;
    uwsgi_temp_path        /tmp/uwsgi;
    scgi_temp_path         /tmp/scgi;

    server {
        listen  8080;

        # GET /health — liveness.
        location = /health {
            default_type  application/json;
            content_by_lua_block {
                ngx.print(require("handlers").health_json())
            }
        }

        # GET /ready — readiness (the SMOKE-gate probe).
        location = /ready {
            default_type  application/json;
            content_by_lua_block {
                ngx.print(require("handlers").ready_json())
            }
        }

        # GET /hello — demo endpoint, the known JSON payload.
        location = /hello {
            default_type  application/json;
            content_by_lua_block {
                ngx.print(require("handlers").hello_json())
            }
        }

        # GET /metrics — Prometheus text exposition.
        location = /metrics {
            default_type  "text/plain; version=0.0.4; charset=utf-8";
            content_by_lua_block {
                ngx.print(require("handlers").metrics_text())
            }
        }
    }
}
