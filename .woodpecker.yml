# Woodpecker CI — weyland image build pipeline (B57a). Builds the weyland-built images → pushes a git-<sha> tag to
# registry.weyland.lab → opens a PR that bumps the tag in the manifests → YOU merge → Argo CD reconciles → rollout.
# git-as-seam: CI never calls `argocd sync` (that bypasses GitOps → drift).
#
# Runs on the KUBERNETES backend (steps = pods on mother's woodpecker-agent-0/-1). Pinned so an unlabeled workflow
# can't land on STUD.io's local-backend agents (B57b). Single-node k3s → local-path RWO → steps run SEQUENTIALLY,
# so the workspace files (.ci-build-plan, .ci-image-bumps) pass cleanly step→step.
#
# Build engine = rootless BuildKit, DAEMONLESS (nothing always-on — mother runs at ~90% RAM, no swap). ~1-3 GB peak
# vs kaniko's ~8-12 GB on the 8.38 GB user-code image; heavy scratch lands on disk (400 GB free), warm-cache via a
# registry cache tag. See aidlc-docs/image-build-pipeline-design.md.
#
# Trigger: manual + a nightly pre-dawn cron (create once: `woodpecker-cli cron add --repository edtbl76/weyland-lab
#          --name nightly-images --schedule "0 30 2 * * *" --branch main`). No push-webhooks on the LAN.
labels:
  backend: kubernetes
when:
  - event: manual
  - event: cron

steps:
  # ── 1. lint the k8s manifests (syntax) ──────────────────────────────────────
  - name: yaml-syntax
    image: pipelinecomponents/yamllint:latest
    commands:
      - yamllint nodes/mother/lab/weyland-platform/k8s/

  # ── 1b. repo guards: diagrams parse, documented counts match reality ────────
  # WHY THIS STEP EXISTS: on 2026-08-21 a sweep found FIFTEEN mermaid blocks under docs/ that had
  # never rendered (all the same bug — a `;` inside sequence-diagram text, which mermaid treats as a
  # statement separator) and TEN stale Argo application counts across eight files, in three different
  # generations (28 / 59 / 72) against 78 actual. Both classes had been in the repo for months.
  #
  # Nothing caught them because the checks were human. The DoD mandates a per-batch "Diagrams" pillar,
  # a "verify the render" cross-cutting rule, and a docs relevance sweep — all satisfied by eye. A page
  # saying "28 apps onboarded" READS as perfectly relevant; only comparing it to the cluster reveals it.
  # scripts/check-app-registry.sh could not help: it compares structure to structure, so a number typed
  # into a sentence is invisible to it.
  #
  # BLOCKING ON PURPOSE. These are cheap and deterministic, and an advisory warning is exactly what let
  # 15 diagrams rot. Trade-off, stated plainly: a stale doc count will now fail the nightly cron and no
  # images will ship that run. If that coupling proves wrong, add `failure: ignore` to this step — it
  # keeps reporting and stops blocking. Do NOT silently delete the step.
  #
  # All five guards run here. The three older ones (check-app-registry / check-quality-tools /
  # check-sa-automount-collisions) had ALSO never been wired — the repo's own comments claimed they
  # "enforce" and "guard" things while nothing ran them. All three are pure file analysis (python3 +
  # pyyaml, no cluster access), so there is no reason they were not in CI other than nobody adding them.
  - name: repo-guards
    image: node:24-alpine
    commands:
      - apk add --no-cache bash python3 py3-yaml >/dev/null
      # The mermaid parser needs its own resolution root: ESM ignores NODE_PATH, so a global install
      # does not satisfy a bare `import "mermaid"`. Built here per-run rather than baked into an image.
      # Deliberately NOT @mermaid-js/mermaid-cli — that pulls puppeteer + headless Chromium, which
      # needs a sandbox this cluster's step pods should not be granting.
      - mkdir -p /tmp/mmcheck
      - printf '{"name":"mmcheck","private":true,"type":"module"}\n' > /tmp/mmcheck/package.json
      - (cd /tmp/mmcheck && npm install --silent --no-audit --no-fund mermaid jsdom)
      - MERMAID_CHECK_ROOT=/tmp/mmcheck bash scripts/check-mermaid.sh docs
      - bash scripts/check-doc-counts.sh
      - bash scripts/check-app-registry.sh
      - bash scripts/check-quality-tools.sh
      - bash scripts/check-sa-automount-collisions.sh

  # ── 1c. shellcheck the shell surface ────────────────────────────────────────
  # --severity=warning on purpose. At `note` the repo has 3 findings, and two of them are noise that
  # can never be fixed: SC2016 fires on the deliberately-single-quoted node heredoc in
  # check-mermaid.sh, and SC1091 cannot follow scripts/.env because it is gitignored. Gating at
  # warning gives a clean zero today while still catching real defects (unquoted expansions that
  # word-split, unreachable code, bad test operators). There is no .shellcheckrc — the severity flag
  # is the whole policy, kept visible here rather than hidden in a dotfile.
  - name: shellcheck
    image: koalaman/shellcheck-alpine:stable
    commands:
      - shellcheck --severity=warning scripts/*.sh scripts/lib/*.sh scripts/ci/*.sh

  # ── 1d. unit tests ──────────────────────────────────────────────────────────
  # The repo had ONE test suite and CI had never run it. Worse, it was orphaned: the tests lived in
  # services/weyland-tool-server/tests/ while the code they import moved to services/weyland-guard/
  # when B70 extracted the shared guard service. 5 of 8 files could not even be collected
  # (ModuleNotFoundError) and the suite had clearly not been run since the extraction. Tests moved to
  # weyland-guard/tests/, the stale assertions repaired against the current API, and
  # test_llm_guard.py replaced by test_safety_validators.py (its `llm_guard` backend was retired in
  # B117). 28 tests, all green.
  #
  # No image build needed: guardrails/ imports only dataclasses + enum from stdlib, and conftest.py
  # supplies DB fakes — so pytest + prometheus_client on a slim base is the entire dependency set.
  # Deliberately NOT building the weyland-guard image to test it; that would pull transformers,
  # presidio and spaCy for a suite that stubs all three.
  - name: unit-tests
    image: python:3.12-slim
    commands:
      - pip install --quiet --no-cache-dir pytest prometheus_client
      - cd nodes/mother/lab/weyland-platform/services/weyland-guard && python -m pytest tests/ -q -p no:cacheprovider

  # ── 2. detect which images changed since their currently-deployed git-<sha> ──
  - name: detect-changes
    image: alpine/git:latest
    commands:
      - sh scripts/ci/detect-changes.sh

  # ── 3. build + push the changed images (thin buildctl client → buildkitd) ───
  # Builds against the persistent buildkitd Deployment (k8s/woodpecker/buildkitd.yaml) over tcp. This step mounts
  # nothing and needs no privilege — buildkitd does the snapshot mounts in its own stable mnt ns. (Daemonless
  # BuildKit in an ephemeral step pod EPERM'd on its mounts on this cluster, even privileged+trusted; hence the daemon.)
  # The client-side context filesync uses inotify — fine now that mother's fs.inotify.max_user_instances = 8192.
  - name: build
    image: moby/buildkit:latest
    environment:
      BUILDKIT_HOST: tcp://buildkitd:1234
    commands:
      - sh scripts/ci/build-images.sh

  # ── 4. schema-validate the manifests that will carry the new tag ────────────
  - name: kubeconform
    image: ghcr.io/yannh/kubeconform:latest-alpine
    commands:
      - |
        [ -s .ci-image-bumps ] || { echo "kubeconform: nothing built — skip"; exit 0; }
        # validate each manifest that will carry the new tag (cols 3+ of each row); fail the gate on any error
        rc=0
        for m in $(cut -f3- .ci-image-bumps | tr '\t ' '\n\n' | sed '/^$/d' | sort -u); do
          f="nodes/mother/lab/weyland-platform/$m"
          [ -f "$f" ] || continue
          echo "validate $f"
          /kubeconform -strict -summary -ignore-missing-schemas "$f" || rc=1
        done
        exit $rc

  # ── 5. deploy handoff: bump tags → branch → PR (you merge → Argo deploys) ────
  - name: deploy-handoff
    image: alpine:latest
    when:
      - status: success
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - apk add --no-cache git curl >/dev/null
      - sh scripts/ci/open-deploy-pr.sh

  # ── 6. build status → Port ci_pipeline (B63 — CI reliability signal; success AND failure) ──
  - name: notify-port
    image: curlimages/curl:latest
    when:
      - status: [success, failure]
    environment:
      PORT_INGEST_URL:
        from_secret: port_ingest_url
    commands:
      - |
        printf '{"number":%s,"status":"%s","repo":"%s","branch":"%s","commit":"%s","event":"%s","url":"%s"}' \
          "$CI_PIPELINE_NUMBER" "$CI_PIPELINE_STATUS" "$CI_REPO" "$CI_COMMIT_BRANCH" "$CI_COMMIT_SHA" "$CI_PIPELINE_EVENT" "$CI_PIPELINE_URL" > /tmp/port.json
        curl -sf -X POST "$PORT_INGEST_URL" -H "Content-Type: application/json" -d @/tmp/port.json
