# Woodpecker CI — weyland image build pipeline (B57a). Builds the weyland-built images → pushes a git-<sha> tag to
# registry.weyland.lab → opens a PR that bumps the tag in the manifests → YOU merge → Argo CD reconciles → rollout.
# git-as-seam: CI never calls `argocd sync` (that bypasses GitOps → drift).
#
# Runs on the KUBERNETES backend (steps = pods on mother's woodpecker-agent-0/-1). Pinned so an unlabeled workflow
# can't land on STUD.io's local-backend agents (B57b). Single-node k3s → local-path RWO → steps run SEQUENTIALLY,
# so the workspace files (.ci-build-plan, .ci-image-bumps) pass cleanly step→step.
#
# Build engine = rootless BuildKit, DAEMONLESS (nothing always-on — mother runs at ~90% RAM, no swap). ~1-3 GB peak
# vs kaniko's ~8-12 GB on the 8.38 GB user-code image; heavy scratch lands on disk (400 GB free), warm-cache via a
# registry cache tag. See docs/design/image-build-pipeline-design.md.
#
# Trigger: manual + a nightly pre-dawn cron. No push-webhooks on the LAN.
#
# The cron is `nightly-images`, id 2, `0 5 * * *` UTC = 01:00 EDT / 00:00 EST (Woodpecker crons are UTC, NOT
# NY-pinned — docs/schedules.md Design Rule #1). It already exists; do not re-create it.
#
# ⚠ IT WAS CREATED **DISABLED** ON 2026-08-18 AND NEVER RAN. Found 2026-08-22: `enabled:false`, `next_exec` frozen
# at its first-ever slot, and all 21 pipelines on this repo were `event: manual`. Meanwhile docs/schedules.md
# documented a nightly build as running. `--enabled` is NOT a default — a cron created without it is inert and
# nothing warns you. Verify after any cron change:
#   curl -sf -H "Authorization: Bearer $WOODPECKER_TOKEN" "$WOODPECKER_SERVER/api/repos/2/cron"
# and check `enabled` AND that `next_exec` is in the FUTURE. A stale next_exec is the tell.
#
# CLI notes (v3.x, verified 2026-08-22): `cron` lives under `repo` (`woodpecker-cli repo cron ls|add|update`), not
# at the top level as an older comment here claimed. `repo cron update` and `pipeline last` 404 on a positional
# repo argument; the REST API works. `--output json` is accepted and SILENTLY IGNORED — use
# `--output 'go-template={{range .}}...{{end}}'` (the payload is a slice). See docs/runbooks/ship-images.md.
labels:
  backend: kubernetes
when:
  - event: manual
  - event: cron

steps:
  # ── 1. lint the k8s manifests (syntax) ──────────────────────────────────────
  - name: yaml-syntax
    image: pipelinecomponents/yamllint:latest
    commands:
      - yamllint nodes/mother/lab/weyland-platform/k8s/

  # ── 1b. repo guards: diagrams parse, documented counts match reality ────────
  # WHY THIS STEP EXISTS: on 2026-08-21 a sweep found FIFTEEN mermaid blocks under docs/ that had
  # never rendered (all the same bug — a `;` inside sequence-diagram text, which mermaid treats as a
  # statement separator) and TEN stale Argo application counts across eight files, in three different
  # generations (28 / 59 / 72) against 78 actual. Both classes had been in the repo for months.
  #
  # Nothing caught them because the checks were human. The DoD mandates a per-batch "Diagrams" pillar,
  # a "verify the render" cross-cutting rule, and a docs relevance sweep — all satisfied by eye. A page
  # saying "28 apps onboarded" READS as perfectly relevant; only comparing it to the cluster reveals it.
  # scripts/check-app-registry.sh could not help: it compares structure to structure, so a number typed
  # into a sentence is invisible to it.
  #
  # BLOCKING ON PURPOSE. These are cheap and deterministic, and an advisory warning is exactly what let
  # 15 diagrams rot. Trade-off, stated plainly: a stale doc count will now fail the nightly cron and no
  # images will ship that run. If that coupling proves wrong, add `failure: ignore` to this step — it
  # keeps reporting and stops blocking. Do NOT silently delete the step.
  #
  # All five guards run here. The three older ones (check-app-registry / check-quality-tools /
  # check-sa-automount-collisions) had ALSO never been wired — the repo's own comments claimed they
  # "enforce" and "guard" things while nothing ran them. All three are pure file analysis (python3 +
  # pyyaml, no cluster access), so there is no reason they were not in CI other than nobody adding them.
  - name: repo-guards
    image: node:24-alpine
    commands:
      - apk add --no-cache bash python3 py3-yaml >/dev/null
      # The mermaid parser needs its own resolution root: ESM ignores NODE_PATH, so a global install
      # does not satisfy a bare `import "mermaid"`. Built here per-run rather than baked into an image.
      # Deliberately NOT @mermaid-js/mermaid-cli — that pulls puppeteer + headless Chromium, which
      # needs a sandbox this cluster's step pods should not be granting.
      - mkdir -p /tmp/mmcheck
      - printf '{"name":"mmcheck","private":true,"type":"module"}\n' > /tmp/mmcheck/package.json
      - (cd /tmp/mmcheck && npm install --silent --no-audit --no-fund mermaid jsdom)
      - MERMAID_CHECK_ROOT=/tmp/mmcheck bash scripts/check-mermaid.sh docs
      - bash scripts/check-doc-counts.sh
      - bash scripts/check-app-registry.sh
      - bash scripts/check-quality-tools.sh
      - bash scripts/check-sa-automount-collisions.sh
      # B140 — a CronJob's cadence lives on three surfaces (manifest schedule · schedules.md ·
      # the freshness budget). Nothing kept them honest, so relaxing a schedule silently made
      # its alert false-fire and tightening one silently stopped it catching a stop.
      - bash scripts/check-cron-freshness-budgets.sh
      # B142 — a `pip-audit --ignore-vuln` exception is scoped to a vuln ID and NOTHING else, so
      # unlike osv-scanner.toml's version-scoped PackageOverrides it can never expire on its own.
      # This asserts each accepted ID is really wired into scan.py's IGNORED_VULNS, and that the
      # upstream condition justifying it still holds (asked of PyPI). When the blocker is fixed,
      # this goes red and names the exception to delete, instead of it rotting unnoticed.
      - bash scripts/check-pip-audit-ignores.sh

  # ── 1b2. Port IaC coverage (B137) ───────────────────────────────────────────
  # SEPARATE from repo-guards because it is the only guard here that talks to a live API and needs
  # credentials. repo-guards is deliberately pure file analysis with no secrets, and mixing the two
  # would hand every one of those checks a token they have no use for.
  #
  # WHAT IT CATCHES that nothing else can: Port schema created in the UI. On 2026-08-22 the live org
  # held 51 blueprints / 8 scorecards / 4 integrations while tofu/port/ described 13 / 0 / 0 — and
  # `tofu plan` reported no drift the entire time, because plan compares the code to the resources
  # TOFU KNOWS ABOUT and a UI-created blueprint is not one of them. The gap opened one click at a
  # time over two months and was found by accident.
  #
  # BLOCKING, same posture as repo-guards. It shipped `failure: ignore` for exactly as long as it took
  # to create the two secrets below (`port_client_id` / `port_client_secret` on edtbl76/weyland-lab,
  # events cron+manual — a secret that does not cover the triggering event is a whole-config PARSE
  # error, not a failed step). An advisory guard left advisory is how fifteen diagrams rotted.
  - name: port-iac-coverage
    image: alpine:latest
    environment:
      PORT_CLIENT_ID:
        from_secret: port_client_id
      PORT_CLIENT_SECRET:
        from_secret: port_client_secret
    commands:
      - apk add --no-cache bash curl python3 >/dev/null
      - bash scripts/check-port-iac-coverage.sh

  # ── 1b3. DoD Pillar 5 — backlog/Linear reconciliation (B148 follow-on) ──────
  # SEPARATE from repo-guards for the same reason as the step above: it needs a credential, and
  # repo-guards is deliberately pure file analysis. Its own step rather than folded into
  # port-iac-coverage, because the two tokens address different SaaS and a step should hold only the
  # secret it uses.
  #
  # WHAT IT CATCHES that nothing else can: DoD Pillar 5 was the ONE pillar with no checker. Every
  # other has one — check-mermaid, check-doc-counts, check-cron-freshness-budgets, the bats suite,
  # eyes on a UI — so here the tick WAS the work and recorded intent rather than outcome. On
  # 2026-08-26 the B148 close-out claimed "Linear EMA-207, backlog flipped" with NO Linear call ever
  # made; the issue sat in Backlog. Checking then found B143 open two days after shipping and three
  # open issues with no project at all — invisible to every filtered view, because this team runs two
  # products (Weyland Lab / Stud.IO) and project is the only separator.
  #
  # UNLIKE check-secret-placeholders.sh and check-servicemonitor-coverage.sh, this one CAN live in
  # CI: those need cluster read (`woodpecker:default` cannot list secrets, ServiceMonitors, Services
  # or workloads) and granting that permanently to run a periodic lint is not worth it. This makes
  # one outbound HTTPS call with a READ-scoped token. Different trade, different answer.
  #
  # NEEDS the `linear_api_key` secret on edtbl76/weyland-lab, events cron+manual — a secret that does
  # not cover the triggering event is a whole-config PARSE error, not a failed step (learned when
  # port_client_id shipped). Read scope is sufficient; the guard has no write path.
  - name: linear-sync
    image: alpine:latest
    environment:
      LINEAR_API_KEY:
        from_secret: linear_api_key
    commands:
      - apk add --no-cache bash curl python3 >/dev/null
      - bash scripts/check-linear-sync.sh

  # ── 1c. shellcheck the shell surface ────────────────────────────────────────
  # --severity=warning on purpose. At `note` the repo has 3 findings, and two of them are noise that
  # can never be fixed: SC2016 fires on the deliberately-single-quoted node heredoc in
  # check-mermaid.sh, and SC1091 cannot follow scripts/.env because it is gitignored. Gating at
  # warning gives a clean zero today while still catching real defects (unquoted expansions that
  # word-split, unreachable code, bad test operators). There is no .shellcheckrc — the severity flag
  # is the whole policy, kept visible here rather than hidden in a dotfile.
  - name: shellcheck
    image: koalaman/shellcheck-alpine:stable
    commands:
      - shellcheck --severity=warning scripts/*.sh scripts/lib/*.sh scripts/ci/*.sh scripts/integration/*.sh

  # ── 1c2. shell tests ────────────────────────────────────────────────────────
  # B131/B135 — the repo's FIRST shell test harness. shellcheck above catches malformed shell; it
  # cannot tell you that a gate predicate returns the wrong answer. `ship-images.sh` merges PRs on
  # main and syncs the live cluster, so its decisions are exactly the kind that must not be verified
  # by running them.
  #
  # Every external binary (git/gh/woodpecker-cli/argocd/kubectl/curl) is stubbed onto PATH by
  # scripts/tests/helper.bash — this step reaches nothing outside its own container. The staleness
  # tests additionally extract the CronJob's decision logic straight out of its ConfigMap, so the
  # cluster runs the same text the suite exercises.
  - name: shell-tests
    image: bats/bats:latest
    commands:
      # python3 + pyyaml are NOT in bats/bats:latest. check-cron-freshness-budgets.sh needs them
      # to read CronJob manifests and the PrometheusRule, and its end-to-end tests exercise the
      # real guard rather than a stub (the whole point — a stubbed guard would only confirm the
      # stub). Same packages repo-guards installs; keep the two steps in step if either changes.
      #
      # `jq` ADDED 2026-08-26 (found during B148). It is not in the image either, and WITHOUT IT 8
      # of port-pr-reconcile.bats's cases fail — every one that reaches `main`, because the script
      # under test parses the Port and GitHub responses with jq. Measured, not inferred: 197/197
      # pass with jq present and 189/197 without, and `command -v jq` in a bare bats/bats:latest
      # returns nothing. This step has therefore been failing since port-pr-reconcile.bats landed
      # with B144 on 2026-08-25 — a one-day-old red that a green local run would not reveal, because
      # a dev box has jq. (Why it went unread was not investigated; the fix does not depend on it.)
      #
      # `git` ADDED 2026-08-28 (found while building B88's lane runner). ship-images.bats's
      # commit_iso cases shell out to `git show -s --format=%aI` to resolve a git-<sha> tag to its
      # author date. They landed with the EMA-172 DORA work on 2026-08-27 and have been RED in CI
      # ever since, because bats/bats:latest has no git. Measured, not inferred: 4 failures without
      # git, 0 with it. This is the SECOND time this exact step has been silently red for a missing
      # tool — jq was the first, two days earlier. A green local run hides both, because a dev box
      # has git and jq.
      - apk add --no-cache python3 py3-yaml jq git >/dev/null
      - bats scripts/tests/

  # ── 1d. unit tests ──────────────────────────────────────────────────────────
  # The repo had ONE test suite and CI had never run it. Worse, it was orphaned: the tests lived in
  # services/weyland-tool-server/tests/ while the code they import moved to services/weyland-guard/
  # when B70 extracted the shared guard service. 5 of 8 files could not even be collected
  # (ModuleNotFoundError) and the suite had clearly not been run since the extraction. Tests moved to
  # weyland-guard/tests/, the stale assertions repaired against the current API, and
  # test_llm_guard.py replaced by test_safety_validators.py (its `llm_guard` backend was retired in
  # B117). 28 tests, all green.
  #
  # No image build needed: guardrails/ imports only dataclasses + enum from stdlib, and conftest.py
  # supplies DB fakes — so pytest + prometheus_client on a slim base is the entire dependency set.
  # Deliberately NOT building the weyland-guard image to test it; that would pull transformers,
  # presidio and spaCy for a suite that stubs all three.
  # ── 1d. per-language test lanes (B88) ───────────────────────────────────────
  # REPLACES a hardcoded `cd services/weyland-guard && pytest`. That named ONE service by path, so a
  # suite added anywhere else was never executed and sat green by absence. scripts/run-lang-tests.sh
  # discovers suites by TEST FILE and resolves each to its owning project root.
  #
  # EVERY LANE SHIPS A HELLO-WORLD FIXTURE under tests/lang/<lang>/. A language with no production
  # code yet (Go, Rust) would otherwise have nothing to run, and "nothing to run" is one careless
  # line from "green". The fixture means every lane always executes a real test, so the image,
  # toolchain, discovery and runner are continuously proven.
  #
  # EXIT CODES ARE NOT INTERCHANGEABLE:
  #   0  fixture passed and every discovered project passed
  #   1  a REAL project failed                      -> the estate has a defect
  #   2  the FIXTURE failed, or the lane could not do its job -> the LANE is broken
  # A broken runner must never read like broken code.
  #
  # --self-check runs each fixture's DELIBERATELY FAILING test and asserts the runner propagates it.
  # A lane never seen failing is not a lane; without this a runner that swallowed failures would
  # report green forever. It runs FIRST in each lane, deliberately.
  #
  # Each lane pins its own toolchain image rather than installing into one — the roadie convention
  # from STUD.io: tests run in a controlled environment, off host/base-image drift.

  # ── 1c3. Gatekeeper Rego (B88 Phase 3) ──────────────────────────────────────
  # kubeconform SKIPS Gatekeeper CRDs — it has no schema for them — so before this step NOTHING
  # validated the Rego. A policy with a syntax error or inverted logic would ship, be applied, and
  # silently admit everything; "the file exists" was the only check it got. This compiles every
  # ConstraintTemplate and EXERCISES the signature constraint against real admission payloads,
  # because a policy that compiles can still be backwards.
  - name: rego-policies
    image: python:3.12-slim
    commands:
      - pip install --quiet pyyaml
      - apt-get update -qq >/dev/null && apt-get install -y -qq curl >/dev/null
      - curl -sSfL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
      - chmod +x /usr/local/bin/opa
      - sh scripts/ci/check-rego-policies.sh

  - name: test-python
    image: python:3.12-slim
    commands:
      - pip install --quiet --no-cache-dir pytest pytest-cov prometheus_client
      - bash scripts/run-lang-tests.sh python --self-check
      - bash scripts/run-lang-tests.sh python
      # B88 gap #1 — coverage RATCHET: fails ONLY if a project's coverage drops vs the committed
      # baseline (tests/lang/coverage-baseline.tsv). weyland-guard sits at 74% today; this stops it
      # sliding, without an 80% floor that would fail the mostly-fixture lanes on day one.
      - bash scripts/coverage-ratchet.sh run python

  - name: test-shell
    image: bats/bats:latest
    commands:
      # Same package set as the shell-tests step above; keep them in step if either changes.
      - apk add --no-cache python3 py3-yaml jq git bash >/dev/null
      - bash scripts/run-lang-tests.sh shell --self-check
      - bash scripts/run-lang-tests.sh shell

  - name: test-java
    image: maven:3.9-eclipse-temurin-17
    volumes:
      - ci-cache-maven:/root/.m2/repository   # B88 #6 — persist downloaded maven plugins/deps
    commands:
      # Java 17 matches the Flink modules' maven.compiler.source/target. B88 added JUnit 5 +
      # Surefire to both modules — before that `mvn test` ran zero tests and exited 0.
      - bash scripts/run-lang-tests.sh java --self-check
      - bash scripts/run-lang-tests.sh java
      # Coverage ratchet — jacoco. The Flink modules sit at 9.8% / 33.3% (main() is untested
      # topology wiring); the ratchet protects those floors rather than demanding they rise.
      - bash scripts/coverage-ratchet.sh run java

  - name: test-go
    image: golang:1.26
    environment:                              # B88 #6 — persist the go module + build caches
      GOMODCACHE: /cache/go/mod
      GOCACHE: /cache/go/build
    volumes:
      - ci-cache-go:/cache/go
    commands:
      # NOT -alpine: `go test -race` needs cgo, and alpine without build-base cannot race-detect —
      # it would silently run without the detector.
      - bash scripts/run-lang-tests.sh go --self-check
      - bash scripts/run-lang-tests.sh go
      - bash scripts/coverage-ratchet.sh run go   # B88 gap #1 — coverage ratchet

  - name: test-rust
    image: rust:1-slim
    # B88 #6 — persist CARGO_HOME (registry + cargo-installed bins, so cargo-llvm-cov is not recompiled
    # every run). PATH is set LITERALLY (image PATH + the cache bin) rather than with $PATH, so the
    # scripts' `command -v cargo-llvm-cov` finds the cached binary; RUSTUP_HOME stays the image default.
    environment:
      CARGO_HOME: /cache/cargo
      PATH: /cache/cargo/bin:/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ci-cache-cargo:/cache/cargo
    commands:
      - bash scripts/run-lang-tests.sh rust --self-check
      - bash scripts/run-lang-tests.sh rust
      # Coverage ratchet — cargo-llvm-cov (the standard Rust line-coverage tool) is not in the base
      # image, so install it here. A missing tool is a BROKEN lane (exit 2), never a silent pass.
      - rustup component add llvm-tools-preview >/dev/null 2>&1 || true
      - cargo install cargo-llvm-cov --quiet 2>/dev/null || true
      - bash scripts/coverage-ratchet.sh run rust

  - name: test-node
    image: node:24-alpine
    environment:
      npm_config_cache: /cache/npm            # B88 #6 — persist the npm package cache
    volumes:
      - ci-cache-npm:/cache/npm
    commands:
      # Four archetypes on ONE toolchain. TypeScript and JavaScript are dependency-free (node's
      # built-in runner + native TS type-stripping, 23.6+); React and Next.js cannot be — rendering
      # a component needs React and a DOM — so those two npm install from their committed lockfiles.
      - apk add --no-cache bash >/dev/null
      - bash scripts/run-lang-tests.sh typescript --self-check
      - bash scripts/run-lang-tests.sh typescript
      - bash scripts/run-lang-tests.sh javascript --self-check
      - bash scripts/run-lang-tests.sh javascript
      - bash scripts/run-lang-tests.sh react --self-check
      - bash scripts/run-lang-tests.sh react
      - bash scripts/run-lang-tests.sh nextjs --self-check
      - bash scripts/run-lang-tests.sh nextjs
      # Coverage ratchet — node's built-in coverage for ts/js, jest --coverage for react/next.
      - bash scripts/coverage-ratchet.sh run typescript
      - bash scripts/coverage-ratchet.sh run javascript
      - bash scripts/coverage-ratchet.sh run react
      - bash scripts/coverage-ratchet.sh run nextjs

  # ── 1e. per-language SCANNERS (B88 Phase 2) ─────────────────────────────────
  # The analysis sibling of the test lanes above. Kept OUT of the scan-suite image on purpose: that
  # image already carries python + a full Go toolchain + a JRE, and adding Rust/Java/Node toolchains
  # would roughly triple it — oversized layers have broken builds here before (`unpigz: invalid
  # deflate`). Registry: quality-tools.yaml, `runner: lang-scan`; check-quality-tools.sh fails if
  # this script and the registry disagree in either direction.
  #
  # FINDINGS DO NOT FAIL THE BUILD (exit 0 with counts); only an inability to LOOK does (exit 2).
  # Gating CI on lint counts turns every nit into a merge blocker and gets the gate muted — the same
  # argument this repo makes about permanently-lit alerts.
  #
  # ⚠ DELIBERATELY NO `failure: ignore` HERE. The first draft of these steps had it, which would
  # have swallowed exit 2 — "the scanner could not run" — along with the findings, so a lane with a
  # missing toolchain would have reported green forever. That is precisely the absence-as-success
  # defect this whole item exists to remove, reintroduced in the CI wiring. The exit-code contract
  # in run-lang-scan.sh already does the filtering: findings are 0, broken is 2.
  - name: scan-rust
    image: rust:1-slim
    environment:                              # B88 #6 — same cargo cache as test-rust (audit/deny bins persist)
      CARGO_HOME: /cache/cargo
      PATH: /cache/cargo/bin:/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ci-cache-cargo:/cache/cargo
    commands:
      - rustup component add clippy rustfmt >/dev/null 2>&1 || true
      - cargo install cargo-audit cargo-deny --locked >/dev/null 2>&1 || true
      - bash scripts/run-lang-scan.sh rust

  - name: scan-java
    image: maven:3.9-eclipse-temurin-17
    volumes:
      - ci-cache-maven:/root/.m2/repository   # B88 #6 — same maven cache as test-java
    commands:
      - bash scripts/run-lang-scan.sh java

  - name: scan-node
    image: node:24-alpine
    environment:
      npm_config_cache: /cache/npm            # B88 #6 — same npm cache as test-node
    volumes:
      - ci-cache-npm:/cache/npm
    commands:
      - apk add --no-cache bash >/dev/null
      - bash scripts/run-lang-scan.sh typescript
      - bash scripts/run-lang-scan.sh javascript
      - bash scripts/run-lang-scan.sh react
      - bash scripts/run-lang-scan.sh nextjs

  # ── 1f. INTEGRATION tier (B88 gap #2) — black-box the LIVE services in-cluster ────
  # The first test tier above unit. The unit lanes above prove a module in isolation; nothing until
  # now asserted that a request actually CROSSES a service boundary and comes back correct. These
  # steps run IN-CLUSTER (k8s-backend pods), so cluster-DNS service names resolve; the mesh default
  # is PERMISSIVE (only Postgres is STRICT), so an un-meshed caller reaches the targets in plaintext
  # — verified against the manifests, not assumed.
  #
  # ⚠ NO `failure: ignore`, for the same reason as the scan lanes. Each script uses the same
  # three-outcome contract: 0 pass · 1 the service is REACHABLE but MISBEHAVED (a real regression the
  # author must see) · 2 the target could not be reached / the lane could not run. Exit 2 must stay
  # visible — a "could not reach it" that read as green would be the exact absence-as-success this
  # whole effort removes.

  # Guard: POSTs real payloads to weyland-guard and asserts the deterministic enforcing verdict
  # (actorless act BLOCKED by policy.gate) plus the route/pipeline contract on the SHADOW model hooks
  # — reaching app.py, the HTTP layer un-importable in the unit lane (0% there). Curl-only, no jq.
  - name: test-integration-guard
    image: alpine:latest
    commands:
      - apk add --no-cache bash curl >/dev/null
      - bash scripts/integration/guard-blackbox.sh

  # DataHub<->Redpanda: asserts DataHub is actually CONSUMING from the Redpanda it was repointed onto
  # (2026-08-29) — the MAE/MCE consumer groups are Stable and the topic spine exists. DataHub serves
  # its catalog from Postgres+OpenSearch, so a severed event bus is invisible in the UI; only the
  # broker shows it. Uses the deployed redpanda image so rpk matches the broker version.
  - name: test-integration-datahub
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    commands:
      - bash scripts/integration/datahub-redpanda-blackbox.sh

  # ── 2. detect which images changed since their currently-deployed git-<sha> ──
  - name: detect-changes
    image: alpine/git:latest
    commands:
      - sh scripts/ci/detect-changes.sh

  # ── 3. build + push the changed images (thin buildctl client → buildkitd) ───
  # Builds against the persistent buildkitd Deployment (k8s/woodpecker/buildkitd.yaml) over tcp. This step mounts
  # nothing and needs no privilege — buildkitd does the snapshot mounts in its own stable mnt ns. (Daemonless
  # BuildKit in an ephemeral step pod EPERM'd on its mounts on this cluster, even privileged+trusted; hence the daemon.)
  # The client-side context filesync uses inotify — fine now that mother's fs.inotify.max_user_instances = 8192.
  - name: build
    image: moby/buildkit:latest
    environment:
      BUILDKIT_HOST: tcp://buildkitd:1234
      TRIVY_CACHE_DIR: /cache/trivy           # B88 #6 — persist trivy's 109MB vuln DB across runs (was re-downloaded every build)
    secrets: [cosign_key, cosign_password]
    volumes:
      - ci-cache-trivy:/cache/trivy
    # B88 gap #3 — the per-image supply-chain scans (syft SBOM + trivy image vuln) analyse the full
    # pushed image. With no memory request the step pod is best-effort QoS and was OOMKilled (exit 137)
    # scanning a large ML image on the RAM-tight node. A 1Gi request makes it Burstable (a real floor,
    # not first-to-die) and a 4Gi limit gives the scans headroom. MEMORY ONLY — no cpu request, to
    # avoid adding to mother's cpu-requests wall (cpu is compressible; it never triggers an OOM kill).
    backend_options:
      kubernetes:
        resources:
          requests:
            memory: 1Gi
          limits:
            memory: 4Gi
    commands:
      # B88 Phase 3 — syft + cosign + trivy are fetched here rather than baked into moby/buildkit,
      # which is upstream's image and not ours to rebuild. All single static binaries.
      - apk add --no-cache curl bash >/dev/null 2>&1 || true
      - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin >/dev/null
      - curl -sSfL -o /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
      - chmod +x /usr/local/bin/cosign
      # B88 gap #3 — trivy for the per-build vulnerability scan (supply-chain.sh vuln). Weekly-only
      # trivy meant a base-image CVE sat uncaught until Sunday; this runs it per pushed image (loud,
      # non-fatal). trivy pulls its vuln DB on first run — a cache lives in gap #6.
      - curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin >/dev/null
      # Warm trivy's vuln DB ONCE before the scan loop. Without this, the first image's scan races the
      # DB download and trivy returns a valid-looking 0-findings report (observed: a fresh install
      # reported 0 CVEs for an image that really had 327) — an absence-as-success the per-scan guard
      # cannot detect. Best-effort: if it fails, the scans report BROKEN, which is the honest outcome.
      - trivy image --download-db-only >/dev/null 2>&1 || echo "[build] WARNING - trivy DB pre-download failed, vuln scans may report BROKEN"
      - sh scripts/ci/build-images.sh

  # ── 4. schema-validate the manifests that will carry the new tag ────────────
  - name: kubeconform
    image: ghcr.io/yannh/kubeconform:latest-alpine
    commands:
      - |
        [ -s .ci-image-bumps ] || { echo "kubeconform: nothing built — skip"; exit 0; }
        # validate each manifest that will carry the new tag (cols 3+ of each row); fail the gate on any error
        rc=0
        for m in $(cut -f3- .ci-image-bumps | tr '\t ' '\n\n' | sed '/^$/d' | sort -u); do
          f="nodes/mother/lab/weyland-platform/$m"
          [ -f "$f" ] || continue
          echo "validate $f"
          /kubeconform -strict -summary -ignore-missing-schemas "$f" || rc=1
        done
        exit $rc

  # ── 5. deploy handoff: bump tags → branch → PR (you merge → Argo deploys) ────
  - name: deploy-handoff
    image: alpine:latest
    when:
      - status: success
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - apk add --no-cache git curl >/dev/null
      - sh scripts/ci/open-deploy-pr.sh

  # ── 6. build status → Port ci_pipeline (B63 — CI reliability signal; success AND failure) ──
  - name: notify-port
    image: curlimages/curl:latest
    when:
      - status: [success, failure]
    environment:
      PORT_INGEST_URL:
        from_secret: port_ingest_url
    commands:
      - |
        printf '{"number":%s,"status":"%s","repo":"%s","branch":"%s","commit":"%s","event":"%s","url":"%s"}' \
          "$CI_PIPELINE_NUMBER" "$CI_PIPELINE_STATUS" "$CI_REPO" "$CI_COMMIT_BRANCH" "$CI_COMMIT_SHA" "$CI_PIPELINE_EVENT" "$CI_PIPELINE_URL" > /tmp/port.json
        curl -sf -X POST "$PORT_INGEST_URL" -H "Content-Type: application/json" -d @/tmp/port.json
