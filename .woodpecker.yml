# Woodpecker CI — weyland (CI/CD category). Runs on the kubernetes backend: each step is a pod in the cluster.
# LAN-only: GitHub can't reach woodpecker.weyland.lab to deliver push webhooks, so trigger via "Run pipeline"
# (manual) or cron. The `manual`/`cron` events below are what actually fire here; push/pull_request are kept
# for the day this (or a repo) is reachable. First pipeline = prove the mechanism + one real check.
#
# B57 — PIN this workflow to the kubernetes backend. The shared Woodpecker server also hosts STUD.io's
# local-backend agents (native, on rogueone); an unlabeled workflow in v3.17 schedules onto ANY connected
# agent, so without this guard a weyland build could land on a local agent and run these container steps
# directly on rogueone's host. The `backend` label is auto-advertised by each agent as its backend type.
labels:
  backend: kubernetes
when:
  - event: [manual, cron, push, pull_request]

steps:
  - name: info
    image: alpine
    commands:
      - echo "Woodpecker CI on weyland — this step is running as a pod IN the cluster (k8s backend)."
      - echo "commit ${CI_COMMIT_SHA} on branch ${CI_COMMIT_BRANCH}"
      - ls -la

  - name: yaml-syntax
    image: pipelinecomponents/yamllint:latest
    commands:
      # Uses .yamllint at the repo root (relaxed + line-length disabled). Catches broken YAML / trailing
      # spaces / dup keys without the 80-col noise that's meaningless for commented k8s manifests.
      - yamllint nodes/mother/lab/weyland-platform/k8s/

  # Report build status → Port (CI/CD category). Runs on success AND failure. The Port ingest URL comes from a
  # Woodpecker repo secret (port_ingest_url) so the key stays OUT of this public repo. printf builds the JSON
  # cleanly (no quote-escaping). Maps to the `ci_pipeline` blueprint.
  - name: notify-port
    image: curlimages/curl:latest
    when:
      - status: [success, failure]
    environment:
      PORT_INGEST_URL:
        from_secret: port_ingest_url
    commands:
      - |
        printf '{"number":%s,"status":"%s","repo":"%s","branch":"%s","commit":"%s","event":"%s","url":"%s"}' \
          "$CI_PIPELINE_NUMBER" "$CI_PIPELINE_STATUS" "$CI_REPO" "$CI_COMMIT_BRANCH" "$CI_COMMIT_SHA" "$CI_PIPELINE_EVENT" "$CI_PIPELINE_URL" > /tmp/port.json
        curl -sf -X POST "$PORT_INGEST_URL" -H "Content-Type: application/json" -d @/tmp/port.json
