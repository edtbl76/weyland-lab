# Canonical active-repo source of truth (B138 — repo coverage parity).
#
# WHY THIS EXISTS: the lab's repo-watching lanes each grew their own repo list, onboarded once against
# whatever set was current that day — they ranged from 1 to 6 repos, two carried a stale repo, and two
# genuinely-active repos (freejack, MyBodyGraph) were tracked NOWHERE. This file is the ONE declared list every
# lane reconciles to. A lane that omits a repo must say so here as a reasoned `except` note, never by silence.
# `scripts/check-repo-coverage.sh` fails when a lane diverges from this file for its ENFORCED lanes.
# `scripts/onboard-repo.sh` is the write side: it propagates a repo across the declarative lanes + prints the
# per-repo + manual steps.
#
# LANES (what "covered" means for each):
#   iac      declared in tofu/github/ (github_repository resource)
#   ci       has CI — a .woodpecker.yml in the repo AND activated in Woodpecker (the guard checks activation)
#   scan     in the security/quality + AI-review stack (scan-suite / sonarqube / .deepsource / .coderabbit / .sourcery)
#   pr       watched by BOTH pr-lifecycle consumers — the staleness check (k8s/pr-lifecycle/pr-staleness.yaml
#            PR_REPOS) AND the reconcile CronJob (scripts/check-pr-lifecycle.sh REPOS); guarded as pr + pr(recon)
#   catalog  in the Port github-weyland integration selectors (tofu/port/b137_integrations.tf)
#   backup   in the restic repo-backup allow-list (nodes/rogueone/backup/backup-repos.conf) — matched by
#            `backup_path` (the rogueone checkout path), NOT the repo name, because a checkout folder can be
#            named differently than its repo (freejack lives under ~/Documents/Education).
#
# A lane marked false MUST carry a matching `except:` note. Per-repo lanes (ci/scan) are configured by files
# that live IN the target repo (.woodpecker.yml, .deepsource.toml, …) — the guard verifies the central lanes it
# can see; onboard-repo.sh lists the in-repo files to add for full parity.
#
# LINEAR PROJECT MAPPING (`linear_project`): every ACTIVE repo maps 1:1 to a Linear Project (team EMA), so the
# board mirrors the active-repo set. The value is the project NAME (the raw Linear GraphQL API exposes only
# id/slugId/name — the "P-EMA-N" identifier is an MCP-only synthetic and is NOT resolvable by the CI guard).
# `scripts/check-linear-sync.sh` check G resolves each active repo's name against the live projects query and
# fails CI on a gap (repo with no project) or a stale name (renamed/deleted project). A rename therefore forces
# a one-line update here — which is correct hygiene, not a flaw. Linear Projects is a SUPERSET of repos: non-repo
# projects exist (e.g. "rogueone Hardware" = physical-machine faults, no repo) and carry no entry here. A `stale`
# repo gets no project until reactivated. Scaffolded 2026-09-23 per docs/concepts/linear-evaluation.md.

owner_default: edtbl76   # confirm per-repo owners; override with a per-repo `owner:` when it differs

# Lanes the drift guard HARD-FAILS on (CI-blocking). Starts small and grows as each lane is reconciled to
# full parity — a lane not listed here is still checked and its gaps REPORTED (onboarding-pending), but does
# not fail CI. This is how the coverage guard ships incrementally without redding the pipeline on day one.
# Reconciled: pr (pr-staleness REPOS) + catalog (Port github-weyland selectors) + backup (restic allow-list,
# by backup_path) + iac (all 8 active codified in tofu/github/ via import — repo.tf + repos_generated.tf), all
# scan (the code-scan suite's SCAN_REPOS — scan-all.sh loops the 21-tool vuln suite over every scan:true repo),
# all 2026-09-15. ci ENFORCED 2026-09-24: compared against Woodpecker ACTIVATION (anonymous per-repo lookup).
# Before that `ci: true` was an unchecked claim — 7 of 9 active repos said it with no pipeline; they are now
# `ci: false` + an except note, and flip to true ONLY when the repo is activated in Woodpecker (the guard
# fails either way round: claimed-but-not-activated, or activated-but-still-false).
enforce: [pr, catalog, backup, iac, scan, ci]

repos:
  - name: weyland-lab
    visibility: public
    status: active
    linear_project: "Weyland Lab"
    backup_path: ~/IdeaProjects/weyland
    lanes: { iac: true, ci: true, scan: true, pr: true, catalog: true, backup: true }

  - name: stud.io
    visibility: public
    status: active
    linear_project: "Stud.IO"
    backup_path: ~/Documents/Studio/STUD.io
    lanes: { iac: true, ci: true, scan: true, pr: true, catalog: true, backup: true }

  - name: Algopedia
    visibility: public
    status: active
    linear_project: "Algopedia"
    backup_path: ~/PycharmProjects/Algopedia
    lanes: { iac: true, ci: false, scan: true, pr: true, catalog: true, backup: true }
    except:
      ci: "no pipeline yet — no .woodpecker.yml, not activated in Woodpecker (found 2026-09-24); flip to true on activation"

